</style></head><body><header><span class="tag">新HSK教程 3 · LESSON 5</span><h1>这样的照片才好看</h1><p>Học theo giáo trình · Hiểu bản chất · Luyện tập thông minh · Dịch 4 bài khóa</p></header><div class="shell"><nav id="nav"></nav><main id="app"></main></div><script>const DB={"vocab": [["总是", "zǒngshì", "luôn luôn"], ["终于", "zhōngyú", "cuối cùng"], ["爬", "pá", "leo, trèo"], ["山", "shān", "núi"], ["锻炼", "duànliàn", "rèn luyện, tập thể dục"], ["照", "zhào", "chụp ảnh"], ["鞋", "xié", "giày"], ["大衣", "dàyī", "áo khoác dài"], ["拍照", "pāizhào", "chụp ảnh"], ["感兴趣", "gǎn xìngqù", "có hứng thú"], ["照相", "zhàoxiàng", "chụp ảnh"], ["难看", "nánkàn", "xấu, khó coi"], ["比较", "bǐjiào", "so sánh; tương đối"], ["水平", "shuǐpíng", "trình độ"], ["太阳", "tàiyáng", "mặt trời"], ["树", "shù", "cây"], ["干", "gàn", "làm"], ["电", "diàn", "điện"], ["收到", "shōudào", "nhận được"], ["封", "fēng", "lượng từ thư"], ["邮件", "yóujiàn", "thư điện tử"], ["难过", "nánguò", "buồn"], ["哈哈", "hāhā", "ha ha"], ["音乐", "yīnyuè", "âm nhạc"], ["兴趣", "xìngqù", "hứng thú"], ["会", "huì", "buổi tụ họp / hội"], ["结束", "jiéshù", "kết thúc"]], "readings": [{"title": "课文 1 · Chuẩn bị leo núi", "lines": [["白家月", "这个星期总是阴天，今天终于晴了。", "Tuần này trời cứ âm u, hôm nay cuối cùng đã nắng đẹp."], ["李文", "现在天气好得很！我们去爬山怎么样？", "Thời tiết bây giờ đẹp lắm! Chúng ta đi leo núi nhé?"], ["白家月", "好啊！又能锻炼身体，又能照好看的照片。", "Được chứ! Vừa rèn luyện sức khỏe vừa chụp được những bức ảnh đẹp."], ["李文", "那我带点儿水和吃的，咱们现在就去？", "Vậy tôi mang ít nước và đồ ăn, chúng ta đi ngay nhé?"], ["白家月", "我回去穿上运动鞋，拿上大衣。要不要叫一雪姐一起去？", "Tôi về thay giày thể thao, lấy áo khoác. Có gọi chị Nhất Tuyết đi cùng không?"], ["李文", "好主意。给她打个电话吧。", "Ý hay đấy. Gọi điện cho chị ấy nhé."]], "questions": [["白家月觉得爬山怎么样？", "又能锻炼身体，又能照好看的照片。"], ["李文要带什么东西？", "带水和吃的。"], ["白家月要先回去做什么？", "穿上运动鞋，拿上大衣。"]]}, {"title": "课文 2 · Xem ảnh chụp", "lines": [["白家月", "这些照片是谁给您照的？张张都非常好看。", "Những bức ảnh này ai chụp cho bác vậy? Bức nào cũng đẹp."], ["王一雪", "一飞。她对拍照一直很感兴趣，经常给我照相。", "Nhất Phi chụp. Cô ấy luôn hứng thú với nhiếp ảnh, thường chụp ảnh cho tôi."], ["白家月", "我喜欢您大笑的这张，看起来很漂亮。", "Cháu thích bức bác cười tươi này, trông rất đẹp."], ["王一雪", "我觉得这张有点儿难看，那时候我不知道她在给我照相。", "Tôi thấy bức này hơi xấu, lúc đó tôi không biết cô ấy đang chụp tôi."], ["白家月", "这样的照片才好看。我也喜欢拍照，爬山的时候我给您照几张照片吧。", "Những bức ảnh như thế này mới đẹp. Cháu cũng thích chụp ảnh, khi leo núi cháu chụp vài tấm cho bác nhé."], ["王一雪", "好，我可以比较一下你们两个谁的水平高。", "Được, tôi có thể so sánh xem hai người ai có trình độ cao hơn."]], "questions": [["白家月喜欢哪张照片？为什么？", "喜欢王一雪大笑的那张，觉得好看。"], ["王一雪为什么不喜欢这张照片？", "她觉得有点儿难看，而且当时不知道有人给她拍照。"], ["爬山的时候，白家月打算做什么？", "给王一雪拍几张照片。"]]}, {"title": "课文 3 · Trên núi chụp ảnh", "lines": [["王一雪", "家月，这里挺漂亮的，咱们在这里拍照吧。", "Gia Nguyệt, chỗ này khá đẹp, chúng ta chụp ảnh ở đây nhé."], ["白家月", "这边没有太阳，咱们去那边吧。", "Bên này không có nắng, chúng ta sang bên kia nhé."], ["王一雪", "好。你觉得我站在这些树中间怎么样？", "Được. Cháu thấy cô đứng giữa những cái cây này thế nào?"], ["白家月", "挺好的。等一下，后边走过去两个人。", "Khá tốt ạ. Chờ một chút, phía sau có hai người đi ngang qua."], ["王一雪", "我准备好了，你照的时候告诉我。", "Tôi sẵn sàng rồi, khi chụp cháu báo cho tôi."], ["白家月", "你不用看着我，想干什么都可以。", "Bác không cần nhìn cháu, muốn làm gì cũng được."], ["王一雪", "树上飞来了几只鸟，我就看它们吧。", "Có mấy con chim bay đến trên cây, tôi sẽ nhìn chúng vậy."], ["白家月", "啊，手机没电了。", "Ôi, điện thoại hết pin rồi."]], "questions": [["王一雪想站在哪儿拍照？", "站在树中间。"], ["白家月为什么要等一下再照？", "因为后边走过去两个人。"], ["白家月的手机怎么了？", "手机没电了。"]]}, {"title": "课文 4 · Thư mời hòa nhạc", "lines": [["王一雪", "家月，我收到了你的那封邮件，也看到了你给我照的照片，张张都很漂亮。我已经告诉了一飞，你的拍照水平比她高，她难过得很，哈哈。不知道你对中国的音乐有没有兴趣？我送你一张明天下午音乐会的门票。音乐会七点多结束，你听完了音乐会就来我家吃饭，尝尝我做的中国菜。你觉得怎么样？", "Gia Nguyệt, tôi đã nhận được email của cháu và xem ảnh cháu chụp cho tôi, tấm nào cũng đẹp. Tôi kể với Nhất Phi rằng trình độ chụp ảnh của cháu cao hơn cô ấy, cô ấy buồn lắm, ha ha. Không biết cháu có hứng thú với âm nhạc Trung Quốc không? Tôi tặng cháu một vé hòa nhạc chiều mai. Buổi hòa nhạc kết thúc sau bảy giờ, nghe xong cháu đến nhà tôi ăn cơm nhé, thử món Trung Quốc tôi nấu. Cháu thấy thế nào?"]], "questions": [["王一雪觉得白家月的拍照水平怎么样？", "她觉得白家月拍照水平很高。"], ["音乐会什么时候结束？", "七点多结束。"], ["听完音乐会，白家月可能做什么？", "可能去王一雪家吃饭。"]]}], "grammar": [{"title": "程度补语（2）· 得很", "formula": "Chủ ngữ + tính từ / từ trạng thái + 得很", "meaning": "Đứng sau tính từ, nhấn mạnh mức độ rất cao, thường dùng trong khẩu ngữ.", "examples": [["现在天气好得很。", "Bây giờ thời tiết rất đẹp."], ["她难过得很。", "Cô ấy buồn lắm."]], "trap": "Không nói 很得好; thứ tự đúng là 好得很.", "q": "Muốn nhấn mạnh thời tiết rất đẹp, em đặt 得很 trước hay sau 好?"}, {"title": "量词重叠 · Lặp lượng từ", "formula": "Lượng từ + lượng từ + 都 + vị ngữ", "meaning": "Nhấn mạnh mọi thành viên trong một nhóm đều có đặc điểm hoặc trạng thái nào đó.", "examples": [["这些照片张张都非常好看。", "Những bức ảnh này tấm nào cũng rất đẹp."], ["这些苹果个个都很大。", "Những quả táo này quả nào cũng to."]], "trap": "Lượng từ lặp đi kèm 都 nhằm nhấn mạnh toàn bộ, không đơn thuần nói nhiều.", "q": "张张都好看 có nghĩa một tấm đẹp hay tấm nào cũng đẹp?"}, {"title": "存现句（3）· Câu tồn hiện", "formula": "Nơi chốn + động từ + bổ ngữ xu hướng / kết quả + 了 + số lượng + người/vật", "meaning": "Diễn tả sự xuất hiện hoặc biến mất của người/vật tại một địa điểm.", "examples": [["后边走过去两个人。", "Phía sau có hai người đi qua."], ["树上飞来了几只鸟。", "Có mấy con chim bay đến trên cây."]], "trap": "Thường đưa địa điểm lên đầu, người/vật mới xuất hiện sau động từ.", "q": "Trong 树上飞来了几只鸟, đâu là địa điểm và cái gì mới xuất hiện?"}, {"title": "紧缩复句 · ……了……就……", "formula": "Động từ 1 + 了 + …… + 就 + Động từ 2 + ……", "meaning": "Hai hành động diễn ra liên tiếp, hành động sau xảy ra ngay sau hành động trước.", "examples": [["你听完了音乐会就来我家吃饭。", "Nghe xong hòa nhạc thì đến nhà tôi ăn cơm nhé."], ["我吃了早饭就去学校了。", "Ăn sáng xong là tôi đi học."]], "trap": "了 đứng sau hành động thứ nhất, 就 mở đầu hành động tiếp theo.", "q": "Trong 吃了早饭就去学校, việc nào diễn ra trước?"}], "book": [["他的拍照______比我高多了。", ["照", "干", "水平", "难看", "收到"], 2, "水平: trình độ; chụp ảnh có trình độ cao."], ["我______了一封学校的邮件。", ["照", "干", "水平", "难看", "收到"], 4, "收到邮件: nhận được email."], ["明天又是星期天，我不知道应该______什么。", ["照", "干", "水平", "难看", "收到"], 1, "干什么: làm gì."], ["我还没准备好呢，我看着你的时候你再______。", ["照", "干", "水平", "难看", "收到"], 0, "照 ở đây: chụp ảnh."], ["我觉得前两张照片好看，第三张有点儿______，你选前两张吧。", ["照", "干", "水平", "难看", "收到"], 3, "难看: xấu, khó coi."], ["他们的飞机到了吗？— ______到了，晚点了五个多小时。", ["结束", "总是", "终于", "感兴趣", "比较"], 2, "终于: cuối cùng sau một thời gian chờ."], ["为什么我照的照片______不好看？— 我姐姐会拍照，我让她教教你。", ["结束", "总是", "终于", "感兴趣", "比较"], 1, "总是: luôn luôn."], ["喂，你在哪儿？怎么没接电话？— 我在看电影呢，还有十分钟就______了。", ["结束", "总是", "终于", "感兴趣", "比较"], 0, "结束: kết thúc."], ["假期我想去北京，也想去上海，不知道怎么选。— 我帮你______一下。", ["结束", "总是", "终于", "感兴趣", "比较"], 4, "比较一下: so sánh một chút."], ["我有两张音乐会的票，咱们一起去吧。— 我对音乐不______。家月喜欢，你问问她。", ["结束", "总是", "终于", "感兴趣", "比较"], 3, "对音乐不感兴趣: không hứng thú với âm nhạc."]], "extra": [["这里的天气好______。", ["得很", "了就", "张张", "结束"], 0, "好得很: rất đẹp."], ["我今天累______。", ["得很", "一张", "收到", "才"], 0, "累得很: rất mệt."], ["照片______都好看。", ["张张", "拍照", "水平", "总是"], 0, "张张都: tấm nào cũng."], ["树上飞来了几______鸟。", ["只", "张", "封", "件"], 0, "只: lượng từ dùng cho chim."], ["我吃______早饭就去上学。", ["了", "得很", "都", "张"], 0, "吃了…就… diễn tả hai việc nối tiếp."], ["我对中国音乐很______。", ["感兴趣", "难看", "收到", "结束"], 0, "感兴趣: hứng thú."], ["她给我______了几张照片。", ["照", "山", "干", "电"], 0, "照照片: chụp ảnh."], ["这双运动______很舒服。", ["鞋", "树", "太阳", "山"], 0, "鞋: giày."], ["昨天我去______山了。", ["爬", "电", "封", "水平"], 0, "爬山: leo núi."], ["他______给我发邮件。", ["总是", "张张", "几只", "一封"], 0, "总是: luôn."], ["我们______到山顶了。", ["终于", "比较", "兴趣", "难过"], 0, "终于: cuối cùng."], ["今天______很大，照片很好看。", ["太阳", "音乐", "电", "鞋"], 0, "太阳: mặt trời."], ["他喜欢听______。", ["音乐", "电", "鞋", "树"], 0, "音乐: âm nhạc."], ["手机没______了。", ["电", "照", "树", "会"], 0, "没电了: hết pin."], ["前面走过来______个人。", ["两个", "一封", "两张", "一只"], 0, "两个 人: hai người."], ["你______完这本书就告诉我。", ["看", "封", "树", "电"], 0, "看完…就: đọc xong thì."], ["我收到了______邮件。", ["一封", "一只", "一棵", "一双"], 0, "一封邮件: một email."], ["这些水果______都甜。", ["个个", "张张", "封封", "只只"], 0, "个个都: quả nào cũng."], ["她对拍照很有______。", ["兴趣", "电", "树", "山"], 0, "兴趣: hứng thú."], ["这张照片一点儿也不______。", ["难看", "水平", "终于", "锻炼"], 0, "难看: xấu."], ["这个月我准备多______身体。", ["锻炼", "收到", "结束", "封"], 0, "锻炼身体: rèn luyện sức khỏe."], ["音乐会七点多______。", ["结束", "收到", "比较", "照相"], 0, "结束: kết thúc."], ["她听完音乐会______回家了。", ["就", "张张", "只", "得很"], 0, "就 chỉ hành động tiếp sau."], ["拍照的______很高。", ["水平", "太阳", "鞋", "山"], 0, "水平: trình độ."], ["看到好看的照片，他______笑了。", ["哈哈", "封", "电", "树"], 0, "哈哈: cười ha ha."], ["我______了你的邮件。", ["收到", "感兴趣", "锻炼", "干"], 0, "收到: nhận được."], ["他今天非常______，因为考试没考好。", ["难过", "鞋", "照", "山"], 0, "难过: buồn."], ["请______一张照片。", ["拍", "封", "干", "树"], 0, "拍照片: chụp ảnh."], ["他们爬山时看到几______树。", ["棵", "封", "张", "双"], 0, "棵: lượng từ cây."], ["我洗了澡______睡觉。", ["就", "个个", "终于", "难看"], 0, "洗了澡就睡觉: tắm xong ngủ."]]};</script><script>

let page='home',which=0,vMode='meaning',filter='',state={};try{state=JSON.parse(localStorage.getItem('hsk3lesson5_v1')||'{}')}catch{};

function render(){document.getElementById('nav').innerHTML=tabs.map(([k,t])=>`<button class="${page===k?'active':''}" onclick="setPage('${k}')">${t}</button>`).join('');let a=document.getElementById('app');if(page==='home')home(a);else if(page==='vocab')vocabPage(a);else if(page==='vquiz')vquiz(a);else if(page==='grammar')grammarPage(a);else if(page==='reading')readingPage(a);else if(page==='translate')translationPage(a);else exercises(a)}

function home(a){let n=Object.keys(state.mark).length,correct=Object.values(state.mark).filter(Boolean).length,vc=Object.values(state.vans).filter(v=>v.checked).length;a.innerHTML=`<h2>HSK 3 · Bài 5 <span class="tag">Bài học mới</span></h2><p class="subtitle">Chủ đề sở thích, leo núi, chụp ảnh và âm nhạc (trang 38–46 trong PDF).</p><div class="grid"><div class="stat">Từ vựng <br><b>27</b><div class="small">Hán tự, Pinyin, nghĩa Việt</div></div><div class="stat">Quiz từ vựng<br><b>${vc}/81</b><div class="small">3 chế độ × 27 từ</div></div><div class="stat">Luyện câu<br><b>${n}/40</b><div class="small">Tỉ lệ đúng ${n?Math.round(correct/n*100):0}%</div></div></div><div class="card"><h2>Lộ trình học hiệu quả</h2><p>① Học từ vựng → ② Nắm 4 công thức ngữ pháp → ③ Đọc 4 bài khóa → ④ Dịch từng câu → ⑤ Làm bài sách và bài mở rộng → ⑥ Ôn câu sai.</p><button class="btn" onclick="setPage('vocab')">Bắt đầu học</button></div><div class="card"><h2>🖼️ Tổng quan · Bộ công thức cấu trúc ngữ pháp</h2><p class="subtitle">Thẻ ghi chú kiểu highlight: công thức, ý nghĩa, ví dụ, lỗi hay mắc và câu hỏi Socrates. Đây là thẻ do app biên soạn, không phải ảnh chụp trang PDF.</p><div class="posterStudy">${grammar.map((g,i)=>grammarCard(g,i)).join('')}</div></div><div class="card"><h3>🍜 Mục tiêu thực hành</h3><p>Biết nói về sở thích, chụp ảnh, các hành động nối tiếp; dùng 得很, lặp lượng từ, câu tồn hiện và ……了……就…….</p></div><p class="notice">Lưu ý: PDF không kèm tệp âm thanh. Chức năng 🔊 dùng giọng tổng hợp tiếng Trung trên thiết bị; không thay thế bài nghe gốc.</p>`}
function vocabPage(a){let items=vocab.map((v,i)=>({v,i})).filter(x=>x.v.join(' ').toLowerCase().includes(filter.toLowerCase()));a.innerHTML=`<h2>🀄 Từ vựng bài 5 · 27 từ</h2><div class="toolbar"><input class="inputline" style="max-width:330px" placeholder="Tìm chữ Hán / Pinyin / nghĩa" oninput="filter=this.value;vocabPage(document.getElementById('app'))" value="${E(filter)}"><button class="btn" onclick="setPage('vquiz')">Luyện quiz 27 từ →</button></div><div class="vocab">${items.map(({v,i})=>`<div class="card"><span class="tag">#${i+1}</span><div class="hanzi">${E(v[0])}</div><div class="pinyin">${E(v[1])}</div><p>${E(v[2])}</p><button class="btn ghost" onclick="speak('${E(v[0])}')">🔊 Phát âm</button></div>`).join('')}</div>`}
function vocabOpts(i){let s=[i];for(let k=1;s.length<4;k++){let j=(i+k*7)%27;if(!s.includes(j))s.push(j)}return s.sort((a,b)=>((a*11+4)%31)-((b*11+4)%31))}
function vKey(i){return vMode+'_'+i}
function changeVMode(x){vMode=x;render()}
function vquiz(a){let completed=vocab.filter((v,i)=>state.vans[vKey(i)]?.checked).length,correct=vocab.filter((v,i)=>state.vans[vKey(i)]?.checked&&state.vans[vKey(i)].choice===i).length;a.innerHTML=`<h2>🧩 Quiz 27 từ vựng</h2><p class="subtitle">Chọn → kiểm tra → hiện đúng/sai, nghĩa, Pinyin và câu hỏi Socrates. Điểm được lưu riêng theo từng chế độ.</p><div class="card"><div class="toolbar"><button class="pill ${vMode==='meaning'?'active':''}" onclick="changeVMode('meaning')">Hán → Việt</button><button class="pill ${vMode==='hanzi'?'active':''}" onclick="changeVMode('hanzi')">Việt → Hán</button><button class="pill ${vMode==='sound'?'active':''}" onclick="changeVMode('sound')">Hán → Pinyin</button><button class="btn ghost" onclick="resetV()">Làm lại chế độ</button></div><b>${completed}/27 đã chấm · ${correct} đúng</b><div class="progress"><i style="width:${completed*100/27}%"></i></div></div>${vocab.map((v,i)=>{let k=vKey(i),r=state.vans[k]||{},opts=vocabOpts(i),show=(j)=>vMode==='meaning'?vocab[j][2]:vMode==='hanzi'?vocab[j][0]:vocab[j][1],question=vMode==='hanzi'?v[2]:v[0];return `<article class="q"><span class="tag">Câu ${i+1}/27</span><h3 class="hanzi">${E(question)}</h3>${opts.map((j,n)=>`<button class="choice ${r.choice===j?'selected':''} ${r.checked&&j===i?'correct':''} ${r.checked&&r.choice===j&&j!==i?'wrong':''}" onclick="setVAnswer(${i},${j})">${'ABCD'[n]}. ${E(show(j))}</button>`).join('')}<button class="btn" onclick="checkV(${i})">Kiểm tra đáp án</button> <button class="btn ghost" onclick="speak('${E(v[0])}')">🔊 Nghe</button>${r.checked?`<div class="feedback ${r.choice===i?'ok':'no'}"><b>${r.choice===i?'✅ Chính xác':'❌ Chưa đúng'}</b><p>${E(v[0])} · ${E(v[1])} · ${E(v[2])}</p><b>Feynman:</b> Ghép chữ Hán, âm đọc và nghĩa trong tình huống hoạt động giải trí.<div class="socratic"><b>🧠 Socrates:</b> Hãy đặt một câu ngắn sử dụng “${E(v[0])}”.</div></div>`:''}</article>`}).join('')}`}
function setVAnswer(i,j){state.vans[vKey(i)]={choice:j,checked:false};save();preserve()}
function checkV(i){let r=state.vans[vKey(i)];if(!r){alert('Bạn hãy chọn đáp án trước.');return}r.checked=true;save();preserve()}
function resetV(){if(!confirm('Xóa đáp án chế độ từ vựng này?'))return;vocab.forEach((v,i)=>delete state.vans[vKey(i)]);save();render()}
function preserve(){let y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,y))}
function grammarPage(a){a.innerHTML=`<h2>📒 4 điểm ngữ pháp</h2><div class="toolbar">${grammar.map((g,i)=>`<button class="pill ${which===i?'active':''}" onclick="setWhich(${i})">${i+1}. ${E(g.title)}</button>`).join('')}</div>${grammarCard(grammar[which],which,true)}<button class="btn" onclick="setPage('practice')">Luyện trắc nghiệm ứng dụng →</button>`}
function readingPage(a){let r=readings[which];a.innerHTML=`<h2>📖 Hội thoại / Nhật ký</h2><div class="toolbar">${readings.map((r,i)=>`<button class="pill ${which===i?'active':''}" onclick="setWhich(${i})">Bài khóa ${i+1}</button>`).join('')}</div><div class="card"><h2>${E(r.title)}</h2>${r.lines.map(([speaker,cn,vi],i)=>`<div class="readingBlock"><div class="readCN">${speaker?`<b>${E(speaker)}：</b>`:''}${E(cn)}</div><button class="btn ghost" onclick="speak('${E(cn)}')">🔊 Đọc câu</button> <button class="tog" onclick="document.getElementById('v${i}').hidden=!document.getElementById('v${i}').hidden">Xem / ẩn nghĩa</button><p class="gloss" id="v${i}" hidden>${E(vi)}</p></div>`).join('')}<h3>🧠 Câu hỏi đọc hiểu</h3>${r.questions.map(([q,an],i)=>`<details><summary class="quote">${i+1}. ${E(q)}</summary><div class="answer">${E(an)}</div></details>`).join('')}<p><button class="btn" onclick="setPage('translate')">Luyện dịch bài này →</button></p></div>`}
function translationPage(a){let r=readings[which];a.innerHTML=`<h2>🌏 Luyện dịch 4 bài khóa · Trung → Việt</h2><p class="subtitle">Tự viết bản dịch trước khi mở đáp án mẫu. App lưu nội dung bạn nhập trên thiết bị, không tự đánh giá chính xác mọi bản dịch tự do.</p><div class="toolbar">${readings.map((r,i)=>`<button class="pill ${which===i?'active':''}" onclick="setWhich(${i})">Bài khóa ${i+1}</button>`).join('')}</div><div class="card"><h3>${E(r.title)}</h3>${r.lines.map(([sp,cn,vi],i)=>{let k='b'+which+'_s'+i;return `<div class="readingBlock"><small>Câu ${i+1}</small><div class="readCN">${sp?`<b>${E(sp)}：</b>`:''}${E(cn)}</div><button class="btn ghost" onclick="speak('${E(cn)}')">🔊 Nghe</button><textarea class="inputTranslate" placeholder="Nhập bản dịch tiếng Việt của bạn..." oninput="saveTrans('${k}',this.value)">${E(state.translation[k]||'')}</textarea><details><summary>🔎 Xem bản dịch tham khảo</summary><div class="answer">${E(vi)}</div><p><b>Phân tích 5 bước:</b> Tách cụm → xác định chủ thể → tìm động từ chính → tìm bổ nghĩa → ghép nghĩa tự nhiên.</p></details></div>`}).join('')}<button class="btn secondary" onclick="exportTrans()">Xuất bản dịch của tôi (.txt)</button></div>`}
function saveTrans(k,v){state.translation[k]=v;save()}
function exportTrans(){let r=readings[which],txt=r.title+'\n\n'+r.lines.map(([sp,cn,vi],i)=>(sp?sp+'：':'')+cn+'\n'+(state.translation['b'+which+'_s'+i]||'')).join('\n\n');let u=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='HSK3_Bai5_Dich_Bai'+(which+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const allQ=[...book.map((e,i)=>({id:'b'+i,q:e[0],options:e[1],correct:e[2],explain:e[3],source:true})),...extra.map((e,i)=>({id:'x'+i,q:e[0],options:e[1],correct:e[2],explain:e[3],source:false}))];
function exercises(a){let list=page==='original'?allQ.filter(x=>x.source):page==='practice'?allQ.filter(x=>!x.source):allQ.filter(x=>state.mark[x.id]===false);let done=list.filter(x=>x.id in state.mark).length,correct=list.filter(x=>state.mark[x.id]).length;a.innerHTML=`<h2>${page==='original'?'📝 Bài tập chọn từ trong sách (trang 44–45)':page==='practice'?'🎯 30 câu vận dụng mở rộng':'🔁 Ôn tập các câu đã sai'}</h2><p class="subtitle">${page==='original'?'10 câu trong mục 综合练习; lựa chọn hiển thị riêng ở từng câu.':'Bài mở rộng do app biên soạn, dựa trên kiến thức Bài 5.'}</p><div class="card"><b>Đã chấm: ${done}/${list.length} · Đúng ${correct}</b><div class="progress"><i style="width:${list.length?done*100/list.length:0}%"></i></div><div class="toolbar"><button class="btn ghost" onclick="resetExercises()">Làm lại phần này</button></div></div>${list.length?list.map((x,i)=>{let picked=state.ans[x.id],ch=x.id in state.mark;return `<article class="q"><span class="tag">Câu ${i+1}${x.source?' · Sách':' · Mở rộng'}</span><h3>${E(x.q)}</h3>${x.options.map((option,j)=>`<button class="choice ${picked===j?'selected':''} ${ch&&j===x.correct?'correct':''} ${ch&&picked===j&&j!==x.correct?'wrong':''}" onclick="choose('${x.id}',${j})">${'ABCDE'[j]}. ${E(option)}</button>`).join('')}<button class="btn" onclick="grade('${x.id}')">Kiểm tra đáp án</button>${ch?`<div class="feedback ${state.mark[x.id]?'ok':'no'}"><b>${state.mark[x.id]?'✅ Đúng':'❌ Sai'} – Đáp án: ${'ABCDE'[x.correct]}. ${E(x.options[x.correct])}</b><p><b>Feynman:</b> ${E(x.explain)}</p><div class="socratic"><b>🧠 Socrates:</b> Từ nào trong câu là dấu hiệu giúp em loại các phương án còn lại?</div></div>`:''}</article>`}).join(''):'<div class="card">Chưa có câu trả lời sai. Hãy thử làm bài trước!</div>'}`}
function choose(id,j){state.ans[id]=j;delete state.mark[id];save();preserve()}
function grade(id){if(!(id in state.ans)){alert('Bạn hãy chọn đáp án trước.');return}let q=allQ.find(x=>x.id===id);state.mark[id]=q.correct===state.ans[id];save();preserve()}
function resetExercises(){let arr=page==='original'?allQ.filter(x=>x.source):page==='practice'?allQ.filter(x=>!x.source):allQ.filter(x=>state.mark[x.id]===false);if(!confirm('Xóa bài làm trong mục hiện tại?'))return;arr.forEach(x=>{delete state.ans[x.id];delete state.mark[x.id]});save();render()}
render();
</script></body></html>
