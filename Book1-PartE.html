function explain(q,i){let ans=q.o[choices.indexOf(q.a)]||'';let prompt=q.q.toLowerCase(),v=ans.toLowerCase(),parts=[];if(/\b(are|is|am|was|were|do|does|did|has|have|had)\b/.test(v))parts.push('Kiểm tra chủ ngữ, số ít/số nhiều và thời điểm của hành động.');if(/\b(to|in|on|at|for|with|of|from|by)\b/.test(v))parts.push('Xét cả cụm từ đứng trước và sau chỗ trống; giới từ thường đi với cấu trúc cố định.');if(/\b(ing|ed)\b/.test(v)||/ing$|ed$/.test(v))parts.push('Xem động từ chính, dạng V-ing/V3 và dấu hiệu thời gian trước khi chọn.');if(/\b(a|an|the)\b/.test(v))parts.push('Xác định danh từ đếm được hay không, số ít hay số nhiều, đã xác định hay chưa.');if(/\b(he|him|his|she|her|they|them|their|we|us|our)\b/.test(v))parts.push('Phân biệt đại từ làm chủ ngữ, tân ngữ và tính từ sở hữu.');if(/than|more|most|best|better|worse/.test(v+prompt))parts.push('Xác định đây là so sánh hơn, so sánh nhất hay so sánh bằng.');if(!parts.length)parts.push('Đọc cả câu, xác định chức năng ngữ pháp và ý nghĩa của phần cần điền; thử ghép từng phương án vào câu.');return `<div class="note"><b>1. Dấu hiệu và cách suy luận</b><p>${esc(parts.join(' '))}</p><b>2. Đối chiếu phương án</b><p>Đáp án theo Key: <b>${q.a}) ${esc(ans)}</b>. ${i===choices.indexOf(q.a)?'Bạn đã chọn đúng đáp án trong Key.':'Đáp án bạn chọn: '+choices[i]+') '+esc(q.o[i])+'. Hãy so sánh sự khác biệt về cấu trúc và ý nghĩa với đáp án trong Key.'}</p><b>3. Tư duy ngược – Socrates</b><p>Nếu thay đáp án đúng bằng phương án bạn vừa chọn, điều kiện nào về chủ ngữ, thì, cấu trúc hoặc nghĩa của câu không còn phù hợp?</p></div><div class="small">Giải thích là gợi ý suy luận theo dấu hiệu, không phải xác minh đầy đủ tính đúng/sai của mọi phương án. Một số câu in trong nguồn có thể có lỗi hoặc cách dùng gây tranh luận.</div>`}
