s:15px;border:2px dashed #dccde7;padding:20px;background:linear-gradient(120deg,#fff9fc,#fffef5)}.grammar h3{margin:0 0 10px}.readingline{border-bottom:1px dashed #d7dfed;padding:12px 0;line-height:1.7}.readingline .hanzi{font-size:21px}.quiz{border:1px solid var(--line);padding:18px;border-radius:14px;background:white;margin-bottom:13px}.option{display:block;width:100%;padding:12px;text-align:left;background:#fbfcff;border:1px solid #dce3ed;border-radius:11px;margin:7px 0;color:var(--ink)}.option.sel{border:2px solid #4267ef;padding:11px;background:#edf2ff}.option.good{border-color:#24a17d;background:#e8f8ee}.option.bad{border-color:var(--red);background:#fff0f2}.feedback{background:#f2f5fb;border-radius:12px;padding:14px;margin:10px 0;line-height:1.8}.feedback.good{background:#e7f8f0}.feedback.bad{background:#fff0f2}.socrates{border-left:4px solid #daa34f;background:#fffaeb;padding:12px;margin-top:9px;border-radius:9px}textarea{width:100%;min-height:100px;padding:14px;border:1px solid #ccd5e5;border-radius:11px;line-height:1.7;resize:vertical}details{margin:12px 0}summary{color:#315ac4;cursor:pointer;font-weight:bold}.progress{height:9px;border-radius:10px;background:#e4eaf5;overflow:hidden}.progress>i{display:block;background:var(--blue);height:100%}.small{font-size:13px;color:#748198}.textnote{background:#fff9e5;padding:14px;border-radius:11px}.quizstats{padding:15px;border-radius:12px;background:#edf3ff;margin:14px 0}h2{margin:0 0 13px}h3{line-height:1.5}.empty{padding:24px;text-align:center}.voice{font-size:13px}.badge{background:#ffe4ed;color:#aa4669;border-radius:7px;padding:4px 9px;display:inline-block;font-size:12px;font-weight:bold}.qtitle{font-size:19px;line-height:1.7}.cover{background:linear-gradient(130deg,#fef1ef,#f2f2ff);border:2px dashed #e8c8cf;border-radius:16px;padding:18px;margin:12px 0}.cover .formula{margin-top:10px}.tabs{display:flex;flex-wrap:wrap;gap:8px}.alert{background:#fff9e7;border-radius:12px;padding:13px} @media(max-width:800px){.wr </style></head><body><header><span class="badge">新HSK教程 3 · LESSON 11</span><h1>看来我没办法解决这个问题</h1><div>Xem ra tôi không có cách nào giải quyết vấn đề này · Học hiểu → luyện tập → tự chữa lỗi</div></header><div class="wrap"><nav id="nav"></nav><main id="main"></main></div><script>
const DB={"vocab":[["会议","huìyì","cuộc họp"],["经理","jīnglǐ","giám đốc; quản lý"],["开会","kāihuì","họp"],["后天","hòutiān","ngày kia"],["地点","dìdiǎn","địa điểm"],["室","shì","phòng"],["发","fā","gửi; phát"],["笔记本（电脑）","bǐjìběn (diànnǎo)","máy tính xách tay"],["或者","huòzhě","hoặc (câu trần thuật)"],["声音","shēngyīn","âm thanh"],["看来","kànlái","xem ra; có vẻ như"],["办法","bànfǎ","cách; biện pháp"],["解决","jiějué","giải quyết"],["只能","zhǐnéng","chỉ có thể"],["别人","biérén","người khác"],["请假","qǐngjià","xin nghỉ phép"],["同事","tóngshì","đồng nghiệp"],["休假","xiūjià","nghỉ phép"],["怕","pà","sợ; e rằng"],["邮箱","yóuxiāng","hộp thư điện tử"],["愿意","yuànyì","sẵn lòng; đồng ý"],["城市","chéngshì","thành phố"],["离开","líkāi","rời khỏi"],["机会","jīhuì","cơ hội"],["生活","shēnghuó","cuộc sống; sinh sống"],["为","wèi","vì; cho"],["或","huò","hoặc"]],"readings":[{"title":"Bài khóa 1 – Sắp xếp cuộc họp","where":"Văn phòng · 王一雪 và 杨同乐","lines":[["王一雪","会议下午几点开始？","Cuộc họp chiều nay bắt đầu lúc mấy giờ?"],["杨同乐","今天下午经理不在，不开会了。","Chiều nay giám đốc không có mặt nên không họp nữa."],["王一雪","那什么时候开会？","Vậy khi nào họp?"],["杨同乐","后天上午十点，会议地点换到第一会议室。我正要给大家发邮件。","10 giờ sáng ngày kia, địa điểm họp chuyển sang phòng họp số một. Tôi đang định gửi email cho mọi người."],["王一雪","开会的时候，我们用会议室的电脑还是自己的笔记本电脑？","Lúc họp chúng ta dùng máy tính của phòng họp hay máy tính xách tay của mình?"],["杨同乐","会议室的电脑或者自己的电脑都可以。","Máy tính của phòng họp hoặc máy tính cá nhân đều được."],["王一雪","那到时候咱们早点儿过去，你帮我把电脑接好吧。","Vậy hôm đó mình đến sớm nhé, anh giúp tôi kết nối máy tính cho xong."]],"questions":["今天为什么不开会了？","会议换到了什么时间和地点？","王一雪需要杨同乐帮忙做什么？"]},{"title":"Bài khóa 2 – Máy tính gặp trục trặc","where":"Phòng họp · 王一雪 và 杨同乐","lines":[["王一雪","电脑接好了吗？","Máy tính đã kết nối xong chưa?"],["杨同乐","已经接好了。您开机看看有没有问题。","Kết nối xong rồi. Chị khởi động máy xem có vấn đề gì không."],["王一雪","现在什么都看不见。","Bây giờ không nhìn thấy gì cả."],["杨同乐","我检查一下哪里出问题了……您再试一下。","Để tôi kiểm tra xem bị lỗi ở đâu… Chị thử lại một lần nhé."],["王一雪","看见了，但是听不见声音。","Thấy hình rồi, nhưng không nghe được âm thanh."],["杨同乐","现在呢？","Bây giờ thì sao?"],["王一雪","听得见声音，但是声音有点儿小，听不清楚。","Nghe được nhưng âm thanh hơi nhỏ, nghe không rõ."],["杨同乐","看来我没办法解决这个问题，只能找别人来帮忙了。","Xem ra tôi không có cách nào giải quyết vấn đề này, chỉ có thể nhờ người khác giúp."]],"questions":["开机以后，电脑有什么问题？","杨同乐检查以后，电脑怎么样？","杨同乐最后准备怎么办？"]},{"title":"Bài khóa 3 – Công việc và nghỉ phép","where":"Văn phòng · 王一雪 và 杨同乐","lines":[["王一雪","同乐，你看见老张了吗？","Đồng Lạc, anh có thấy anh Trương không?"],["杨同乐","老张没来。他说家里有点儿事，所以请假了。","Anh Trương không đến. Anh ấy nói nhà có việc nên xin nghỉ phép."],["王一雪","好几个同事都休假了，开会前这么多工作我怕干不完。","Mấy đồng nghiệp đều nghỉ phép, nhiều việc trước cuộc họp như thế này tôi sợ không làm xong."],["杨同乐","十二点多了，咱们先去吃饭吧。吃完饭，我跟您一起把这些工作做完。","Hơn 12 giờ rồi, ta đi ăn trước đi. Ăn xong tôi cùng chị làm xong những việc này."],["王一雪","你先去吃，我想再干一会儿。明天开会前要发到公司的邮箱里。","Anh cứ đi ăn trước, tôi muốn làm thêm một lúc. Trước cuộc họp ngày mai phải gửi vào hộp thư của công ty."],["杨同乐","您没看到邮件吗？经理还没回来，下周才能开会。","Chị chưa xem email à? Giám đốc chưa về, tuần sau mới họp được."],["王一雪","那不着急了。走，吃饭去。","Vậy không cần vội nữa. Đi ăn thôi."]],"questions":["老张今天为什么没来上班？","王一雪为什么没有时间吃饭？","会议最后什么时候开？"]},{"title":"Bài khóa 4 – Lựa chọn công việc","where":"Ở nhà · Nhật ký của 王一雪","lines":[["王一雪","前几天，上海的同事来北京了。","Vài ngày trước, đồng nghiệp từ Thượng Hải đến Bắc Kinh."],["王一雪","一起吃饭时，他们跟我说最近有不少同事去上海工作了，问我愿意不愿意也去上海。","Trong bữa ăn họ nói gần đây nhiều đồng nghiệp đã đến Thượng Hải làm và hỏi tôi có muốn đi không."],["王一雪","我是这样想的：现在丈夫和孩子都在北京，刘明的工作很忙，小雪和小明也还小，我去别的城市工作就要离开他们。","Tôi nghĩ thế này: hiện chồng và các con đều ở Bắc Kinh, Lưu Minh rất bận, Tiểu Tuyết và Tiểu Minh còn nhỏ; nếu đến thành phố khác làm việc thì tôi phải xa họ."],["王一雪","虽然去上海可能会有更好的机会，但是对我来说，生活也很重要，我不愿意为工作或学习离开家人。","Tuy đến Thượng Hải có thể có cơ hội tốt hơn, nhưng với tôi cuộc sống cũng rất quan trọng; tôi không muốn rời gia đình vì công việc hay học tập."]],"questions":["上海的同事告诉王一雪什么？","王一雪觉得去上海工作有什么好处？","对王一雪来说，工作和生活哪个更重要？"]}],"grammar":[{"name":"还是 và 或者 – lựa chọn","formula":"Câu hỏi: A 还是 B？  |  Câu trần thuật: A 或者 B","meaning":"还是 dùng hỏi người nghe lựa chọn; 或者 nối các khả năng trong câu kể.","example":"我们用会议室的电脑还是自己的笔记本电脑？","vi":"Chúng ta dùng máy tính của phòng họp hay máy tính xách tay cá nhân?","tip":"Muốn người nghe chọn A hay B thì dùng 还是. Nêu rằng cả A hoặc B đều được thì dùng 或者.","s":"Trong câu 会议室的电脑或者自己的电脑都可以, vì sao dùng 或者?"},{"name":"看来 – suy đoán có căn cứ","formula":"看来 + nhận xét / kết luận","meaning":"Nêu nhận định rút ra sau khi quan sát, suy nghĩ hoặc phân tích.","example":"看来我没办法解决这个问题。","vi":"Xem ra tôi không có cách nào giải quyết vấn đề này.","tip":"Đầu tiên có dấu hiệu (máy tính không nghe rõ), rồi rút kết luận với 看来.","s":"Nếu không có bằng chứng, nói 看来 có chắc hợp lý không?"},{"name":"Câu 把 (3) – kết quả hành động","formula":"Chủ ngữ + 把 + tân ngữ xác định + động từ + bổ ngữ kết quả","meaning":"Nhấn mạnh việc tác động lên một vật/sự việc và đạt được kết quả.","example":"我跟您一起把这些工作做完。","vi":"Tôi sẽ cùng chị làm xong những công việc này.","tip":"Cần có kết quả, như 做完 (làm xong), 接好 (kết nối xong). Không nên dừng câu ngay ở động từ 做.","s":"Vì sao “把这些工作做完” thể hiện hoàn tất rõ hơn “做工作”?"},{"name":"对……来说 – xét từ góc nhìn","formula":"对 + người / nhóm người + 来说，+ nhận xét","meaning":"Cho biết ai là người có quan điểm hay cảm nhận được nhắc đến.","example":"对我来说，生活也很重要。","vi":"Đối với tôi, cuộc sống cũng rất quan trọng.","tip":"Hỏi: điều này là quan trọng đối với ai? Đặt người đó giữa 对 và 来说.","s":"Hãy đổi 我 thành 学生 để nói “đối với học sinh”."}],"book":[["这是同事们________你准备的礼物。",["发","怕","为","或者","机会"],2,"为 + người: chuẩn bị vì/cho ai."],["下班以前我得把这封邮件________给大家。",["发","怕","为","或者","机会"],0,"发邮件 là gửi thư."],["今天好几个人请假了，我们明天________后天再开会吧。",["发","怕","为","或者","机会"],3,"或者 diễn tả một lựa chọn trong câu kể."],["每次开会我都不说话，因为我总是________说错话。",["发","怕","为","或者","机会"],1,"怕 = sợ."],["这次去上海开会是个好________，你可以多认识一些新同事。",["发","怕","为","或者","机会"],4,"机会 = cơ hội."],["A：你为什么要________现在的公司？\nB：对我来说，多跟家人在一起比工作更重要。",["办法","解决","只能","离开","愿意"],3,"离开 = rời khỏi."],["A：工作中遇到不能________的问题，你怎么办？\nB：请同事帮忙，多跟他们学习。",["办法","解决","只能","离开","愿意"],1,"解决问题 = giải quyết vấn đề."],["A：每次遇到问题，他都会和我们一起想________。\nB：所以大家都喜欢和他做朋友。",["办法","解决","只能","离开","愿意"],0,"想办法 = nghĩ biện pháp."],["A：你________去别的城市工作吗？\nB：经理已经问过我了，我还没想好呢。",["办法","解决","只能","离开","愿意"],4,"愿意 = sẵn lòng."],["A：这么多工作今天做不完，________明天再说。\nB：行，明天我和你一起把这些做完。",["办法","解决","只能","离开","愿意"],2,"只能 = chỉ còn cách."]],"extra":[["Từ nào có nghĩa “cuộc họp”?",["地点","会议","声音","同事"],1,"会议 (huìyì) nghĩa là cuộc họp."],["Từ nào có nghĩa “giám đốc; quản lý”?",["经理","室","看来","休假"],0,"经理 (jīnglǐ) nghĩa là giám đốc; quản lý."],["Từ nào có nghĩa “họp”?",["发","办法","怕","开会"],3,"开会 (kāihuì) nghĩa là họp."],["Từ nào có nghĩa “ngày kia”?",["笔记本（电脑）","解决","后天","邮箱"],2,"后天 (hòutiān) nghĩa là ngày kia."],["Từ nào có nghĩa “địa điểm”?",["或者","地点","只能","愿意"],1,"地点 (dìdiǎn) nghĩa là địa điểm."],["Từ nào có nghĩa “phòng”?",["室","声音","别人","城市"],0,"室 (shì) nghĩa là phòng."],["Từ nào có nghĩa “gửi; phát”?",["看来","请假","离开","发"],3,"发 (fā) nghĩa là gửi; phát."],["Từ nào có nghĩa “máy tính xách tay”?",["办法","同事","笔记本（电脑）","机会"],2,"笔记本（电脑） (bǐjìběn (diànnǎo)) nghĩa là máy tính xách tay."],["Từ nào có nghĩa “hoặc (câu trần thuật)”?",["解决","或者","休假","生活"],1,"或者 (huòzhě) nghĩa là hoặc (câu trần thuật)."],["Từ nào có nghĩa “âm thanh”?",["声音","只能","怕","为"],0,"声音 (shēngyīn) nghĩa là âm thanh."],["Từ nào có nghĩa “xem ra; có vẻ như”?",["别人","邮箱","或","看来"],3,"看来 (kànlái) nghĩa là xem ra; có vẻ như."],["Từ nào có nghĩa “cách; biện pháp”?",["请假","愿意","办法","会议"],2,"办法 (bànfǎ) nghĩa là cách; biện pháp."],["Từ nào có nghĩa “giải quyết”?",["同事","解决","城市","经理"],1,"解决 (jiějué) nghĩa là giải quyết."],["Từ nào có nghĩa “chỉ có thể”?",["只能","休假","离开","开会"],0,"只能 (zhǐnéng) nghĩa là chỉ có thể."],["Từ nào có nghĩa “người khác”?",["怕","机会","后天","别人"],3,"别人 (biérén) nghĩa là người khác."],["Từ nào có nghĩa “xin n const {vocab,readings,grammar,book,extra}=DB;
let page='home',ri=0,vm='hv',state={};try{state=JSON.parse(localStorage.getItem('HSK3_L11_offline_v1')||'{}')}catch(e){};
for(const name of ['answer','graded','vanswer','vgraded','translation'])if(!state[name])state[name]={};
const save=()=>{try{localStorage.setItem('HSK3_L11_offline_v1',JSON.stringify(state))}catch(e){}};
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs=[['home','🏠 Tổng quan'],['vocab','🀄 27 từ vựng'],['vquiz','🧩 Quiz từ vựng'],['grammar','📒 3 điểm ngữ pháp'],['reading','📖 4 bài khóa'],['translate','🌏 Luyện dịch'],['original','📝 Bài tập gốc'],['practice','🎯 30 câu mở rộng'],['mistakes','🔁 Ôn câu sai']];
function setPage(p){page=p;render();window.scrollTo(0,0)}function setRi(i){ri=i;render()}function setVM(m){vm=m;render()}
function speak(t){if(!('speechSynthesis'in window)){alert('Thiết bị không hỗ trợ giọng đọc.');return}speechSynthesis.cancel();let a=new SpeechSynthesisUtterance(t);a.lang='zh-CN';a.rate=.77;speechSynthesis.speak(a)}
function render(){document.getElementById('nav').innerHTML=tabs.map(([k,t])=>`<button class="${page===k?'active':''}" onclick="setPage('${k}')">${t}</button>`).join('');let a=document.getElementById('main');({home,vocab:showVocab,vquiz:showVQuiz,grammar:showGrammar,reading:showReading,translate:showTranslation,original:showExercises,practice:showExercises,mistakes:showExercises})[page](a)}
function home(a){let marks=Object.values(state.graded),done=marks.length,acc=marks.filter(Boolean).length;a.innerHTML=`<h2>Chào mừng đến HSK 3 – Bài 11 📚</h2><p class="muted">Nội dung dựa trên trang 86–94 của giáo trình đính kèm. Quiz từ vựng và bài tập mở rộng có ghi rõ là nội dung biên soạn thêm.</p><div class="grid"><div class="stat">Từ vựng<strong>27</strong></div><div class="stat">Bài khóa<strong>4</strong></div><div class="stat">Đã làm<strong>${done}/40</strong><span class="small">Đúng ${acc}/${done||0}</span></div></div><div class="card"><h2>🧠 Tổng quan · Công thức trọng tâm</h2><p class="muted">Bốn thẻ ngữ pháp hiển thị ngay dưới đây, bấm để học ví dụ và luyện tập.</p>${grammar.map((g,i)=>`<div class="cover"><h3>${i+1}. ${E(g.name)}</h3><div class="formula">${E(g.formula)}</div><p>${E(g.meaning)}</p><div class="hanzi">${E(g.example)}</div><p>${E(g.vi)}</p><button class="btn alt" onclick="ri=${i};setPage('grammar')">Học sâu chủ điểm này →</button></div>`).join('')}</div><div class="card"><h3>Lộ trình đề xuất</h3>① Học 27 từ → ② Quiz từ vựng → ③ Học 4 công thức → ④ Đọc và dịch 4 bài khóa → ⑤ Làm 10 câu sách → ⑥ Làm 30 câu mở rộng → ⑦ Ôn câu sai.<div class="toolbar"><button class="btn" onclick="setPage('vocab')">Bắt đầu học</button><button class="btn alt" onclick="setPage('original')">Làm bài gốc</button></div></div><div class="alert">Lưu ý: Tài liệu là trang scan; phần dịch tiếng Việt là bản tham khảo biên soạn. Chưa tích hợp audio gốc của sách.</div>`}
function showVocab(a){a.innerHTML=`<h2>🀄 27 từ vựng Bài 11</h2><p class="muted">Chữ Hán · Pinyin · nghĩa Việt · giọng đọc tiếng Trung của trình duyệt.</p><div class="toolbar"><input id="findv" placeholder="Tìm chữ Hán / Pinyin / nghĩa Việt" oninput="drawVocab(this.value)" style="padding:12px;border:1px solid #dbe1ed;border-radius:10px;max-width:350px;width:100%"><button class="btn" onclick="setPage('vquiz')">Luyện quiz →</button></div><div class="vgrid" id="vitems"></div>`;drawVocab('')}
function drawVocab(term){let g=document.getElementById('vitems');if(!g)return;g.innerHTML=vocab.filter(v=>v.join(' ').toLowerCase().includes(term.toLowerCase())).map(v=>`<div class="card"><div class="hanzi">${E(v[0])}</div><div class="py">${E(v[1])}</div><p>${E(v[2])}</p><button class="btn alt voice" onclick="speak('${E(v[0])}')">🔊 Nghe</button></div>`).join('')}
function vkey(i){return vm+'_'+i}function vopts(i){let inds=[i];for(let k=1;inds.length<4;k++){let j=(i+k*7)%vocab.length;if(!inds.includes(j))inds.push(j)}return inds.sort((a,b)=>((a*17+5)%29)-((b*17+5)%29))}
function showVQuiz(a){let n=vocab.filter((_,i)=>vkey(i) in state.vgraded).length,ok=vocab.filter((_,i)=>state.vgraded[vkey(i)]===true).length;a.innerHTML=`<h2>🧩 Quiz từ vựng · 27 từ</h2><p class="muted">3 chế độ: Hán → nghĩa, nghĩa → Hán, chữ Hán → Pinyin. 81 lượt câu hỏi.</p><div class="card"><div class="toolbar"><button class="pill ${vm==='hv'?'on':''}" onclick="setVM('hv')">Hán → Việt</button><button class="pill ${vm==='vh'?'on':''}" onclick="setVM('vh')">Việt → Hán</button><button class="pill ${vm==='hp'?'on':''}" onclick="setVM('hp')">Hán → Pinyin</button></div><b>Đã chấm ${n}/27 · Đúng ${ok}</b><div class="progress"><i style="width:${n/27*100}%"></i></div></div>${vocab.map((v,i)=>{let k=vkey(i),pick=state.vanswer[k],graded=k in state.vgraded,opts=vopts(i),show=j=>vm==='hv'?vocab[j][2]:vm==='vh'?vocab[j][0]:vocab[j][1];return `<div class="quiz"><span class="badge">Từ ${i+1}/27</span><div class="qtitle">${E(vm==='vh'?v[2]:v[0])}</div>${opts.map((j,n)=>`<button class="option ${pick===j?'sel':''} ${graded&&j===i?'good':''} ${graded&&pick===j&&j!==i?'bad':''}" onclick="chooseV(${i},${j})">${'ABCD'[n]}. ${E(show(j))}</button>`).join('')}<button class="btn" onclick="checkV(${i})">Chấm đáp án</button> <button class="btn alt" onclick="speak('${E(v[0])}')">🔊 Nghe</button>${graded?`<div class="feedback ${state.vgraded[k]?'good':'bad'}"><b>${state.vgraded[k]?'✅ Đúng':'❌ Sai'}</b><p><b>Feynman:</b> ${E(v[0])} đọc là <b>${E(v[1])}</b>, nghĩa <b>${E(v[2])}</b>.</p><div class="socrates"><b>Socrates:</b> Em thử đặt một câu ngắn có từ này trong tình huống học tập?</div></div>`:''}</div>`}).join('')}`}
function chooseV(i,j){let k=vkey(i);state.vanswer[k]=j;delete state.vgraded[k];save();keep()}function checkV(i){let k=vkey(i);if(!(k in state.vanswer)){alert('Hãy chọn đáp án.');return}state.vgraded[k]=state.vanswer[k]===i;save();keep()}
function showGrammar(a){a.innerHTML=`<h2>📒 Ngữ pháp 1–4</h2><div class="toolbar">${grammar.map((g,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">${i+1}. ${E(g.name)}</button>`).join('')}</div>${(()=>{let g=grammar[Math.min(ri,3)];return `<div class="card grammar"><h2>${E(g.name)}</h2><div class="formula">${E(g.formula)}</div><h3>Ý nghĩa</h3><p>${E(g.meaning)}</p><h3>Ví dụ trong bài</h3><div class="hanzi">${E(g.example)}</div><p>${E(g.vi)}</p><p class="textnote"><b>Feynman:</b> ${E(g.tip)}</p><div class="socrates"><b>Câu hỏi Socrates:</b> Nếu thay cụm này bằng cách nói khác, sắc thái của người nói sẽ thay đổi như thế nào?</div></div>`})()}<button class="btn" onclick="setPage('practice')">Luyện vận dụng ngữ pháp →</button>`}
function showReading(a){let r=readings[ri%4];a.innerHTML=`<h2>📖 Đọc hiểu 4 bài khóa</h2><div class="toolbar">${readings.map((x,i)=>`<button class="pill ${i===ri?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div><div class="card"><h2>${E(r.title)}</h2><p class="muted">${E(r.where)}</p>${r.lines.map(([sp,cn,vi],i)=>`<div class="readingline"><div class="hanzi"><b>${E(sp)}：</b>${E(cn)}</div><button class="btn alt voice" onclick="speak('${E(cn)}')">🔊 Đọc</button> <details><summary>Xem bản dịch</summary>${E(vi)}</details></div>`).join('')}<h3>Vấn đáp Socrates · Đọc hiểu</h3>${r.questions.map((q,i)=>`<p>${i+1}. ${E(q)}</p>`).join('')}<button class="btn" onclick="setPage('translate')">Tự dịch bài khóa →</button></div>`}
function showTranslation(a){let r=readings[ri%4];a.innerHTML=`<h2>🌏 Dịch từng câu · Trung → Việt</h2><p class="muted">Viết trước khi xem đáp án mẫu. Nội dung tự lưu trên trình duyệt.</p><div class="toolbar">${readings.map((x,i)=>`<button class="pill ${i===ri?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div><div class="card"><h3>${E(r.title)}</h3>${r.lines.map(([sp,cn,vi],i)=>{let key='r'+ri+'_'+i;return `<div class="readingline"><div class="hanzi">${E(sp)}：${E(cn)}</div><textarea placeholder="Viết bản dịch tiếng Việt của bạn..." oninput="transInput('${key}',this.value)">${E(state.translation[key]||'')}</textarea><details><summary>🔎 Xem bản dịch mẫu và tự đối chiếu</summary><div class="feedback good">${E(vi)}</div><p class="small">Socrates: Hãy tìm chủ ngữ, động từ chính, từ chỉ thời gian và thành phần chỉ kết quả.</p></details></div>`}).join('')}<button class="btn alt" onclick="downloadTrans()">Xuất bản dịch (.txt)</button></div>`}
function transInput(k,v){state.translation[k]=v;save()}function downloadTrans(){let r=readings[ri%4],txt=r.title+'\n\n'+r.lines.map(([sp,cn],i)=>sp+'：'+cn+'\n'+(state.translation['r'+ri+'_'+i]||'')).join('\n\n');let u=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='HSK3_Bai11_Dich_Bai'+(ri+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),800)}
const questions=[...book.map((e,i)=>({id:'b'+i,q:e[0],opts:e[1],ans:e[1].indexOf(e[2]===undefined?'':e[1][e[2]]),ex:e[3],source:true})),...extra.map((e,i)=>({id:'e'+i,q:e[0],opts:e[1],ans:e[2],ex:e[3],source:false}))];
// For source questions the numeric answer key is recorded in DB.book's 3rd item.
book.forEach((e,i)=>questions[i].ans=e[2]);
function showExercises(a){let list=page==='original'?questions.filter(q=>q.source):page==='practice'?questions.filter(q=>!q.source):questions.filter(q=>state.graded[q.id]===false);let n=list.filter(q=>q.id in state.graded).length,ok=list.filter(q=>state.graded[q.id]===true).length;a.innerHTML=`<h2>${page==='original'?'📝 10 câu điền từ từ sách · tr. 102':page==='practice'?'🎯 30 câu luyện vận dụng':'🔁 Ôn lại câu sai'}</h2><p class="muted">${page==='original'?'Câu gốc dựa trên mục 综合练习, mỗi câu có các lựa chọn của nhóm từ tương ứng.':'Các câu trắc nghiệm mở rộng do app biên soạn, không phải bài gốc.'}</p><div class="quizstats">Đã chấm <b>${n}/${list.length}</b> · Đúng <b>${ok}</b><div class="progress"><i style="width:${list.length?n/list.length*100:0}%"></i></div></div>${list.length?list.map((q,i)=>{let p=state.answer[q.id],g=q.id in state.graded;return `<article class="quiz"><span class="badge">Câu ${i+1} ${q.source?'· Theo sách':'· Mở rộng'}</span><h3 class="qtitle">${E(q.q)}</h3>${q.opts.map((o,j)=>`<button class="option ${p===j?'sel':''} ${g&&j===q.ans?'good':''} ${g&&p===j&&p!==q.ans?'bad':''}" onclick="pick('${q.id}',${j})">${'ABCDE'[j]}. ${E(o)}</button>`).join('')}<button class="btn" onclick="check('${q.id}')">Kiểm tra đáp án</button>${g?`<div class="feedback ${state.graded[q.id]?'good':'bad'}"><b>${state.graded[q.id]?'✅ Chính xác':'❌ Chưa đúng'}. Đáp án: ${E(q.opts[q.ans])}</b><p><b>Feynman:</b> ${E(q.ex)}</p><div class="socrates"><b>Socrates:</b> Từ nào trong ngữ cảnh giúp em chọn đáp án này và loại những từ còn lại?</div></div>`:''}</article>`}).join(''):'<div class="card empty">Chưa có câu sai. Hãy làm bài tập trước nhé!</div>'}`}
function pick(id,j){state.answer[id]=j;delete state.graded[id];save();keep()}function check(id){if(!(id in state.answer)){alert('Hãy chọn đáp án trước.');return}let q=questions.find(x=>x.id===id);state.graded[id]=state.answer[id]===q.ans;save();keep()}
function keep(){let y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,y))}render();
</script></body></html>
