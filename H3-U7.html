const DB={"vocab": [["辆", "liàng", "lượng từ dùng cho xe"], ["自行车", "zìxíngchē", "xe đạp"], ["旧", "jiù", "cũ"], ["矮", "ǎi", "thấp"], ["试", "shì", "thử"], ["黄色", "huángsè", "màu vàng"], ["短裤", "duǎnkù", "quần đùi"], ["大小", "dàxiǎo", "kích cỡ"], ["合适", "héshì", "phù hợp; vừa vặn"], ["裙子", "qúnzi", "váy"], ["更", "gèng", "càng; hơn nữa"], ["决定", "juédìng", "quyết định"], ["西瓜", "xīguā", "dưa hấu"], ["新鲜", "xīnxiān", "tươi"], ["甜", "tián", "ngọt"], ["公斤", "gōngjīn", "kilôgam"], ["冰", "bīng", "đá; làm đông"], ["极", "jí", "cực kỳ"], ["斤", "jīn", "cân Trung Quốc (0,5 kg)"], ["香蕉", "xiāngjiāo", "chuối"], ["一共", "yígòng", "tổng cộng"], ["毛", "máo", "hào (1/10 tệ)"], ["结婚", "jiéhūn", "kết hôn"], ["不但", "búdàn", "không những"], ["而且", "érqiě", "mà còn"], ["声", "shēng", "tiếng; âm thanh"], ["开机", "kāijī", "khởi động; bật máy"]], "readings": [{"title": "课文 1 · Mua xe đạp", "where": "Ở nhà, 王一雪 và 刘明 bàn đi mua sắm.", "lines": [["王一雪", "这辆自行车是小雪八岁的时候买的，看起来有点儿旧了。", "Chiếc xe đạp này được mua khi Tiểu Tuyết tám tuổi, trông đã hơi cũ."], ["刘明", "是啊，她现在长高了，这辆车已经太矮了。", "Đúng vậy, bây giờ cô bé cao hơn rồi, chiếc xe này quá thấp."], ["王一雪", "商场里开了一家自行车店，咱们给她买辆新的吧。", "Trong trung tâm thương mại có cửa hàng xe đạp mới mở, chúng ta mua cho cô bé một chiếc mới nhé."], ["刘明", "好，咱们带小雪一起去，让她试一下。", "Được, chúng ta dẫn Tiểu Tuyết đi cùng để cô bé thử."], ["王一雪", "那今天就去吧！我也想再看看衣服。咱们怎么去？", "Vậy hôm nay đi nhé! Tôi cũng muốn xem thêm quần áo. Chúng ta đi thế nào?"], ["刘明", "商场不远，咱们可以走着去。", "Trung tâm thương mại không xa, chúng ta có thể đi bộ tới."]]}, {"title": "课文 2 · Chọn váy hay quần đùi", "where": "Tại trung tâm thương mại, 王一雪 và 刘明 chọn quần áo.", "lines": [["王一雪", "你看我穿这条黄色的短裤好看吗？", "Anh thấy em mặc chiếc quần đùi màu vàng này có đẹp không?"], ["刘明", "大小合适，但我觉得那条裙子比短裤更好看。", "Kích cỡ vừa, nhưng anh thấy chiếc váy kia đẹp hơn quần đùi."], ["王一雪", "裙子比短裤贵一点儿。", "Váy đắt hơn quần đùi một chút."], ["刘明", "贵多少？", "Đắt hơn bao nhiêu?"], ["王一雪", "裙子480，短裤400。", "Váy 480 tệ, quần đùi 400 tệ."], ["刘明", "裙子不比短裤贵多少，还是买裙子吧，你穿裙子更好看。", "Váy không đắt hơn quần đùi bao nhiêu; cứ mua váy nhé, em mặc váy đẹp hơn."], ["王一雪", "我多看看再决定。你看，那边有买二送一！", "Để em xem thêm rồi quyết định. Anh nhìn kìa, đằng kia có chương trình mua hai tặng một!"]]}, {"title": "课文 3 · Mua dưa hấu và chuối", "where": "Tại cửa hàng hoa quả, 王一雪 mua trái cây.", "lines": [["店员", "西瓜又大又新鲜，不甜不要钱！", "Dưa hấu vừa to vừa tươi, không ngọt không lấy tiền!"], ["王一雪", "西瓜看起来不错，怎么卖？", "Dưa hấu trông được đấy, bán thế nào?"], ["店员", "五块钱一公斤。来，您先尝尝这块西瓜，甜极了！", "Năm tệ một kilôgam. Nào, chị nếm thử miếng dưa này, ngọt cực kỳ!"], ["王一雪", "是挺甜的！帮我选个大点儿的，再来两斤香蕉。", "Đúng là khá ngọt! Chọn giúp tôi quả to hơn một chút, thêm hai cân chuối nữa."], ["店员", "一共五十八块五毛。", "Tổng cộng 58 tệ 5 hào."], ["王一雪", "我买了这么多，便宜点儿吧。", "Tôi mua nhiều thế, giảm giá chút nhé."], ["店员", "您给我五十五吧，不能再便宜了。", "Chị đưa tôi 55 tệ nhé, không thể rẻ hơn nữa."]]}, {"title": "课文 4 · Chọn ti vi mới", "where": "Ở nhà, 刘明 xem ti vi và phát hiện vấn đề.", "lines": [["旁白", "这几天我们在新家坐着看电视的时候，又发现了新问题。", "Mấy hôm nay khi ngồi xem ti vi ở nhà mới, chúng tôi lại phát hiện vấn đề mới."], ["旁白", "房子大了，电视看起来就有点儿小。", "Nhà rộng hơn nên ti vi trông hơi nhỏ."], ["旁白", "这个电视是我们结婚时买的，是时候换个新电视了。", "Chiếc ti vi này mua khi chúng tôi kết hôn, đã đến lúc đổi ti vi mới."], ["旁白", "今天我一直在网上选电视，没想到，现在的电视不但便宜，而且用着非常方便。", "Hôm nay tôi liên tục chọn ti vi trên mạng; không ngờ ti vi hiện nay không những rẻ mà dùng còn rất tiện."], ["旁白", "有的电视叫它一声就能开机。我看了好几个，都很满意，晚上让一雪来决定吧。", "Có loại ti vi chỉ cần gọi một tiếng là bật được. Tôi đã xem mấy cái đều ưng ý, tối để Nhất Tuyết quyết định nhé."]]}], "grammar": [{"name": "连动句：动词 + 着 + 动词", "formula": "Động từ 1 + 着 + (tân ngữ) + động từ 2", "meaning": "着 chỉ trạng thái/cách thức của hành động thứ hai; hai hành động liên quan cùng một chủ thể.", "example": "咱们可以走着去。", "vi": "Chúng ta có thể đi bộ tới.", "tip": "着 gắn với động từ mô tả tư thế/cách thức (走着、坐着、穿着), không đơn thuần là thì hiện tại.", "color": "#dbeafe"}, {"name": "A 不比 B + tính từ", "formula": "A + 不比 + B + tính từ (+ 多少)", "meaning": "A không hơn B về tính chất nào đó; không nhất thiết có nghĩa A kém hơn B.", "example": "裙子不比短裤贵多少。", "vi": "Váy không đắt hơn quần đùi bao nhiêu.", "tip": "不比 khác với 没有…那么…; 不比 không khẳng định A thấp hơn B.", "color": "#fae8ff"}, {"name": "Tính từ / động từ tâm lý + 极了", "formula": "Chủ ngữ + tính từ / động từ tâm lý + 极了", "meaning": "Cực kỳ, vô cùng; nhấn mạnh mức độ rất cao.", "example": "这块西瓜甜极了！", "vi": "Miếng dưa hấu này ngọt cực kỳ!", "tip": "极了 đứng SAU từ miêu tả: 甜极了、热极了、喜欢极了.", "color": "#ffedd5"}, {"name": "不但……而且……", "formula": "(Chủ ngữ) + 不但 + mệnh đề 1， 而且 + mệnh đề 2", "meaning": "Không những… mà còn…; bổ sung thông tin theo hướng tăng tiến.", "example": "现在的电视不但便宜，而且用着非常方便。", "vi": "Ti vi hiện nay không những rẻ mà còn sử dụng rất thuận tiện.", "tip": "Hai ý phải cùng đối tượng/chủ đề; vị trí 不但 có thể thay đổi nếu hai vế khác chủ ngữ.", "color": "#dcfce7"}], "book": [["你的手机很______，买个新的吧。", ["试", "更", "矮", "旧", "声"], 3, "旧 = cũ; mua cái mới vì điện thoại cũ."], ["她比我大两岁，但是比我还______一点儿。", ["试", "更", "矮", "旧", "声"], 2, "矮 = thấp; so sánh chiều cao."], ["这条短裤比那条______合适，买这条吧。", ["试", "更", "矮", "旧", "声"], 1, "更 dùng để nhấn mạnh mức độ so sánh: càng phù hợp hơn."], ["我们都听见了他在教室外面的笑______。", ["试", "更", "矮", "旧", "声"], 4, "笑声 = tiếng cười."], ["上网买东西很方便，你应该______一下。", ["试", "更", "矮", "旧", "声"], 0, "试一下 = thử một chút."], ["假期的时候你们去哪儿旅游？我想去看海，不知道这个时间是不是______。", ["一共", "合适", "决定", "结婚", "开机"], 1, "合适 = phù hợp."], ["你们两个准备什么时候______？可能今年10月，到时候一定告诉你。", ["一共", "合适", "决定", "结婚", "开机"], 3, "结婚 = kết hôn."], ["你帮我看看，我的手机为什么不能______？", ["一共", "合适", "决定", "结婚", "开机"], 4, "开机 = bật máy."], ["网上的房子太多了，我还没有______去看哪一个。", ["一共", "合适", "决定", "结婚", "开机"], 2, "决定 = quyết định."], ["苹果两斤，八块；香蕉四斤，十二块。______二十块。", ["一共", "合适", "决定", "结婚", "开机"], 0, "一共 = tổng cộng."]], "extra": [["这辆自行车很______，我想买新的。", ["旧", "甜", "新鲜", "极"], 0, "Xe đạp đã cũ."], ["这条裙子比短裤______好看。", ["试", "更", "斤", "毛"], 1, "更 + tính từ: hơn nữa."], ["这块西瓜甜______！", ["多少", "一共", "极了", "合适"], 2, "Tính từ + 极了."], ["我们可以走______去商场。", ["着", "更", "比", "极"], 0, "走着去: đi bộ đến."], ["他坐______看电视。", ["才", "着", "斤", "旧"], 1, "坐着 biểu thị tư thế đang ngồi."], ["这条裙子______短裤贵多少。", ["不比", "极了", "不但", "一共"], 0, "不比 không đắt hơn."], ["这家店______便宜，而且东西也好。", ["不比", "不但", "更", "极了"], 1, "Cặp 不但…而且…"], ["你______尝尝这个西瓜。", ["决定", "试", "斤", "旧"], 1, "Thử nếm."], ["西瓜五块一______。", ["辆", "条", "公斤", "声"], 2, "公斤 là kilôgam."], ["这些水果很______。", ["新鲜", "水平", "声", "短裤"], 0, "水果很新鲜: hoa quả tươi."], ["妹妹______长高了。", ["已经", "裙子", "毛", "香蕉"], 0, "已经 = đã; từ bổ sung quen thuộc."], ["一______自行车。", ["辆", "条", "斤", "声"], 0, "Lượng từ xe."], ["一______裙子。", ["辆", "条", "斤", "声"], 1, "条 dùng cho váy (裙子)."], ["我还没有______买哪条裙子。", ["决定", "开机", "结婚", "冰"], 0, "Chưa quyết định mua cái nào."], ["这件衣服大小很______。", ["合适", "极了", "旧", "黄"], 0, "Cỡ vừa vặn."], ["你想______这双鞋吗？", ["试", "毛", "冰", "声"], 0, "Thử giày."], ["这个西瓜______甜，而且很新鲜。", ["不但", "不比", "旧", "斤"], 0, "Không những ngọt mà còn tươi."], ["我______喜欢这个颜色。", ["极了", "更", "毛", "声"], 1, "更喜欢: thích hơn."], ["一公斤等于______斤（theo đơn vị cân Trung Quốc）。", ["两", "一", "三", "四"], 0, "1 kg = 2 斤."], ["五十八块五______。", ["声", "毛", "车", "条"], 1, "5 hào."], ["苹果和香蕉______多少钱？", ["一共", "极了", "试", "更"], 0, "Tổng cộng bao nhiêu?"], ["西瓜放进冰箱，可以______起来。", ["冰", "试", "矮", "斤"], 0, "冰起来 = làm lạnh/đông."], ["你们什么时候______？", ["结婚", "合适", "旧", "极了"], 0, "Kết hôn."], ["有人喊了一______。", ["条", "辆", "声", "斤"], 2, "Một tiếng gọi."], ["电视不能______了。", ["开机", "裙子", "新鲜", "公斤"], 0, "Bật máy."], ["这件裙子______那条贵。", ["不比", "极了", "斤", "试"], 0, "So sánh không hơn."], ["王一雪穿______黄色的短裤。", ["着", "才", "极", "毛"], 0, "穿着: đang mặc."], ["这家水果店的香蕉______极了。", ["甜", "一共", "斤", "试"], 0, "甜极了."], ["不但价格便宜，______质量好。", ["而且", "不比", "旧", "更"], 0, "Câu tăng tiến."], ["看完这些，再______买哪一条。", ["决定", "极了", "西瓜", "公斤"], 0, "Quyết định sau khi xem."]]};

function speak(t){if(!('speechSynthesis'in window)){alert('Thiết bị không hỗ trợ giọng đọc.');return}speechSynthesis.cancel();let a=new SpeechSynthesisUtterance(t);a.lang='zh-CN';a.rate=.77;speechSynthesis.speak(a)}
function render(){document.getElementById('nav').innerHTML=tabs.map(([k,t])=>`<button class="${page===k?'active':''}" onclick="setPage('${k}')">${t}</button>`).join('');let a=document.getElementById('main');({home,vocab:showVocab,vquiz:showVQuiz,grammar:showGrammar,reading:showReading,translate:showTranslation,original:showExercises,practice:showExercises,mistakes:showExercises})[page](a)}
function home(a){let marks=Object.values(state.graded),done=marks.length,acc=marks.filter(Boolean).length;a.innerHTML=`<h2>Chào mừng đến HSK 3 – Bài 7 🚄</h2><p class="muted">Nội dung dựa trên trang 57–66 của giáo trình đính kèm. Quiz từ vựng và bài tập mở rộng có ghi rõ là nội dung biên soạn thêm.</p><div class="grid"><div class="stat">Từ vựng<strong>27</strong></div><div class="stat">Bài khóa<strong>4</strong></div><div class="stat">Đã làm<strong>${done}/40</strong><span class="small">Đúng ${acc}/${done||0}</span></div></div><div class="card"><h2>🧠 Tổng quan · Công thức trọng tâm</h2><p class="muted">Ba thẻ ngữ pháp hiển thị ngay dưới đây, bấm để học ví dụ và luyện tập.</p>${grammar.map((g,i)=>`<div class="cover"><h3>${i+1}. ${E(g.name)}</h3><div class="formula">${E(g.formula)}</div><p>${E(g.meaning)}</p><div class="hanzi">${E(g.example)}</div><p>${E(g.vi)}</p><button class="btn alt" onclick="ri=${i};setPage('grammar')">Học sâu chủ điểm này →</button></div>`).join('')}</div><div class="card"><h3>Lộ trình đề xuất</h3>① Học 27 từ → ② Quiz từ vựng → ③ Học 4 công thức → ④ Đọc và dịch 4 bài khóa → ⑤ Làm 10 câu sách → ⑥ Làm 30 câu mở rộng → ⑦ Ôn câu sai.<div class="toolbar"><button class="btn" onclick="setPage('vocab')">Bắt đầu học</button><button class="btn alt" onclick="setPage('original')">Làm bài gốc</button></div></div><div class="alert">Lưu ý: Tài liệu là trang scan; phần dịch tiếng Việt là bản tham khảo biên soạn. Chưa tích hợp audio gốc của sách.</div>`}
function showVocab(a){a.innerHTML=`<h2>🀄 27 từ vựng Bài 7</h2><p class="muted">Chữ Hán · Pinyin · nghĩa Việt · giọng đọc tiếng Trung của trình duyệt.</p><div class="toolbar"><input id="findv" placeholder="Tìm chữ Hán / Pinyin / nghĩa Việt" oninput="drawVocab(this.value)" style="padding:12px;border:1px solid #dbe1ed;border-radius:10px;max-width:350px;width:100%"><button class="btn" onclick="setPage('vquiz')">Luyện quiz →</button></div><div class="vgrid" id="vitems"></div>`;drawVocab('')}
function drawVocab(term){let g=document.getElementById('vitems');if(!g)return;g.innerHTML=vocab.filter(v=>v.join(' ').toLowerCase().includes(term.toLowerCase())).map(v=>`<div class="card"><div class="hanzi">${E(v[0])}</div><div class="py">${E(v[1])}</div><p>${E(v[2])}</p><button class="btn alt voice" onclick="speak('${E(v[0])}')">🔊 Nghe</button></div>`).join('')}
function vkey(i){return vm+'_'+i}function vopts(i){let inds=[i];for(let k=1;inds.length<4;k++){let j=(i+k*7)%vocab.length;if(!inds.includes(j))inds.push(j)}return inds.sort((a,b)=>((a*17+5)%29)-((b*17+5)%29))}
function showVQuiz(a){let n=vocab.filter((_,i)=>vkey(i) in state.vgraded).length,ok=vocab.filter((_,i)=>state.vgraded[vkey(i)]===true).length;a.innerHTML=`<h2>🧩 Quiz từ vựng · 27 từ</h2><p class="muted">3 chế độ: Hán → nghĩa, nghĩa → Hán, chữ Hán → Pinyin. 81 lượt câu hỏi.</p><div class="card"><div class="toolbar"><button class="pill ${vm==='hv'?'on':''}" onclick="setVM('hv')">Hán → Việt</button><button class="pill ${vm==='vh'?'on':''}" onclick="setVM('vh')">Việt → Hán</button><button class="pill ${vm==='hp'?'on':''}" onclick="setVM('hp')">Hán → Pinyin</button></div><b>Đã chấm ${n}/27 · Đúng ${ok}</b><div class="progress"><i style="width:${n/27*100}%"></i></div></div>${vocab.map((v,i)=>{let k=vkey(i),pick=state.vanswer[k],graded=k in state.vgraded,opts=vopts(i),show=j=>vm==='hv'?vocab[j][2]:vm==='vh'?vocab[j][0]:vocab[j][1];return `<div class="quiz"><span class="badge">Từ ${i+1}/27</span><div class="qtitle">${E(vm==='vh'?v[2]:v[0])}</div>${opts.map((j,n)=>`<button class="option ${pick===j?'sel':''} ${graded&&j===i?'good':''} ${graded&&pick===j&&j!==i?'bad':''}" onclick="chooseV(${i},${j})">${'ABCD'[n]}. ${E(show(j))}</button>`).join('')}<button class="btn" onclick="checkV(${i})">Chấm đáp án</button> <button class="btn alt" onclick="speak('${E(v[0])}')">🔊 Nghe</button>${graded?`<div class="feedback ${state.vgraded[k]?'good':'bad'}"><b>${state.vgraded[k]?'✅ Đúng':'❌ Sai'}</b><p><b>Feynman:</b> ${E(v[0])} đọc là <b>${E(v[1])}</b>, nghĩa <b>${E(v[2])}</b>.</p><div class="socrates"><b>Socrates:</b> Em thử đặt một câu ngắn có từ này trong tình huống đi tàu cao tốc?</div></div>`:''}</div>`}).join('')}`}
function chooseV(i,j){let k=vkey(i);state.vanswer[k]=j;delete state.vgraded[k];save();keep()}function checkV(i){let k=vkey(i);if(!(k in state.vanswer)){alert('Hãy chọn đáp án.');return}state.vgraded[k]=state.vanswer[k]===i;save();keep()}
function showGrammar(a){a.innerHTML=`<h2>📒 Ngữ pháp 1–4</h2><div class="toolbar">${grammar.map((g,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">${i+1}. ${E(g.name)}</button>`).join('')}</div>${(()=>{let g=grammar[Math.min(ri,3)];return `<div class="card grammar"><h2>${E(g.name)}</h2><div class="formula">${E(g.formula)}</div><h3>Ý nghĩa</h3><p>${E(g.meaning)}</p><h3>Ví dụ trong bài</h3><div class="hanzi">${E(g.example)}</div><p>${E(g.vi)}</p><p class="textnote"><b>Feynman:</b> ${E(g.tip)}</p><div class="socrates"><b>Câu hỏi Socrates:</b> Nếu thay cụm này bằng cách nói khác, sắc thái của người nói sẽ thay đổi như thế nào?</div></div>`})()}<button class="btn" onclick="setPage('practice')">Luyện vận dụng ngữ pháp →</button>`}
function showReading(a){let r=readings[ri%4];a.innerHTML=`<h2>📖 Đọc hiểu 4 bài khóa</h2><div class="toolbar">${readings.map((x,i)=>`<button class="pill ${i===ri?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div><div class="card"><h2>${E(r.title)}</h2><p class="muted">${E(r.where)}</p>${r.lines.map(([sp,cn,vi],i)=>`<div class="readingline"><div class="hanzi"><b>${E(sp)}：</b>${E(cn)}</div><button class="btn alt voice" onclick="speak('${E(cn)}')">🔊 Đọc</button> <details><summary>Xem bản dịch</summary>${E(vi)}</details></div>`).join('')}<h3>Vấn đáp Socrates · Đọc hiểu</h3>${r.questions.map((q,i)=>`<p>${i+1}. ${E(q)}</p>`).join('')}<button class="btn" onclick="setPage('translate')">Tự dịch bài khóa →</button></div>`}
function showTranslation(a){let r=readings[ri%4];a.innerHTML=`<h2>🌏 Dịch từng câu · Trung → Việt</h2><p class="muted">Viết trước khi xem đáp án mẫu. Nội dung tự lưu trên trình duyệt.</p><div class="toolbar">${readings.map((x,i)=>`<button class="pill ${i===ri?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div><div class="card"><h3>${E(r.title)}</h3>${r.lines.map(([sp,cn,vi],i)=>{let key='r'+ri+'_'+i;return `<div class="readingline"><div class="hanzi">${E(sp)}：${E(cn)}</div><textarea placeholder="Viết bản dịch tiếng Việt của bạn..." oninput="transInput('${key}',this.value)">${E(state.translation[key]||'')}</textarea><details><summary>🔎 Xem bản dịch mẫu và tự đối chiếu</summary><div class="feedback good">${E(vi)}</div><p class="small">Socrates: Hãy tìm chủ ngữ, động từ chính, từ chỉ thời gian và thành phần chỉ kết quả.</p></details></div>`}).join('')}<button class="btn alt" onclick="downloadTrans()">Xuất bản dịch (.txt)</button></div>`}
function transInput(k,v){state.translation[k]=v;save()}function downloadTrans(){let r=readings[ri%4],txt=r.title+'\n\n'+r.lines.map(([sp,cn],i)=>sp+'：'+cn+'\n'+(state.translation['r'+ri+'_'+i]||'')).join('\n\n');let u=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='HSK3_Bai7_Dich_Bai'+(ri+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),800)}
const questions=[...book.map((e,i)=>({id:'b'+i,q:e[0],opts:e[1],ans:e[1].indexOf(e[2]===undefined?'':e[1][e[2]]),ex:e[3],source:true})),...extra.map((e,i)=>({id:'e'+i,q:e[0],opts:e[1],ans:e[2],ex:e[3],source:false}))];
// For source questions the numeric answer key is recorded in DB.book's 3rd item.
book.forEach((e,i)=>questions[i].ans=e[2]);
function showExercises(a){let list=page==='original'?questions.filter(q=>q.source):page==='practice'?questions.filter(q=>!q.source):questions.filter(q=>state.graded[q.id]===false);let n=list.filter(q=>q.id in state.graded).length,ok=list.filter(q=>state.graded[q.id]===true).length;a.innerHTML=`<h2>${page==='original'?'📝 10 câu điền từ từ sách · tr. 64–65':page==='practice'?'🎯 30 câu luyện vận dụng':'🔁 Ôn lại câu sai'}</h2><p class="muted">${page==='original'?'Câu gốc dựa trên mục 综合练习, mỗi câu có các lựa chọn của nhóm từ tương ứng.':'Các câu trắc nghiệm mở rộng do app biên soạn, không phải bài gốc.'}</p><div class="quizstats">Đã chấm <b>${n}/${list.length}</b> · Đúng <b>${ok}</b><div class="progress"><i style="width:${list.length?n/list.length*100:0}%"></i></div></div>${list.length?list.map((q,i)=>{let p=state.answer[q.id],g=q.id in state.graded;return `<article class="quiz"><span class="badge">Câu ${i+1} ${q.source?'· Theo sách':'· Mở rộng'}</span><h3 class="qtitle">${E(q.q)}</h3>${q.opts.map((o,j)=>`<button class="option ${p===j?'sel':''} ${g&&j===q.ans?'good':''} ${g&&p===j&&p!==q.ans?'bad':''}" onclick="pick('${q.id}',${j})">${'ABCDE'[j]}. ${E(o)}</button>`).join('')}<button class="btn" onclick="check('${q.id}')">Kiểm tra đáp án</button>${g?`<div class="feedback ${state.graded[q.id]?'good':'bad'}"><b>${state.graded[q.id]?'✅ Chính xác':'❌ Chưa đúng'}. Đáp án: ${E(q.opts[q.ans])}</b><p><b>Feynman:</b> ${E(q.ex)}</p><div class="socrates"><b>Socrates:</b> Từ nào trong ngữ cảnh giúp em chọn đáp án này và loại những từ còn lại?</div></div>`:''}</article>`}).join(''):'<div class="card empty">Chưa có câu sai. Hãy làm bài tập trước nhé!</div>'}`}
function pick(id,j){state.answer[id]=j;delete state.graded[id];save();keep()}function check(id){if(!(id in state.answer)){alert('Hãy chọn đáp án trước.');return}let q=questions.find(x=>x.id===id);state.graded[id]=state.answer[id]===q.ans;save();keep()}
function keep(){let y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,y))}render();
</script></body></html>
