</style></head><body><header><span class="mini">HSK 3 · SMART PRACTICE</span><h1>第4课 · 这家宾馆跟别的都不一样</h1><p class="topsub">Khách sạn này khác với những khách sạn khác · Bài 4 (trang 29–37)</p></header><div class="layout"><nav id="nav"></nav><main id="app"></main></div><div class="lightbox" id="zoom"><div class="inner"><button class="btn subtle close" onclick="document.querySelector('#zoom').classList.remove('show')">✕ Đóng</button><div id="zcontent"></div></div></div><script>
const DATA={"vocab": [["假期", "jiàqī", "kỳ nghỉ"], ["海", "hǎi", "biển"], ["草原", "cǎoyuán", "thảo nguyên"], ["主意", "zhǔyi", "ý tưởng"], ["骑", "qí", "cưỡi, đi (xe)"], ["马", "mǎ", "ngựa"], ["羊", "yáng", "cừu"], ["月亮", "yuèliang", "mặt trăng"], ["一定", "yídìng", "chắc chắn"], ["刻", "kè", "15 phút (đơn vị thời gian)"], ["起飞", "qǐfēi", "cất cánh"], ["宾馆", "bīnguǎn", "khách sạn"], ["特别", "tèbié", "đặc biệt"], ["别的", "biéde", "khác"], ["一样", "yíyàng", "giống nhau"], ["牛", "niú", "bò"], ["相机", "xiàngjī", "máy ảnh"], ["欢迎", "huānyíng", "chào đón"], ["司机", "sījī", "tài xế"], ["晚点", "wǎndiǎn", "đến muộn"], ["久", "jiǔ", "lâu"], ["除了", "chúle", "ngoài, ngoại trừ"], ["以外", "yǐwài", "ở ngoài, ngoài ra"], ["先", "xiān", "trước"], ["一直", "yìzhí", "suốt, liên tục"], ["干净", "gānjìng", "sạch sẽ"], ["满意", "mǎnyì", "hài lòng"]], "texts": [[["杨同乐", "这个假期咱们去哪儿玩玩吧。", "Kỳ nghỉ này chúng mình đi đâu đó chơi nhé."], ["王一飞", "好啊，你想去哪儿，咱们就去哪儿。", "Được đấy, cậu muốn đi đâu thì chúng ta đi đó."], ["杨同乐", "你喜欢海，找个海边住几天，怎么样？", "Cậu thích biển, tìm một nơi ven biển ở vài ngày, thế nào?"], ["王一飞", "现在去海边有点儿冷。", "Bây giờ đi biển thì hơi lạnh."], ["杨同乐", "那去草原吧？草原一点儿也不冷。", "Vậy đến thảo nguyên nhé? Thảo nguyên chẳng lạnh chút nào."], ["王一飞", "这个主意好！我好久没骑马了。", "Ý tưởng này hay! Tôi lâu rồi chưa cưỡi ngựa."], ["杨同乐", "对，在草原上骑马、吃羊肉、看月亮，一定很有意思。", "Đúng, cưỡi ngựa, ăn thịt cừu và ngắm trăng trên thảo nguyên chắc chắn thú vị."]], [["杨同乐", "出去玩的机票买好了吗？", "Cậu đã mua vé máy bay cho chuyến đi chưa?"], ["王一飞", "买好了。星期六上午十点一刻起飞。", "Mua rồi. Máy bay cất cánh lúc 10 giờ 15 sáng thứ Bảy."], ["杨同乐", "宾馆也选好了吗？", "Đã chọn khách sạn chưa?"], ["王一飞", "是的，这家宾馆很特别，跟别的都不一样，一出门就能看见牛和羊！", "Rồi, khách sạn này rất đặc biệt, không giống những nơi khác; vừa ra khỏi cửa là có thể nhìn thấy bò và cừu!"], ["杨同乐", "太好了！你看看要带什么东西？", "Tuyệt quá! Cậu xem cần mang gì?"], ["王一飞", "我们不用带太多东西，别忘了拿上新买的相机。", "Chúng ta không cần mang quá nhiều đồ; đừng quên mang theo chiếc máy ảnh mới mua."], ["杨同乐", "一定不会忘带的。我现在就去准备行李。", "Chắc chắn sẽ không quên. Tôi đi chuẩn bị hành lý ngay đây."]], [["小李", "欢迎你们！我是你们的司机，我姓李，叫我小李就可以。", "Chào mừng hai bạn! Tôi là tài xế của hai bạn, họ Lý, cứ gọi tôi là Tiểu Lý."], ["杨同乐", "您好！不好意思，飞机晚点了，让您久等了。", "Xin chào! Xin lỗi, máy bay đến muộn khiến anh phải chờ lâu."], ["小李", "没关系。除了这个行李箱以外，还有别的东西吗？", "Không sao. Ngoài chiếc vali này còn có đồ gì khác không?"], ["杨同乐", "还有一个包，我自己拿就可以。", "Còn một cái túi nữa, tôi tự cầm được."], ["小李", "车在一层，请跟我来。", "Xe ở tầng một, xin theo tôi."], ["杨同乐", "我们住的宾馆离机场远吗？", "Khách sạn chúng tôi ở có xa sân bay không?"], ["小李", "不远，三十分钟就能到。两位到了可以先休息休息，晚饭的时候我叫你们。", "Không xa, 30 phút là đến. Hai bạn đến nơi có thể nghỉ ngơi trước, đến giờ ăn tối tôi gọi."]], [["日记", "今天是我们旅游的第一天。", "Hôm nay là ngày đầu tiên trong chuyến du lịch của chúng tôi."], ["日记", "我们很早就起床去机场了，没想到飞机晚点了。", "Chúng tôi dậy rất sớm để ra sân bay, không ngờ máy bay bị trễ."], ["日记", "我们到的时候，天已经黑了，但是司机小李一直在机场等我们，一点儿也没着急。", "Khi chúng tôi đến thì trời đã tối, nhưng tài xế Tiểu Lý vẫn luôn chờ ở sân bay, chẳng hề sốt ruột."], ["日记", "他特别热情，路上给我们介绍了很多东西，还准备了水果。", "Anh ấy rất nhiệt tình, trên đường giới thiệu cho chúng tôi nhiều điều, còn chuẩn bị hoa quả."], ["日记", "宾馆的房间跟我想的一样漂亮，又大又干净，我非常满意。", "Phòng khách sạn đẹp đúng như tôi nghĩ, vừa rộng vừa sạch, tôi rất hài lòng."]]], "grammar": [{"name": "一……也/都 + 不/没……", "title": "Phủ định hoàn toàn", "rule": "一 + lượng từ / 一点儿 + 也/都 + 不/没 + động từ hoặc tính từ", "note": "Nhấn mạnh “không… một chút nào”. Với tính từ thường gặp 一点儿也不 + tính từ.", "example": "草原一点儿也不冷。", "vi": "Thảo nguyên không lạnh chút nào.", "trap": "Không bỏ 不/没: 一点儿也 + tính từ không phải cấu trúc phủ định."}, {"name": "A 跟 B (不) 一样", "title": "So sánh giống/khác nhau", "rule": "A + 跟 + B + 一样 (+ tính từ) / A + 跟 + B + 不一样", "note": "一样 so sánh hai đối tượng tương đồng; 不一样 là khác nhau.", "example": "这家宾馆跟别的都不一样。", "vi": "Khách sạn này khác với những khách sạn khác.", "trap": "Chú ý 不 đứng ngay trước 一样 khi phủ định."}, {"name": "除了……（以外），……都 / 还 / 也……", "title": "Ngoại trừ / Ng function fillVocab(){let target=document.querySelector('#vgrid');if(!target)return;target.innerHTML=DATA.vocab.filter(v=>v.join(' ').toLowerCase().includes(search.toLowerCase())).map(v=>`<div class="vcard"><div class="hanzi">${esc(v[0])}</div><div class="pinyin">${esc(v[1])}</div><p>${esc(v[2])}</p><button class="btn soft" onclick="speak('${esc(v[0])}')">🔊 Phát âm</button></div>`).join('')}
function makeQ(x,id){return {id,text:x[0],options:x[1],right:x[2],explain:x[3],socrates:x[4]}}
function vocabQuestion(i){let v=DATA.vocab[i],pool=[i];for(let step=1;pool.length<4;step++){let j=(i+step*7)%27;if(!pool.includes(j))pool.push(j)}pool.sort((a,b)=>((a*13+5)%31)-((b*13+5)%31));let text=vmode==='vizh'?v[2]:v[0],opts=pool.map(j=>vmode==='vizh'?DATA.vocab[j][0]:vmode==='py'?DATA.vocab[j][1]:DATA.vocab[j][2]);return {id:'v'+vmode+i,text,options:opts,right:pool.indexOf(i),explain:`${v[0]} (${v[1]}) nghĩa là “${v[2]}”.`,socrates:`Hãy tự đặt một câu ngắn có từ ${v[0]}.`}}
function qHTML(q,i=0){let rec=state.answers[q.id]||{},checked=rec.done;return `<div class="question"><span class="mini">Câu ${i+1}</span><h3>${esc(q.text)}</h3>${q.options.map((o,j)=>`<button class="choice ${rec.pick===j?'sel':''} ${checked&&q.right===j?'good':''} ${checked&&rec.pick===j&&!rec.ok?'bad':''}" onclick="choose('${q.id}',${j})">${'ABCDE'[j]}. ${esc(o)}</button>`).join('')}<div class="toolbar"><button class="btn" onclick="check('${q.id}')">Check đáp án</button><button class="btn subtle" onclick="reset('${q.id}')">Làm lại</button></div>${checked?`<div class="feedback ${rec.ok?'correct':'wrong'}"><b>${rec.ok?'✅ Chính xác!':'❌ Chưa chính xác'}</b><p>Đáp án: <b>${'ABCDE'[q.right]}. ${esc(q.options[q.right])}</b></p><b>Feynman · Vì sao?</b><p>${esc(q.explain)}</p>${rec.ok?'':`<div class="socrates"><b>Socrates · Tự tìm lỗ hổng</b><p>${esc(q.socrates)}</p><p class="small">Đọc câu hỏi, tự trả lời rồi mới làm lại.</p></div>`}</div>`:''}</div>`}
function allQuestions(){return [...DATA.original.map((x,i)=>makeQ(x,'o'+i)),...DATA.extra.map((x,i)=>makeQ(x,'e'+i)),...DATA.listening.map((x,i)=>({id:'l'+i,text:x[1],options:x[2],right:x[3],explain:'Đối chiếu tình tiết trong bài khóa.',socrates:'Bằng chứng nào trong bài khóa cho đáp án?' })),...DATA.vocab.map((_,i)=>vocabQuestion(i))]}
function lookup(id){if(id.startsWith('v')){let m=id.match(/^v(zhvi|vizh|py)(\d+)$/);if(m){let prev=vmode;vmode=m[1];let q=vocabQuestion(+m[2]);vmode=prev;return q}}return allQuestions().find(q=>q.id===id)}
function choose(id,pick){state.answers[id]={pick,done:false};save();rerender()}function check(id){let q=lookup(id),r=state.answers[id];if(!r||r.pick===undefined)return alert('Chọn một đáp án trước');r.done=true;r.ok=r.pick===q.right;save();rerender()}function reset(id){delete state.answers[id];save();rerender()}function rerender(){let y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,y))}function resetV(){if(!confirm('Làm lại toàn bộ quiz của chế độ hiện tại?'))return;DATA.vocab.forEach((_,i)=>delete state.answers['v'+vmode+i]);save();render()}function saveTrans(k,v){state.translations[k]=v;save()}
function downloadTranslation(){let text=DATA.texts[lesson].map((r,i)=>r[1]+'\n'+(state.translations['t'+lesson+'_'+i]||'')).join('\n\n')+'\n\nDỊCH CẢ BÀI:\n'+(state.translations['t'+lesson+'all']||'');let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='HSK3_Bai4_BaiKhoa'+(lesson+1)+'_BanDich.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}render();
</script></body></html>
