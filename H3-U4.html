<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSK 3 · Bài 4 — Smart Practice</title><style>
:root{--blue:#425fe3;--ink:#26334c;--muted:#65758f;--line:#e5e9f3;--bg:#f6f8fd;--pink:#fff0f5;--good:#087c54;--bad:#c33349}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 'Segoe UI',Arial,'Microsoft YaHei',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}header{background:linear-gradient(120deg,#202f6e,#6377e7);color:white;padding:22px 28px}h1{font-size:26px;margin:5px 0}.topsub{opacity:.86;margin:0}.layout{display:grid;grid-template-columns:240px minmax(0,1fr)}nav{background:white;border-right:1px solid var(--line);min-height:calc(100vh - 100px);padding:14px}nav button{display:block;text-align:left;width:100%;background:none;border:0;border-radius:12px;padding:11px 12px;color:#40516f;font-weight:650;margin-bottom:4px}nav button.active,nav button:hover{background:#eaf0ff;color:#304fc2}main{max-width:1030px;width:100%;padding:25px;margin:auto}.card,.question{background:white;border:1px solid var(--line);border-radius:17px;padding:21px;margin-bottom:16px;box-shadow:0 4px 22px #23345a08}.hero{background:linear-gradient(120deg,#fff3f4,#f1f5ff)}h2{font-size:23px;line-height:1.4;margin:0 0 12px}h3{font-size:18px;margin:9px 0}.muted,.small{color:var(--muted)}.small{font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#f3f6ff;border-radius:12px;padding:17px}.stat b{display:block;font-size:29px;color:var(--blue)}.btn{border:0;background:var(--blue);color:white;border-radius:10px;padding:10px 14px;font-weight:650}.btn.soft{background:#e9eeff;color:#304fc2}.btn.subtle{background:#f1f3f8;color:#3b4a63}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:14px 0}.tab{background:white;border:1px solid #d8deec;border-radius:99px;padding:7px 12px;color:#455474}.tab.on{color:white;background:var(--blue);border-color:var(--blue)}.posters{display:grid;grid-template-columns:1fr;gap:16px}.poster{border-radius:17px;padding:19px;background:#fff;border:1px solid #e4dced}.poster:nth-child(1){background:#fff6f8}.poster:nth-child(2){background:#f3f5ff}.poster:nth-child(3){background:#f2fff6}.poster .label{font-size:12px;font-weight:800;letter-spacing:1px;color:#a45379}.poster h3{font-size:22px}.formula{font-size:20px;font-weight:750;color:#a8366d;line-height:1.7;background:#fff;padding:12px;border:1px dashed #edb7d3;border-radius:10px;margin:11px 0}.example{font-size:20px;font-weight:600;color:#203c75}.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}.vcard{background:white;border:1px solid var(--line);border-radius:14px;padding:14px}.hanzi{font-size:27px;font-weight:700}.pinyin{color:#426db0}.choice{width:100%;text-align:left;padding:11px 12px;margin:7px 0;border-radius:10px;background:#fafbff;border:1px solid #d9e1ef;color:#26334c}.choice.sel{border:2px solid var(--blue);padding:10px 11px;background:#edf2ff}.choice.good{background:#e5f9ee;border-color:var(--good)}.choice.bad{background:#fff0f1;border-color:var(--bad)}.feedback{padding:14px;margin-top:12px;border-radius:11px;background:#f1f5ff}.feedback.correct{background:#e6f9f0}.feedback.wrong{background:#fff0f2}.socrates{border-left:4px solid #e3a43e;padding:9px 13px;margin-top:9px;background:#fff9e9}.reader{font-size:20px;line-height:2;padding:12px;background:#f9fbff;border-radius:11px}.translation{border-left:4px solid #cfdaff;padding:11px 13px;margin:13px 0}.translation .cn{font-size:21px}textarea{width:100%;min-height:90px;border:1px solid #cfd7e9;border-radius:10px;padding:11px;resize:vertical}details{margin-top:9px}summary{cursor:pointer;color:#3155ba;font-weight:700}.bar{height:10px;border-radius:10px;background:#e1e8f8;overflow:hidden}.bar>i{display:block;background:#5474e9;height:100%}.notice{border-radius:11px;padding:14px;background:#fff7e4;color:#80622c}.listrow{border-bottom:1px solid var(--line);padding:12px 0}.mini{font-size:12px;background:#fff0f4;border-radius:9px;padding:4px 9px;color:#9a4460;font-weight:bold;display:inline-block}.lightbox{position:fixed;inset:0;background:#151b2dcc;display:none;align-items:center;justify-content:center;padding:24px;z-index:20}.lightbox.show{display:flex}.lightbox .inner{background:white;width:min(920px,100%);max-height:95vh;overflow:auto;border-radius:17px;padding:24px}.close{float:right}.selectmode{display:flex;flex-wrap:wrap;gap:6px}@media(max-width:760px){.layout{display:block}nav{min-height:0;position:sticky;top:0;display:flex;overflow-x:auto;z-index:10;padding:6px}nav button{white-space:nowrap;width:auto;font-size:12px}.stats{grid-template-columns:1fr}main{padding:13px}header{padding:17px}h1{font-size:21px}.card{padding:16px}}
</style></head><body><header><span class="mini">HSK 3 · SMART PRACTICE</span><h1>第4课 · 这家宾馆跟别的都不一样</h1><p class="topsub">Khách sạn này khác với những khách sạn khác · Bài 4 (trang 29–37)</p></header><div class="layout"><nav id="nav"></nav><main id="app"></main></div><div class="lightbox" id="zoom"><div class="inner"><button class="btn subtle close" onclick="document.querySelector('#zoom').classList.remove('show')">✕ Đóng</button><div id="zcontent"></div></div></div><script src="data.js"></script><script>
const PAGES=[['home','🏠 Tổng quan'],['vocab','🀄 Từ vựng'],['vquiz','🧩 Quiz từ vựng'],['grammar','📒 Ngữ pháp'],['reading','📖 4 bài khóa'],['translate','🌏 Luyện dịch'],['listen','🎧 Câu hỏi nghe hiểu'],['original','📝 Bài tập trong sách'],['practice','🎯 Luyện mở rộng'],['mistakes','🔁 Ôn câu sai']];
let page='home',lesson=0,focus=0,vmode='zhvi',tmode='sentence',search='';let state;try{state=JSON.parse(localStorage.getItem('hsk3-bai4-v1')||'{}')}catch(e){state={}}state.answers??={};state.translations??={};let save=()=>localStorage.setItem('hsk3-bai4-v1',JSON.stringify(state));const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function setPage(p){page=p;window.scrollTo(0,0);render()};function speak(s){if(!('speechSynthesis'in window))return alert('Trình duyệt không có tính năng phát âm');speechSynthesis.cancel();let v=new SpeechSynthesisUtterance(s);v.lang='zh-CN';v.rate=.78;speechSynthesis.speak(v)}
function cardGrammar(g,i){return `<section class="poster"><div class="label">GHI CHÚ CÔNG THỨC ${i+1} · BÀI 4</div><h3>${esc(g.name)}</h3><p><b>${esc(g.title)}</b></p><div class="formula">${esc(g.rule)}</div><p>${esc(g.note)}</p><div class="example">${esc(g.example)}</div><p>${esc(g.vi)}</p><button class="btn soft" onclick="speak('${esc(g.example)}')">🔊 Nghe câu ví dụ</button> <button class="btn subtle" onclick="focus=${i};setPage('grammar')">Học sâu →</button></section>`}
function render(){document.querySelector('#nav').innerHTML=PAGES.map(([id,n])=>`<button class="${page===id?'active':''}" onclick="setPage('${id}')">${n}</button>`).join('');let app=document.querySelector('#app');let count=Object.values(state.answers).filter(a=>a.done).length,correct=Object.values(state.answers).filter(a=>a.done&&a.ok).length;
if(page==='home'){app.innerHTML=`<section class="card hero"><h2>Khởi động Bài 4 👋</h2><p>Học về kế hoạch du lịch, khách sạn, cách so sánh và mẫu phủ định hoàn toàn.</p><div class="stats"><div class="stat">Từ vựng<b>27</b>Hán tự · Pinyin · Nghĩa</div><div class="stat">Chủ điểm<b>3</b>Cấu trúc và ví dụ</div><div class="stat">Đã làm<b>${count}</b>Trong ${PAGES.length} phân hệ</div></div><div class="toolbar"><button class="btn" onclick="setPage('vocab')">Bắt đầu học →</button><button class="btn soft" onclick="setPage('translate')">Luyện dịch bài khóa</button></div><p class="small">Điểm đúng: ${correct}/${count||0}. Tiến độ tự lưu trên trình duyệt.</p></section><h2>🎨 Tổng quan · Bộ công thức ngữ pháp</h2><p class="muted">Các bảng công thức trình bày trực quan ngay trong app, chưa phải ảnh ghi chú viết tay tạo riêng. Bạn có thể mở học sâu từng cấu trúc.</p><div class="posters">${DATA.grammar.map(cardGrammar).join('')}</div><div class="notice">Bài nghe theo mã audio của sách; nếu không có audio gốc, hãy dùng chế độ đọc hiểu và giọng tổng hợp, không coi đó là bài kiểm tra nghe chuẩn.</div>`}
else if(page==='vocab'){app.innerHTML=`<h2>🀄 Từ vựng · 27 từ</h2><p class="muted">Theo các bảng 生词 ở trang 30, 32, 33 và 35.</p><div class="toolbar"><input style="padding:10px;border:1px solid #ccd6e9;border-radius:10px;min-width:260px" value="${esc(search)}" placeholder="Tìm Hán tự, Pinyin, nghĩa Việt" oninput="search=this.value;fillVocab()"><button class="btn" onclick="setPage('vquiz')">Làm quiz từ vựng →</button></div><div id="vgrid" class="vgrid"></div>`;fillVocab()}
else if(page==='vquiz'){let n=DATA.vocab.filter((_,i)=>state.answers['v'+vmode+i]?.done).length;app.innerHTML=`<h2>🧩 Quiz 27 từ vựng</h2><div class="toolbar">${[['zhvi','Hán → nghĩa'],['vizh','Nghĩa → Hán'],['py','Hán → Pinyin']].map(([k,v])=>`<button class="tab ${vmode===k?'on':''}" onclick="vmode='${k}';render()">${v}</button>`).join('')}<button class="btn subtle" onclick="resetV()">Làm lại chế độ</button></div><div class="card"><b>Đã làm: ${n}/27</b><div class="bar"><i style="width:${n/27*100}%"></i></div></div>${DATA.vocab.map((x,i)=>qHTML(vocabQuestion(i),i)).join('')}`}
else if(page==='grammar'){let g=DATA.grammar[focus];app.innerHTML=`<h2>📒 Học ngữ pháp</h2><div class="toolbar">${DATA.grammar.map((v,i)=>`<button class="tab ${focus===i?'on':''}" onclick="focus=${i};render()">${i+1}. ${esc(v.name)}</button>`).join('')}</div>${cardGrammar(g,focus)}<div class="card"><h3>🧠 Hiểu kiểu Feynman</h3><p>${esc(g.note)}</p><h3>⚠️ Bẫy dễ sai</h3><p>${esc(g.trap)}</p><h3>Tự hỏi kiểu Socrates</h3><p>Ở ví dụ này, từ nào là dấu hiệu của cấu trúc? Nếu bỏ từ đó, ý nghĩa thay đổi ra sao?</p><button class="btn" onclick="setPage('practice')">Vận dụng ngay →</button></div>`}
else if(page==='reading'){let lines=DATA.texts[lesson];app.innerHTML=`<h2>📖 4 bài khóa · 原文</h2>${lessonTabs()}<section class="card"><h3>课文 ${lesson+1}</h3>${lines.map(([who,cn])=>`<div class="listrow"><b>${esc(who)}：</b><span style="font-size:21px">${esc(cn)}</span><button class="btn subtle" style="margin-left:8px" onclick="speak('${esc(cn)}')">🔊</button></div>`).join('')}<div class="toolbar"><button class="btn soft" onclick="speak(DATA.texts[lesson].map(x=>x[1]).join('。'))">🔊 Đọc cả bài</button><button class="btn" onclick="setPage('translate')">Dịch bài khóa này →</button></div></section>`}
else if(page==='translate'){let lines=DATA.texts[lesson],prefix='t'+lesson;app.innerHTML=`<h2>🌏 Dịch Trung → Việt</h2><p class="muted">Tự dịch trước, sau đó mở đáp án tham khảo; app không tự chấm nghĩa câu dịch tự do.</p>${lessonTabs()}<div class="toolbar"><button class="tab ${tmode==='sentence'?'on':''}" onclick="tmode='sentence';render()">Dịch từng câu</button><button class="tab ${tmode==='whole'?'on':''}" onclick="tmode='whole';render()">Dịch cả bài</button><button class="btn subtle" onclick="downloadTranslation()">⬇ Xuất bản dịch TXT</button></div><section class="card">${tmode==='whole'?`<div class="reader">${lines.map(x=>esc(x[1])).join('<p></p>')}</div><textarea style="min-height:220px" placeholder="Dịch cả bài..." oninput="saveTrans('${prefix}all',this.value)">${esc(state.translations[prefix+'all'])}</textarea><details><summary>Xem bản dịch mẫu toàn bài</summary><p>${lines.map(x=>esc(x[2])).join('<br>')}</p></details>`:lines.map(([who,cn,vi],i)=>`<div class="translation"><b>Câu ${i+1} · ${esc(who)}</b><div class="cn">${esc(cn)}</div><button class="btn subtle" onclick="speak('${esc(cn)}')">🔊 Nghe</button><textarea placeholder="Viết bản dịch của bạn…" oninput="saveTrans('${prefix}_${i}',this.value)">${esc(state.translations[prefix+'_'+i])}</textarea><details><summary>Kiểm tra với đáp án mẫu</summary><p>${esc(vi)}</p><p class="small">Tự xét: chủ ngữ là ai? Động từ chính nào? Phần nào là trạng ngữ, bổ ngữ hoặc mẫu ngữ pháp?</p></details></div>`).join('')}</section>`}
else if(page==='listen'){let arr=DATA.listening.map((v,i)=>({id:'l'+i,text:v[1],options:v[2],right:v[3],explain:'Đọc lại bài khóa tương ứng để đối chiếu ý chính và chi tiết.',socrates:'Cụm từ nào trong bài khóa cho phép loại các phương án sai?'}));app.innerHTML=`<h2>🎧 8 câu nghe hiểu từ sách</h2><div class="notice">Chưa có tệp âm thanh gốc của giáo trình trong PDF, vì vậy đây là chế độ làm câu hỏi dựa trên bài khóa đã đọc; đáp án được suy ra từ hội thoại.</div>${arr.map(qHTML).join('')}`}
else if(['original','practice','mistakes'].includes(page)){let arr=[...DATA.original.map((x,i)=>makeQ(x,'o'+i)),...DATA.extra.map((x,i)=>makeQ(x,'e'+i))];if(page==='original')arr=arr.filter(q=>q.id.startsWith('o'));if(page==='practice')arr=arr.filter(q=>q.id.startsWith('e'));if(page==='mistakes')arr=arr.filter(q=>state.answers[q.id]?.done&&!state.answers[q.id]?.ok);app.innerHTML=`<h2>${page==='original'?'📝 10 câu chọn từ trong sách':page==='practice'?'🎯 30 câu luyện mở rộng':'🔁 Luyện câu đã sai'}</h2><p class="muted">${page==='original'?'Trích từ bài 综合练习 (trang 36); các lựa chọn được trình bày riêng dưới mỗi câu.':'Chọn → kiểm tra → giải thích → vấn đáp Socrates.'}</p>${arr.length?arr.map(qHTML).join(''):'<div class="card">Chưa có câu sai. Hãy luyện tập trước nhé!</div>'}`}
}
function lessonTabs(){return `<div class="toolbar">${DATA.texts.map((_,i)=>`<button class="tab ${lesson===i?'on':''}" onclick="lesson=${i};render()">Bài khóa ${i+1}</button>`).join('')}</div>`}
function fillVocab(){let target=document.querySelector('#vgrid');if(!target)return;target.innerHTML=DATA.vocab.filter(v=>v.join(' ').toLowerCase().includes(search.toLowerCase())).map(v=>`<div class="vcard"><div class="hanzi">${esc(v[0])}</div><div class="pinyin">${esc(v[1])}</div><p>${esc(v[2])}</p><button class="btn soft" onclick="speak('${esc(v[0])}')">🔊 Phát âm</button></div>`).join('')}
function makeQ(x,id){return {id,text:x[0],options:x[1],right:x[2],explain:x[3],socrates:x[4]}}
function vocabQuestion(i){let v=DATA.vocab[i],pool=[i];for(let step=1;pool.length<4;step++){let j=(i+step*7)%27;if(!pool.includes(j))pool.push(j)}pool.sort((a,b)=>((a*13+5)%31)-((b*13+5)%31));let text=vmode==='vizh'?v[2]:v[0],opts=pool.map(j=>vmode==='vizh'?DATA.vocab[j][0]:vmode==='py'?DATA.vocab[j][1]:DATA.vocab[j][2]);return {id:'v'+vmode+i,text,options:opts,right:pool.indexOf(i),explain:`${v[0]} (${v[1]}) nghĩa là “${v[2]}”.`,socrates:`Hãy tự đặt một câu ngắn có từ ${v[0]}.`}}
function qHTML(q,i=0){let rec=state.answers[q.id]||{},checked=rec.done;return `<div class="question"><span class="mini">Câu ${i+1}</span><h3>${esc(q.text)}</h3>${q.options.map((o,j)=>`<button class="choice ${rec.pick===j?'sel':''} ${checked&&q.right===j?'good':''} ${checked&&rec.pick===j&&!rec.ok?'bad':''}" onclick="choose('${q.id}',${j})">${'ABCDE'[j]}. ${esc(o)}</button>`).join('')}<div class="toolbar"><button class="btn" onclick="check('${q.id}')">Check đáp án</button><button class="btn subtle" onclick="reset('${q.id}')">Làm lại</button></div>${checked?`<div class="feedback ${rec.ok?'correct':'wrong'}"><b>${rec.ok?'✅ Chính xác!':'❌ Chưa chính xác'}</b><p>Đáp án: <b>${'ABCDE'[q.right]}. ${esc(q.options[q.right])}</b></p><b>Feynman · Vì sao?</b><p>${esc(q.explain)}</p>${rec.ok?'':`<div class="socrates"><b>Socrates · Tự tìm lỗ hổng</b><p>${esc(q.socrates)}</p><p class="small">Đọc câu hỏi, tự trả lời rồi mới làm lại.</p></div>`}</div>`:''}</div>`}
function allQuestions(){return [...DATA.original.map((x,i)=>makeQ(x,'o'+i)),...DATA.extra.map((x,i)=>makeQ(x,'e'+i)),...DATA.listening.map((x,i)=>({id:'l'+i,text:x[1],options:x[2],right:x[3],explain:'Đối chiếu tình tiết trong bài khóa.',socrates:'Bằng chứng nào trong bài khóa cho đáp án?' })),...DATA.vocab.map((_,i)=>vocabQuestion(i))]}
function lookup(id){if(id.startsWith('v')){let m=id.match(/^v(zhvi|vizh|py)(\d+)$/);if(m){let prev=vmode;vmode=m[1];let q=vocabQuestion(+m[2]);vmode=prev;return q}}return allQuestions().find(q=>q.id===id)}
function choose(id,pick){state.answers[id]={pick,done:false};save();rerender()}function check(id){let q=lookup(id),r=state.answers[id];if(!r||r.pick===undefined)return alert('Chọn một đáp án trước');r.done=true;r.ok=r.pick===q.right;save();rerender()}function reset(id){delete state.answers[id];save();rerender()}function rerender(){let y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,y))}function resetV(){if(!confirm('Làm lại toàn bộ quiz của chế độ hiện tại?'))return;DATA.vocab.forEach((_,i)=>delete state.answers['v'+vmode+i]);save();render()}function saveTrans(k,v){state.translations[k]=v;save()}
function downloadTranslation(){let text=DATA.texts[lesson].map((r,i)=>r[1]+'\n'+(state.translations['t'+lesson+'_'+i]||'')).join('\n\n')+'\n\nDỊCH CẢ BÀI:\n'+(state.translations['t'+lesson+'all']||'');let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='HSK3_Bai4_BaiKhoa'+(lesson+1)+'_BanDich.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}render();
</script></body></html>
