const vocab=[['以为','yǐwéi','tưởng rằng; cho rằng'],['像','xiàng','giống'],['长','zhǎng','lớn lên; phát triển'],['身高','shēngāo','chiều cao'],['米','mǐ','mét'],['瘦','shòu','gầy'],['接','jiē','đón; tiếp'],['行李','xíngli','hành lý'],['丢','diū','làm mất'],['箱子','xiāngzi','cái hòm; va-li'],['号码','hàomǎ','số'],['好像','hǎoxiàng','hình như; có vẻ'],['重要','zhòngyào','quan trọng'],['着急','zháojí','sốt ruột; lo lắng'],['护照','hùzhào','hộ chiếu'],['服务台','fúwùtái','quầy dịch vụ'],['应该','yīnggāi','nên; chắc là'],['站','zhàn','đứng'],['中间','zhōngjiān','ở giữa'],['短','duǎn','ngắn'],['头发','tóufa','tóc'],['年轻','niánqīng','trẻ tuổi'],['发现','fāxiàn','phát hiện'],['不见','bújiàn','không thấy; mất tích'],['带','dài','mang theo'],['帮助','bāngzhù','giúp đỡ'],['照片','zhàopiàn','ảnh chụp']];
const reading=[{title:'课文 1 · Ở nhà',text:'刘明：这是杨同乐吗？他怎么跟白家月在一起？\n王一雪：他不是杨同乐，他叫李文，是白家月的好朋友。\n刘明：我还以为是同乐呢，他们看上去有点儿像。\n王一雪：是长得有点儿像，但是他比同乐高，身高有一米八。\n刘明：看起来也比同乐瘦一点儿。\n王一雪：下个星期家月和李文要来北京，我去机场接他们。\n刘明：他们哪天到北京？我跟你一起去机场接他们吧。',question:'李文和杨同乐 có điểm gì giống, khác?',answer:'Họ trông hơi giống nhau, nhưng 李文 cao hơn (1,8 m) và có vẻ gầy hơn.'},{title:'课文 2 · Nhận hành lý',text:'白家月：我的行李怎么还没出来？是不是丢了？\n李文：你的行李箱是什么样的？\n白家月：是一个黑色的箱子，上面写着我的名字和电话号码。\n李文：我好像在哪儿看到过这个箱子，是不是有人拿错了？\n白家月：我们快找谁问一下吧，箱子里有不少重要的东西。\n李文：别着急，我们拿着护照和机票，去服务台问问吧。',question:'白家月 mất gì và sẽ làm gì?',answer:'Không tìm thấy va-li đen; họ mang hộ chiếu và vé máy bay tới quầy dịch vụ hỏi.'},{title:'课文 3 · Đón người tại sân bay',text:'刘明：飞机早就到了，你看见白家月他们了吗？\n王一雪：没有，他们应该快出来了。\n刘明：我们站到中间去吧，这样他们好找一些。\n王一雪：你看那个高个子的人是李文吗？\n刘明：你说的是哪个？那个穿着黑衣服的短头发的年轻人？\n王一雪：对，那个人就是李文！你看，家月在他后面呢。',question:'Vì sao 刘明 muốn đứng giữa?',answer:'Để 白家月 và 李文 dễ tìm thấy họ hơn.'},{title:'课文 4 · Nhật ký của 李文',text:'昨天我到北京了。虽然路上花了十几个小时，但是跟家月坐在一起，我觉得时间过得很快。到机场的时候，家月发现行李箱不见了，我带她去服务台，帮助她找到了行李箱。走出机场的时候，已经八点多了，我们一出来就看见了王老师的姐姐，她看起来比照片上年轻。晚上，一雪姐带我们去吃了一家很好吃的中国菜。',question:'Chuyện gì xảy ra với hành lý của 家月?',answer:'Hành lý bị thất lạc, nhưng được giúp tìm thấy tại quầy dịch vụ.'}];
const grammar=[{title:'看上去 / 看起来',formula:'Chủ ngữ + 看上去 / 看起来 + tính từ / cụm miêu tả',meaning:'Trông có vẻ / nhìn có vẻ; nhận định từ điều quan sát được.',example:'他们看上去有点儿像。',vi:'Họ trông có vẻ hơi giống nhau.',poster:'ngu_phap_1.png',why:'看上去 và 看起来 giới thiệu ấn tượng bề ngoài; không khẳng định chắc chắn bản chất sự vật.'},{title:'疑问代词的非疑问用法',formula:'Từ nghi vấn 谁 / 什么 / 哪儿 / 哪 + thành phần liên quan, trong một câu trần thuật',meaning:'Ai đó, cái gì đó, nơi nào đó... trong ngữ cảnh không cần xác định cụ thể.',example:'我好像在哪儿看见过这个箱子。',vi:'Hình như tôi đã trông thấy chiếc va-li này ở đâu đó.',poster:'ngu_phap_2.png',why:'哪儿 vốn là “ở đâu”, nhưng ở đây không hỏi người nghe mà diễn tả nơi chốn chưa xác định.'},{title:'多项定语 · Nhiều định ngữ',formula:'[thời gian / nơi chốn] + [hành động / trạng thái] + [đặc điểm] + danh từ trung tâm',meaning:'Nhiều lớp thông tin cùng bổ nghĩa cho một danh từ.',example:'那个穿着黑衣服的短头发的年轻人',vi:'Người trẻ tóc ngắn, mặc đồ đen kia.',poster:'ngu_phap_3.png',why:'Danh từ trung tâm 年轻人 đặt sau; từng nhóm phía trước làm rõ người nào đang được nói đến.'}];
const bank1=[['服务台______在前面，我们过去问问吧。',['带','接','丢','重要','应该'],4,'“应该” ở đây diễn tả suy đoán: quầy dịch vụ chắc ở phía trước.','Nếu không chắc vị trí, dùng từ “nên”, “đón” hay “chắc là”?'],['他已经到了，我们快出去______他吧。',['带','接','丢','重要','应该'],1,'接 = đón người; cấu trúc 去接他 = đi đón anh ấy.','Nếu một người đã đến sân bay, hành động phù hợp là đón hay đánh mất?'],['我的护照不见了，是不是在机场______了？',['带','接','丢','重要','应该'],2,'丢 = đánh mất, hợp với 护照不见了.','不见了 gợi ý đồ vật còn hay đã thất lạc?'],['行李票很______，你们出机场的时候有人看。',['带','接','丢','重要','应该'],3,'重要 = quan trọng; vé hành lý được kiểm tra khi ra sân bay.','Vì có nhân viên kiểm tra, tấm vé mang tính chất gì?'],['我______了两个行李箱和一个大包，所以走得非常慢。',['带','接','丢','重要','应该'],0,'带 = mang theo; có nhiều hành lý nên đi chậm.','Động từ chỉ đem hai va-li theo mình là gì?'],['这个头发很短的男孩儿是我弟弟。— 我______这个是你，你们长得太像了。',['发现','以为','好像','年轻','帮助'],1,'以为 = cứ tưởng (nhận định trước đó có thể sai).','Tưởng nhầm hai người giống nhau thì dùng 以为 hay 帮助?'],['我______坐飞机来北京的人非常多。— 对，很多人这个时候来北京旅游。',['发现','以为','好像','年轻','帮助'],0,'发现 = phát hiện/nhận thấy thực tế có nhiều người đi máy bay.','Nếu vừa nhận ra một thực tế từ quan sát, nên chọn động từ nào?'],['你们很像，你哥哥看起来也很______。',['发现','以为','好像','年轻','帮助'],3,'年轻 là tính từ “trẻ”; hợp với 看起来很 + tính từ.','Sau 看起来很 cần tính từ hay động từ “giúp đỡ”?'],['你的行李箱找到了，你看看是不是这个？— 对，太好了！谢谢您的______。',['发现','以为','好像','年轻','帮助'],4,'帮助 = sự giúp đỡ; 谢谢您的帮助 = cảm ơn sự giúp đỡ của ngài.','Một người tìm được va-li nhờ nhân viên: họ cảm ơn điều gì?'],['那个穿着黑衣服的高个子的人是王老师吗？— ______是吧，我也不知道。',['发现','以为','好像','年轻','帮助'],2,'好像 = hình như; hợp khi người nói không chắc (我也不知道).','Người nói khẳng định hay chỉ phỏng đoán?']];
const drills=[['他们______有点儿像。',['看起来','接','丢','重要'],0,'看起来 biểu thị “trông có vẻ”; theo sau là tính chất 有点儿像.','Câu miêu tả bề ngoài giống nhau hay hành động đón người?'],['那个老师______很年轻。',['看上去','服务台','护照','站'],0,'看上去 + 很年轻 = trông có vẻ trẻ.','很年轻 là miêu tả tính chất hay đồ vật?'],['这些菜______很好吃。',['看起来','带','丢','接'],0,'看起来 là nhận xét món ăn trông ngon.','Khi nhận xét bằng mắt, cấu trúc cần là gì?'],['我好像在______看见过这个箱子。',['哪儿','应该','年轻','重要'],0,'哪儿 ở đây là “nơi nào đó”, không phải câu hỏi.','Người nói nhớ rõ nơi hay nhớ mơ hồ?'],['你吃点儿______再走吧。',['什么','身高','中间','短'],0,'什么 = một món gì đó chưa nói rõ.','Đối tượng của 吃 là thứ gì đó hay chiều cao?'],['我们______一起去踢足球吧。',['哪天','护照','服务台','身高'],0,'哪天 trong ngữ cảnh đề nghị là “hôm nào đó”.','Câu đề nghị đã chốt ngày cụ thể chưa?'],['那个______年轻人是李文。',['穿着黑衣服的','接','应该','丢'],0,'穿着黑衣服的 là định ngữ bổ nghĩa cho 年轻人.','Phần nào trả lời người trẻ “nào”?'],['我喜欢那本______书。',['新买的','接','应该','丢'],0,'新买的 là đặc điểm mô tả quyển sách.','Từ/cụm nào bổ nghĩa cho 书?'],['那个______人是我朋友。',['短头发的','应该','服务台','带'],0,'短头发的 là “tóc ngắn”, dùng làm định ngữ cho 人.','Phần mô tả đặc điểm tóc nằm trước hay sau danh từ 人?'],['我们去机场______朋友。',['接','丢','瘦','短'],0,'接朋友 = đón bạn.','Động từ nào diễn tả đi ra sân bay đón người?'],['我的______不见了。',['护照','接','年轻','站'],0,'护照 = hộ chiếu; có thể bị thất lạc.','Trong các lựa chọn, từ nào là một vật?'],['别______，我们去服务台问问。',['着急','年轻','照片','号码'],0,'别着急 = đừng lo lắng, bình tĩnh.','Sau 别 cần động từ/trạng thái nào?'],['他______很高，有一米八。',['身高','行李','号码','帮助'],0,'身高 = chiều cao, hợp với 一米八.','Con số 1,8 m đo điều gì?'],['那个人头发很______。',['短','应该','接','带'],0,'短 là tính từ ngắn, mô tả tóc.','Tính từ chỉ độ dài tóc là gì?'],['飞机到了，他们______快出来了。',['应该','照片','箱子','米'],0,'应该 = chắc là; suy đoán họ sắp ra.','Người nói đã nhìn thấy hay chỉ suy đoán?'],['你知道他的电话______吗？',['号码','年轻','站','短'],0,'电话号码 = số điện thoại.','Đi cùng 电话 để tạo “số điện thoại” là từ gì?'],['他比我______一点儿。',['瘦','带','接','应该'],0,'瘦 = gầy, đi với 比 ... 一点儿.','Sau 比 ... 一点儿 có thể dùng tính từ nào?'],['我______我的行李箱了！',['发现','年轻','重要','身高'],0,'发现 = phát hiện/nhận ra va-li.','Động từ biểu thị tìm thấy, phát hiện là gì?'],['你看见我的______了吗？',['照片','应该','年轻','短'],0,'照片 = ảnh, một vật có thể nhìn thấy.','Từ nào chỉ một bức ảnh?'],['我们站在______，这样他们好找。',['中间','身高','号码','护照'],0,'中间 = ở giữa; một vị trí.','Muốn dễ được tìm thấy, người nói đứng ở vị trí nào?'],['我______他是老师，原来是学生。',['以为','帮助','带','短'],0,'以为 biểu thị suy nghĩ nhầm trước đó.','Người nói đã nhận định đúng từ đầu hay tưởng nhầm?'],['这件事很______，请记住。',['重要','瘦','短','站'],0,'重要 = quan trọng.','Nếu cần ghi nhớ, sự việc có tính chất gì?'],['他______黑色衣服。',['穿着','身高','行李','号码'],0,'穿着 là đang mặc; dùng trong miêu tả trang phục.','Để diễn đạt đang mặc đồ đen, cần cụm nào?'],['______的那个女孩儿是谁？',['站在门口','很接','丢很','重要在'],0,'站在门口的 = đứng ở cửa, làm định ngữ cho 那个女孩儿.','Phần nào cho biết cô gái đang đứng ở đâu?']];

['Sao hành lý của tôi vẫn chưa ra nhỉ? Có phải bị mất rồi không?','Va-li của cậu trông như thế nào?','Là một chiếc va-li màu đen, bên trên có viết tên và số điện thoại của tôi.','Hình như tôi đã thấy chiếc va-li này ở đâu đó, có phải ai đó lấy nhầm rồi không?','Chúng ta mau tìm ai đó để hỏi đi, trong va-li có khá nhiều đồ quan trọng.','Đừng lo, chúng ta cầm hộ chiếu và vé máy bay đến quầy dịch vụ hỏi thử nhé.'],
['Máy bay đã đến từ lâu rồi, cậu đã thấy Gia Nguyệt và những người đi cùng chưa?','Chưa, chắc họ sắp ra rồi.','Chúng ta đứng ra giữa nhé, như vậy họ sẽ dễ tìm hơn.','Cậu xem người cao cao kia có phải Lý Văn không?','Cậu nói người nào? Người trẻ tóc ngắn mặc đồ đen ấy à?','Đúng, người ấy chính là Lý Văn! Cậu xem, Gia Nguyệt ở phía sau cậu ấy kìa.'],
['Hôm qua tôi đã đến Bắc Kinh.','Tuy đi đường mất hơn mười tiếng, nhưng vì ngồi cùng Gia Nguyệt nên tôi thấy thời gian trôi qua rất nhanh.','Khi đến sân bay, Gia Nguyệt phát hiện va-li không thấy đâu nữa, tôi đưa cô ấy đến quầy dịch vụ và giúp cô ấy tìm lại va-li.','Khi ra khỏi sân bay thì đã hơn tám giờ, vừa ra là chúng tôi nhìn thấy chị gái của thầy Vương; chị ấy trông trẻ hơn trong ảnh.','Buổi tối, chị Nhất Tuyết đưa chúng tôi đi ăn ở một nhà hàng món Trung rất ngon.']
];
function translationLines(i){return reading[i].text.split('\n').map((line,j)=>({cn:line,vi:lessonVI[i][j]}))}
function setTranslateMode(m){translateMode=m;render()}
function renderTranslate(app){const lines=translationLines(lesson),key='L'+lesson;app.innerHTML=`<h2>🌏 Tập dịch bài khóa · Trung → Việt</h2><p class="subtitle">Dịch trước khi xem đáp án. Bản dịch mẫu chỉ là tham khảo về ý nghĩa; phần tự viết không được máy chấm chính xác tuyệt đối.</p><div class="toolbar">${reading.map((r,i)=>`<button class="pill ${lesson===i?'active':''}" onclick="lesson=${i};render()">Bài khóa ${i+1}</button>`).join('')}</div><div class="card"><div class="quizTop"><button class="pill ${translateMode==='sent'?'active':''}" onclick="setTranslateMode('sent')">Dịch từng câu</button><button class="pill ${translateMode==='whole'?'active':''}" onclick="setTranslateMode('whole')">Dịch cả bài</button></div><h3>${esc(reading[lesson].title)}</h3>${translateMode==='sent'?lines.map((x,j)=>`<div class="translationRow"><div class="small">Câu ${j+1}/${lines.length}</div><div class="readingSentence">${esc(x.cn)}</div><div class="toolbar"><button class="btn ghost" onclick="speak('${esc(x.cn.split('：').pop())}')">🔊 Nghe</button></div><textarea class="translationTextarea" placeholder="Tự dịch sang tiếng Việt..." oninput="updateTrans('${key}_${j}',this.value)">${esc(state.translations[key+'_'+j]||'')}</textarea><details><summary>🔎 Xem bản dịch mẫu và tự đối chiếu</summary><div class="feedback">${esc(x.vi)}<p class="small">Gợi ý Socrates: Ai là chủ thể? Động từ nào là hành động chính? Các phần miêu tả bổ nghĩa cho từ nào?</p></div></details></div>`).join(''):`<div class="translationPrompt reading">${esc(reading[lesson].text)}</div><textarea class="translationTextarea" style="min-height:260px" placeholder="Viết bản dịch hoàn chỉnh tại đây..." oninput="updateTrans('${key}_whole',this.value)">${esc(state.translations[key+'_whole']||'')}</textarea><details><summary>📚 Hiện bản dịch mẫu toàn bài</summary><div class="feedback translationAnswer">${esc(lines.map(x=>x.vi).join('\n'))}</div></details>`}<div class="note"><b>Checklist tự chữa:</b> đúng nhân vật, đúng thời gian, đúng cấu trúc 看上去/看起来, từ nghi vấn không mang ý hỏi, và thứ tự các định ngữ.</div><button class="btn secondary" onclick="downloadTranslation()">⬇ Xuất bản dịch đã viết (.txt)</button></div>`}
function updateTrans(k,val){state.translations[k]=val;save()}
function downloadTranslation(){const k='L'+lesson;const txt=reading[lesson].title+'\n\n'+translationLines(lesson).map((x,j)=>x.cn+'\n'+(state.translations[k+'_'+j]||'')).join('\n\n')+'\n\nBẢN DỊCH CẢ BÀI:\n'+(state.translations[k+'_whole']||'');const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='HSK3_Bai1_BaiKhoa'+(lesson+1)+'_BanDich.txt';a.click();URL.revokeObjectURL(url)}
render();
</script></body></html>
