function bindSettings(){if($('topic'))$('topic').onchange=e=>{state.topic=e.target.value;render()};if($('size'))$('size').onchange=e=>{state.size=+e.target.value};if($('uncertain'))$('uncertain').onchange=e=>{state.includeUnverified=e.target.checked;render()}}
function selectedPool(){return pool(!state.includeUnverified)}
function home(){let learned=Object.values(progress).filter(x=>x.right>0).length,missed=Object.values(progress).filter(x=>x.wrong>0).length;return `<span class="pill">Tự học IELTS nâng cao</span><h2 class="hero">Một từ vựng, nhiều lần ghi nhớ.</h2><p class="muted">Nguồn: ebook Easy IELTS, 78 trang. Có 510 dòng danh sách, trong đó phần bổ sung có từ lặp. 150 dòng đầu đã được chỉnh nghĩa; các dòng còn lại cần đối chiếu OCR.</p><div class="stats"><div class="stat"><b>${DATA.length}</b><span>Mục từ trong ebook</span></div><div class="stat"><b>${TOPICS.length}</b><span>Nhóm chủ đề</span></div><div class="stat"><b>${learned}</b><span>Từ đã làm đúng</span></div><div class="stat"><b>${missed}</b><span>Từ từng làm sai</span></div></div>${settings()}<div class="rowbtn"><button class="primary" onclick="start('mcq')">Bắt đầu trắc nghiệm</button><button class="secondary" onclick="start('flash')">Học flashcard</button><button class="secondary" onclick="nav('list')">Xem từ vựng</button></div><div class="feedback"><b>Quy trình học:</b> Nhìn từ → thử đoán nghĩa → kiểm tra → giải thích bằng lời của mình → ôn từ sai. Các câu hỏi chỉ lấy từ danh sách đã chọn, không dùng từ ngoài ebook.</div>`}
function start(mode,missed=false){state.mode=mode;state.index=0;state.correct=0;state.selected=-1;state.checked=false;state.flip=false;state.wrong=[];let words=selectedPool().filter(w=>!missed||(progress[w.id]?.wrong||0)>0);state.quiz=shuffle(words).slice(0,state.size);if(mode==='mcq')setOptions();render()}
function statsQuestion(){return `<div class="top"><span class="pill">${state.mode==='mcq'?'TRẮC NGHIỆM':state.mode==='flash'?'FLASHCARD':'GÕ TỪ'}</span><span class="muted">${state.index+1} / ${state.quiz.length} • Đúng: ${state.correct}</span></div><div class="bar"><div style="width:${100*state.index/state.quiz.length}%"></div></div>`}
function question(){if(!state.quiz.length)return `<h2>Chưa có câu hỏi</h2>${settings()}<button class="primary" onclick="start('${state.mode}')">Bắt đầu</button><p class="muted">Chọn "Bao gồm mục OCR" nếu muốn luyện các từ chưa kiểm chứng.</p>`;if(state.index>=state.quiz.length)return `<h2>Hoàn thành lượt học!</h2><div class="hero">${state.correct} / ${state.quiz.length} câu đúng</div><p>${state.wrong.length} câu cần ôn thêm.</p><button class="primary" onclick="start('${state.mode}')">Làm lại</button><button class="secondary" onclick="nav('wrong')">Ôn từ sai</button>`;
let w=state.quiz[state.index];let mark=w.verified?'<span class="verified">✓ Nghĩa đã chuẩn hóa</span>':'<span class="flag">⚠ Nghĩa OCR, cần rà soát</span>';
if(state.mode==='flash')return statsQuestion()+`<div class="flash" onclick="flipCard()"><div class="muted">Nhấp để lật thẻ</div><strong>${esc(state.flip?(w.meaning||'Chưa có nghĩa rõ'):w.word)}</strong><p>${state.flip?esc(w.word):'Bạn có nhớ nghĩa tiếng Việt?'}</p></div><div class="rowbtn"><button class="secondary" onclick="say(${JSON.stringify(w.word)})">🔊 Nghe phát âm</button><button class="secondary" onclick="flipCard()">Lật thẻ</button><button class="secondary" onclick="next(false)">Chưa nhớ</button><button class="primary" onclick="next(true)">Đã nhớ →</button></div><p class="small" style="text-align:center">${mark} • Trang ${w.page} • Mục ${w.id}</p>`;
if(state.mode==='type')return statsQuestion()+`<div class="qcard"><div class="prompt">Viết từ tiếng Anh tương ứng với nghĩa</div><div class="question">${esc(w.meaning)}</div><input id="typeAnswer" type="text" placeholder="Nhập từ tiếng Anh rồi Enter" autocomplete="off" ${state.checked?'disabled':''}><div class="rowbtn"><button class="primary" onclick="typeCheck()">${state.checked?'Câu tiếp theo →':'Kiểm tra ↵'}</button><button class="secondary" onclick="say(${JSON.stringify(w.word)})">🔊 Nghe từ</button></div>${state.checked?feedback(w):''}</div><p class="small">${mark} • Trang ${w.page}</p>`;
let opts=state.options||[];return statsQuestion()+`<div class="qcard"><div class="prompt">Chọn nghĩa phù hợp nhất cho từ sau</div><div class="question">${esc(w.word)} <button class="secondary" onclick="say(${JSON.stringify(w.word)})">🔊</button></div><div class="answerGrid">${opts.map((o,i)=>`<button class="opt ${state.checked?(o===w.meaning?'correct':i===state.selected?'wrong':''):i===state.selected?'chosen':''}" onclick="choose(${i})" ${state.checked?'disabled':''}><span class="muted">${'ABCD'[i]}.</span> ${esc(o)}</button>`).join('')}</div><div class="rowbtn"><button class="primary" onclick="${state.checked?'advance()':'check()'}">${state.checked?'Câu tiếp theo ↵':'Kiểm tra đáp án ↵'}</button></div>${state.checked?feedback(w):''}</div><p class="small">${mark} • Trang ${w.page} • STT ${w.id}</p>`}
function feedback(w){let ok=state.mode==='type'?state.typeWasRight:state.options[state.selected]===w.meaning;return `<div class="feedback ${ok?'good':'bad'}"><b>${ok?'✓ Chính xác!':'✗ Chưa đúng.'}</b> ${esc(w.word)} = <b>${esc(w.meaning)}</b>.<div>Giải thích Feynman: Hãy diễn đạt lại nghĩa trên bằng một câu tiếng Việt thật đơn giản. Sau đó thử tự đặt một câu tiếng Anh có chứa “${esc(w.word)}”.</div>${ok?'':`<div><b>Câu hỏi Socrates:</b> Nghĩa em chọn khác nghĩa chính xác ở điểm nào? Hãy tự nêu một tình huống sử dụng từ này.</div>`}</div>`}
function setOptions(){let w=state.quiz[state.index];if(!w)return;let choices=shuffle(selectedPool().filter(x=>x.meaning&&x.meaning!==w.meaning)).slice(0,3).map(x=>x.meaning);state.options=shuffle([w.meaning,...choices]);}
function choose(i){if(state.checked)return;state.selected=i;render()}
function record(w,ok){let p=progress[w.id]||{right:0,wrong:0};p[ok?'right':'wrong']++;progress[w.id]=p;save();if(ok)state.correct++;else state.wrong.push(w.id)}
function check(){if(state.checked){advance();return}if(state.selected<0)return;let w=state.quiz[state.index];record(w,state.options[state.selected]===w.meaning);state.checked=true;render()}
function typeCheck(){if(state.checked){advance();return}let input=$('typeAnswer');if(!input||!input.value.trim())return;let w=state.quiz[state.index];let normalize=s=>s.toLowerCase().trim().replace(/\s+/g,' ').replace(/[’']/g,"'");state.typeWasRight=normalize(input.value)===normalize(w.word);record(w,state.typeWasRight);state.checked=true;render()}
function advance(){state.index++;state.checked=false;state.selected=-1;state.flip=false;setOptions();render()}
function next(ok){let w=state.quiz[state.index];record(w,ok);advance()}
function flipCard(){state.flip=!state.flip;render()}
function listing(){return `<div class="top"><h2>Kho từ vựng IELTS C1/C2</h2><span class="pill">510 mục</span></div><p class="muted">Các mục chưa kiểm chứng có nhãn OCR. Chỉ dùng mục có dấu ✓ để làm bài chính xác.</p><div class="controls"><select id="listTopic"><option value="all">Tất cả chủ đề</option>${TOPICS.map((x,i)=>`<option value="${i}" ${state.topic===String(i)?'selected':''}>${i+1}. ${x}</option>`).join('')}</select><input class="search" type="text" id="search" placeholder="Tìm từ hoặc nghĩa..." oninput="drawRows()"><button class="secondary" onclick="downloadCSV()">Xuất CSV</button></div><div id="tableRows"></div>`}
function drawRows(){let term=($('search')?.value||'').trim().toLowerCase();let a=DATA.filter(w=>(state.topic==='all'||w.topic===+state.topic)&&(!term||w.word.toLowerCase().includes(term)||w.meaning.toLowerCase().includes(term)));$('tableRows').innerHTML=`<p class="small">Hiển thị ${a.length} mục. Nhấp vào biểu tượng loa để nghe.</p><div style="overflow:auto;max-height:650px"><table class="vlist"><tr><th>#</th><th>Từ vựng</th><th>Nghĩa / Trạng thái</th><th>Trang</th></tr>${a.map(w=>`<tr><td>${w.id}</td><td><b>${esc(w.word)}</b> <button style="border:0;background:transparent" onclick="say(${JSON.stringify(w.word)})">🔊</button></td><td>${esc(w.meaning||'Chưa nhận dạng rõ')}<div class="${w.verified?'verified':'flag'}">${w.verified?'✓ Chuẩn hóa':'⚠ OCR cần soát'}</div></td><td>${w.page}</td></tr>`).join('')}</table></div>`}
function downloadCSV(){let rows=[['STT','Từ tiếng Anh','Nghĩa (OCR nếu chưa soát)','Trang','Độ tin cậy'],...DATA.map(w=>[w.id,w.word,w.meaning,w.page,w.verified?'Đã chuẩn hóa':'OCR cần đối chiếu'])];let csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c||'').replaceAll('"','""')+'"').join(',')).join('\r\n');let b=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ielts-c1-c2-510-vocabulary.csv';a.click();URL.revokeObjectURL(a.href)}
function render(){menu();let v=$('view');if(state.mode==='home')v.innerHTML=home();else if(state.mode==='list')v.innerHTML=listing();else if(state.mode==='wrong'){let bad=DATA.filter(w=>(progress[w.id]?.wrong||0)>0);v.innerHTML=`<h2>Ôn những từ từng trả lời sai</h2><p class="muted">Có ${bad.length} mục cần ôn. Những từ chưa được chuẩn hóa chỉ xuất hiện khi bật mục OCR.</p>${settings()}<button class="primary" onclick="start('mcq',true)">Luyện lại bằng trắc nghiệm</button><button class="secondary" onclick="start('type',true)">Luyện gõ từ</button>`}else if(!state.quiz.length){v.innerHTML=`<h2>${state.mode==='mcq'?'Trắc nghiệm C1/C2':state.mode==='flash'?'Flashcards':'Gõ từ tiếng Anh'}</h2>${settings()}<button class="primary" onclick="start('${state.mode}')">Bắt đầu học</button>`}else v.innerHTML=question();bindSettings();if(state.mode==='list'){$('listTopic').onchange=e=>{state.topic=e.target.value;drawRows()};drawRows()}if(state.mode==='type'&&!state.checked&&$('typeAnswer'))$('typeAnswer').focus()}
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea')&&!(e.key==='Enter'&&state.mode==='type'))return;if(state.mode==='mcq'&&!state.checked){let k=e.key.toUpperCase(),idx='ABCD'.indexOf(k);if(/^[1-4]$/.test(k))idx=+k-1;if(idx>=0){choose(idx);return}}if(e.key==='Enter'){e.preventDefault();if(state.mode==='mcq')state.checked?advance():check();else if(state.mode==='type')typeCheck();else if(state.mode==='flash')flipCard()}});
render();
</script></body></html>
