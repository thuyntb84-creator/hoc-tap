const ORDER=['Elementary 1','Elementary 2','Elementary 3','Elementary 4','synonyms','antonyms','the logic list'];const NAMES={'Elementary 1':'Elementary Vocabulary · Test 1','Elementary 2':'Elementary Vocabulary · Test 2','Elementary 3':'Elementary Vocabulary · Test 3','Elementary 4':'Elementary Vocabulary · Test 4',synonyms:'Synonyms · Từ đồng nghĩa',antonyms:'Antonyms · Từ trái nghĩa','the logic list':'The Logic List · Tìm từ khác nhóm'};
const $=x=>document.getElementById(x);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=q=>q.section+'::'+q.n;const letters=['A','B','C','D','E'];
let scores={};try{scores=JSON.parse(localStorage.getItem('eng_test_lab_book2a_v1')||'{}')}catch(e){};
let sec=ORDER[0],arr=[],idx=0,selected='',review=false;
function save(){localStorage.setItem('eng_test_lab_book2a_v1',JSON.stringify(scores))}
function setup(s){sec=s;review=false;arr=DATA.filter(q=>q.section===s);idx=0;selected='';render()}
function paintMenu(){let h='';ORDER.forEach(s=>{let qs=DATA.filter(q=>q.section===s),done=qs.filter(q=>scores[uid(q)]).length;h+=`<button class="test ${!review&&sec===s?'active':''}" onclick="setup(${JSON.stringify(s)})">${esc(NAMES[s])}<div class="small">${done}/${qs.length} câu đã làm</div></button>`});$('menu').innerHTML=h}
function render(){paintMenu();$('headCount').textContent=DATA.length+' câu có đáp án';if(!arr.length){$('stem').textContent='Không có câu nào để luyện lại.';$('choices').innerHTML='';$('feedback').classList.add('hidden');$('check').disabled=true;return}idx=Math.max(0,Math.min(idx,arr.length-1));let q=arr[idx],s=scores[uid(q)];selected=s?.choice||'';
$('currentTest').textContent=review?'Luyện lại câu sai':NAMES[sec];$('counter').textContent='Câu '+(idx+1)+' / '+arr.length+' · Câu gốc '+q.n;$('bar').style.width=((idx+1)/arr.length*100)+'%';$('stem').textContent=q.stem||'Chọn từ khác nhóm với các từ còn lại.';
$('choices').innerHTML=q.options.map((o,i)=>{let l=letters[i];let cls=s?(l===q.answer?'good':(l===s.choice&&l!==q.answer?'bad':'')):(selected===l?'selected':'');return `<button class="choice ${cls}" onclick="selectAnswer('${l}')" ${s?'disabled':''}><b>${l}</b><span>${esc(o)}</span></button>`}).join('');
$('check').disabled=!!s||!selected;$('check').textContent=s?'Đã chấm':'Kiểm tra (Enter)';$('next').textContent=idx===arr.length-1?'Kết thúc Test':'Câu tiếp →';let count=arr.filter(q=>scores[uid(q)]).length,good=arr.filter(q=>scores[uid(q)]?.choice===q.answer).length;$('stats').innerHTML=`<span>Đã làm: <strong>${count}/${arr.length}</strong></span><span>Đúng: <strong>${good}</strong></span><span>Sai: <strong>${count-good}</strong></span>`;
if(s){$('feedback').classList.remove('hidden');$('feedback').innerHTML=explain(q,s.choice)}else{$('feedback').classList.add('hidden');$('feedback').innerHTML=''}$('footer').textContent='Nguồn: Book 2 Part A.pdf · Trang PDF '+q.page+' · Đáp án: Book 2 Part A-Key.pdf. Một số câu lỗi bố cục hoặc không có đáp án chắc chắn chưa được đưa vào.'}
function selectAnswer(l){let q=arr[idx];if(scores[uid(q)])return;selected=l;renderUnscored()}
function renderUnscored(){document.querySelectorAll('.choice').forEach((e,i)=>e.classList.toggle('selected',letters[i]===selected));$('check').disabled=!selected}
function checkAnswer(){let q=arr[idx];if(!q||scores[uid(q)]||!selected)return;scores[uid(q)]={choice:selected};save();render()}
function move(d){if(!arr.length)return;if(d>0&&idx===arr.length-1){let missing=arr.filter(q=>!scores[uid(q)]);if(missing.length){idx=arr.indexOf(missing[0]);render()}else{alert('Đã hết Test! Kết quả và các câu sai đã được lưu.');}return}idx=Math.max(0,Math.min(arr.length-1,idx+d));render()}
function reviewWrong(){review=true;arr=DATA.filter(q=>scores[uid(q)]&&scores[uid(q)].choice!==q.answer);arr.forEach(q=>delete scores[uid(q)]);save();idx=0;render()}
function resetCurrent(){if(!confirm('Xóa kết quả của Test hiện tại để làm lại?'))return;DATA.filter(q=>q.section===sec).forEach(q=>delete scores[uid(q)]);save();setup(sec)}
const hints={

'Elementary 2':'Tách các dữ kiện quan trọng trong câu: hành động, người, đồ vật và mối quan hệ. Loại các từ không đáp ứng đủ dữ kiện.',

function explain(q,choice){let ok=choice===q.answer;let cor=q.options[letters.indexOf(q.answer)],sel=q.options[letters.indexOf(choice)];let study=q.section==='the logic list'?'Hãy tự gọi tên một nhóm nghĩa chung của ba từ còn lại, rồi giải thích tại sao từ được chọn không phù hợp.':q.section==='synonyms'?'Đối chiếu nghĩa của từ cần tìm với cả câu; kiểm tra hai từ có thể thay thế nhau mà không đổi ý chính không.':q.section==='antonyms'?'Xác định chiều nghĩa đối lập (ví dụ tăng–giảm, rộng–hẹp), sau đó thử đặt hai từ vào cùng cấu trúc.':'Đọc câu sau khi điền đáp án đúng; tìm dữ kiện về ngữ cảnh khiến lựa chọn này phù hợp hơn các lựa chọn còn lại.';
return `<h3 class="${ok?'ok':'err'}">${ok?'✓ Chính xác':'✕ Chưa chính xác'}</h3><p><b>Đáp án theo Key:</b> ${q.answer}) ${esc(cor)}</p>${ok?'':`<p><b>Bạn đã chọn:</b> ${choice}) ${esc(sel)}</p>`}<p><b>1. Nhận diện dạng bài:</b> ${esc(NAMES[q.section])}.</p><p><b>2. Logic Feynman:</b> ${esc(hints[q.section])}</p><p><b>3. Đặt lại vào ngữ cảnh:</b> ${esc(study)}</p><p><b>4. Câu hỏi Socrates:</b> Nếu đổi ${esc(cor)} thành ${esc(sel)} trong câu này, ý nghĩa hoặc cách dùng thay đổi thế nào? Bạn có thể nêu một câu ví dụ để kiểm tra không?</p><p class="small">Đây là quy trình gợi suy luận theo dạng bài, chưa phải bản dịch hay phân tích độc lập từng phương án. Nếu có phương án hoặc câu hỏi in sai trong đề gốc, hãy đối chiếu trang nguồn được ghi bên dưới.</p>`}
window.addEventListener('keydown',e=>{if(!arr.length||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();let max=arr[idx].options.length;if(scores[uid(arr[idx])])return;let n=letters.indexOf(selected);selected=letters[(n+(e.key==='ArrowDown'?1:max-1)+max)%max];renderUnscored()}if(e.key==='Enter'){e.preventDefault();if(scores[uid(arr[idx])])move(1);else if(selected)checkAnswer()}});setup(ORDER[0]);
