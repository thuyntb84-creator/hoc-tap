s:15px;border:2px dashed #dccde7;padding:20px;background:linear-gradient(120deg,#fff9fc,#fffef5)}.grammar h3{margin:0 0 10px}.readingline{border-bottom:1px dashed #d7dfed;padding:12px 0;line-height:1.7}.readingline .hanzi{font-size:21px}.quiz{border:1px solid var(--line);padding:18px;border-radius:14px;background:white;margin-bottom:13px}.option{display:block;width:100%;padding:12px;text-align:left;background:#fbfcff;border:1px solid #dce3ed;border-radius:11px;margin:7px 0;color:var(--ink)}.option.sel{border:2px solid #4267ef;padding:11px;background:#edf2ff}.option.good{border-color:#24a17d;background:#e8f8ee}.option.bad{border-color:var(--red);background:#fff0f2}.feedback{background:#f2f5fb;border-radius:12px;padding:14px;margin:10px 0;line-height:1.8}.feedback.good{background:#e7f8f0}.feedback.bad{background:#fff0f2}.socrates{border-left:4px solid #daa34f;background:#fffaeb;padding:12px;margin-top:9px;border-radius:9px}textarea{width:100%;min-height:100px;padding:14px;border:1px solid #ccd5e5;border-radius:11px;line-height:1.7;resize:vertical}details{margin:12px 0}summary{color:#315ac4;cursor:pointer;font-weight:bold}.progress{height:9px;border-radius:10px;background:#e4eaf5;overflow:hidden}.progress>i{display:block;background:var(--blue);height:100%}.small{font-size:13px;color:#748198}.textnote{background:#fff9e5;padding:14px;border-radius:11px}.quizstats{padding:15px;border-radius:12px;background:#edf3ff;margin:14px 0}h2{margin:0 0 13px}h3{line-height:1.5}.empty{padding:24px;text-align:center}.voice{font-size:13px}.badge{background:#ffe4ed;color:#aa4669;border-radius:7px;padding:4px 9px;display:inline-block;font-size:12px;font-weight:bold}.qtitle{font-size:19px;line-height:1.7}.cover{background:linear-gradient(130deg,#fef1ef,#f2f2ff);border:2px dashed #e8c8cf;border-radius:16px;padding:18px;margin:12px 0}.cover .formula{margin-top:10px}.tabs{display:flex;flex-wrap:wrap;gap:8px}.alert{background:#fff9e7;border-radius:12px;padding:13px} @media(max-width:800px){.wr </style></head><body><header><span class="badge">新HSK教程 3 · LESSON 6</span><h1>今天我出院了</h1><div>Trên tàu cao tốc còn có thể gọi đồ ăn · Học hiểu → luyện tập → tự chữa lỗi</div></header><div class="wrap"><nav id="nav"></nav><main id="main"></main></div><script>
const DB={"vocab": [["最近", "zuìjìn", "gần đây"], ["常", "cháng", "thường"], ["体育馆", "tǐyùguǎn", "nhà thi đấu; phòng tập thể thao"], ["习惯", "xíguàn", "thói quen; quen với"], ["胖", "pàng", "béo; mập"], ["健康", "jiànkāng", "khỏe mạnh; sức khỏe"], ["以后", "yǐhòu", "sau; về sau"], ["羽毛球", "yǔmáoqiú", "cầu lông"], ["耳朵", "ěrduo", "tai"], ["感冒", "gǎnmào", "cảm lạnh"], ["发烧", "fāshāo", "sốt"], ["低", "dī", "thấp"], ["关心", "guānxīn", "quan tâm"], ["注意", "zhùyì", "chú ý"], ["突然", "tūrán", "đột nhiên"], ["住院", "zhùyuàn", "nhập viện; nằm viện"], ["担心", "dānxīn", "lo lắng"], ["腿", "tuǐ", "chân"], ["病人", "bìngrén", "người bệnh"], ["差不多", "chàbuduō", "gần như; xấp xỉ"], ["得", "děi", "phải; cần phải"], ["开心", "kāixīn", "vui vẻ"], ["出院", "chūyuàn", "xuất viện"], ["开", "kāi", "kê; viết đơn (thuốc)"], ["种", "zhǒng", "loại"], ["方法", "fāngfǎ", "phương pháp"], ["其他", "qítā", "khác"], ["心里", "xīnlǐ", "trong lòng; trong tâm trí"]], "readings": [{"title": "课文 1 · Thói quen tập thể dục", "where": "Ở nhà thi đấu trường học, 李文 nói chuyện cùng 陈天中.", "lines": [["李文", "天中，最近常看见你来体育馆。", "Thiên Trung, gần đây tôi thường thấy cậu đến nhà thi đấu."], ["陈天中", "我每天下午都来跑一个小时的步。", "Chiều nào tôi cũng đến chạy bộ một tiếng."], ["李文", "你的运动习惯真不错。", "Thói quen vận động của cậu thật tốt."], ["陈天中", "因为我今年胖了十多斤，不能再胖下去了，有点儿不健康。", "Vì năm nay tôi tăng hơn mười cân Trung Quốc, không thể tiếp tục béo lên nữa, hơi không khỏe mạnh."], ["李文", "我下课以后常去打羽毛球，你也来玩吧。", "Sau giờ học tôi thường chơi cầu lông, cậu cũng đến chơi nhé."], ["陈天中", "我知道，但是你们的水平太高了，我打得不怎么样。", "Tôi biết, nhưng trình độ các cậu cao quá, tôi chơi không giỏi lắm."], ["李文", "没关系，我可以教你。", "Không sao, tôi có thể dạy cậu."]]}, {"title": "课文 2 · Đau tai và cảm sốt", "where": "Trong lớp học, 安妮 hỏi thăm sức khỏe 陈天中.", "lines": [["安妮", "你怎么了？看上去有点儿不舒服。", "Cậu sao thế? Trông hơi khó chịu."], ["陈天中", "昨天游完泳以后，耳朵一直有点儿疼。", "Sau khi bơi hôm qua, tai tôi cứ hơi đau."], ["安妮", "是不是感冒了？发烧吗？", "Có phải bị cảm rồi không? Có sốt không?"], ["陈天中", "好像发低烧了。", "Hình như bị sốt nhẹ."], ["安妮", "我送你去医院，让医生检查一下吧。", "Tôi đưa cậu đến bệnh viện để bác sĩ khám thử nhé."], ["陈天中", "我先回去睡一觉，可能休息休息就好了。", "Tôi về ngủ một giấc trước, có lẽ nghỉ ngơi một chút sẽ ổn."], ["安妮", "好吧，如果下午还发烧，就一定要去看医生。", "Được, nếu chiều vẫn sốt thì nhất định phải đi khám."], ["陈天中", "谢谢关心，我会注意的。", "Cảm ơn cậu quan tâm, tôi sẽ chú ý."]]}, {"title": "课文 3 · Đến bệnh viện thăm bạn", "where": "Tại phòng bệnh, 安妮 đến thăm 陈天中.", "lines": [["安妮", "你怎么突然住院了？大家都很担心你。", "Sao cậu đột nhiên phải nhập viện thế? Mọi người đều rất lo cho cậu."], ["陈天中", "我的腿疼了几个星期了，医生说需要住院做检查。", "Chân tôi đau mấy tuần rồi, bác sĩ nói cần nằm viện kiểm tra."], ["安妮", "你看起来一点儿也不像病人。", "Trông cậu chẳng giống người bệnh chút nào."], ["陈天中", "是啊，我很少生病。我上次来医院已经过去差不多两年了。", "Đúng vậy, tôi rất ít ốm. Từ lần trước đến bệnh viện đã gần hai năm."], ["安妮", "你每天跑步，有时候还去游泳，是不是运动太多了？", "Ngày nào cậu cũng chạy bộ, đôi khi còn bơi, có phải vận động quá nhiều không?"], ["陈天中", "医生也这么说，但是还得做完检查才能知道。", "Bác sĩ cũng nói vậy, nhưng phải kiểm tra xong mới biết."], ["安妮", "别担心！听医生的话，好好休息，你的腿一定能好。", "Đừng lo! Nghe lời bác sĩ, nghỉ ngơi cho tốt, chân cậu chắc chắn sẽ khỏi."], ["陈天中", "谢谢。有人来看我，我就开心多了。", "Cảm ơn. Có người đến thăm, tôi vui hơn nhiều."]]}, {"title": "课文 4 · Hôm nay xuất viện", "where": "Ở nhà, 陈天中 nghỉ ngơi, uống thuốc.", "lines": [["陈天中", "今天我出院了。", "Hôm nay tôi xuất viện."], ["陈天中", "出院前，医生给我开了几种药，而且告诉了我吃药的方法。", "Trước khi xuất viện, bác sĩ kê cho tôi vài loại thuốc và dặn cách uống."], ["陈天中", "有一种药需要每天睡前吃一次，其他几种每天吃三次，饭后吃。", "Có loại thuốc cần uống một lần mỗi ngày trước khi ngủ, những loại khác uống ba lần/ngày, sau bữa ăn."], ["陈天中", "除了吃药，医生还说最重要的是多休息。", "Ngoài uống thuốc, bác sĩ còn nói quan trọng nhất là nghỉ ngơi nhiều."], ["陈天中", "我都记在心里了，回家以后一定会多注意。", "Tôi ghi nhớ tất cả rồi, sau khi về nhà nhất định sẽ chú ý hơn."], ["陈天中", "希望我的腿能快一点儿好。", "Hy vọng chân tôi mau khỏi."]]}], "grammar": [{"name": "趋向补语引申：下去", "formula": "Động từ / tính từ + 下去", "meaning": "Hành động hoặc trạng thái đã bắt đầu và tiếp tục về sau.", "example": "不能再胖下去了。", "vi": "Không thể cứ tiếp tục tăng cân nữa.", "tip": "Ở đây 下去 chỉ sự tiếp diễn, không phải hướng đi xuống theo nghĩa đen.", "color": "#dbeafe"}, {"name": "离合词 · Động từ ly hợp", "formula": "Phần động từ + bổ ngữ/số lượng + phần danh từ", "meaning": "Các từ như 跑步、睡觉、游泳 có cấu tạo tách được; thành phần chỉ thời lượng/số lần có thể xen giữa.", "example": "我每天下午都来跑一个小时的步。", "vi": "Chiều nào tôi cũng đến chạy bộ một tiếng.", "tip": "Không viết 跑步一个小时 trong mẫu ly hợp của sách; dùng 跑一个小时的步.", "color": "#fae8ff"}, {"name": "时量补语（2）· Bổ ngữ thời lượng", "formula": "Động từ + 了 + khoảng thời gian (+ 了)", "meaning": "Với tình trạng đã kết thúc, diễn tả khoảng thời gian trôi qua kể từ khi kết thúc hành động; cách dùng tùy động từ và ngữ cảnh.", "example": "我上次来医院已经过去差不多两年了。", "vi": "Đã gần hai năm kể từ lần trước tôi đến bệnh viện.", "tip": "Phân biệt “đã kéo dài bao lâu” với “đã bao lâu kể từ khi việc đó diễn ra”.", "color": "#ffedd5"}, {"name": "以前 / 以后 / 前 / 后", "formula": "Thời điểm / sự việc + 以前 / 以后 / 前 / 后", "meaning": "Trước hoặc sau một mốc thời gian, sự việc.", "example": "出院前，医生给我开了几种药。", "vi": "Trước khi xuất viện, bác sĩ kê cho tôi vài loại thuốc.", "tip": "以前/以后 có thể dùng sau mệnh đề; 前/后 ngắn gọn, thường theo sau sự việc hoặc thời điểm.", "color": "#dcfce7"}], "book": [["李医生特别______病人。", ["开", "得", "种", "关心", "方法"], 3, "关心 = quan tâm người bệnh."], ["医生说你下个星期______回来检查一下。", ["开", "得", "种", "关心", "方法"], 1, "得 (děi) = phải, cần làm."], ["您一直很健康，有什么好的锻炼______吗？", ["开", "得", "种", "关心", "方法"], 4, "方法 = phương pháp tập luyện."], ["如果你的病好了，医生就不会给你______药了。", ["开", "得", "种", "关心", "方法"], 0, "开药 = kê thuốc."], ["感冒的时候能吃这______药吗？你再问一下医生。", ["开", "得", "种", "关心", "方法"], 2, "种 = loại; 这种药 = loại thuốc này."], ["A：你什么时候能出院？ B：可能两天______，我还需要做几个检查。", ["注意", "突然", "差不多", "其他", "以后"], 4, "两天以后 = sau hai ngày."], ["A：你是不是生病了？ B：是，我昨天晚上______头疼、发烧，吃完药好多了。", ["注意", "突然", "差不多", "其他", "以后"], 1, "突然 = đột nhiên."], ["A：你的腿可以走路，但是还不能运动。 B：我知道了，我会______的。", ["注意", "突然", "差不多", "其他", "以后"], 0, "注意 = chú ý."], ["A：刘医生，您下个星期来医院吗？ B：我下个星期一不来，______时间都在。", ["注意", "突然", "差不多", "其他", "以后"], 3, "其他时间 = các thời gian khác."], ["A：你疼了多长时间了？ B：有时候疼，有时候不疼，______一个月吧。", ["注意", "突然", "差不多", "其他", "以后"], 2, "差不多 = khoảng chừng."]], "extra": [["我下课______去打羽毛球。", ["以后", "耳朵", "突然", "种"], 0, "Sau khi tan học."], ["他最近______感冒。", ["常", "腿", "开", "种"], 0, "Thường xuyên."], ["我的______有点儿疼。", ["耳朵", "体育馆", "方法", "以后"], 0, "Tai."], ["他生病了，正在______。", ["住院", "开机", "结婚", "爬山"], 0, "Nằm viện."], ["医生让我多______。", ["休息", "结婚", "买车", "购物"], 0, "Nghỉ ngơi; từ đã xuất hiện trong bài khóa."], ["你一定要______身体健康。", ["注意", "突然", "其他", "差不多"], 0, "Chú ý sức khỏe."], ["我今天______了，可以回家休息。", ["出院", "住院", "发烧", "担心"], 0, "Được xuất viện."], ["医生给我______了药。", ["开", "关心", "胖", "注意"], 0, "Kê thuốc."], ["______睡觉以前吃药。", ["每天", "耳朵", "腿", "方法"], 0, "Mỗi ngày."], ["他______两年没有来这里了。", ["差不多", "种", "耳朵", "体育馆"], 0, "Khoảng gần hai năm."], ["我希望能坚持运动______。", ["下去", "上来", "出去", "进来"], 0, "Tiếp tục duy trì vận động."], ["这种药每天吃三______。", ["次", "斤", "辆", "张"], 0, "Lần."], ["我跑了一个小时的______。", ["步", "觉", "泳", "饭"], 0, "跑步 là động từ ly hợp."], ["我昨天晚上睡了一______觉。", ["个", "条", "辆", "张"], 0, "睡了一个觉 (tự nhiên hơn: 睡了一觉)."], ["______之前，请检查你的东西。", ["出院", "一共", "甜", "香蕉"], 0, "Trước khi xuất viện."], ["他今年______了十多斤。", ["胖", "健康", "体育馆", "方法"], 0, "Tăng cân."], ["你______发烧，应该去看医生。", ["一直", "短裤", "一共", "公斤"], 0, "Liên tục / vẫn đang sốt."], ["我打羽毛球打得不______。", ["怎么样", "突然", "其他", "差不多"], 0, "不怎么样 = không tốt lắm."], ["吃药______要注意休息。", ["以后", "耳朵", "体育馆", "种"], 0, "Sau khi uống thuốc."], ["______前不能吃这个药。", ["饭", "腿", "羽毛球", "医生"], 0, "Trước bữa ăn."], ["你______什么时候开始疼的？", ["腿", "种", "方法", "其他"], 0, "Chân của bạn."], ["这个病人需要医生的______。", ["关心", "裙子", "高铁", "香蕉"], 0, "Sự quan tâm."], ["我很______他，希望他快好。", ["担心", "矮", "甜", "合适"], 0, "Lo lắng cho ai."], ["每天运动是一个好______。", ["习惯", "耳朵", "药", "医生"], 0, "Thói quen."], ["运动可以让身体更______。", ["健康", "突然", "低", "开"], 0, "Khỏe mạnh."], ["他不但头疼，而且还______。", ["发烧", "开机", "结婚", "买票"], 0, "Sốt."], ["我去医院做了一次______。", ["检查", "衣服", "自行车", "鞋"], 0, "Khám/kiểm tra."], ["这______药需要饭后吃。", ["种", "条", "辆", "张"], 0, "Loại thuốc."], ["他前天才回家，才过了两______。", ["天", "种", "次", "只"], 0, "Hai ngày."], ["回家______我会好好休息。", ["以后", "关心", "突然", "腿"], 0, "Sau khi về nhà."]]};

const save=()=>{try{localStorage.setItem('HSK3_L8_fixed_2026',JSON.stringify(state))}catch(e){}};
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs=[['home','🏠 Tổng quan'],['vocab','🀄 28 từ vựng'],['vquiz','🧩 Quiz từ vựng'],['grammar','📒 4 điểm ngữ pháp'],['reading','📖 4 bài khóa'],['translate','🌏 Luyện dịch'],['original','📝 Bài tập gốc'],['practice','🎯 30 câu mở rộng'],['mistakes','🔁 Ôn câu sai']];
function setPage(p){page=p;render();window.scrollTo(0,0)}function setRi(i){ri=i;render()}function setVM(m){vm=m;render()}
function speak(t){if(!('speechSynthesis'in window)){alert('Thiết bị không hỗ trợ giọng đọc.');return}speechSynthesis.cancel();let a=new SpeechSynthesisUtterance(t);a.lang='zh-CN';a.rate=.77;speechSynthesis.speak(a)}
function render(){document.getElementById('nav').innerHTML=tabs.map(([k,t])=>`<button class="${page===k?'active':''}" onclick="setPage('${k}')">${t}</button>`).join('');let a=document.getElementById('main');({home,vocab:showVocab,vquiz:showVQuiz,grammar:showGrammar,reading:showReading,translate:showTranslation,original:showExercises,practice:showExercises,mistakes:showExercises})[page](a)}
function home(a){let marks=Object.values(state.graded),done=marks.length,acc=marks.filter(Boolean).length;a.innerHTML=`<h2>Chào mừng đến HSK 3 – Bài 8 🚄</h2><p class="muted">Nội dung dựa trên trang 67–75 của giáo trình đính kèm. Quiz từ vựng và bài tập mở rộng có ghi rõ là nội dung biên soạn thêm.</p><div class="grid"><div class="stat">Từ vựng<strong>28</strong></div><div class="stat">Bài khóa<strong>4</strong></div><div class="stat">Đã làm<strong>${done}/40</strong><span class="small">Đúng ${acc}/${done||0}</span></div></div><div class="card"><h2>🧠 Tổng quan · Công thức trọng tâm</h2><p class="muted">Ba thẻ ngữ pháp hiển thị ngay dưới đây, bấm để học ví dụ và luyện tập.</p>${grammar.map((g,i)=>`<div class="cover"><h3>${i+1}. ${E(g.name)}</h3><div class="formula">${E(g.formula)}</div><p>${E(g.meaning)}</p><div class="hanzi">${E(g.example)}</div><p>${E(g.vi)}</p><button class="btn alt" onclick="ri=${i};setPage('grammar')">Học sâu chủ điểm này →</button></div>`).join('')}</div><div class="card"><h3>Lộ trình đề xuất</h3>① Học 28 từ → ② Quiz từ vựng → ③ Học 4 công thức → ④ Đọc và dịch 4 bài khóa → ⑤ Làm 10 câu sách → ⑥ Làm 30 câu mở rộng → ⑦ Ôn câu sai.<div class="toolbar"><button class="btn" onclick="setPage('vocab')">Bắt đầu học</button><button class="btn alt" onclick="setPage('original')">Làm bài gốc</button></div></div><div class="alert">Lưu ý: Tài liệu là trang scan; phần dịch tiếng Việt là bản tham khảo biên soạn. Chưa tích hợp audio gốc của sách.</div>`}
function showVocab(a){a.innerHTML=`<h2>🀄 28 từ vựng Bài 8</h2><p class="muted">Chữ Hán · Pinyin · nghĩa Việt · giọng đọc tiếng Trung của trình duyệt.</p><div class="toolbar"><input id="findv" placeholder="Tìm chữ Hán / Pinyin / nghĩa Việt" oninput="drawVocab(this.value)" style="padding:12px;border:1px solid #dbe1ed;border-radius:10px;max-width:350px;width:100%"><button class="btn" onclick="setPage('vquiz')">Luyện quiz →</button></div><div class="vgrid" id="vitems"></div>`;drawVocab('')}
function drawVocab(term){let g=document.getElementById('vitems');if(!g)return;g.innerHTML=vocab.filter(v=>v.join(' ').toLowerCase().includes(term.toLowerCase())).map(v=>`<div class="card"><div class="hanzi">${E(v[0])}</div><div class="py">${E(v[1])}</div><p>${E(v[2])}</p><button class="btn alt voice" onclick="speak('${E(v[0])}')">🔊 Nghe</button></div>`).join('')}
function vkey(i){return vm+'_'+i}function vopts(i){let inds=[i];for(let k=1;inds.length<4;k++){let j=(i+k*7)%vocab.length;if(!inds.includes(j))inds.push(j)}return inds.sort((a,b)=>((a*17+5)%29)-((b*17+5)%29))}
function showVQuiz(a){let n=vocab.filter((_,i)=>vkey(i) in state.vgraded).length,ok=vocab.filter((_,i)=>state.vgraded[vkey(i)]===true).length;a.innerHTML=`<h2>🧩 Quiz từ vựng · 28 từ</h2><p class="muted">3 chế độ: Hán → nghĩa, nghĩa → Hán, chữ Hán → Pinyin. 84 lượt câu hỏi.</p><div class="card"><div class="toolbar"><button class="pill ${vm==='hv'?'on':''}" onclick="setVM('hv')">Hán → Việt</button><button class="pill ${vm==='vh'?'on':''}" onclick="setVM('vh')">Việt → Hán</button><button class="pill ${vm==='hp'?'on':''}" onclick="setVM('hp')">Hán → Pinyin</button></div><b>Đã chấm ${n}/28 · Đúng ${ok}</b><div class="progress"><i style="width:${n/28*100}%"></i></div></div>${vocab.map((v,i)=>{let k=vkey(i),pick=state.vanswer[k],graded=k in state.vgraded,opts=vopts(i),show=j=>vm==='hv'?vocab[j][2]:vm==='vh'?vocab[j][0]:vocab[j][1];return `<div class="quiz"><span class="badge">Từ ${i+1}/28</span><div class="qtitle">${E(vm==='vh'?v[2]:v[0])}</div>${opts.map((j,n)=>`<button class="option ${pick===j?'sel':''} ${graded&&j===i?'good':''} ${graded&&pick===j&&j!==i?'bad':''}" onclick="chooseV(${i},${j})">${'ABCD'[n]}. ${E(show(j))}</button>`).join('')}<button class="btn" onclick="checkV(${i})">Chấm đáp án</button> <button class="btn alt" onclick="speak('${E(v[0])}')">🔊 Nghe</button>${graded?`<div class="feedback ${state.vgraded[k]?'good':'bad'}"><b>${state.vgraded[k]?'✅ Đúng':'❌ Sai'}</b><p><b>Feynman:</b> ${E(v[0])} đọc là <b>${E(v[1])}</b>, nghĩa <b>${E(v[2])}</b>.</p><div class="socrates"><b>Socrates:</b> Em thử đặt một câu ngắn có từ này trong tình huống đi tàu cao tốc?</div></div>`:''}</div>`}).join('')}`}
function chooseV(i,j){let k=vkey(i);state.vanswer[k]=j;delete state.vgraded[k];save();keep()}function checkV(i){let k=vkey(i);if(!(k in state.vanswer)){alert('Hãy chọn đáp án.');return}state.vgraded[k]=state.vanswer[k]===i;save();keep()}
function showGrammar(a){a.innerHTML=`<h2>📒 Ngữ pháp 1–4</h2><div class="toolbar">${grammar.map((g,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">${i+1}. ${E(g.name)}</button>`).join('')}</div>${(()=>{let g=grammar[Math.min(ri,3)];return `<div class="card grammar"><h2>${E(g.name)}</h2><div class="formula">${E(g.formula)}</div><h3>Ý nghĩa</h3><p>${E(g.meaning)}</p><h3>Ví dụ trong bài</h3><div class="hanzi">${E(g.example)}</div><p>${E(g.vi)}</p><p class="textnote"><b>Feynman:</b> ${E(g.tip)}</p><div class="socrates"><b>Câu hỏi Socrates:</b> Nếu thay cụm này bằng cách nói khác, sắc thái của người nói sẽ thay đổi như thế nào?</div></div>`})()}<button class="btn" onclick="setPage('practice')">Luyện vận dụng ngữ pháp →</button>`}
function showReading(a){let r=readings[ri%4];a.innerHTML=`<h2>📖 Đọc hiểu 4 bài khóa</h2><div class="toolbar">${readings.map((x,i)=>`<button class="pill ${i===ri?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div><div class="card"><h2>${E(r.title)}</h2><p class="muted">${E(r.where)}</p>${r.lines.map(([sp,cn,vi],i)=>`<div class="readingline"><div class="hanzi"><b>${E(sp)}：</b>${E(cn)}</div><button class="btn alt voice" onclick="speak('${E(cn)}')">🔊 Đọc</button> <details><summary>Xem bản dịch</summary>${E(vi)}</details></div>`).join('')}<h3>Vấn đáp Socrates · Đọc hiểu</h3>${r.questions.map((q,i)=>`<p>${i+1}. ${E(q)}</p>`).join('')}<button class="btn" onclick="setPage('translate')">Tự dịch bài khóa →</button></div>`}
function showTranslation(a){let r=readings[ri%4];a.innerHTML=`<h2>🌏 Dịch từng câu · Trung → Việt</h2><p class="muted">Viết trước khi xem đáp án mẫu. Nội dung tự lưu trên trình duyệt.</p><div class="toolbar">${readings.map((x,i)=>`<button class="pill ${i===ri?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div><div class="card"><h3>${E(r.title)}</h3>${r.lines.map(([sp,cn,vi],i)=>{let key='r'+ri+'_'+i;return `<div class="readingline"><div class="hanzi">${E(sp)}：${E(cn)}</div><textarea placeholder="Viết bản dịch tiếng Việt của bạn..." oninput="transInput('${key}',this.value)">${E(state.translation[key]||'')}</textarea><details><summary>🔎 Xem bản dịch mẫu và tự đối chiếu</summary><div class="feedback good">${E(vi)}</div><p class="small">Socrates: Hãy tìm chủ ngữ, động từ chính, từ chỉ thời gian và thành phần chỉ kết quả.</p></details></div>`}).join('')}<button class="btn alt" onclick="downloadTrans()">Xuất bản dịch (.txt)</button></div>`}
function transInput(k,v){state.translation[k]=v;save()}function downloadTrans(){let r=readings[ri%4],txt=r.title+'\n\n'+r.lines.map(([sp,cn],i)=>sp+'：'+cn+'\n'+(state.translation['r'+ri+'_'+i]||'')).join('\n\n');let u=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='HSK3_Bai8_Dich_Bai'+(ri+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),800)}
const questions=[...book.map((e,i)=>({id:'b'+i,q:e[0],opts:e[1],ans:e[1].indexOf(e[2]===undefined?'':e[1][e[2]]),ex:e[3],source:true})),...extra.map((e,i)=>({id:'e'+i,q:e[0],opts:e[1],ans:e[2],ex:e[3],source:false}))];
// For source questions the numeric answer key is recorded in DB.book's 3rd item.
book.forEach((e,i)=>questions[i].ans=e[2]);
function showExercises(a){let list=page==='original'?questions.filter(q=>q.source):page==='practice'?questions.filter(q=>!q.source):questions.filter(q=>state.graded[q.id]===false);let n=list.filter(q=>q.id in state.graded).length,ok=list.filter(q=>state.graded[q.id]===true).length;a.innerHTML=`<h2>${page==='original'?'📝 10 câu điền từ từ sách · tr. 74–75':page==='practice'?'🎯 30 câu luyện vận dụng':'🔁 Ôn lại câu sai'}</h2><p class="muted">${page==='original'?'Câu gốc dựa trên mục 综合练习, mỗi câu có các lựa chọn của nhóm từ tương ứng.':'Các câu trắc nghiệm mở rộng do app biên soạn, không phải bài gốc.'}</p><div class="quizstats">Đã chấm <b>${n}/${list.length}</b> · Đúng <b>${ok}</b><div class="progress"><i style="width:${list.length?n/list.length*100:0}%"></i></div></div>${list.length?list.map((q,i)=>{let p=state.answer[q.id],g=q.id in state.graded;return `<article class="quiz"><span class="badge">Câu ${i+1} ${q.source?'· Theo sách':'· Mở rộng'}</span><h3 class="qtitle">${E(q.q)}</h3>${q.opts.map((o,j)=>`<button class="option ${p===j?'sel':''} ${g&&j===q.ans?'good':''} ${g&&p===j&&p!==q.ans?'bad':''}" onclick="pick('${q.id}',${j})">${'ABCDE'[j]}. ${E(o)}</button>`).join('')}<button class="btn" onclick="check('${q.id}')">Kiểm tra đáp án</button>${g?`<div class="feedback ${state.graded[q.id]?'good':'bad'}"><b>${state.graded[q.id]?'✅ Chính xác':'❌ Chưa đúng'}. Đáp án: ${E(q.opts[q.ans])}</b><p><b>Feynman:</b> ${E(q.ex)}</p><div class="socrates"><b>Socrates:</b> Từ nào trong ngữ cảnh giúp em chọn đáp án này và loại những từ còn lại?</div></div>`:''}</article>`}).join(''):'<div class="card empty">Chưa có câu sai. Hãy làm bài tập trước nhé!</div>'}`}
function pick(id,j){state.answer[id]=j;delete state.graded[id];save();keep()}function check(id){if(!(id in state.answer)){alert('Hãy chọn đáp án trước.');return}let q=questions.find(x=>x.id===id);state.graded[id]=state.answer[id]===q.ans;save();keep()}
function keep(){let y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,y))}render();
</script></body></html>
