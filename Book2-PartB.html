:"B"}]}];const byId=(id)=>document.getElementById(id);let idx=0,pos=0,choice=null,review=false;let state={};try{state=JSON.parse(localStorage.getItem('testlab_b2b_v1')||'{}')}catch(e){}const save=()=>localStorage.setItem('testlab_b2b_v1',JSON.stringify(state));let ids=[];let current=()=>sets[idx].items.find(x=>x.n===ids[pos]);const entry=()=>state[sets[idx].id+'#'+ids[pos]];function setTest(i){idx=i;review=false;ids=sets[idx].items.map(x=>x.n);pos=0;choice=null;draw()}function getWords(s){return s.match(/[A-Za-z][A-Za-z'-]*/g)||[]}function normalize(v){return v.toLowerCase().replace(/[^a-z\s-]/g,'').trim()}function reason(q){let good=q.o[q.a],name=sets[idx].name;let hint='';if(name==='Synonyms')hint='Tìm từ hoặc cụm từ có nghĩa gần nhất với phần được hỏi. Đối chiếu sắc thái nghĩa, từ loại và ngữ cảnh; từ cùng chủ đề chưa chắc đồng nghĩa.';else if(name==='Antonyms')hint='Đề yêu cầu nghĩa TRÁI NGƯỢC. Xác định nghĩa của từ gốc trước, sau đó chọn từ đối lập về cùng đặc điểm; đừng nhầm với từ khác nghĩa nhưng không đối lập.';else hint='Xác định thuộc tính chung của ba từ trước (loại từ, chủ đề hoặc mối liên hệ nghĩa). Từ còn lại phá vỡ mối liên hệ đó.';return `<strong>Đáp án theo Key: ${q.a}) ${esc(good)}</strong><br><strong>1. Dấu hiệu:</strong> ${esc(name)} — chú ý từ/cụm từ trong câu và ý nghĩa theo ngữ cảnh.<br><strong>2. Logic Feynman:</strong> ${hint}<br><strong>3. Đối chiếu:</strong> Phương án bạn chọn là “${esc(q.o[choice]||'')}”; đáp án sách là “${esc(good)}”. Hãy so sánh nghĩa cụ thể của hai lựa chọn, không chỉ dựa vào sự quen thuộc.<br><strong>4. Socrates:</strong> Nếu tự diễn đạt từ khóa bằng tiếng Việt, đặc điểm nghĩa nào giúp bạn loại trừ phương án vừa chọn?<br><span class=small>Giải thích theo dạng bài, không phải bản dịch hoặc lời giải đã biên soạn riêng cho từng phương án.</span>`}function esc(s){return String(s).replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))}function sidebar(){byId('tests').innerHTML=sets.map((s,i)=>{let done=s.items.filter(q=>state[s.id+'#'+q.n]).length;return `<button class="item ${i===idx?'active':''}" onclick="setTest(${i})">${esc(s.name)} <span class=small>(${done}/${s.items.length})</span></button>`}).join('');byId('total').textContent=sets.reduce((n,s)=>n+s.items.length,0)}function draw(){sidebar();if(!ids.length){byId('content').innerHTML='<div class=card>Chưa có câu nào trong chế độ này. Hãy chọn bài khác hoặc quay lại luyện tất cả.</div>';return}if(pos>=ids.length){byId('content').innerHTML='<div class=card><h2>Đã hoàn thành!</h2><button onclick="setTest(idx)">Làm lại Test</button></div>';return}let q=current();choice=entry()?.pick||null;let marked=!!entry();let correct=marked&&entry().pick===q.a;let completed=sets[idx].items.filter(z=>state[sets[idx].id+'#'+z.n]).length;let right=sets[idx].items.filter(z=>state[sets[idx].id+'#'+z.n]?.pick===z.a).length;let options=Object.entries(q.o).map(([k,v])=>`<button class="opt ${choice===k?'sel':''} ${marked&&k===q.a?'good':''} ${marked&&choice===k&&!correct?'bad':''}" ${marked?'disabled':''} onclick="select('${k}')"><b>${k}</b><span>${esc(v)}</span></button>`).join('');byId('content').innerHTML=`<div class=card><div class=small>BOOK 2 • PART B / ${esc(sets[idx].name)} ${review?'• LUYỆN CÂU SAI':''}</div><div class=toolbar><span class=pill>Câu ${pos+1}/${ids.length} (số gốc ${q.n})</span><span class=pill>${completed} đã làm • ${right} đúng</span></div><div class=meter><div class=fill style="width:${Math.round(completed/sets[idx].items.length*100)}%"></div></div><div class=q>${esc(q.q)}</div>${options}<div class=actions><button class=primary ${(!choice||marked)?'disabled':''} onclick="check()">Kiểm tra • Enter</button><button onclick="next()">Câu tiếp →</button><button onclick="prev()">← Câu trước</button></div>${marked?`<div class=analysis><strong class=${correct?'green':'red'}>${correct?'✓ Đúng!':'✗ Chưa đúng'}</strong><div>${reason(q)}</div></div>`:''}</div><div class=card><div class=toolbar><button onclick="wrongOnly()">Luyện lại câu sai</button><button onclick="setTest(idx)">Tất cả câu</button><button onclick="resetTest()">Xóa kết quả Test này</button><select onchange="jump(this.value)">${ids.map((v,i)=>`<option ${i===pos?'selected':''} value=${i}>Câu ${v}</option>`).join('')}</select></div><p class=small>↑/↓ chọn đáp án • Enter kiểm tra hoặc qua câu tiếp. Kết quả được lưu trong trình duyệt này. Đối chiếu đáp án theo file Key; câu lỗi định dạng không được tự chấm.</p></div>`}function select(k){if(entry())return;choice=k;drawChoice()}function drawChoice(){document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('sel',b.querySelector('b').textContent===choice));let btn=document.querySelector('.primary');if(btn)btn.disabled=!choice}function check(){if(entry()){next();return}let q=current();if(!choice)return;state[sets[idx].id+'#'+q.n]={pick:choice};save();draw()}function next(){if(pos<ids.length-1){pos++;choice=null;draw()}else{pos=ids.length;draw()}}function prev(){pos=Math.max(0,pos-1);choice=null;draw()}function jump(v){pos=Number(v);choice=null;draw()}function wrongOnly(){let s=sets[idx];let failures=s.items.filter(q=>state[s.id+'#'+q.n]&&state[s.id+'#'+q.n].pick!==q.a).map(q=>q.n);if(!failures.length){alert('Chưa có câu sai đã được chấm trong Test này.');return}ids=failures;review=true;pos=0;for(let n of failures)delete state[s.id+'#'+n];save();draw()}function resetTest(){if(!confirm('Xóa kết quả Test này?'))return;for(let q of sets[idx].items)delete state[sets[idx].id+'#'+q.n];save();setTest(idx)}document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();let q=current();if(!q||entry())return;let arr=Object.keys(q.o);let i=arr.indexOf(choice);i=e.key==='ArrowDown'?(i+1)%arr.length:(i<0?arr.length-1:(i+arr.length-1)%arr.length);select(arr[i])}else if(e.key==='Enter'&&!e.target.closest('select,button')){e.preventDefault();check()}});setTest(0);</script></body></html>
