s:15px;border:2px dashed #dccde7;padding:20px;background:linear-gradient(120deg,#fff9fc,#fffef5)}.grammar h3{margin:0 0 10px}.readingline{border-bottom:1px dashed #d7dfed;padding:12px 0;line-height:1.7}.readingline .hanzi{font-size:21px}.quiz{border:1px solid var(--line);padding:18px;border-radius:14px;background:white;margin-bottom:13px}.option{display:block;width:100%;padding:12px;text-align:left;background:#fbfcff;border:1px solid #dce3ed;border-radius:11px;margin:7px 0;color:var(--ink)}.option.sel{border:2px solid #4267ef;padding:11px;background:#edf2ff}.option.good{border-color:#24a17d;background:#e8f8ee}.option.bad{border-color:var(--red);background:#fff0f2}.feedback{background:#f2f5fb;border-radius:12px;padding:14px;margin:10px 0;line-height:1.8}.feedback.good{background:#e7f8f0}.feedback.bad{background:#fff0f2}.socrates{border-left:4px solid #daa34f;background:#fffaeb;padding:12px;margin-top:9px;border-radius:9px}textarea{width:100%;min-height:100px;padding:14px;border:1px solid #ccd5e5;border-radius:11px;line-height:1.7;resize:vertical}details{margin:12px 0}summary{color:#315ac4;cursor:pointer;font-weight:bold}.progress{height:9px;border-radius:10px;background:#e4eaf5;overflow:hidden}.progress>i{display:block;background:var(--blue);height:100%}.small{font-size:13px;color:#748198}.textnote{background:#fff9e5;padding:14px;border-radius:11px}.quizstats{padding:15px;border-radius:12px;background:#edf3ff;margin:14px 0}h2{margin:0 0 13px}h3{line-height:1.5}.empty{padding:24px;text-align:center}.voice{font-size:13px}.badge{background:#ffe4ed;color:#aa4669;border-radius:7px;padding:4px 9px;display:inline-block;font-size:12px;font-weight:bold}.qtitle{font-size:19px;line-height:1.7}.cover{background:linear-gradient(130deg,#fef1ef,#f2f2ff);border:2px dashed #e8c8cf;border-radius:16px;padding:18px;margin:12px 0}.cover .formula{margin-top:10px}.tabs{display:flex;flex-wrap:wrap;gap:8px}.alert{background:#fff9e7;border-radius:12px;padding:13px} @media(max-width:800px){.wr </style></head><body><header><span class="badge">新HSK教程 3 · LESSON 12</span><h1>这个季节天气变化很快</h1><div>Thời tiết mùa này thay đổi rất nhanh · Học hiểu → luyện tập → tự chữa lỗi</div></header><div class="wrap"><nav id="nav"></nav><main id="main"></main></div><script>
const DB={"vocab":[["街","jiē","phố"],["开花","kāihuā","nở hoa"],["公园","gōngyuán","công viên"],["船","chuán","thuyền"],["工作日","gōngzuòrì","ngày làm việc"],["地方","dìfang","địa điểm; nơi"],["刚才","gāngcái","vừa rồi"],["刮","guā","thổi (gió)"],["风","fēng","gió"],["新闻","xīnwén","tin tức"],["伞","sǎn","ô; dù"],["借","jiè","cho mượn; mượn"],["把","bǎ","lượng từ cho ô, dao, ghế"],["雨衣","yǔyī","áo mưa"],["变","biàn","thay đổi"],["季节","jìjié","mùa"],["变化","biànhuà","sự thay đổi; thay đổi"],["冬天","dōngtiān","mùa đông"],["常常","chángcháng","thường xuyên"],["关注","guānzhù","quan tâm; theo dõi"],["四季","sìjì","bốn mùa"],["春天","chūntiān","mùa xuân"],["夏天","xiàtiān","mùa hè"],["凉快","liángkuai","mát mẻ"],["秋天","qiūtiān","mùa thu"],["叶子","yèzi","lá cây"],["变成","biànchéng","biến thành"]],"readings":[{"title":"Bài khóa 1 – Hẹn đi công viên","where":"Ngoài phố · 王一飞 và 白家月","lines":[["白家月","王老师，您看，这条街上的树都开花了。","Cô Vương, cô xem, cây cối trên phố này đều nở hoa rồi."],["王一飞","上周我去公园坐船了，公园里的花也开了。","Tuần trước tôi đi thuyền ở công viên, hoa trong công viên cũng nở rồi."],["白家月","天气这么好，下午我也想去公园坐船。","Thời tiết đẹp thế này, chiều tôi cũng muốn đi thuyền trong công viên."],["王一飞","去吧！今天是工作日，人应该不多。","Đi đi! Hôm nay là ngày làm việc nên chắc không đông người."],["白家月","您有时间吗？我想跟您一起去。","Cô có thời gian không? Tôi muốn đi cùng cô."],["王一飞","我今天下午有课，不能去太远的地方。","Chiều nay tôi có tiết học, không đi xa được."],["白家月","那咱们换一天去？","Vậy chúng ta đổi sang hôm khác nhé?"],["王一飞","行。或者明天去，或者后天去，我给你打电话。","Được. Hoặc ngày mai, hoặc ngày kia đi, tôi sẽ gọi cho bạn."]],"questions":["上周王一飞去公园做什么了？","白家月今天想做什么？","她们可能什么时候去公园？"]},{"title":"Bài khóa 2 – Thời tiết thay đổi bất ngờ","where":"Ngoài phố · 王一飞 và 白家月","lines":[["白家月","刚才还是大晴天呢，怎么突然就刮起风来了？","Vừa rồi còn nắng đẹp, sao đột nhiên nổi gió thế này?"],["王一飞","好像新闻里说今天有雨。","Hình như bản tin nói hôm nay có mưa."],["白家月","啊？我每天书包里都放着雨伞，就今天没带。","Ơ? Ngày nào tôi cũng để ô trong cặp, chỉ hôm nay không mang."],["王一飞","我可以借给你，我车里有一把伞和一件雨衣。","Tôi có thể cho bạn mượn, trong xe tôi có một chiếc ô và một áo mưa."],["白家月","谢谢，希望下午天气能变好。","Cảm ơn, hy vọng thời tiết chiều nay sẽ tốt lên."],["王一飞","这个季节天气变化很快。","Thời tiết mùa này thay đổi rất nhanh."],["白家月","雨已经下起来了，咱们快点儿走吧。","Mưa bắt đầu rơi rồi, chúng ta đi nhanh lên."]],"questions":["白家月今天带雨伞了吗？","王一飞可以借给白家月什么？","她们现在要做什么？为什么？"]},{"title":"Bài khóa 3 – Mùa đông Bắc Kinh","where":"Trong lớp học · 王一飞 và 白家月","lines":[["白家月","您来这里已经一年多了，习惯了吧？","Cô đã đến đây hơn một năm rồi, quen rồi chứ?"],["王一飞","别的早就习惯了，就是天气我还不太习惯。","Những thứ khác tôi đã quen từ lâu, chỉ có thời tiết là tôi chưa quen lắm."],["白家月","为什么？您不喜欢这里的天气吗？","Tại sao? Cô không thích thời tiết ở đây sao?"],["王一飞","我觉得冬天太冷了。","Tôi thấy mùa đông quá lạnh."],["白家月","冬天虽然冷，但是下雪的时候特别漂亮。","Dù mùa đông lạnh nhưng lúc tuyết rơi đặc biệt đẹp."],["王一飞","我也喜欢雪。北京常常下雪，但听说今年就下了一次。","Tôi cũng thích tuyết. Bắc Kinh thường có tuyết, nhưng nghe nói năm nay chỉ rơi một lần."],["白家月","我没关注过北京的天气，但是新闻里说过，今年冬天很多地方雪下得都少了。","Tôi không theo dõi thời tiết Bắc Kinh, nhưng tin tức nói mùa đông năm nay nhiều nơi ít tuyết hơn."]],"questions":["王一飞还不太习惯什么？","白家月为什么喜欢冬天？","新闻里说今年冬天的雪怎么样？"]},{"title":"Bài khóa 4 – Bốn mùa ở Bắc Kinh","where":"Nhật ký · 王一飞","lines":[["王一飞","我离开北京到这里工作一年多了。","Tôi rời Bắc Kinh đến đây làm việc hơn một năm rồi."],["王一飞","这一年多住下来，我还是更喜欢北京的四季。","Sau hơn một năm sống ở đây, tôi vẫn thích bốn mùa Bắc Kinh hơn."],["王一飞","北京的春天最舒服，天气不冷不热。","Mùa xuân Bắc Kinh dễ chịu nhất, thời tiết không lạnh cũng không nóng."],["王一飞","夏天白天很热，但是晚上比较凉快。","Mùa hè ban ngày rất nóng nhưng buổi tối khá mát."],["王一飞","秋天树上的叶子都变成了红色、黄色，非常漂亮。","Mùa thu lá cây chuyển sang đỏ, vàng, rất đẹp."],["王一飞","冬天不但冷，而且风很大，我最不喜欢冬天。","Mùa đông không chỉ lạnh mà gió còn mạnh, tôi không thích mùa đông nhất."],["王一飞","每个人都有自己最喜欢的季节，你最喜欢哪个季节呢？","Ai cũng có mùa yêu thích của mình. Bạn thích mùa nào nhất?"]],"questions":["北京的夏天是什么样的？","北京的秋天是什么样的？","王一飞为什么最不喜欢冬天？"]}],"grammar":[{"name":"或者……或者…… – lựa chọn","formula":"或者 + phương án A，或者 + phương án B","meaning":"Đưa ra hai hoặc nhiều lựa chọn khả thi, thường dùng trong ngôn ngữ nói.","example":"或者明天去，或者后天去。","vi":"Hoặc ngày mai đi, hoặc ngày kia đi.","tip":"Dùng khi chưa quyết định chọn một trong hai khả năng.","s":"Nếu muốn đưa ra hai ngày có thể đi, em đặt 或者 ở những vị trí nào?"},{"name":"起来 – bắt đầu trạng thái/hành động","formula":"Động từ / tính từ + 起来  |  Động từ + 起 + tân ngữ + 来","meaning":"Diễn tả một hành động bắt đầu hoặc bước vào trạng thái mới.","example":"雨已经下起来了。","vi":"Mưa đã bắt đầu rơi.","tip":"Chú ý tân ngữ có thể đứng giữa 起 và 来.","s":"“刮起风来了” khác gì với “风很大” về thời điểm bắt đầu?"},{"name":"就 – phó từ phạm vi","formula":"Chủ ngữ + 就 + động từ / vị ngữ","meaning":"Giới hạn phạm vi hoặc số lượng: chỉ, riêng, chỉ có. Cần hiểu theo ngữ cảnh.","example":"我每天都带伞，就今天没带。","vi":"Ngày nào tôi cũng mang ô, chỉ hôm nay không mang.","tip":"Tìm phần được nói là ngoại lệ hoặc bị giới hạn.","s":"Trong 就今天没带, phần nào được nhấn mạnh là ngoại lệ?"},{"name":"下来 – hoàn thành qua thời gian/công sức","formula":"Động từ + 下来  |  Động từ + tân ngữ + 下来 (tùy động từ)","meaning":"Chỉ việc hoàn thành một hành động kéo dài, đòi hỏi nỗ lực hay vượt trở ngại.","example":"这一年多住下来，我还是更喜欢北京的四季。","vi":"Sau hơn một năm sống qua, tôi vẫn thích bốn mùa Bắc Kinh hơn.","tip":"Phân biệt: 起来 nhấn mạnh bắt đầu, 下来 có thể nhấn mạnh trải qua và hoàn thành.","s":"Vì sao 住下来 trong đoạn văn cho thấy người nói đã trải nghiệm hơn một năm?"}],"book":[["突然________起风来了，可能会下雨。",["刮","季节","把","借","地方"],0,"Xác định nghĩa của từ cần điền và ngữ cảnh cả câu."],["我在昨天拍照的________等你，别走错了。",["刮","季节","把","借","地方"],4,"Xác định nghĩa của từ cần điền và ngữ cảnh cả câu."],["这________雨伞不大不小，可以放在书包里。",["刮","季节","把","借","地方"],2,"Xác định nghĩa của từ cần điền và ngữ cảnh cả câu."],["我把这件雨衣________给你吧，我开车不需要穿。",["刮","季节","把","借","地方"],3,"Xác định nghĩa của từ cần điền và ngữ cảnh cả câu."],["这个________北京不冷不热，很多人都在这个时候来旅游。",["刮","季节","把","借","地方"],1,"Xác định nghĩa của từ cần điền và ngữ cảnh cả câu."],["A：这里的冬天________下雪吗？\nB：不是，每年就一月雪最多。",["刚才","关注","变成","常常","变"],3,"Xác định nghĩa của từ cần điền và ngữ cảnh cả câu."],["A：________下大雨了，天气凉快了很多。\nB：没错，每天都能这么凉快就好了。",["刚才","关注","变成","常常","变"],0,"Xác định nghĩa của từ cần điền và ngữ cảnh cả câu."],["A：这几天天气不好，我怕下午的飞机会晚点。\nB：放心吧，我一直在________天气，下午是晴天。",["刚才","关注","变成","常常","变"],1,"Xác định nghĩa của từ cần điền và ngữ cảnh cả câu."],["A：这里以前是一片草地，现在________了学校和医院。\nB：是啊，变化真大。",["刚才","关注","变成","常常","变"],2,"Xác định nghĩa của từ cần điền và ngữ cảnh cả câu."],["A：下了一晚上的雪，外面全都________白了。\nB：是的，太漂亮了！",["刚才","关注","变成","常常","变"],4,"Xác định nghĩa của từ cần điền và ngữ cảnh cả câu."]],"extra":[["Từ nào có nghĩa “phố”?",["街","地方","伞","季节"],0,"街 (jiē) = phố."],["Từ nào có nghĩa “nở hoa”?",["开花","刚才","借","变化"],0,"开花 (kāihuā) = nở hoa."],["Từ nào có nghĩa “công viên”?",["公园","刮","把","冬天"],0,"公园 (gōngyuán) = công viên."],["Từ nào có nghĩa “thuyền”?",["船","风","雨衣","常常"],0,"船 (chuán) = thuyền."],["Từ nào có nghĩa “ngày làm việc”?",["新闻","变","关注","工作日"],3,"工作日 (gōngzuòrì) = ngày làm việc."],["Từ nào có nghĩa “địa điểm; nơi”?",["地方","伞","季节","四季"],0,"地方 (dìfang) = địa điểm; nơi."],["Từ nào có nghĩa “vừa rồi”?",["春天","刚才","借","变化"],1,"刚才 (gāngcái) = vừa rồi."],["Từ nào có nghĩa “thổi (gió)”?",["刮","把","冬天","夏天"],0,"刮 (guā) = thổi (gió)."],["Từ nào có nghĩa “gió”?",["风","雨衣","常常","凉快"],0,"风 (fēng) = gió."],["Từ nào có nghĩa “tin tức”?",["新闻","变","关注","秋天"],0,"新闻 (xīnwén) = tin tức."],["Từ nào có nghĩa “ô; dù”?",["伞","季节","四季","叶子"],0,"伞 (sǎn) = ô; dù."],["Từ nào có nghĩa “cho mượn; mượn”?",["春天","变成","借","变化"],2,"借 (jiè) = cho mượn; mượn."],["Từ nào có nghĩa “lượng từ cho ô, dao, ghế”?",["街","把","冬天","夏天"],1,"把 (bǎ) = lượng từ cho ô, dao, ghế."],["Từ nào có nghĩa “áo mưa”?",["开花","雨衣","常常","凉快"],1,"雨衣 (yǔyī) = áo mưa."],["Từ nào có nghĩa “thay đổi”?",["公园","变","关注","秋天"],1,"变 (biàn) = thay đổi."],["Từ nào có nghĩa “mùa”?",["船","季节","四季","叶子"],1,"季节 (jìjié) = mùa."],["Từ nào có nghĩa “sự thay đổi; thay đổi”?",["春天","变成","工作日","变化"],3,"变化 (biànhuà) = sự thay đổi; thay đổi const {vocab,readings,grammar,book,extra}=DB;
let page='home',ri=0,vm='hv',state={};try{state=JSON.parse(localStorage.getItem('HSK3_L12_offline_v1')||'{}')}catch(e){};
for(const name of ['answer','graded','vanswer','vgraded','translation'])if(!state[name])state[name]={};
const save=()=>{try{localStorage.setItem('HSK3_L12_offline_v1',JSON.stringify(state))}catch(e){}};
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs=[['home','🏠 Tổng quan'],['vocab','🀄 27 từ vựng'],['vquiz','🧩 Quiz từ vựng'],['grammar','📒 4 điểm ngữ pháp'],['reading','📖 4 bài khóa'],['translate','🌏 Luyện dịch'],['original','📝 Bài tập gốc'],['practice','🎯 30 câu mở rộng'],['mistakes','🔁 Ôn câu sai']];
function setPage(p){page=p;render();window.scrollTo(0,0)}function setRi(i){ri=i;render()}function setVM(m){vm=m;render()}
function speak(t){if(!('speechSynthesis'in window)){alert('Thiết bị không hỗ trợ giọng đọc.');return}speechSynthesis.cancel();let a=new SpeechSynthesisUtterance(t);a.lang='zh-CN';a.rate=.77;speechSynthesis.speak(a)}
function render(){document.getElementById('nav').innerHTML=tabs.map(([k,t])=>`<button class="${page===k?'active':''}" onclick="setPage('${k}')">${t}</button>`).join('');let a=document.getElementById('main');({home,vocab:showVocab,vquiz:showVQuiz,grammar:showGrammar,reading:showReading,translate:showTranslation,original:showExercises,practice:showExercises,mistakes:showExercises})[page](a)}
function home(a){let marks=Object.values(state.graded),done=marks.length,acc=marks.filter(Boolean).length;a.innerHTML=`<h2>Chào mừng đến HSK 3 – Bài 12 📚</h2><p class="muted">Nội dung dựa trên trang 86–94 của giáo trình đính kèm. Quiz từ vựng và bài tập mở rộng có ghi rõ là nội dung biên soạn thêm.</p><div class="grid"><div class="stat">Từ vựng<strong>27</strong></div><div class="stat">Bài khóa<strong>4</strong></div><div class="stat">Đã làm<strong>${done}/40</strong><span class="small">Đúng ${acc}/${done||0}</span></div></div><div class="card"><h2>🧠 Tổng quan · Công thức trọng tâm</h2><p class="muted">Bốn thẻ ngữ pháp hiển thị ngay dưới đây, bấm để học ví dụ và luyện tập.</p>${grammar.map((g,i)=>`<div class="cover"><h3>${i+1}. ${E(g.name)}</h3><div class="formula">${E(g.formula)}</div><p>${E(g.meaning)}</p><div class="hanzi">${E(g.example)}</div><p>${E(g.vi)}</p><button class="btn alt" onclick="ri=${i};setPage('grammar')">Học sâu chủ điểm này →</button></div>`).join('')}</div><div class="card"><h3>Lộ trình đề xuất</h3>① Học 27 từ → ② Quiz từ vựng → ③ Học 4 công thức → ④ Đọc và dịch 4 bài khóa → ⑤ Làm 10 câu sách → ⑥ Làm 30 câu mở rộng → ⑦ Ôn câu sai.<div class="toolbar"><button class="btn" onclick="setPage('vocab')">Bắt đầu học</button><button class="btn alt" onclick="setPage('original')">Làm bài gốc</button></div></div><div class="alert">Lưu ý: Tài liệu là trang scan; phần dịch tiếng Việt là bản tham khảo biên soạn. Chưa tích hợp audio gốc của sách.</div>`}
function showVocab(a){a.innerHTML=`<h2>🀄 27 từ vựng Bài 12</h2><p class="muted">Chữ Hán · Pinyin · nghĩa Việt · giọng đọc tiếng Trung của trình duyệt.</p><div class="toolbar"><input id="findv" placeholder="Tìm chữ Hán / Pinyin / nghĩa Việt" oninput="drawVocab(this.value)" style="padding:12px;border:1px solid #dbe1ed;border-radius:10px;max-width:350px;width:100%"><button class="btn" onclick="setPage('vquiz')">Luyện quiz →</button></div><div class="vgrid" id="vitems"></div>`;drawVocab('')}
function drawVocab(term){let g=document.getElementById('vitems');if(!g)return;g.innerHTML=vocab.filter(v=>v.join(' ').toLowerCase().includes(term.toLowerCase())).map(v=>`<div class="card"><div class="hanzi">${E(v[0])}</div><div class="py">${E(v[1])}</div><p>${E(v[2])}</p><button class="btn alt voice" onclick="speak('${E(v[0])}')">🔊 Nghe</button></div>`).join('')}
function vkey(i){return vm+'_'+i}function vopts(i){let inds=[i];for(let k=1;inds.length<4;k++){let j=(i+k*7)%vocab.length;if(!inds.includes(j))inds.push(j)}return inds.sort((a,b)=>((a*17+5)%29)-((b*17+5)%29))}
function showVQuiz(a){let n=vocab.filter((_,i)=>vkey(i) in state.vgraded).length,ok=vocab.filter((_,i)=>state.vgraded[vkey(i)]===true).length;a.innerHTML=`<h2>🧩 Quiz từ vựng · 27 từ</h2><p class="muted">3 chế độ: Hán → nghĩa, nghĩa → Hán, chữ Hán → Pinyin. 81 lượt câu hỏi.</p><div class="card"><div class="toolbar"><button class="pill ${vm==='hv'?'on':''}" onclick="setVM('hv')">Hán → Việt</button><button class="pill ${vm==='vh'?'on':''}" onclick="setVM('vh')">Việt → Hán</button><button class="pill ${vm==='hp'?'on':''}" onclick="setVM('hp')">Hán → Pinyin</button></div><b>Đã chấm ${n}/27 · Đúng ${ok}</b><div class="progress"><i style="width:${n/27*100}%"></i></div></div>${vocab.map((v,i)=>{let k=vkey(i),pick=state.vanswer[k],graded=k in state.vgraded,opts=vopts(i),show=j=>vm==='hv'?vocab[j][2]:vm==='vh'?vocab[j][0]:vocab[j][1];return `<div class="quiz"><span class="badge">Từ ${i+1}/27</span><div class="qtitle">${E(vm==='vh'?v[2]:v[0])}</div>${opts.map((j,n)=>`<button class="option ${pick===j?'sel':''} ${graded&&j===i?'good':''} ${graded&&pick===j&&j!==i?'bad':''}" onclick="chooseV(${i},${j})">${'ABCD'[n]}. ${E(show(j))}</button>`).join('')}<button class="btn" onclick="checkV(${i})">Chấm đáp án</button> <button class="btn alt" onclick="speak('${E(v[0])}')">🔊 Nghe</button>${graded?`<div class="feedback ${state.vgraded[k]?'good':'bad'}"><b>${state.vgraded[k]?'✅ Đúng':'❌ Sai'}</b><p><b>Feynman:</b> ${E(v[0])} đọc là <b>${E(v[1])}</b>, nghĩa <b>${E(v[2])}</b>.</p><div class="socrates"><b>Socrates:</b> Em thử đặt một câu ngắn có từ này trong tình huống học tập?</div></div>`:''}</div>`}).join('')}`}
function chooseV(i,j){let k=vkey(i);state.vanswer[k]=j;delete state.vgraded[k];save();keep()}function checkV(i){let k=vkey(i);if(!(k in state.vanswer)){alert('Hãy chọn đáp án.');return}state.vgraded[k]=state.vanswer[k]===i;save();keep()}
function showGrammar(a){a.innerHTML=`<h2>📒 Ngữ pháp 1–4</h2><div class="toolbar">${grammar.map((g,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">${i+1}. ${E(g.name)}</button>`).join('')}</div>${(()=>{let g=grammar[Math.min(ri,3)];return `<div class="card grammar"><h2>${E(g.name)}</h2><div class="formula">${E(g.formula)}</div><h3>Ý nghĩa</h3><p>${E(g.meaning)}</p><h3>Ví dụ trong bài</h3><div class="hanzi">${E(g.example)}</div><p>${E(g.vi)}</p><p class="textnote"><b>Feynman:</b> ${E(g.tip)}</p><div class="socrates"><b>Câu hỏi Socrates:</b> Nếu thay cụm này bằng cách nói khác, sắc thái của người nói sẽ thay đổi như thế nào?</div></div>`})()}<button class="btn" onclick="setPage('practice')">Luyện vận dụng ngữ pháp →</button>`}
function showReading(a){let r=readings[ri%4];a.innerHTML=`<h2>📖 Đọc hiểu 4 bài khóa</h2><div class="toolbar">${readings.map((x,i)=>`<button class="pill ${i===ri?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div><div class="card"><h2>${E(r.title)}</h2><p class="muted">${E(r.where)}</p>${r.lines.map(([sp,cn,vi],i)=>`<div class="readingline"><div class="hanzi"><b>${E(sp)}：</b>${E(cn)}</div><button class="btn alt voice" onclick="speak('${E(cn)}')">🔊 Đọc</button> <details><summary>Xem bản dịch</summary>${E(vi)}</details></div>`).join('')}<h3>Vấn đáp Socrates · Đọc hiểu</h3>${r.questions.map((q,i)=>`<p>${i+1}. ${E(q)}</p>`).join('')}<button class="btn" onclick="setPage('translate')">Tự dịch bài khóa →</button></div>`}
function showTranslation(a){let r=readings[ri%4];a.innerHTML=`<h2>🌏 Dịch từng câu · Trung → Việt</h2><p class="muted">Viết trước khi xem đáp án mẫu. Nội dung tự lưu trên trình duyệt.</p><div class="toolbar">${readings.map((x,i)=>`<button class="pill ${i===ri?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div><div class="card"><h3>${E(r.title)}</h3>${r.lines.map(([sp,cn,vi],i)=>{let key='r'+ri+'_'+i;return `<div class="readingline"><div class="hanzi">${E(sp)}：${E(cn)}</div><textarea placeholder="Viết bản dịch tiếng Việt của bạn..." oninput="transInput('${key}',this.value)">${E(state.translation[key]||'')}</textarea><details><summary>🔎 Xem bản dịch mẫu và tự đối chiếu</summary><div class="feedback good">${E(vi)}</div><p class="small">Socrates: Hãy tìm chủ ngữ, động từ chính, từ chỉ thời gian và thành phần chỉ kết quả.</p></details></div>`}).join('')}<button class="btn alt" onclick="downloadTrans()">Xuất bản dịch (.txt)</button></div>`}
function transInput(k,v){state.translation[k]=v;save()}function downloadTrans(){let r=readings[ri%4],txt=r.title+'\n\n'+r.lines.map(([sp,cn],i)=>sp+'：'+cn+'\n'+(state.translation['r'+ri+'_'+i]||'')).join('\n\n');let u=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='HSK3_Bai11_Dich_Bai'+(ri+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),800)}
const questions=[...book.map((e,i)=>({id:'b'+i,q:e[0],opts:e[1],ans:e[1].indexOf(e[2]===undefined?'':e[1][e[2]]),ex:e[3],source:true})),...extra.map((e,i)=>({id:'e'+i,q:e[0],opts:e[1],ans:e[2],ex:e[3],source:false}))];
// For source questions the numeric answer key is recorded in DB.book's 3rd item.
book.forEach((e,i)=>questions[i].ans=e[2]);
function showExercises(a){let list=page==='original'?questions.filter(q=>q.source):page==='practice'?questions.filter(q=>!q.source):questions.filter(q=>state.graded[q.id]===false);let n=list.filter(q=>q.id in state.graded).length,ok=list.filter(q=>state.graded[q.id]===true).length;a.innerHTML=`<h2>${page==='original'?'📝 10 câu điền từ từ sách · tr. 102':page==='practice'?'🎯 30 câu luyện vận dụng':'🔁 Ôn lại câu sai'}</h2><p class="muted">${page==='original'?'Câu gốc dựa trên mục 综合练习, mỗi câu có các lựa chọn của nhóm từ tương ứng.':'Các câu trắc nghiệm mở rộng do app biên soạn, không phải bài gốc.'}</p><div class="quizstats">Đã chấm <b>${n}/${list.length}</b> · Đúng <b>${ok}</b><div class="progress"><i style="width:${list.length?n/list.length*100:0}%"></i></div></div>${list.length?list.map((q,i)=>{let p=state.answer[q.id],g=q.id in state.graded;return `<article class="quiz"><span class="badge">Câu ${i+1} ${q.source?'· Theo sách':'· Mở rộng'}</span><h3 class="qtitle">${E(q.q)}</h3>${q.opts.map((o,j)=>`<button class="option ${p===j?'sel':''} ${g&&j===q.ans?'good':''} ${g&&p===j&&p!==q.ans?'bad':''}" onclick="pick('${q.id}',${j})">${'ABCDE'[j]}. ${E(o)}</button>`).join('')}<button class="btn" onclick="check('${q.id}')">Kiểm tra đáp án</button>${g?`<div class="feedback ${state.graded[q.id]?'good':'bad'}"><b>${state.graded[q.id]?'✅ Chính xác':'❌ Chưa đúng'}. Đáp án: ${E(q.opts[q.ans])}</b><p><b>Feynman:</b> ${E(q.ex)}</p><div class="socrates"><b>Socrates:</b> Từ nào trong ngữ cảnh giúp em chọn đáp án này và loại những từ còn lại?</div></div>`:''}</article>`}).join(''):'<div class="card empty">Chưa có câu sai. Hãy làm bài tập trước nhé!</div>'}`}
function pick(id,j){state.answer[id]=j;delete state.graded[id];save();keep()}function check(id){if(!(id in state.answer)){alert('Hãy chọn đáp án trước.');return}let q=questions.find(x=>x.id===id);state.graded[id]=state.answer[id]===q.ans;save();keep()}
function keep(){let y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,y))}render();
</script></body></html>
