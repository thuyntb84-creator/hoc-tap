const DB={"vocab": [["该", "gāi", "nên; đến lúc"], ["打算", "dǎsuàn", "dự định; kế hoạch"], ["高铁", "gāotiě", "tàu cao tốc"], ["行", "xíng", "được; ổn"], ["路口", "lùkǒu", "ngã tư; giao lộ"], ["小心", "xiǎoxīn", "cẩn thận"], ["迟到", "chídào", "đến muộn"], ["红绿灯", "hónglǜdēng", "đèn giao thông"], ["后来", "hòulái", "sau đó; về sau"], ["急", "jí", "vội; sốt ruột"], ["如果", "rúguǒ", "nếu"], ["以前", "yǐqián", "trước đây"], ["耳机", "ěrjī", "tai nghe"], ["充电宝", "chōngdiànbǎo", "sạc dự phòng"], ["常用", "chángyòng", "thường dùng"], ["越", "yuè", "càng"], ["分开", "fēnkāi", "tách ra; xa nhau"], ["检查", "jiǎnchá", "kiểm tra"], ["刷", "shuā", "quét"], ["检票", "jiǎnpiào", "kiểm vé"], ["电梯", "diàntī", "thang máy; thang cuốn"], ["放假", "fàngjià", "nghỉ lễ; nghỉ học"], ["沙发", "shāfā", "ghế sofa"], ["安静", "ānjìng", "yên tĩnh"], ["选择", "xuǎnzé", "lựa chọn"], ["必须", "bìxū", "bắt buộc; phải"]], "readings": [{"title": "课文 1 · Mua vé tàu cao tốc", "where": "Trong quán cà phê, 李文 và 白家月 nói chuyện.", "lines": [["李文", "家月，咱们该买去上海的票了。你打算怎么去上海？", "Gia Nguyệt, đến lúc chúng ta mua vé đi Thượng Hải rồi. Cậu dự định đến Thượng Hải bằng gì?"], ["白家月", "我还没坐过高铁，咱们坐高铁去，怎么样？", "Tớ vẫn chưa từng đi tàu cao tốc; chúng ta đi tàu cao tốc nhé?"], ["李文", "没问题，从北京到上海的高铁很多，非常方便。", "Không vấn đề gì, có rất nhiều chuyến tàu cao tốc từ Bắc Kinh đến Thượng Hải, rất thuận tiện."], ["白家月", "行！怎么买高铁票？", "Được! Mua vé tàu cao tốc thế nào?"], ["李文", "用手机App就能买。给我你的护照，我帮你买。", "Có thể mua bằng ứng dụng điện thoại. Đưa tớ hộ chiếu, tớ mua giúp."], ["白家月", "早就听说过高铁，终于可以坐上了。", "Tớ đã nghe nói về tàu cao tốc từ lâu, cuối cùng cũng được đi rồi."], ["李文", "高铁又快又舒服，你一定会喜欢的。", "Tàu cao tốc vừa nhanh vừa thoải mái, chắc chắn cậu sẽ thích."]], "questions": ["李文和白家月打算去哪个城市？", "白家月为什么想坐高铁？", "他们打算怎么买高铁票？"]}, {"title": "课文 2 · Trên đường đến nhà ga", "where": "刘明 lái xe đưa 李文 và 白家月 đến ga tàu cao tốc.", "lines": [["刘明", "过了前面的路口就到高铁站了。", "Qua giao lộ phía trước là đến ga tàu cao tốc."], ["白家月", "我看见了。马上就到了，这条路车很多，您小心点儿。", "Tớ nhìn thấy rồi. Sắp đến nơi; đường này nhiều xe, anh lái cẩn thận nhé."], ["刘明", "好，你们还有一个小时，应该不会迟到的。", "Được, các bạn còn một tiếng, chắc sẽ không muộn đâu."], ["白家月", "我发现这条路车多，红绿灯也多。", "Tớ thấy đường này nhiều xe và cũng nhiều đèn giao thông."], ["刘明", "是啊，这条路我走过一次，后来再也不走了。", "Ừ, tôi đã đi qua con đường này một lần, sau đó không đi nữa."], ["白家月", "那您今天为什么走了这条路？", "Vậy sao hôm nay anh lại đi đường này?"], ["刘明", "我一急就走错了。如果没走错，二十分钟以前就到了。", "Tôi cứ vội là rẽ nhầm. Nếu không đi nhầm thì đã đến từ 20 phút trước rồi."]], "questions": ["刘明为什么说“应该不会迟到”？", "白家月觉得这条路有什么问题？", "刘明为什么今天走了这条路？"]}, {"title": "课文 3 · Kiểm tra và soát vé", "where": "李文 và 白家月 xếp hàng kiểm tra an ninh và vé tại nhà ga.", "lines": [["白家月", "李文，我的手机没电了，你有充电宝吗？", "Lý Văn, điện thoại của tớ hết pin rồi, cậu có sạc dự phòng không?"], ["李文", "有，这些常用的东西我都放在包里了，我给你拿。", "Có, những đồ thường dùng này tớ đều để trong túi, tớ lấy cho cậu."], ["白家月", "前面的人越来越多。", "Người phía trước ngày càng đông."], ["李文", "对，马上就进高铁站了。咱们一起走，别分开。", "Đúng vậy, sắp vào ga rồi. Chúng ta đi cùng nhau, đừng tách ra."], ["白家月", "好，你检查一下，高铁票都拿好了吗？", "Được. Cậu kiểm tra xem đã cầm đủ vé tàu cao tốc chưa?"], ["李文", "不用拿票，刷护照就能检票进站。", "Không cần cầm vé; quét hộ chiếu là có thể kiểm vé vào ga."], ["白家月", "去哪里检票？", "Kiểm vé ở đâu?"], ["李文", "检票口在二层，我们一会儿坐电梯上去。", "Cửa kiểm vé ở tầng hai, lát nữa chúng ta đi thang cuốn/thang máy lên."]], "questions": ["白家月为什么要用充电宝？", "他们怎么检票进站？", "他们怎么去检票口？"]}, {"title": "课文 4 · Trải nghiệm tàu cao tốc", "where": "白家月 gọi điện kể với Annie về chuyến đi.", "lines": [["白家月", "这次放假，我去了北京，还去了上海。", "Kỳ nghỉ này, tớ đã đến Bắc Kinh và còn đến Thượng Hải."], ["白家月", "我是从北京南站坐高铁去的上海。", "Tớ đi tàu cao tốc từ ga Bắc Kinh Nam đến Thượng Hải."], ["白家月", "我觉得坐在高铁上跟坐在家里的沙发上一样，又安静又舒服。", "Tớ thấy ngồi trên tàu cao tốc giống như ngồi trên sofa ở nhà, vừa yên tĩnh vừa thoải mái."], ["白家月", "坐累了就站一会儿，饿了就点外卖。", "Ngồi mỏi thì đứng dậy một lát, đói thì gọi đồ ăn giao tới."], ["白家月", "对，你没听错，高铁上可以点外卖，只需要选择好车站和想吃的东西，到站时不用下车，服务员就会给你拿过来。", "Đúng vậy, cậu không nghe nhầm đâu. Trên tàu có thể gọi đồ ăn; chỉ cần chọn ga và món muốn ăn, đến ga không phải xuống tàu, nhân viên sẽ mang đến."], ["白家月", "现在喜欢坐高铁的人越来越多。", "Bây giờ người thích đi tàu cao tốc ngày càng nhiều."], ["白家月", "我爸妈来中国旅游的时候，必须带他们也坐一次高铁。", "Khi bố mẹ tớ đến Trung Quốc du lịch, tớ nhất định phải đưa họ đi tàu cao tốc một lần."]], "questions": ["白家月是怎么去上海的？", "高铁上怎么点外卖？", "白家月想带谁坐高铁？"]}], "grammar": [{"name": "该……了", "formula": "Chủ ngữ + 该 + động từ / cụm động từ + 了", "meaning": "Đã đến lúc nên làm việc gì.", "example": "咱们该买去上海的票了。", "vi": "Đã đến lúc chúng ta mua vé đi Thượng Hải rồi.", "tip": "该 nhắc việc đến thời điểm thích hợp, không phải chỉ nghĩa “nên” chung chung.", "color": "#ffe2a4"}, {"name": "如果……就……", "formula": "如果 + điều kiện, (chủ ngữ) + 就 + kết quả", "meaning": "Nếu… thì…; đưa ra giả thiết và kết quả.", "example": "如果没走错，二十分钟以前就到了。", "vi": "Nếu không đi nhầm thì đã đến từ 20 phút trước.", "tip": "Phân biệt mệnh đề điều kiện sau 如果 và kết quả sau 就.", "color": "#d9e9ff"}, {"name": "越来越……", "formula": "Chủ ngữ + 越来越 + tính từ / động từ tâm lý", "meaning": "Ngày càng…, mức độ thay đổi tăng dần theo thời gian.", "example": "前面的人越来越多。", "vi": "Người phía trước ngày càng đông.", "tip": "Không chèn 很 vào giữa 越来越 và tính từ.", "color": "#dbf6e9"}], "book": [["我没带钱，可以______信用卡吗？", ["该", "刷", "急", "后来", "以前"], 1, "刷信用卡 = quẹt thẻ tín dụng."], ["不用太早，星期五______买票就可以。", ["该", "刷", "急", "后来", "以前"], 4, "星期五以前 = trước thứ Sáu."], ["飞机马上就要起飞了，你的手机______关机了。", ["该", "刷", "急", "后来", "以前"], 0, "该……了 = đến lúc phải làm."], ["前面的路口人很多，你开慢一点儿，别______。", ["该", "刷", "急", "后来", "以前"], 2, "别急 = đừng vội."], ["她开始的时候说要来，______打电话说不来了。", ["该", "刷", "急", "后来", "以前"], 3, "后来 = sau đó."], ["你一个人开车，路上要______。", ["选择", "检查", "小心", "必须", "打算"], 2, "小心 = cẩn thận."], ["马上就要出门了，你再______一下，护照什么的都带了吧？", ["选择", "检查", "小心", "必须", "打算"], 1, "检查 = kiểm tra."], ["明天晚上六点的火车，你几点出门？— 我______四点半出门，晚一点儿也没关系。", ["选择", "检查", "小心", "必须", "打算"], 4, "打算 = dự định."], ["高铁站比机场近多了，我还是想______高铁。", ["选择", "检查", "小心", "必须", "打算"], 0, "选择 = lựa chọn."], ["我们的票是分开买的，你______坐在前面。", ["选择", "检查", "小心", "必须", "打算"], 3, "必须 = phải/bắt buộc."]], "extra": [["现在八点了，咱们______出发了。", ["路口", "该", "以前", "分开"], 1, "Đến lúc xuất phát rồi."], ["如果下雨，我们______在家休息。", ["就", "迟到", "耳机", "检票"], 0, "Nếu mưa thì ở nhà nghỉ."], ["车站里的人越来越______。", ["电话", "检查", "沙发", "多"], 3, "Ngày càng đông."], ["你______怎么去上海？", ["常用", "电梯", "打算", "必须"], 2, "Hỏi kế hoạch."], ["坐______又快又舒服。", ["刷", "高铁", "安静", "包"], 1, "Phương tiện tàu cao tốc."], ["过了前面的______就到了。", ["路口", "放假", "越来越", "就"], 0, "Giao lộ phía trước."], ["车很多，开车要______。", ["选择", "怎么样", "高铁", "小心"], 3, "Cẩn thận khi lái xe."], ["不要______，我们还有一个小时。", ["还没", "多", "急", "充电宝"], 2, "Không cần vội."], ["他今天又______了。", ["该", "迟到", "路口", "以前"], 1, "Đến muộn."], ["这条路有很多______。", ["红绿灯", "打算", "迟到", "耳机"], 0, "Đèn giao thông."], ["我______去过北京，现在住在上海。", ["小心", "电话", "检查", "以前"], 3, "Trước đây."], ["如果你需要帮忙，就给我打______。", ["红绿灯", "常用", "电话", "电梯"], 2, "Gọi điện."], ["你有______吗？我的手机没电了。", ["刷", "充电宝", "安静", "包"], 1, "Sạc dự phòng."], ["我把______放进包里听音乐。", ["耳机", "分开", "放假", "越来越"], 0, "Tai nghe."], ["这些是我______的东西。", ["检票", "选择", "怎么样", "常用"], 3, "Đồ thường dùng."], ["我们一起走，别______。", ["沙发", "还没", "分开", "多"], 2, "Đừng tách ra."], ["出门前要______护照。", ["必须", "检查", "该", "路口"], 1, "Kiểm tra hộ chiếu."], ["不用拿票，______护照就能进站。", ["刷", "包", "打算", "迟到"], 0, "Quét hộ chiếu."], ["______口在二层。", ["就", "小心", "电话", "检票"], 3, "Cửa kiểm vé."], ["我们坐______上二层。", ["高铁", "红绿灯", "电梯", "常用"], 2, "Thang máy/thang cuốn."], ["下个星期学校______。", ["急", "放假", "充电宝", "刷"], 1, "Nghỉ học."], ["家里的______很舒服。", ["沙发", "以前", "分开", "放假"], 0, "Ghế sofa."], ["车厢里又______又舒服。", ["耳机", "检票", "选择", "安静"], 3, "Yên tĩnh."], ["你可以自己______想吃的东西。", ["检查", "沙发", "选择", "还没"], 2, "Lựa chọn món."], ["上车前______带护照。", ["电梯", "必须", "该", "路口"], 1, "Bắt buộc mang hộ chiếu."], ["喜欢高铁的人______多。", ["越来越", "安静", "包", "打算"], 0, "Ngày càng."], ["你坐累了______站一会儿。", ["越来越", "小心", "电话", "就"], 3, "Hễ mỏi thì đứng l const save=()=>{try{localStorage.setItem('HSK3_L6_fixed_2026',JSON.stringify(state))}catch(e){}};
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs=[['home','🏠 Tổng quan'],['vocab','🀄 26 từ vựng'],['vquiz','🧩 Quiz từ vựng'],['grammar','📒 3 điểm ngữ pháp'],['reading','📖 4 bài khóa'],['translate','🌏 Luyện dịch'],['original','📝 Bài tập gốc'],['practice','🎯 30 câu mở rộng'],['mistakes','🔁 Ôn câu sai']];
function setPage(p){page=p;render();window.scrollTo(0,0)}function setRi(i){ri=i;render()}function setVM(m){vm=m;render()}
function speak(t){if(!('speechSynthesis'in window)){alert('Thiết bị không hỗ trợ giọng đọc.');return}speechSynthesis.cancel();let a=new SpeechSynthesisUtterance(t);a.lang='zh-CN';a.rate=.77;speechSynthesis.speak(a)}
function render(){document.getElementById('nav').innerHTML=tabs.map(([k,t])=>`<button class="${page===k?'active':''}" onclick="setPage('${k}')">${t}</button>`).join('');let a=document.getElementById('main');({home,vocab:showVocab,vquiz:showVQuiz,grammar:showGrammar,reading:showReading,translate:showTranslation,original:showExercises,practice:showExercises,mistakes:showExercises})[page](a)}
function home(a){let marks=Object.values(state.graded),done=marks.length,acc=marks.filter(Boolean).length;a.innerHTML=`<h2>Chào mừng đến HSK 3 – Bài 6 🚄</h2><p class="muted">Nội dung dựa trên trang 47–56 của giáo trình đính kèm. Quiz từ vựng và bài tập mở rộng có ghi rõ là nội dung biên soạn thêm.</p><div class="grid"><div class="stat">Từ vựng<strong>26</strong></div><div class="stat">Bài khóa<strong>4</strong></div><div class="stat">Đã làm<strong>${done}/40</strong><span class="small">Đúng ${acc}/${done||0}</span></div></div><div class="card"><h2>🧠 Tổng quan · Công thức trọng tâm</h2><p class="muted">Ba thẻ ngữ pháp hiển thị ngay dưới đây, bấm để học ví dụ và luyện tập.</p>${grammar.map((g,i)=>`<div class="cover"><h3>${i+1}. ${E(g.name)}</h3><div class="formula">${E(g.formula)}</div><p>${E(g.meaning)}</p><div class="hanzi">${E(g.example)}</div><p>${E(g.vi)}</p><button class="btn alt" onclick="ri=${i};setPage('grammar')">Học sâu chủ điểm này →</button></div>`).join('')}</div><div class="card"><h3>Lộ trình đề xuất</h3>① Học 26 từ → ② Quiz từ vựng → ③ Học 3 công thức → ④ Đọc và dịch 4 bài khóa → ⑤ Làm 10 câu sách → ⑥ Làm 30 câu mở rộng → ⑦ Ôn câu sai.<div class="toolbar"><button class="btn" onclick="setPage('vocab')">Bắt đầu học</button><button class="btn alt" onclick="setPage('original')">Làm bài gốc</button></div></div><div class="alert">Lưu ý: Tài liệu là trang scan; phần dịch tiếng Việt là bản tham khảo biên soạn. Chưa tích hợp audio gốc của sách.</div>`}
function showVocab(a){a.innerHTML=`<h2>🀄 26 từ vựng Bài 6</h2><p class="muted">Chữ Hán · Pinyin · nghĩa Việt · giọng đọc tiếng Trung của trình duyệt.</p><div class="toolbar"><input id="findv" placeholder="Tìm chữ Hán / Pinyin / nghĩa Việt" oninput="drawVocab(this.value)" style="padding:12px;border:1px solid #dbe1ed;border-radius:10px;max-width:350px;width:100%"><button class="btn" onclick="setPage('vquiz')">Luyện quiz →</button></div><div class="vgrid" id="vitems"></div>`;drawVocab('')}
function drawVocab(term){let g=document.getElementById('vitems');if(!g)return;g.innerHTML=vocab.filter(v=>v.join(' ').toLowerCase().includes(term.toLowerCase())).map(v=>`<div class="card"><div class="hanzi">${E(v[0])}</div><div class="py">${E(v[1])}</div><p>${E(v[2])}</p><button class="btn alt voice" onclick="speak('${E(v[0])}')">🔊 Nghe</button></div>`).join('')}
function vkey(i){return vm+'_'+i}function vopts(i){let inds=[i];for(let k=1;inds.length<4;k++){let j=(i+k*7)%26;if(!inds.includes(j))inds.push(j)}return inds.sort((a,b)=>((a*17+5)%29)-((b*17+5)%29))}
function showVQuiz(a){let n=vocab.filter((_,i)=>vkey(i) in state.vgraded).length,ok=vocab.filter((_,i)=>state.vgraded[vkey(i)]===true).length;a.innerHTML=`<h2>🧩 Quiz từ vựng · 26 từ</h2><p class="muted">3 chế độ: Hán → nghĩa, nghĩa → Hán, chữ Hán → Pinyin. 78 lượt câu hỏi.</p><div class="card"><div class="toolbar"><button class="pill ${vm==='hv'?'on':''}" onclick="setVM('hv')">Hán → Việt</button><button class="pill ${vm==='vh'?'on':''}" onclick="setVM('vh')">Việt → Hán</button><button class="pill ${vm==='hp'?'on':''}" onclick="setVM('hp')">Hán → Pinyin</button></div><b>Đã chấm ${n}/26 · Đúng ${ok}</b><div class="progress"><i style="width:${n/26*100}%"></i></div></div>${vocab.map((v,i)=>{let k=vkey(i),pick=state.vanswer[k],graded=k in state.vgraded,opts=vopts(i),show=j=>vm==='hv'?vocab[j][2]:vm==='vh'?vocab[j][0]:vocab[j][1];return `<div class="quiz"><span class="badge">Từ ${i+1}/26</span><div class="qtitle">${E(vm==='vh'?v[2]:v[0])}</div>${opts.map((j,n)=>`<button class="option ${pick===j?'sel':''} ${graded&&j===i?'good':''} ${graded&&pick===j&&j!==i?'bad':''}" onclick="chooseV(${i},${j})">${'ABCD'[n]}. ${E(show(j))}</button>`).join('')}<button class="btn" onclick="checkV(${i})">Chấm đáp án</button> <button class="btn alt" onclick="speak('${E(v[0])}')">🔊 Nghe</button>${graded?`<div class="feedback ${state.vgraded[k]?'good':'bad'}"><b>${state.vgraded[k]?'✅ Đúng':'❌ Sai'}</b><p><b>Feynman:</b> ${E(v[0])} đọc là <b>${E(v[1])}</b>, nghĩa <b>${E(v[2])}</b>.</p><div class="socrates"><b>Socrates:</b> Em thử đặt một câu ngắn có từ này trong tình huống đi tàu cao tốc?</div></div>`:''}</div>`}).join('')}`}
function chooseV(i,j){let k=vkey(i);state.vanswer[k]=j;delete state.vgraded[k];save();keep()}function checkV(i){let k=vkey(i);if(!(k in state.vanswer)){alert('Hãy chọn đáp án.');return}state.vgraded[k]=state.vanswer[k]===i;save();keep()}
function showGrammar(a){a.innerHTML=`<h2>📒 Ngữ pháp 1–3</h2><div class="toolbar">${grammar.map((g,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">${i+1}. ${E(g.name)}</button>`).join('')}</div>${(()=>{let g=grammar[Math.min(ri,2)];return `<div class="card grammar"><h2>${E(g.name)}</h2><div class="formula">${E(g.formula)}</div><h3>Ý nghĩa</h3><p>${E(g.meaning)}</p><h3>Ví dụ trong bài</h3><div class="hanzi">${E(g.example)}</div><p>${E(g.vi)}</p><p class="textnote"><b>Feynman:</b> ${E(g.tip)}</p><div class="socrates"><b>Câu hỏi Socrates:</b> Nếu thay cụm này bằng cách nói khác, sắc thái của người nói sẽ thay đổi như thế nào?</div></div>`})()}<button class="btn" onclick="setPage('practice')">Luyện vận dụng ngữ pháp →</button>`}
function showReading(a){let r=readings[ri%4];a.innerHTML=`<h2>📖 Đọc hiểu 4 bài khóa</h2><div class="toolbar">${readings.map((x,i)=>`<button class="pill ${i===ri?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div><div class="card"><h2>${E(r.title)}</h2><p class="muted">${E(r.where)}</p>${r.lines.map(([sp,cn,vi],i)=>`<div class="readingline"><div class="hanzi"><b>${E(sp)}：</b>${E(cn)}</div><button class="btn alt voice" onclick="speak('${E(cn)}')">🔊 Đọc</button> <details><summary>Xem bản dịch</summary>${E(vi)}</details></div>`).join('')}<h3>Vấn đáp Socrates · Đọc hiểu</h3>${r.questions.map((q,i)=>`<p>${i+1}. ${E(q)}</p>`).join('')}<button class="btn" onclick="setPage('translate')">Tự dịch bài khóa →</button></div>`}
function showTranslation(a){let r=readings[ri%4];a.innerHTML=`<h2>🌏 Dịch từng câu · Trung → Việt</h2><p class="muted">Viết trước khi xem đáp án mẫu. Nội dung tự lưu trên trình duyệt.</p><div class="toolbar">${readings.map((x,i)=>`<button class="pill ${i===ri?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div><div class="card"><h3>${E(r.title)}</h3>${r.lines.map(([sp,cn,vi],i)=>{let key='r'+ri+'_'+i;return `<div class="readingline"><div class="hanzi">${E(sp)}：${E(cn)}</div><textarea placeholder="Viết bản dịch tiếng Việt của bạn..." oninput="transInput('${key}',this.value)">${E(state.translation[key]||'')}</textarea><details><summary>🔎 Xem bản dịch mẫu và tự đối chiếu</summary><div class="feedback good">${E(vi)}</div><p class="small">Socrates: Hãy tìm chủ ngữ, động từ chính, từ chỉ thời gian và thành phần chỉ kết quả.</p></details></div>`}).join('')}<button class="btn alt" onclick="downloadTrans()">Xuất bản dịch (.txt)</button></div>`}
function transInput(k,v){state.translation[k]=v;save()}function downloadTrans(){let r=readings[ri%4],txt=r.title+'\n\n'+r.lines.map(([sp,cn],i)=>sp+'：'+cn+'\n'+(state.translation['r'+ri+'_'+i]||'')).join('\n\n');let u=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='HSK3_Bai6_Dich_Bai'+(ri+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),800)}
const questions=[...book.map((e,i)=>({id:'b'+i,q:e[0],opts:e[1],ans:e[1].indexOf(e[2]===undefined?'':e[1][e[2]]),ex:e[3],source:true})),...extra.map((e,i)=>({id:'e'+i,q:e[0],opts:e[1],ans:e[2],ex:e[3],source:false}))];
// For source questions the numeric answer key is recorded in DB.book's 3rd item.
book.forEach((e,i)=>questions[i].ans=e[2]);
function showExercises(a){let list=page==='original'?questions.filter(q=>q.source):page==='practice'?questions.filter(q=>!q.source):questions.filter(q=>state.graded[q.id]===false);let n=list.filter(q=>q.id in state.graded).length,ok=list.filter(q=>state.graded[q.id]===true).length;a.innerHTML=`<h2>${page==='original'?'📝 10 câu điền từ từ sách · tr. 53–54':page==='practice'?'🎯 30 câu luyện vận dụng':'🔁 Ôn lại câu sai'}</h2><p class="muted">${page==='original'?'Câu gốc dựa trên mục 综合练习, mỗi câu có các lựa chọn của nhóm từ tương ứng.':'Các câu trắc nghiệm mở rộng do app biên soạn, không phải bài gốc.'}</p><div class="quizstats">Đã chấm <b>${n}/${list.length}</b> · Đúng <b>${ok}</b><div class="progress"><i style="width:${list.length?n/list.length*100:0}%"></i></div></div>${list.length?list.map((q,i)=>{let p=state.answer[q.id],g=q.id in state.graded;return `<article class="quiz"><span class="badge">Câu ${i+1} ${q.source?'· Theo sách':'· Mở rộng'}</span><h3 class="qtitle">${E(q.q)}</h3>${q.opts.map((o,j)=>`<button class="option ${p===j?'sel':''} ${g&&j===q.ans?'good':''} ${g&&p===j&&p!==q.ans?'bad':''}" onclick="pick('${q.id}',${j})">${'ABCDE'[j]}. ${E(o)}</button>`).join('')}<button class="btn" onclick="check('${q.id}')">Kiểm tra đáp án</button>${g?`<div class="feedback ${state.graded[q.id]?'good':'bad'}"><b>${state.graded[q.id]?'✅ Chính xác':'❌ Chưa đúng'}. Đáp án: ${E(q.opts[q.ans])}</b><p><b>Feynman:</b> ${E(q.ex)}</p><div class="socrates"><b>Socrates:</b> Từ nào trong ngữ cảnh giúp em chọn đáp án này và loại những từ còn lại?</div></div>`:''}</article>`}).join(''):'<div class="card empty">Chưa có câu sai. Hãy làm bài tập trước nhé!</div>'}`}
function pick(id,j){state.answer[id]=j;delete state.graded[id];save();keep()}function check(id){if(!(id in state.answer)){alert('Hãy chọn đáp án trước.');return}let q=questions.find(x=>x.id===id);state.graded[id]=state.answer[id]===q.ans;save();keep()}
function keep(){let y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,y))}render();
</script></body></html>
