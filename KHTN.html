</style></head><body><div class="layout"><aside class="side"><div><div class="logo"><small>OLYMPIC • 2026</small>KHTN LỚP 7</div><div class="sub">Chất và sự biến đổi của chất</div></div><button class="nav active" data-nav="home">⌂ &nbsp; Tổng quan</button><button class="nav" data-nav="practice">◉ &nbsp; Luyện tập</button><button class="nav" data-nav="exam">◷ &nbsp; Thi thử 90 phút</button><button class="nav" data-nav="mistakes">↺ &nbsp; Ôn lại câu sai</button><button class="nav" data-nav="results">▤ &nbsp; Kết quả học tập</button><div class="sidefooter">60 câu từ đề thi thử số 03.<br>Tiến độ được lưu trên thiết bị này.<br>Đáp án theo ảnh gốc.</div></aside><main class="main"><div class="shell"><div class="top"><div class="crumb" id="breadcrumb">TRANG CHỦ / TỔNG QUAN</div><div class="topright"><span class="timer hide" id="timer">90:00</span><button class="btn ghost" id="reset" title="Xóa tiến độ">↻ Đặt lại</button></div></div><div id="screen"></div></div></main></div><script>
const QUESTIONS=[{"id": 1, "stem": "Trong quá trình làm tương, người ta ủ xôi nếp cho lên mốc vàng (mốc tương) rồi mới đem ngâm trong nước muối. Quá trình lên mốc này là:", "options": {"A": "Sự hòa tan cơ học.", "B": "Sự đông đặc.", "C": "Sự biến đổi vật lý.", "D": "Sự biến đổi hóa học."}, "answer": "D", "topic": "Biến đổi chất", "figure": null, "explanation": "Lên mốc tạo ra các chất mới nhờ hoạt động của vi sinh vật → biến đổi hóa học."}, {"id": 2, "stem": "Bộ dụng cụ gồm phễu, giấy lọc và bình tam giác được dùng để tách hỗn hợp nào sau đây?", "options": {"A": "Dầu ăn và nước.", "B": "Rượu và nước.", "C": "Không khí và bụi mịn.", "D": "Cát và nước."}, "answer": "D", "topic": "Tách chất và hỗn hợp", "figure": null, "explanation": "Giấy lọc giữ lại cát không tan; nước chảy qua."}, {"id": 3, "stem": "Cho các phát biểu sau:\n(1) Tập hợp các nguyên tử có cùng số proton đều thuộc cùng một nguyên tố hóa học.\n(2) Kí hiệu hóa học của nguyên tố Calcium là Ca.\n(3) Nitrogen là nguyên tố chiếm tỉ lệ thể tích lớn nhất trong không khí.\n(4) Các nguyên tố trong bảng tuần hoàn được sắp xếp theo chiều tăng dần khối lượng nguyên tử.\n(5) Trong nguyên tử, các electron được sắp xếp thành từng lớp.\nSố phát biểu đúng là", "options": {"A": "1.", "B": "2.", "C": "3.", "D": "4."}, "answer": "D", "topic": "Nguyên tử & nguyên tố", "figure": null, "explanation": "Đúng (1), (2), (3), (5); sai (4) vì bảng tuần hoàn sắp theo số hiệu nguyên tử."}, {"id": 4, "stem": "Một phân tử oxide có công thức X₂O₃ nặng hơn phân tử hydrogen 51 lần. Nguyên tử khối của X bằng:", "options": {"A": "56 amu.", "B": "14 amu.", "C": "27 amu.", "D": "31 amu."}, "answer": "C", "topic": "Nguyên tử & nguyên tố", "figure": null, "explanation": "M(X₂O₃)=51×2=102; 2X+3×16=102 ⇒ X=27 amu."}, {"id": 5, "stem": "Vào buổi sáng sớm mùa đông, ta thường thấy những giọt nước đọng trên lá cây. Hiện tượng này là kết quả của quá trình:", "options": {"A": "Ngưng tụ.", "B": "Bay hơi.", "C": "Đông đặc.", "D": "Nóng chảy."}, "answer": "A", "topic": "Biến đổi chất", "figure": null, "explanation": "Hơi nước trong không khí gặp lạnh chuyển thành giọt nước: ngưng tụ."}, {"id": 6, "stem": "Cho bảng thông tin sau:\n[BẢNG 6]\nCác thông tin (1), (2), (3) còn thiếu trong bảng trên lần lượt là", "options": {"A": "magnesium, 3, 2.", "B": "sodium, 3, 1.", "C": "aluminum, 3, 3.", "D": "calcium, 4, 2."}, "answer": "A", "topic": "Nguyên tử & nguyên tố", "figure": null, "explanation": "12 proton → magnesium (Mg), phân bố electron 2–8–2 → 3 lớp, lớp ngoài có 2."}, {"id": 7, "stem": "Để làm sạch một mẫu vàng có lẫn các vụn sắt nhỏ, ta có thể sử dụng phương pháp vật lý đơn giản nào?", "options": {"A": "Hòa tan cả hỗn hợp vào nước rồi lọc.", "B": "Dùng nam châm để hút vụn sắt.", "C": "Đun nóng chảy hỗn hợp.", "D": "Dùng phễu chiết."}, "answer": "B", "topic": "Tách chất và hỗn hợp", "figure": null, "explanation": "Sắt bị nam châm hút còn vàng không bị hút."}, {"id": 8, "stem": "Giả sử trong thí nghiệm của Rutherford, cứ khoảng 10.000 hạt alpha phóng ra thì có 9.990 hạt đi xuyên thẳng qua lá vàng mà không bị lệch hướng. Kết quả này cho phép rút ra kết luận quan trọng nào sau đây?", "options": {"A": "Hạt nhân nằm ở tâm nguyên tử và chiếm hầu hết khối lượng nguyên tử.", "B": "Electron chuyển động xung quanh hạt nhân với tốc độ rất lớn.", "C": "Phần không gian trống bên trong nguyên tử chiếm diện tích cực kỳ lớn so với kích thước hạt nhân.", "D": "Lớp vỏ nguyên tử được cấu tạo bởi các hạt neutron không mang điện."}, "answer": "C", "topic": "Nguyên tử & nguyên tố", "figure": null, "explanation": "Hầu hết hạt alpha xuyên qua → phần lớn thể tích nguyên tử là khoảng trống."}, {"id": 9, "stem": "Nguyên tử trung hòa về điện là vì", "options": {"A": "Số hạt proton bằng số hạt electron.", "B": "Số hạt proton bằng số hạt neutron.", "C": "Trong nguyên tử không có hạt mang điện.", "D": "Số hạt electron bằng số hạt neutron."}, "answer": "A", "topic": "Nguyên tử & nguyên tố", "figure": null, "explanation": "Nguyên tử trung hòa khi số proton dương bằng số electron âm."}, {"id": 10, "stem": "Hỗn hợp gồm xăng và nước lỏng. Để tách riêng hai chất này một cách nhanh chóng, thiết bị nào sau đây là phù hợp nhất?", "options": {"A": "Phễu chiết.", "B": "Đèn cồn và bát sứ.", "C": "Bình chưng cất.", "D": "Giấy lọc và phễu thủy tinh."}, "answer": "A", "topic": "Tách chất và hỗn hợp", "figure": null, "explanation": "Xăng và nước không hòa tan vào nhau, dùng phễu chiết."}, {"id": 11, "stem": "Quy trình rèn thép gồm: (1) Nung nóng đỏ thỏi thép; (2) Dùng búa đập thép để tạo hình. Ở giai đoạn (1), thép có sự biến đổi như thế nào?", "options": {"A": "Cả biến đổi vật lý và hóa học.", "B": "Biến đổi vật lý vì chỉ thay đổi nhiệt độ và độ mềm dẻo.", "C": "Biến đổi hóa học vì thép chuyển màu đỏ.", "D": "Sự sôi."}, "answer": "B", "topic": "Biến đổi chất", "figure": null, "explanation": "Nung nóng làm thép thay đổi nhiệt độ, độ mềm dẻo, chưa tạo chất mới."}, {"id": 12, "stem": "Phát biểu nào sau đây về cấu tạo nguyên tử là SAI?", "options": {"A": "Khối lượng nguyên tử tập trung chủ yếu ở hạt nhân.", "B": "Vỏ nguyên tử chứa các electron mang điện tích âm.", "C": "Hạt nhân nguyên tử luôn mang điện tích dương.", "D": "Kích thước của hạt nhân lớn gần bằng kích thước nguyên tử."}, "answer": "D", "topic": "Nguyên tử & nguyên tố", "figure": null, "explanation": "Hạt nhân rất nhỏ so với kích thước toàn nguyên tử."}, {"id": 13, "stem": "Vật liệu nhựa (plastic) có đặc điểm chung nào dưới đây?", "options": {"A": "Dẫn điện tốt, chịu nhiệt cao.", "B": "Dễ bị rỉ sét khi để ngoài không khí.", "C": "Cách điện, nhẹ, bền với môi trường acid/kiềm loãng.", "D": "Cứng, giòn, dễ vỡ như thủy tinh."}, "answer": "C", "topic": "Ứng dụng & môi trường", "figure": null, "explanation": "Nhựa thường nhẹ, cách điện và chịu được nhiều dung dịch acid/kiềm loãng."}, {"id": 14, "stem": "Thí nghiệm đốt cháy photpho trong bình chứa không khí cho thấy lượng chất lỏng dâng lên chiếm khoảng 1/5 thể tích bình.\n[HÌNH 14]\nĐiều này chứng tỏ", "options": {"A": "Khí carbon dioxide chiếm phần lớn không khí.", "B": "Hơi nước ngưng tụ làm giảm thể tích khí.", "C": "Khí oxygen chiếm khoảng 21% (gần 1/5) thể tích không khí.", "D": "Khí nitrogen chiếm 1/5 thể tích không khí."}, "answer": "C", "topic": "Ứng dụng & môi trường", "figure": 14, "explanation": "Phần không khí hỗ trợ sự cháy là oxygen, chiếm xấp xỉ 21%."}, {"id": 15, "stem": "Nguyên tử của nguyên tố A có 7 electron ở lớp ngoài cùng. Nguyên tử của nguyên tố B có tổng số hạt mang điện ít hơn của A là 12 hạt. Cấu tạo của B có đặc điểm nào?", "options": {"A": "B mang điện tích âm.", "B": "B là một khí hiếm.", "C": "B có 11 proton.", "D": "B có 3 lớp electron."}, "answer": "C", "topic": "Nguyên tử & nguyên tố", "figure": null, "explanation": "A có 7 electron ngoài cùng (nhóm VIIA), B có 12 hạt mang điện → 6 proton, là carbon."}, {"id": 16, "stem": "Khí nào sau đây có nồng độ tăng cao trong không khí do hoạt động giao thông và công nghiệp, gây ra hiệu ứng nhà kính?", "options": {"A": "Carbon dioxide.", "B": "Oxygen.", "C": "Argon.", "D": "Nitrogen."}, "answer": "A", "topic": "Ứng dụng & môi trường", "figure": null, "explanation": "CO₂ tăng do đốt nhiên liệu và là khí góp phần gây hiệu ứng nhà kính."}, {"id": 17, "stem": "Hợp chất AB₂ có tổng số hạt mang điện là 44. Biết số hạt mang điện trong hạt nhân của nguyên tử B nhiều hơn của nguyên tử A là 2 hạt.\nPhát biểu nào dưới đây là sai?", "options": {"A": "Điện tích hạt nhân của nguyên tử A là +6.", "B": "Số lớp electron của nguyên tử A và B đều là 2.", "C": "Số electron lớp ngoài cùng của nguyên tử B là 6.", "D": "Số hạt mang điện trong hạt nhân nguyên tử A là 8."}, "answer": "D", "topic": "Nguyên tử & nguyên tố", "figure": null, "explanation": "Tổng hạt mang điện AB₂ là 44; mỗi B nhiều proton hơn A 2 đơn vị. Đối chiếu số electron và lớp."}, {"id": 18, "stem": "Hợp chất X có công thức AlₓOᵧ và có phân tử khối là 102 amu. Giá trị của x và y lần lượt là", "options": {"A": "1 và 1.", "B": "1 và 2.", "C": "2 và 3.", "D": "3 và 2."}, "answer": "C", "topic": "Nguyên tử & nguyên tố", "figure": null, "explanation": "Al₂O₃ có khối lượng 102 amu: 2×27 + 3×16."}, {"id": 19, "stem": "Để bảo vệ môi trường không khí khỏi ô nhiễm bụi và khí độc, biện pháp nào hiệu quả nhất?", "options": {"A": "Xây dựng các ống khói nhà máy thật thấp.", "B": "Chuyển các nhà máy vào sâu trong rừng.", "C": "Trồng nhiều cây xanh và lắp đặt hệ thống lọc khí thải.", "D": "Sử dụng nhiều bếp than tổ ong thay cho bếp gas."}, "answer": "C", "topic": "Ứng dụng & môi trường", "figure": null, "explanation": "Trồng cây và xử lí khí thải giúp giảm ô nhiễm."}, {"id": 20, "stem": "Khối lượng nguyên tử trung bình của Neon là 20,18 amu. Neon có hai đồng vị bền là (20 amu) và (22 amu). Phần trăm số nguyên tử của đồng vị 20 amu là:", "options": {"A": "82%.", "B": "50%.", "C": "91%.", "D": "9%."}, "answer": "C", "topic": "Nguyên tử & nguyên tố", "figure": null, "explanation": "20x+22(1−x)=20,18 ⇒ x=0,91 = 91%."}, {"id": 21, "stem": "Nguyên tố Y đóng vai trò quan trọng trong việc xây dựng các tế bào xương và chức năng của cơ bắp. Nguyên tử của nguyên tố Y có tổng số hạt (p, e, n) là 36. Lớp vỏ nguyên tử của Y có ba lớp electron và lớp ngoài cùng có 2 electron. Nhận định nào sau đây là đúng?", "options": {"A": "Tổng số hạt trong hạt nhân của nguyên tử Y là 24.", "B": "Nguyên tử Y có số hạt mang điện nhiều hơn số hạt không mang điện là 10.", "C": "Tên của nguyên tố Y là Sodium.", "D": "Khối lượng nguyên tử của Y là 36 amu."}, "answer": "A", "topic": "Nguyên tử & nguyên tố", "figure": null, "explanation": "Nguyên tử có 3 lớp, 2 electron ngoài cùng là Mg (Z=12); hạt mang điện 24, neutron 12 → hạt nhân 24."}, {"id": 22, "stem": "Năng lượng giải phóng khi đốt cháy các loại nhiên liệu hóa thạch thực chất có nguồn gốc ban đầu từ:", "options": {"A": "Năng lượng hóa học tích trữ từ xác sinh vật cổ xưa.", "B": "Nhiệt năng của lòng đất.", "C": "Năng lượng nguyên tử.", "D": "Điện năng từ các sấm sét."}, "answer": "A", "topic": "Ứng dụng & môi trường", "figure": null, "explanation": "Năng lượng trong nhiên liệu hóa thạch có nguồn gốc xa từ quang hợp lưu trữ năng lượng Mặt Trời."}, {"id": 23, "stem": "Hợp chất M₂X₃ thường được dùng trong ngành luyện kim. Tổng số proton trong phân tử M₂X₃ là 76. Trong nguyên tử M, số hạt mang điện nhiều hơn số hạt không mang điện là 12. Số proton của nguyên tử M nhiều hơn nguyên tử X là 18 hạt. Nhận định nào sau đây là sai?", "options": {"A": "X là nguyên tố phi kim, thường có hóa trị II trong hợp chất.", "B": "Nguyên tử M có 26 proton trong hạt nhân.", "C": "Hợp chất M₂X₃ có tính từ (bị nam châm hút).", "D": "Lớp vỏ nguyên tử X có 2 lớp electron."}, "answer": "C", "topic": "Nguyên tử & nguyên tố", "figure": null, "explanation": "Thiết lập tổng proton và số hạt mang điện, tìm M=Fe và X=O rồi kiểm tra từng nhận định."}, {"id": 24, "stem": "Quá trình quang hợp ở cây xanh cần cung cấp các nguyên liệu đầu vào chủ yếu nào từ môi trường?", "options": {"A": "Chất hữu cơ và ánh sáng.", "B": "Khí carbon dioxide và khí nitrogen.", "C": "Nước và khí carbon dioxide.", "D": "Nước và khí oxygen."}, "answer": "C", "topic": "Ứng dụng & môi trường", "figure": null, "explanation": "Quang hợp lấy nước từ đất và CO₂ từ không khí."}, {"id": 25, "stem": "Cho thông tin về số lượng các loại hạt của một số nguyên tử như sau:\nA (11, 12, 11).\nB (12, 12, 12).\nC (11, 13, 11).\nD (12, 14, 12).\nE (11, 11, 11).\n(Các số trong ngoặc lần lượt là số proton, neutron, electron). Số nguyên tố hóa học được tạo nên từ các nguyên tử trên là", "options": {"A": "2 nguyên tố.", "B": "3 nguyên tố.", "C": "4 nguyên tố.", "D": "5 nguyên tố."}, "answer": "A", "topic": "Nguyên tử & nguyên tố", "figure": null, "explanation": "Nguyên tố hóa học được phân biệt bằng số proton; các số proton là 11 và 12."}, {"id": 26, "stem": "Khi sử dụng bếp củi, nếu muốn lửa cháy to hơn, người ta thường dùng ống thổi để thổi thêm không khí vào hoặc chẻ nhỏ củi. Việc làm này dựa trên nguyên lý nào?", "options": {"A": "Làm cho củi biến đổi hóa học nhanh hơn.", "B": "Cung cấp thêm oxygen và tăng diện tích tiếp xúc.", "C": "Tăng độ ẩm cho nhiên liệu.", "D": "Giảm nhiệt độ của củi."}, "answer": "B", "topic": "Biến đổi chất", "figure": null, "explanation": "Thêm oxygen và tăng diện tích tiếp xúc làm tăng tốc độ cháy."}, {"id": 27, "stem": "Hình dưới đây mô phỏng vị trí của một số nguyên tố hóa học trong bảng tuần hoàn:\n[HÌNH 27]\nPhát biểu nào dưới đây sai?", "options": {"A": "Nguyên tố Nitrogen (N) thuộc chu kì 2, nhóm VA.", "B": "Nguyên tố He (Helium) là một phi kim.", "C": "Nguyên tử của nguyên tố Potassium (K) có 4 lớp electron.", "D": "Nguyên tố Nitrogen (N) và Helium (He) đều cùng thuộc một chu kì."}, "answer": "D", "topic": "Nguyên tử & nguyên tố", "figure": 27, "explanation": "Nitrogen thuộc chu kì 2 còn helium thuộc chu kì 1."}, {"id": 28, "stem": "Tổng số hạt proton, neutron, electron trong 2 nguyên tử X và Y là 96, trong đó số hạt mang điện nhiều hơn số hạt không mang điện là 32. Số hạt mang điện của X ít hơn số hạt mang điện của Y là 16 hạt. Phát biểu nào sau đây là sai?", "options": {"A": "X và Y thuộc cùng một nhóm A trong bảng tuần hoàn.", "B": "Số electron ở lớp ngoài cùng của X và Y bằng nhau.", "C": "X và Y đều là các nguyên tố phi kim.", "D": "Nguyên tử Y có 4 lớp electron, nguyên tử X có 3 lớp electron."}, "answer": "C", "topic": "Nguyên tử & nguyên tố", "figure": null, "explanation": "Dùng 2(pX+pY)+nX+nY=96 và 2(pX+pY)−(nX+nY)=32 để xác định tổng proton."}, {"id": 29, "stem": "Ngộ độc khí CO (carbon monoxide) thường xảy ra khi người dân đốt than sưởi ấm trong phòng kín. Nguyên nhân chính là do", "options": {"A": "khí CO đẩy hết khí Nitrogen ra ngoài phòng.", "B": "khí CO làm phòng quá nóng gây ngất.", "C": "khí CO quá thơm khiến người ta hít nhiều.", "D": "khí CO ngăn cản hồng cầu vận chuyển oxygen đến các tế bào."}, "answer": "D", "topic": "Ứng dụng & môi trường", "figure": null, "explanation": "CO gắn bền với hemoglobin, làm giảm khả năng vận chuyển oxygen của máu."}, {"id": 30, "stem": "Khi phân tích các tính chất vật lí của hợp chất Y, người ta ghi nhận kết quả ở bảng sau:\n[BẢNG 30]\nKết luận nào sau đây là đúng nhất về liên kết hóa học trong hợp chất Y?", "options": {"A": "Y là hợp chất cộng hóa trị không cực.", "B": "Y là hợp chất cộng hóa trị có cực.", "C": "Y là hợp chất ion.", "D": "Y là đơn chất kim loại."}, "answer": "C", "topic": "Liên kết & công thức", "figure": null, "explanation": "Hợp chất ion thường dẫn điện khi nóng chảy hoặc khi hòa tan trong nước."}, {"id": 31, "stem": "Thủy tinh là loại vật liệu được ứng dụng rất nhiều trong đời sống. Tính chất nào sau đây KHÔNG phải của thủy tinh thông thường?", "options": {"A": "Cứng, giòn, dễ vỡ.", "B": "Không bị gỉ, ít bị ăn mòn bởi các acid thông thường.", "C": "Dẫn điện và dẫn nhiệt rất tốt.", "D": "Trong suốt, cho ánh sáng truyền qua."}, "answer": "C", "topic": "Ứng dụng & môi trường", "figure": null, "explanation": "Thủy tinh không dẫn điện và dẫn nhiệt tốt như kim loại."}, {"id": 32, "stem": "Trong sản xuất dầu thực vật, người ta nghiền nhỏ hạt (đậu nành, lạc) rồi ngâm trong dung môi thích hợp để lấy dầu, sau đó loại bỏ bã. Phương pháp tách chất này dựa trên:", "options": {"A": "Phương pháp cô cạn.", "B": "Phương pháp lọc.", "C": "Phương pháp chưng cất.", "D": "Phương pháp chiết lỏng - rắn (hòa tan có chọn lọc)."}, "answer": "D", "topic": "Tách chất và hỗn hợp", "figure": null, "explanation": "Dung môi hòa tan chọn lọc dầu từ hạt, sau đó tách bã: chiết lỏng–rắn."}, {"id": 33, "stem": "Tinh bột có trong lương thực khi vào cơ thể sẽ bị chuyển hóa thành loại đường đơn giản nào để cung cấp năng lượng?", "options": {"A": "Saccharose.", "B": "Fructose.", "C": "Cellulose.", "D": "Glucose."}, "answer": "D", "topic": "Ứng dụng & môi trường", "figure": null, "explanation": "Tinh bột được tiêu hóa thành glucose để cung cấp năng lượng."}, {"id": 34, "stem": "Nước biển sau khi dẫn vào ruộng muối, dưới sức nóng của ánh nắng mặt trời, nước bay hơi để lại các tinh thể muối. Phương pháp này gọi là:", "options": {"A": "Chưng cất phân đoạn.", "B": "Chiết.", "C": "Lọc áp suất cao.", "D": "Kết tinh qua cô cạn (bay hơi dung môi)."}, "answer": "D", "topic": "Tách chất và hỗn hợp", "figure": null, "explanation": "Nước bay hơi để lại muối kết tinh trong ruộng muối."}, {"id": 35, "stem": "Đá vôi được coi là 'nguyên liệu' khi nó được sử dụng trong quy trình sản xuất nào sau đây?", "options": {"A": "Khai thác làm bàn ghế đá.", "B": "Sản xuất xi măng và nung vôi.", "C": "Lát đường đi bộ trong công viên.", "D": "Tạc tượng trang trí sân vườn."}, "answer": "B", "topic": "Ứng dụng & môi trường", "figure": null, "explanation": "Đá vôi là nguyên liệu để sản xuất xi măng và nung vôi."}, {"id": 36, "stem": "Việc làm nào sau đây góp phần thực hiện mục tiêu phát triển bền vững và bảo vệ môi trường?", "options": {"A": "Tăng cường sử dụng túi nilon dùng một lần.", "B": "Sử dụng các sản phẩm có thể tái chế hoặc tự phân hủy sinh học.", "C": "Đốt chất thải nông nghiệp sau mỗi mùa vụ.", "D": "Khai thác triệt để các nguồn tài nguyên khoáng sản."}, "answer": "B", "topic": "Ứng dụng & môi trường", "figure": null, "explanation": "Sản phẩm tái chế và dễ phân hủy giúp giảm rác thải."}, {"id": 37, "stem": "Nguyên tố phi kim nào sau đây tồn tại ở trạng thái lỏng ở điều kiện thường?", "options": {"A": "Chlorine (Cl).", "B": "Sulfur (S).", "C": "Bromine (Br).", "D": "Iodine (I)."}, "answer": "C", "topic": "Ứng dụng & môi trường", "figure": null, "explanation": "Bromine là phi kim ở trạng thái lỏng trong điều kiện thường."}, {"id": 38, "stem": "Menthol là hợp chất hữu cơ có trong tinh dầu bạc hà, thường được dùng trong y học và thực phẩm. Phân tích thành phần của menthol cho kết quả: %C = 76,92%; %H = 12,82%; còn lại là nguyên tố oxygen. Biết phân tử khối của menthol bằng 156 amu.\nNhận định nào dưới đây sai?", "options": {"A": "Công thức phân tử của menthol là C₁₀H₂₀O.", "B": "Trong một phân tử menthol chứa 1 nguyên tử oxygen.", "C": "Tổng số nguyên tử trong một phân tử menthol là 30.", "D": "Menthol là một hợp chất hữu cơ tạp chức."}, "answer": "A", "topic": "Liên kết & công thức", "figure": null, "explanation": "Từ thành phần % và M=156 suy ra C₁₀H₂₀O; câu hỏi yêu cầu chọn phát biểu sai."}, {"id": 39, "stem": "Tại sao khi pha nước chanh, người ta thường hòa tan đường vào nước ấm trước rồi mới cho đá lạnh vào sau?", "options": {"A": "Để làm giảm độ chua của chanh.", "B": "Để nước chanh có màu đẹp hơn.", "C": "Để đường tan nhanh hơn do độ tan và tốc độ hòa tan tăng theo nhiệt độ.", "D": "Để đường không bị biến đổi hóa học."}, "answer": "C", "topic": "Biến đổi chất", "figure": null, "explanation": "Đường thường tan nhanh hơn trong nước ấm do khuếch tán nhanh hơn."}, {"id": 40, "stem": "Cho bảng dữ liệu về vỏ nguyên tử của 5 nguyên tố ký hiệu là M, N, P, R, S như sau:\n[BẢNG 40]\nDựa vào bảng trên, hai nguyên tố có tính chất hóa học kém hoạt động (bền vững) tương tự nhau là:", "options": {"A": "M và N.", "B": "N và P.", "C": "M và S.", "D": "R và S."}, "answer": "A", "topic": "Nguyên tử & nguyên tố", "figure": null, "explanation": "M có 2 electron lớp ngoài của lớp thứ nhất, N có 8 electron lớp ngoài: đều là cấu hình bền."}, {"id": 41, "stem": "Để tách các hạt bụi gỗ nhỏ lẫn trong nước, người ta thường sử dụng phương pháp nào?", "options": {"A": "Cô cạn.", "B": "Chiết.", "C": "Chưng cất.", "D": "Lọc."}, "answer": "D", "topic": "Tách chất và hỗn hợp", "figure": null, "explanation": "Lọc dùng để loại hạt rắn không tan khỏi chất lỏng."}, {"id": 42, "stem": "Mô hình cấu tạo nguyên tử của các nguyên tố X, Y, Z, T được biểu diễn như hình sau:\n[HÌNH 42]\nCho các nhận định sau:\n(a) X thuộc chu kì 2, nhóm VA.\n(b) X và Z thuộc hai nhóm khác nhau.\n(c) Z và T cùng thuộc một chu kì.\n(d) X, Y, Z đều là phi kim.\nSố nhận định đúng là", "options": {"A": "1.", "B": "2.", "C": "3.", "D": "4."}, "answer": "B", "topic": "Nguyên tử & nguyên tố", "figure": 42, "explanation": "X=nitrogen (7), Y=fluorine (9), Z=phosphorus (15), T=calcium (20); đối chiếu số lớp và nhóm."}, {"id": 43, "stem": "Hình dưới đây mô tả ô nguyên tố của Beryllium trong bảng tuần hoàn.\n[HÌNH 43]\nPhát biểu nào dưới đây sai?", "options": {"A": "Số thứ tự của nguyên tố Beryllium trong bảng tuần hoàn là 2.", "B": "Khối lượng nguyên tử Beryllium là 9,0122 gam.", "C": "Số hiệu nguyên tử của Beryllium là 4.", "D": "Kí hiệu hóa học của Beryllium là Be."}, "answer": "A", "topic": "Nguyên tử & nguyên tố", "figure": 43, "explanation": "Số hiệu nguyên tử của Be là 4; kiểm tra các phát biểu theo ô nguyên tố."}, {"id": 44, "stem": "Phosphorus là nguyên tố phi kim có vai trò quan trọng trong các tế bào sinh vật, được dùng để sản xuất phân bón và diêm. Trong bảng tuần hoàn, phosphorus ở ô số 15.\nCho các phát biểu sau về phosphorus:\n(1) Nguyên tử phosphorus có 15 proton trong hạt nhân.\n(2) Vỏ nguyên tử phosphorus có 3 lớp electron.\n(3) Phosphorus thuộc chu kì 3, nhóm VA trong bảng tuần hoàn.\n(4) Nguyên tử phosphorus có 3 electron ở lớp ngoài cùng.\nSố phát biểu đúng là", "options": {"A": "1.", "B": "2.", "C": "3.", "D": "4."}, "answer": "C", "topic": "Nguyên tử & nguyên tố", "figure": null, "explanation": "Phosphorus có 15p, 3 lớp electron, 5 electron ngoài cùng."}, {"id": 45, "stem": "Trong nuôi trồng thủy sản, vào những ngày nắng nóng hoặc đêm khuya, người ta thường dùng máy sục khí hoặc quạt nước. Mục đích chính là", "options": {"A": "tăng lượng oxygen hòa tan trong nước cho tôm, cá hô hấp.", "B": "giúp tôm cá vận động nhiều hơn để thịt chắc.", "C": "đuổi các loài chim săn mồi.", "D": "làm mát nước cho cá."}, "answer": "A", "topic": "Ứng dụng & môi trường", "figure": null, "explanation": "Máy sục khí làm tăng oxygen hòa tan để tôm cá hô hấp."}, {"id": 46, "stem": "Nhận định nào sau đây về dung dịch là ĐÚNG?", "options": {"A": "Dung dịch là hỗn hợp đồng nhất giữa dung môi và chất tan.", "B": "Mọi hỗn hợp lỏng đều là dung dịch.", "C": "Nước luôn là chất tan trong mọi dung dịch.", "D": "Càng đun nóng thì chất khí tan vào nước càng nhiều."}, "answer": "A", "topic": "Tách chất và hỗn hợp", "figure": null, "explanation": "Dung dịch là hỗn hợp đồng nhất gồm chất tan và dung môi."}, {"id": 47, "stem": "Nước muối sinh lý (nồng độ 0,9%) được dùng để rửa vết thương hoặc súc miệng là loại chất nào?", "options": {"A": "Dung dịch (hỗn hợp đồng nhất).", "B": "Chất tinh khiết.", "C": "Nhũ tương.", "D": "Huyền phù."}, "answer": "A", "topic": "Tách chất và hỗn hợp", "figure": null, "explanation": "Nước muối sinh lí là dung dịch đồng nhất."}, {"id": 48, "stem": "Cho hai nguyên tố X (chu kì 2) và Y (chu kì 3) cùng nhóm IA. Nếu điện tích hạt nhân của X là +3 thì điện tích hạt nhân của Y là", "options": {"A": "+9.", "B": "+4.", "C": "+11.", "D": "+19."}, "answer": "C", "topic": "Nguyên tử & nguyên tố", "figure": null, "explanation": "X thuộc nhóm IA chu kì 2 là Li (Z=3); Y nhóm IA chu kì 3 là Na (Z=11)."}, {"id": 49, "stem": "Dãy chất nào sau đây gồm các chất KHÔNG tan trong nước ở điều kiện thường?", "options": {"A": "Cát san hô, dầu hỏa, bột nhựa PVC.", "B": "Khí carbon dioxide, khí oxygen, đường.", "C": "Vôi sống, acid chanh, muối ăn.", "D": "Muối ăn, đường, rượu ethyl."}, "answer": "A", "topic": "Tách chất và hỗn hợp", "figure": null, "explanation": "Cát, dầu hỏa và PVC đều hầu như không tan trong nước thường."}, {"id": 50, "stem": "Hỗn hợp nào sau đây được gọi là huyền phù?", "options": {"A": "Nước xốt mayonnaise.", "B": "Nước phù sa sông Hồng.", "C": "Nước chè xanh trong suốt.", "D": "Nước lọc tinh khiết."}, "answer": "B", "topic": "Tách chất và hỗn hợp", "figure": null, "explanation": "Nước phù sa sông là huyền phù vì các hạt rắn phân tán trong nước."}, {"id": 51, "stem": "Trong phòng thực hành, hành động nào dưới đây được coi là an toàn?", "options": {"A": "Tự ý trộn các hóa chất với nhau để quan sát hiện tượng.", "B": "Đọc kỹ nhãn mác và hướng dẫn trước khi sử dụng hóa chất.", "C": "Đổ hóa chất thừa trực tiếp vào bồn rửa sau khi làm xong.", "D": "Nếm thử các hóa chất lạ xem có vị gì."}, "answer": "B", "topic": "Ứng dụng & môi trường", "figure": null, "explanation": "Luôn đọc nhãn và hướng dẫn an toàn trước khi dùng hóa chất."}, {"id": 52, "stem": "Dãy nguyên tố nào sau đây hoàn toàn là kim loại?", "options": {"A": "He, Ne, Ar, Kr.", "B": "Al, Si, P, S.", "C": "C, N, O, F.", "D": "Li, Na, K, Ca."}, "answer": "D", "topic": "Ứng dụng & môi trường", "figure": null, "explanation": "Li, Na, K, Ca đều là kim loại."}, {"id": 53, "stem": "Công thức hóa học của hợp chất tạo bởi nguyên tố X (nhóm IIIA) và nhóm (SO₄) có hóa trị II là", "options": {"A": "XSO₄.", "B": "X₂(SO₄)₃.", "C": "X₂SO₄.", "D": "X₃(SO₄)₂."}, "answer": "B", "topic": "Liên kết & công thức", "figure": null, "explanation": "X hóa trị III, SO₄ hóa trị II → X₂(SO₄)₃."}, {"id": 54, "stem": "Quá trình nào sau đây là quá trình biến đổi hóa học?", "options": {"A": "Bẻ đôi một viên phấn viết bảng.", "B": "Đường bị cháy đen khi đun quá lửa.", "C": "Hòa tan muối ăn vào nước thu được nước muối.", "D": "Nước đá tan chảy thành nước lỏng."}, "answer": "B", "topic": "Biến đổi chất", "figure": null, "explanation": "Đường bị cháy đen hình thành chất mới là biến đổi hóa học."}, {"id": 55, "stem": "Cho các phát biểu sau:\n(1) Hạt nhân nguyên tử được cấu tạo bởi các hạt proton và electron.\n(2) Trong một nguyên tử, số proton luôn bằng số electron.\n(3) Các nguyên tố trong cùng một nhóm (A) có số lớp electron bằng nhau.\n(4) Bảng tuần hoàn các nguyên tố hóa học hiện nay có 7 chu kì.\nSố phát biểu đúng là", "options": {"A": "1.", "B": "2.", "C": "3.", "D": "4."}, "answer": "B", "topic": "Nguyên tử & nguyên tố", "figure": null, "explanation": "Đúng (2) và (4); sai (1) và (3)."}, {"id": 56, "stem": "Hợp chất Y gồm nguyên tố R hóa trị II và nhóm (NO₃), khối lượng nguyên tố nitrogen bằng 7/37 lần khối lượng phân tử này.\nNguyên tố R là", "options": {"A": "calcium.", "B": "magnesium.", "C": "copper.", "D": "barium."}, "answer": "B", "topic": "Liên kết & công thức", "figure": null, "explanation": "R(NO₃)₂: 14×2/(M_R+124)=7/37 → M_R=24 → magnesium."}, {"id": 57, "stem": "Trong quá trình nấu rượu, hỗn hợp nước và rượu được đun nóng, hơi rượu bay ra trước, dẫn qua hệ thống làm lạnh để thu được rượu lỏng. Đây là ứng dụng của phương pháp:", "options": {"A": "Chưng cất.", "B": "Chiết.", "C": "Lọc.", "D": "Hấp phụ."}, "answer": "A", "topic": "Tách chất và hỗn hợp", "figure": null, "explanation": "Đun bay hơi rồi làm lạnh ngưng tụ: chưng cất."}, {"id": 58, "stem": "Trong các chất sau: CO, NaCl, BaCl₂, Fe₂O₃, H₂S, SO₂. Có bao nhiêu chất chứa liên kết cộng hóa trị?", "options": {"A": "2.", "B": "3.", "C": "4.", "D": "5."}, "answer": "B", "topic": "Liên kết & công thức", "figure": null, "explanation": "CO, H₂S và SO₂ có liên kết cộng hóa trị."}, {"id": 59, "stem": "Thành phần phần trăm khối lượng của nguyên tố Iron (Sắt) trong hợp chất Fe₂O₃ (Hematite) là bao nhiêu?", "options": {"A": "70,0%.", "B": "77,8%.", "C": "30,0%.", "D": "72,4%."}, "answer": "A", "topic": "Liên kết & công thức", "figure": null, "explanation": "%Fe=112/(112+48)×100%=70%."}, {"id": 60, "stem": "Sơ đồ hình thành liên kết trong phân tử: Nguyên tử Mg cho 2e tạo ion Mg²⁺, nguyên tử O nhận 2e tạo ion O²⁻. Nhận định nào sau đây SAI?", "options": {"A": "Mg²⁺ và O²⁻ đều có 8 electron lớp ngoài cùng.", "B": "MgO là chất khí ở điều kiện thường.", "C": "Liên kết trong MgO là liên kết ion.", "D": "Phân tử khối của MgO là 40 amu."}, "answer": "B", "topic": "Liên kết & công thức", "figure": null, "explanation": "MgO là chất rắn ở nhiệt độ thường, không phải khí."}],FIGURES={"14": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAOYAAAEECAYAAAA8kUiGAADo3UlEQVR4nOz9WZNkSZbfif1U9S62+hL7UpmVmVXV1QXBQqKBwUwDs8mAfCCHDxThF5xPgJd5o8wDuDSARg/YBNFAdaOqcs8MjwjfzG2996oqH1SPmtp1c/dYMqtrREJdTMzclruo6tn/5xzlvfd8GB/Gh/EHNfTf9gV8GB/Gh3F9fCDMD+PD+AMcHwjzw/gw/gDHB8L8MD6MP8DxgTA/jA/jD3B8IMwP48P4AxwfCPPD+DD+AMcHwvwwPow/wPGBMD+MD+MPcHwgzA/jw/gDHB8I88P4MP4AxwfC/DA+jD/A8YEwP4wP4w9wfCDMD+PD+AMcHwjzw/gw/gDHB8L8MD6MP8DxgTA/jA/jD3B8IMwP48P4AxwfCPPD+DD+AEfxtj9o2xatNcaYnfedczjnrr3fH13XUZblzvGcc5RlidaaH7sEkVLqzut7n1EUt09p0zQ/6vHfd/6cc function nav(view){stopClock();state.view=view;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.nav===view));$('#timer').classList.add('hide');$('#breadcrumb').textContent='OLYMPIC KHTN 7 / '+({home:'Tổng quan',practice:'Luyện tập',exam:'Thi thử',mistakes:'Ôn câu sai',results:'Kết quả'}[view]||view).toUpperCase();if(view==='home')home();else if(view==='practice')setup();else if(view==='exam')start('exam');else if(view==='mistakes')start('mistakes');else results();}
function countDone(){return new Set(store.history.filter(h=>h.answered).map(h=>h.id)).size}
function home(){let done=countDone();$('#screen').innerHTML=`<div class="hero"><div class="pill">ĐỀ THI THỬ SỐ 03 • LỚP 7</div><h1>Chinh phục 60 câu hỏi<br>Khoa học tự nhiên</h1><p>Học theo chủ đề · Chấm đáp án tức thì · Thi thử 90 phút · Ôn câu sai</p><div class="actions"><button class="btn primary" onclick="start('practice')">Bắt đầu luyện tập →</button><button class="btn" onclick="start('exam')">Thi thử ngay</button></div></div><div class="stats"><div class="stat"><strong>60</strong><span>Câu trong đề</span></div><div class="stat"><strong>${done}</strong><span>Câu đã luyện</span></div><div class="stat"><strong>${store.mistakes.length}</strong><span>Câu cần ôn lại</span></div></div><div class="panel"><div class="sectioncap">Học theo chuyên đề</div><h2>Chọn nội dung muốn luyện</h2><div class="topics">${topics.map(t=>`<button class="topic" onclick="start('practice',${JSON.stringify(t).replace(/"/g,'&quot;')})"><b>${esc(t)}</b><span>${QUESTIONS.filter(q=>q.topic===t).length} câu hỏi →</span></button>`).join('')}</div></div><p class="tiny">Lưu ý: App sử dụng đáp án đi kèm ảnh gốc; một số đáp án/cách diễn đạt có thể cần giáo viên rà soát trước khi dùng để đánh giá chính thức.</p>`}
function setup(){ $('#screen').innerHTML=`<div class="panel"><div class="sectioncap">Luyện tập có hướng dẫn</div><h2>Chọn phạm vi câu hỏi</h2><p class="muted">Chọn một chuyên đề hoặc luyện toàn bộ 60 câu. Bạn có thể xem đáp án và lời giải ngay sau khi trả lời.</p><select id="topicpick">${topicNames.map(t=>`<option>${esc(t)}</option>`).join('')}</select><div class="actions"><button class="btn primary" onclick="start('practice',document.getElementById('topicpick').value)">Bắt đầu →</button><button class="btn ghost" onclick="start('practice','Tất cả',true)">Trộn 60 câu</button></div></div>`}
function start(mode='practice',topic='Tất cả',shuffle=false){stopClock();state.view=mode;state.mode=mode;state.finished=false;state.answers={};state.checked={};state.at=0;state.seconds=5400;state.topic=topic;let ids=mode==='mistakes'?store.mistakes.slice():QUESTIONS.filter(q=>topic==='Tất cả'||q.topic===topic).map(q=>q.id);if(shuffle)ids.sort(()=>Math.random()-.5);state.order=ids;if(!ids.length){$('#screen').innerHTML='<div class="panel"><h2>Chưa có câu sai để ôn!</h2><p>Hãy luyện một số câu hỏi trước nhé.</p><button class="btn primary" onclick="nav(\'practice\')">Đến phần luyện tập</button></div>';return}document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.nav===mode));$('#breadcrumb').textContent='OLYMPIC KHTN 7 / '+(mode==='exam'?'THI THỬ':mode==='mistakes'?'ÔN CÂU SAI':'LUYỆN TẬP');if(mode==='exam'){clock();$('#timer').classList.remove('hide')}else $('#timer').classList.add('hide');renderQuestion()}
function clock(){stopClock();updateClock();state.clock=setInterval(()=>{state.seconds--;updateClock();if(state.seconds<=0){stopClock();finish()}},1000)}function stopClock(){if(state.clock){clearInterval(state.clock);state.clock=null}}function updateClock(){let s=Math.max(0,state.seconds);$('#timer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function tableMarkup(id){let a=TABLES[String(id)];if(!a)return '';return `<div class="tablewrap"><table><thead><tr>${a[0].map(v=>`<th>${esc(v)}</th>`).join('')}</tr></thead><tbody>${a.slice(1).map(row=>`<tr>${row.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function contentStem(q){let safe=esc(q.stem);safe=safe.replace(/\[BẢNG (\d+)\]/g,(_,id)=>tableMarkup(id)).replace(/\[HÌNH (\d+)\]/g,(_,id)=>FIGURES[id]?`<img class="fig" alt="Hình minh họa câu ${id}" src="${FIGURES[id]}">`:'');return safe.replace(/\n/g,'<br>')}
function renderQuestion(){const q=QUESTIONS[state.order[state.at]-1];const ans=state.answers[q.id],checked=!!state.checked[q.id],pct=Math.round(Object.keys(state.answers).length/state.order.length*100);let count=state.order.length;$('#screen').innerHTML=`<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><div class="sectioncap">${esc(q.topic)}</div><h2 style="margin:0">Câu ${q.id} <span class="muted" style="font-size:13px;font-weight:500">· ${state.at+1}/${count}</span></h2></div><span class="qtag">${state.mode==='exam'?'THI THỬ':'LUYỆN TẬP'}</span></div><div class="progress"><div style="width:${pct}%"></div></div><div class="tiny">Đã trả lời ${Object.keys(state.answers).length}/${count} câu</div><div class="question">${contentStem(q)}</div>${Object.entries(q.options).map(([k,v])=>`<button class="answer ${ans===k?'selected':''} ${checked&&k===q.answer?'correct':''} ${checked&&ans===k&&ans!==q.answer?'wrong':''}" onclick="pick('${k}')" ${checked?'disabled':''}><span class="letter">${k}</span><span>${esc(v)}</span></button>`).join('')}${checked?`<div class="feedback ${ans===q.answer?'good':'bad'}"><small>${ans===q.answer?'✓ Chính xác':'✗ Chưa chính xác'}</small><b>Đáp án theo đề gốc: ${q.answer}.</b><div>${esc(q.explanation)}</div></div>`:''}<div class="actions"><button class="btn ghost" onclick="move(-1)" ${state.at===0?'disabled':''}>← Câu trước</button>${state.mode==='exam'?'':`<button class="btn" onclick="check()" ${!ans||checked?'disabled':''}>Kiểm tra đáp án</button>`}<button class="btn primary" onclick="move(1)">${state.at===count-1?'Xem kết quả':'Câu tiếp →'}</button><button class="btn ghost" onclick="finish()">Nộp bài</button></div></div><div class="panel"><div class="sectioncap">Đi đến câu hỏi</div><div class="gridnums">${state.order.map((id,index)=>`<button class="n ${index===state.at?'current':''} ${state.answers[id]?'done':''} ${state.checked[id]?(state.answers[id]===QUESTIONS[id-1].answer?'correct':'wrong'):''}" onclick="jump(${index})">${id}</button>`).join('')}</div></div>`}
function pick(k){let id=state.order[state.at];if(state.checked[id])return;state.answers[id]=k;renderQuestion()}
function check(){let id=state.order[state.at];if(!state.answers[id])return;state.checked[id]=true;logAnswer(id,state.answers[id]);renderQuestion()}
function logAnswer(id,answer){store.history.push({id,answered:true,correct:answer===QUESTIONS[id-1].answer,time:new Date().toISOString()});if(answer!==QUESTIONS[id-1].answer&&!store.mistakes.includes(id))store.mistakes.push(id);if(answer===QUESTIONS[id-1].answer)store.mistakes=store.mistakes.filter(x=>x!==id);persist()}
function jump(i){state.at=i;renderQuestion()}function move(dx){if(dx>0&&state.at===state.order.length-1){finish();return}state.at=Math.max(0,Math.min(state.order.length-1,state.at+dx));renderQuestion()}
function finish(){stopClock();$('#timer').classList.add('hide');if(state.finished)return;state.finished=true;let correct=0,wrong=[],skipped=[];for(let id of state.order){let a=state.answers[id];if(!a){skipped.push(id);continue}if(a===QUESTIONS[id-1].answer)correct++;else wrong.push(id);if(!state.checked[id])logAnswer(id,a)}const total=state.order.length;const score=(10*correct/total).toFixed(2);store.sessions=store.sessions||[];store.sessions.unshift({date:new Date().toISOString(),mode:state.mode,topic:state.topic,total,correct,score});store.sessions=store.sessions.slice(0,60);persist();$('#screen').innerHTML=`<div class="hero"><div class="pill">KẾT QUẢ BÀI LÀM</div><h1>${state.mode==='exam'?'Hoàn thành bài thi thử!':'Hoàn thành lượt luyện!'}</h1><p>Đúng ${correct}/${total} câu · Sai ${wrong.length} câu · Chưa làm ${skipped.length} câu</p></div><div class="panel"><div class="sectioncap">Điểm quy đổi thang 10</div><div class="resultscore">${score}</div><div class="progress"><div style="width:${100*correct/total}%"></div></div><p class="muted">${correct===total?'Xuất sắc! Bạn đã làm đúng tất cả.':'Hãy xem lại các câu sai để ghi nhớ kiến thức.'}</p><div class="actions"><button class="btn primary" onclick="reviewResult()">Xem chi tiết từng câu</button><button class="btn" onclick="start('mistakes')">Luyện lại câu sai</button><button class="btn ghost" onclick="nav('home')">Về trang chủ</button></div></div>`;state.lastWrong=wrong;state.lastSkipped=skipped}
function reviewResult(){let rows=state.order.map(id=>{let q=QUESTIONS[id-1],a=state.answers[id],good=a===q.answer;return `<div class="resultrow"><span><b>Câu ${id}</b> <span class="tiny">${esc(q.topic)}</span></span><span style="color:${!a?'#8a94a6':good?'#168a67':'#cf4b67'}">${a||'Bỏ trống'} / ${q.answer} ${good?'✓':a?'✗':'—'}</span></div><div class="tiny" style="padding:0 10px 12px">${esc(q.explanation)}</div>`}).join('');$('#screen').innerHTML=`<div class="panel"><h2>Đối chiếu đáp án và lời giải</h2><p class="tiny">Vế trái: đáp án bạn chọn · Vế phải: đáp án gốc</p><div class="resultlist">${rows}</div><div class="actions"><button class="btn primary" onclick="start('mistakes')">Ôn câu sai</button><button class="btn ghost" onclick="nav('home')">Trang chủ</button></div></div>`}
function results(){let sessions=store.sessions||[];$('#screen').innerHTML=`<div class="hero"><div class="pill">HỒ SƠ HỌC TẬP</div><h1>Kết quả của bạn</h1><p>Theo dõi tiến bộ sau mỗi lượt luyện hoặc thi thử</p></div><div class="stats"><div class="stat"><strong>${sessions.length}</strong><span>Lượt đã làm</span></div><div class="stat"><strong>${countDone()}</strong><span>Câu đã luyện</span></div><div class="stat"><strong>${store.mistakes.length}</strong><span>Câu đang sai</span></div></div><div class="panel"><h2>Lịch sử làm bài</h2>${sessions.length?sessions.slice(0,20).map(s=>`<div class="resultrow"><span><b>${esc(s.mode==='exam'?'Thi thử':s.mode==='mistakes'?'Ôn câu sai':'Luyện tập')}</b><div class="tiny">${new Date(s.date).toLocaleString('vi-VN')} · ${esc(s.topic)}</div></span><span><b>${s.score}/10</b><div class="tiny">${s.correct}/${s.total} đúng</div></span></div>`).join(''):'<p class="muted">Chưa có lượt luyện nào. Bắt đầu để xem tiến bộ nhé!</p>'}</div>`}
window.addEventListener('beforeunload',stopClock);document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.nav)));$('#reset').addEventListener('click',()=>{if(confirm('Bạn muốn xóa toàn bộ lịch sử luyện tập trên thiết bị này?')){localStorage.removeItem(KEY);store={history:[],mistakes:[],sessions:[]};nav('home')}});home();
</script></body></html>
