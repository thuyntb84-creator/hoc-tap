s:15px;border:2px dashed #dccde7;padding:20px;background:linear-gradient(120deg,#fff9fc,#fffef5)}.grammar h3{margin:0 0 10px}.readingline{border-bottom:1px dashed #d7dfed;padding:12px 0;line-height:1.7}.readingline .hanzi{font-size:21px}.quiz{border:1px solid var(--line);padding:18px;border-radius:14px;background:white;margin-bottom:13px}.option{display:block;width:100%;padding:12px;text-align:left;background:#fbfcff;border:1px solid #dce3ed;border-radius:11px;margin:7px 0;color:var(--ink)}.option.sel{border:2px solid #4267ef;padding:11px;background:#edf2ff}.option.good{border-color:#24a17d;background:#e8f8ee}.option.bad{border-color:var(--red);background:#fff0f2}.feedback{background:#f2f5fb;border-radius:12px;padding:14px;margin:10px 0;line-height:1.8}.feedback.good{background:#e7f8f0}.feedback.bad{background:#fff0f2}.socrates{border-left:4px solid #daa34f;background:#fffaeb;padding:12px;margin-top:9px;border-radius:9px}textarea{width:100%;min-height:100px;padding:14px;border:1px solid #ccd5e5;border-radius:11px;line-height:1.7;resize:vertical}details{margin:12px 0}summary{color:#315ac4;cursor:pointer;font-weight:bold}.progress{height:9px;border-radius:10px;background:#e4eaf5;overflow:hidden}.progress>i{display:block;background:var(--blue);height:100%}.small{font-size:13px;color:#748198}.textnote{background:#fff9e5;padding:14px;border-radius:11px}.quizstats{padding:15px;border-radius:12px;background:#edf3ff;margin:14px 0}h2{margin:0 0 13px}h3{line-height:1.5}.empty{padding:24px;text-align:center}.voice{font-size:13px}.badge{background:#ffe4ed;color:#aa4669;border-radius:7px;padding:4px 9px;display:inline-block;font-size:12px;font-weight:bold}.qtitle{font-size:19px;line-height:1.7}.cover{background:linear-gradient(130deg,#fef1ef,#f2f2ff);border:2px dashed #e8c8cf;border-radius:16px;padding:18px;margin:12px 0}.cover .formula{margin-top:10px}.tabs{display:flex;flex-wrap:wrap;gap:8px}.alert{background:#fff9e7;border-radius:12px;padding:13px} @media(max-width:800px){.wr </style></head><body><header><span class="badge">新HSK教程 3 · LESSON 16</span><h1>我听说有的熊猫出国了</h1><div>Tôi nghe nói có những con gấu trúc đã ra nước ngoài · Học hiểu → luyện tập → tự chữa lỗi</div></header><div class="wrap"><nav id="nav"></nav><main id="main"></main></div><script>const DB={"vocab":[["脏","zāng","bẩn"],["可爱","kě’ài","đáng yêu"],["一会儿","yíhuìr","một lát; lúc thì"],["脚","jiǎo","chân, bàn chân"],["照顾","zhàogù","chăm sóc"],["好像","hǎoxiàng","hình như; giống như"],["认得","rènde","nhận ra; quen biết"],["周末","zhōumò","cuối tuần"],["动物园","dòngwùyuán","vườn thú"],["动物","dòngwù","động vật"],["大熊猫","dàxióngmāo","gấu trúc lớn"],["奇怪","qíguài","kỳ lạ"],["其实","qíshí","thực ra"],["竹子","zhúzi","tre, trúc"],["国宝","guóbǎo","quốc bảo"],["全","quán","toàn bộ"],["野生","yěshēng","hoang dã"],["关于","guānyú","về; liên quan đến"],["饱","bǎo","no"],["张","zhāng","há (miệng); mở ra"],["嘴","zuǐ","miệng"],["身边","shēnbiān","bên cạnh"],["半天","bàntiān","nửa ngày; lâu"],["脸","liǎn","mặt"],["大人","dàrén","người lớn"],["喜爱","xǐ’ài","yêu thích"]],"readings":[{"title":"Bài khóa 1 – Chú mèo được nhận nuôi","where":"Trung tâm nhận nuôi thú cưng · 王一雪、刘小雪、服务员","lines":[["刘小雪","这只小猫你们养了多久了？","Chú mèo con này mọi người nuôi bao lâu rồi ạ?"],["服务员","已经一年多了。第一天看见它的时候，它又脏又小。","Đã hơn một năm rồi. Lần đầu thấy nó, nó vừa bẩn vừa bé."],["刘小雪","现在它变得又干净又漂亮了。","Bây giờ nó đã trở nên vừa sạch sẽ vừa xinh đẹp."],["服务员","是啊。它还特别可爱，一会儿在你脚边睡觉，一会儿在你身上爬。","Đúng vậy. Nó còn rất đáng yêu, lúc thì ngủ bên chân, lúc thì trèo lên người bạn."],["刘小雪","你们把它照顾得真好。","Mọi người chăm sóc nó thật tốt."],["服务员","它就好像我们的孩子，我们照顾它，它也认得我们了。","Nó như con của chúng tôi; chúng tôi chăm sóc nó và nó cũng đã nhận ra chúng tôi."],["刘小雪","妈妈，我们家也养一只小猫吧。","Mẹ ơi, nhà mình nuôi một chú mèo nhé."],["王一雪","咱们没时间照顾，还是别养了。我周末带你们去北京动物园看动物吧。","Nhà mình không có thời gian chăm sóc, tốt nhất đừng nuôi. Cuối tuần mẹ đưa các con đến vườn thú Bắc Kinh xem động vật nhé."]],"questions":["服务员第一天看见这只小猫的时候，它是什么样的？","服务员为什么觉得小猫很可爱？","服务员和小猫的关系怎么样？"]},{"title":"Bài khóa 2 – Gấu trúc và tre","where":"Vườn thú · 王一雪、刘小明","lines":[["刘小明","妈妈，大熊猫这个名字很奇怪，它们跟猫有什么关系？","Mẹ ơi, cái tên gấu trúc nghe lạ quá. Chúng có liên quan gì đến mèo ạ?"],["王一雪","这个问题问得好。它们跟猫没什么关系，其实应该叫大猫熊。","Câu hỏi hay đấy. Chúng chẳng liên quan nhiều đến mèo; thực ra nên gọi là mèo gấu lớn."],["刘小明","大熊猫为什么只吃竹子不吃肉？","Vì sao gấu trúc chỉ ăn tre mà không ăn thịt?"],["王一雪","它们跟人一样，也可以吃肉，但是对肉不感兴趣。","Chúng cũng có thể ăn thịt như con người nhưng không hứng thú với thịt."],["刘小明","大熊猫为什么是中国的国宝？","Tại sao gấu trúc là quốc bảo Trung Quốc?"],["王一雪","全世界只有中国有野生大熊猫，中国是大熊猫的家。","Trên thế giới chỉ Trung Quốc có gấu trúc hoang dã; Trung Quốc là quê hương của chúng."],["刘小明","我听说有的熊猫出国了，他们去哪儿了？","Con nghe nói có những con gấu trúc đã ra nước ngoài. Chúng đi đâu ạ?"],["王一雪","关于这个问题，我得慢慢给你讲。","Về vấn đề này, mẹ phải từ từ kể cho con."],["刘小明","弟弟，你真是“十万个为什么”。","Em trai, em đúng là “mười vạn câu hỏi vì sao”."]],"questions":["大熊猫跟猫有关系吗？","大熊猫为什么只吃竹子不吃肉？","大熊猫为什么是中国的国宝？"]},{"title":"Bài khóa 3 – Quan sát gấu trúc","where":"Khu gấu trúc · 王一雪、刘小雪","lines":[["刘小雪","这只大熊猫一会儿爬上去，一会儿跳下来，可爱极了！","Con gấu trúc này lúc thì leo lên, lúc thì nhảy xuống, đáng yêu vô cùng!"],["王一雪","它好像还没吃饱，站起来张着嘴找吃的呢。","Hình như nó chưa no, đang đứng há miệng tìm thức ăn."],["刘小雪","它身边那只熊猫半天没动，是不是在睡觉呢？","Con gấu trúc bên cạnh nó lâu rồi không động đậy, có phải đang ngủ không?"],["王一雪","我看不见它的脸，可能是吧。一般来说，熊猫每天要睡很多次觉。","Mẹ không nhìn thấy mặt nó, có lẽ thế. Nói chung, gấu trúc ngủ rất nhiều lần mỗi ngày."],["刘小雪","对，除了睡觉以外，很多时间都在吃东西。","Đúng vậy, ngoài ngủ ra, phần lớn thời gian chúng ăn."],["王一雪","大熊猫的生活真舒服啊！","Cuộc sống của gấu trúc thật thoải mái!"],["刘小雪","妈妈，您帮我和这两只大熊猫照一张照片吧。","Mẹ ơi, mẹ chụp cho con một tấm ảnh với hai con gấu trúc này nhé."]],"questions":["刘小雪为什么觉得这只大熊猫可爱极了？","王一雪为什么觉得它没吃饱？","刘小明觉得大熊猫的生活怎么样？"]},{"title":"Bài khóa 4 – Nhật ký đi vườn thú","where":"Ở nhà · Nhật ký 王一雪","lines":[["王一雪","今天我带小雪和小明去动物园玩了。","Hôm nay tôi đưa Tiểu Tuyết và Tiểu Minh đến vườn thú chơi."],["王一雪","北京动物园是中国很有名的动物园，里面有非常多的动物。","Vườn thú Bắc Kinh là vườn thú rất nổi tiếng ở Trung Quốc, bên trong có rất nhiều loài động vật."],["王一雪","当然，大人和孩子最喜爱的还是大熊猫。","Dĩ nhiên, gấu trúc vẫn là loài được người lớn và trẻ nhỏ yêu thích nhất."],["王一雪","每天有很多游客去熊猫馆，他们带着相机去给可爱的大熊猫拍照。","Mỗi ngày có rất nhiều du khách đến khu gấu trúc, mang máy ảnh chụp những con gấu trúc đáng yêu."],["王一雪","动物园早上七点半开门，晚上七点关门，冬天比夏天游客少，所以也比平时早关门一个小时。","Vườn thú mở cửa lúc 7 giờ rưỡi sáng và đóng cửa lúc 7 giờ tối; mùa đông ít khách hơn mùa hè nên đóng sớm hơn thường lệ một giờ."],["王一雪","如果第一次来北京旅游，跟家人一起去北京动物园是个不错的选择。","Nếu lần đầu du lịch Bắc Kinh, đến vườn thú cùng gia đình là một lựa chọn khá tốt."]],"questions":["今天王一雪带孩子们去哪儿了？","很多游客去动物园做什么？","北京动物园夏天和冬天的关门时间有什么不同？"]}],"grammar":[{"name":"一会儿……一会儿……","formula":"Chủ ngữ + 一会儿 + hành động/trạng thái 1，一会儿 + hành động/trạng thái 2","meaning":"Hai trạng thái hay hành động thay phiên nhau trong thời gian ngắn.","example":"它一会儿在你脚边睡觉，一会儿在你身上爬。","vi":"Nó lúc thì ngủ bên chân bạn, lúc thì trèo lên người bạn.","tip":"Hình dung chiếc đồng hồ đổi liên tục hai việc: lúc A, lúc B.","s":"Nếu chỉ có một hành động kéo dài liên tục, em có dùng 一会儿……一会儿…… không?"},{"name":"关于 – Về vấn đề…","formula":"关于 + danh từ/chủ đề，+ nhận định/hành động","meaning":"Giới thiệu chủ đề hoặc đối tượng được đề cập.","example":"关于这个问题，我得慢慢给你讲。","vi":"Về vấn đề này, mẹ phải từ từ kể cho con.","tip":"关于 giống như nhãn dán chủ đề ở đầu câu: chúng ta đang nói VỀ chuyện gì?","s":"Trong “关于这个问题”, phần nào là chủ đề được đem ra bàn luận?"},{"name":"一般来说 – Nói chung","formula":"一般来说，+ nhận xét mang tính khái quát","meaning":"Dẫn vào nhận định đúng trong phần lớn trường hợp, không tuyệt đối.","example":"一般来说，熊猫每天要睡很多次觉。","vi":"Nói chung, gấu trúc ngủ nhiều lần mỗi ngày.","tip":"一般来说 có nghĩa là “thường thì”, không phải 100% mọi trường hợp.","s":"Vì sao “一般来说” không phù hợp để khẳng định một quy luật không bao giờ có ngoại lệ?"},{"name":"A 比 B + 多/少/早/晚 + V + số lượng/thời gian","formula":"A + 比 + B + 多/少/早/晚 + động từ + cụm số lượng","meaning":"So sánh sự chênh lệch về số lượng hoặc thời gian giữa A và B.","example":"冬天比夏天早关门一个小时。","vi":"Mùa đông đóng cửa sớm hơn mùa hè một tiếng.","tip":"So hai mốc, nêu “hơn bao nhiêu”: 早关门一个小时 = đóng sớm hơn một giờ.","s":"Nếu mùa hè đóng lúc 19:00, mùa đông 早关门一个小时 thì mấy giờ đóng?"}],"book":[{"q":"小猫看到妈妈后马上____开嘴要吃的。","opts":["照顾","张","饱","奇怪","脏"],"ans":1,"ex":"Đáp án 张. Đọc cụm từ ở hai phía chỗ trống để nhận ra nghĩa phù hợp.","tag":"Sách · 综合练习"},{"q":"这个电影介绍了怎么____离开爸爸妈妈的小动物。","opts":["照顾","张","饱","奇怪","脏"],"ans":0,"ex":"Đáp án 照顾. Đọc cụm từ ở hai phía chỗ trống để nhận ra nghĩa phù hợp.","tag":"Sách · 综合练习"},{"q":"这只大熊猫没吃____，你看它还在找吃的东西呢。","opts":["照顾","张","饱","奇怪","脏"],"ans":2,"ex":"Đáp án 饱. Đọc cụm từ ở hai phía chỗ trống để nhận ra nghĩa phù hợp.","tag":"Sách · 综合练习"},{"q":"这个饭馆的桌子这么____，碗也不干净，咱们换一家吧。","opts":["照顾","张","饱","奇怪","脏"],"ans":4,"ex":"Đáp án 脏. Đọc cụm từ ở hai phía chỗ trống để nhận ra nghĩa phù hợp.","tag":"Sách · 综合练习"},{"q":"这只鸟好像飞不起来，而且吃东西的时候看起来也很____。","opts":["照顾","张","饱","奇怪","脏"],"ans":3,"ex":"Đáp án 奇怪. Đọc cụm từ ở hai phía chỗ trống để nhận ra nghĩa phù hợp.","tag":"Sách · 综合练习"},{"q":"我的手机不见了，我找了____也没找到。","opts":["认得","关于","其实","一般","半天"],"ans":4,"ex":"Đáp án 半天. Đọc cụm từ ở hai phía chỗ trống để nhận ra nghĩa phù hợp.","tag":"Sách · 综合练习"},{"q":"你想借哪本书？我忘了名字，是一本____动物的书。","opts":["认得","关于","其实","一般","半天"],"ans":1,"ex":"Đáp án 关于. Đọc cụm từ ở hai phía chỗ trống để nhận ra nghĩa phù hợp.","tag":"Sách · 综合练习"},{"q":"这只小猫在小区里好几天了，是不是找不到家了？我____它，这是我邻居家的小猫。","opts":["认得","关于","其实","一般","半天"],"ans":0,"ex":"Đáp án 认得. Đọc cụm từ ở hai phía chỗ trống để nhận ra nghĩa phù hợp.","tag":"Sách · 综合练习"},{"q":"你周末带孩子做什么？____，我带孩子去公园里玩。","opts":["认得","关于","其实","一般","半天"],"ans":3,"ex":"Đáp án 一般. Đọc cụm từ ở hai phía chỗ trống để nhận ra nghĩa phù hợp.","tag":"Sách · 综合练习"},{"q":"你怎么又去动物园了？____我也不想去，但是妈妈希望我和弟弟一起去。","opts":["认得","关于","其实","一般","半天"],"ans":2,"ex":"Đáp án 其实. Đọc cụm từ ở hai phía chỗ trống const vocab=DB.vocab, readings=DB.readings, grammar=DB.grammar;
const labels={home:'🏠 Tổng quan',vocab:'🀄 Từ vựng',vquiz:'🧩 Quiz từ vựng',grammar:'📒 Ngữ pháp',reading:'📖 Bài khóa',translate:'🌏 Luyện dịch',original:'📝 Bài tập trong sách',practice:'🎯 Luyện mở rộng',mistakes:'🔁 Ôn câu sai'};
const store='hsk3b16_complete_v1';let state;try{state=JSON.parse(localStorage.getItem(store)||'{}')}catch(e){state={}};state={answers:{},results:{},vocAnswers:{},vocResults:{},translation:{},...state};let page='home',ri=0,vm='hv';
function save(){try{localStorage.setItem(store,JSON.stringify(state))}catch(e){}}function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function speak(t){if(!('speechSynthesis' in window)){alert('Trình duyệt chưa hỗ trợ phát âm.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;speechSynthesis.speak(u)}
function setPage(p){page=p;ri=0;render();window.scrollTo(0,0)}function setRi(i){ri=i;render()}function setVM(v){vm=v;render()}
function render(){document.getElementById('nav').innerHTML=Object.entries(labels).map(([k,t])=>`<button class="${page===k?'active':''}" onclick="setPage('${k}')">${t}</button>`).join('');let a=document.getElementById('main');({home:home,vocab:showVocab,vquiz:showVQuiz,grammar:showGrammar,reading:showReading,translate:showTranslate,original:showQuiz,practice:showQuiz,mistakes:showQuiz})[page](a)}
function home(a){let done=Object.keys(state.results).length,good=Object.values(state.results).filter(Boolean).length;a.innerHTML=`<h2>HSK 3 – Bài 16</h2><p class="muted">Nguồn: giáo trình Bài 16, 10 trang, tr. 144–153; phần quiz mở rộng và lời dịch Việt là nội dung biên soạn hỗ trợ.</p><div class="grid"><div class="stat">Từ mới<strong>24</strong></div><div class="stat">Bài khóa<strong>4</strong></div><div class="stat">Đã luyện<strong>${done}/40</strong><span class="small">Đúng ${good}</span></div></div><div class="card"><h2>🧠 Tổng quan · Cấu trúc ngữ pháp</h2>${grammar.map((g,i)=>`<div class="cover"><h3>${i+1}. ${esc(g.name)}</h3><div class="formula">${esc(g.formula)}</div><p>${esc(g.meaning)}</p><div class="hanzi">${esc(g.example)}</div><p>${esc(g.vi)}</p><button class="btn alt" onclick="page='grammar';ri=${i};render()">Học chi tiết →</button></div>`).join('')}</div><div class="card"><h3>7 bước học</h3>Học từ → Quiz → Ngữ pháp → Đọc bài khóa → Luyện dịch → Bài tập → Ôn câu sai.<div class="toolbar"><button class="btn" onclick="setPage('vocab')">Bắt đầu học</button><button class="btn alt" onclick="setPage('original')">Làm bài gốc</button></div></div>`}
function showVocab(a){a.innerHTML=`<h2>🀄 26 từ mới Bài 16</h2><div class="toolbar"><input id="search" placeholder="Tìm chữ Hán, Pinyin, nghĩa Việt" oninput="drawWords(this.value)" style="padding:12px;border:1px solid #dbe1ed;border-radius:10px;max-width:330px;width:100%"><button class="btn" onclick="setPage('vquiz')">Quiz từ vựng →</button></div><div class="vgrid" id="words"></div>`;drawWords('')}
function drawWords(term){document.getElementById('words').innerHTML=vocab.filter(v=>v.join(' ').toLowerCase().includes(term.toLowerCase())).map(v=>`<div class="card"><div class="hanzi"><b>${esc(v[0])}</b></div><div class="py">${esc(v[1])}</div><p>${esc(v[2])}</p><button class="btn alt" onclick="speak('${v[0]}')">🔊 Nghe</button></div>`).join('')}
function optsV(i){let ids=[i,(i+5)%26,(i+11)%26,(i+18)%26];return ids.sort((a,b)=>((a*9+i*3)%31)-((b*9+i*3)%31))}
function showVQuiz(a){a.innerHTML=`<h2>🧩 Quiz từ vựng · 78 lượt</h2><div class="toolbar">${[['hv','Hán → Việt'],['vh','Việt → Hán'],['hp','Hán → Pinyin']].map(([v,t])=>`<button class="pill ${vm===v?'on':''}" onclick="setVM('${v}')">${t}</button>`).join('')}</div>${vocab.map((v,i)=>{let key=vm+i,sel=state.vocAnswers[key],graded=key in state.vocResults;return `<article class="quiz"><span class="badge">Từ ${i+1}/26</span><h3 class="qtitle">${esc(vm==='vh'?v[2]:v[0])}</h3>${optsV(i).map((j,n)=>`<button class="option ${sel===j?'sel':''} ${graded&&j===i?'good':''} ${graded&&sel===j&&j!==i?'bad':''}" onclick="chooseV('${key}',${j})">${'ABCD'[n]}. ${esc(vm==='hv'?vocab[j][2]:vm==='vh'?vocab[j][0]:vocab[j][1])}</button>`).join('')}<button class="btn" onclick="gradeV('${key}',${i})">Chấm đáp án</button> <button class="btn alt" onclick="speak('${v[0]}')">🔊 Nghe</button>${graded?`<div class="feedback ${state.vocResults[key]?'good':'bad'}"><b>${state.vocResults[key]?'✅ Đúng':'❌ Sai'}</b><p><b>Feynman:</b> ${esc(v[0])} – ${esc(v[1])} – ${esc(v[2])}.</p><div class="socrates">Em đặt thử một câu có từ này nhé?</div></div>`:''}</article>`}).join('')}`}
function chooseV(k,j){state.vocAnswers[k]=j;delete state.vocResults[k];save();keep()}function gradeV(k,i){if(!(k in state.vocAnswers)){alert('Hãy chọn đáp án.');return}state.vocResults[k]=state.vocAnswers[k]===i;save();keep()}
function showGrammar(a){let g=grammar[ri%4];a.innerHTML=`<h2>📒 4 chủ điểm ngữ pháp</h2><div class="toolbar">${grammar.map((x,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">${i+1}. ${esc(x.name)}</button>`).join('')}</div><div class="card grammar"><h2>${esc(g.name)}</h2><div class="formula">${esc(g.formula)}</div><h3>Ý nghĩa</h3><p>${esc(g.meaning)}</p><h3>Ví dụ</h3><div class="hanzi">${esc(g.example)}</div><p>${esc(g.vi)}</p><div class="textnote"><b>Feynman:</b> ${esc(g.tip)}</div><div class="socrates"><b>Socrates:</b> ${esc(g.s)}</div></div><button class="btn" onclick="setPage('practice')">Luyện thêm →</button>`}
function tabs(){return `<div class="toolbar">${readings.map((_,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div>`}
function showReading(a){let r=readings[ri%4];a.innerHTML=`<h2>📖 4 bài khóa</h2>${tabs()}<div class="card"><h2>${esc(r.title)}</h2><p class="muted">${esc(r.where)}</p>${r.lines.map(([sp,cn,vi])=>`<div class="readingline"><div class="hanzi"><b>${esc(sp)}：</b>${esc(cn)}</div><button class="btn alt" onclick="speak('${cn}')">🔊 Đọc</button><details><summary>Xem bản dịch tham khảo</summary>${esc(vi)}</details></div>`).join('')}<h3>Câu hỏi đọc hiểu trong sách</h3>${r.questions.map((q,i)=>`<p>${i+1}. ${esc(q)}</p>`).join('')}<button class="btn" onclick="setPage('translate')">Tự luyện dịch →</button></div>`}
function showTranslate(a){let r=readings[ri%4];a.innerHTML=`<h2>🌏 Luyện dịch Trung → Việt</h2><p class="muted">Hãy tự viết bản dịch trước khi xem đáp án mẫu. Bản dịch được lưu trên trình duyệt này.</p>${tabs()}<div class="card"><h3>${esc(r.title)}</h3>${r.lines.map(([sp,cn,vi],i)=>{let key=`${ri}_${i}`;return `<div class="readingline"><div class="hanzi">${esc(sp)}：${esc(cn)}</div><textarea oninput="setTrans('${key}',this.value)" placeholder="Tự viết bản dịch…">${esc(state.translation[key]||'')}</textarea><details><summary>🔎 Xem bản dịch mẫu</summary><div class="feedback good">${esc(vi)}</div><p class="small">Hãy đối chiếu chủ ngữ, động từ chính và sắc thái nghĩa.</p></details></div>`}).join('')}<button class="btn alt" onclick="exportTrans()">Xuất bản dịch TXT</button></div>`}
function setTrans(key,v){state.translation[key]=v;save()}
function exportTrans(){let r=readings[ri%4],s=r.title+'\n\n'+r.lines.map(([sp,cn],i)=>sp+'：'+cn+'\n'+(state.translation[`${ri}_${i}`]||'')).join('\n\n'),a=document.createElement('a'),u=URL.createObjectURL(new Blob([s],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='HSK3_Bai13_DichBai'+(ri+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const all=[...DB.book.map((q,i)=>({...q,id:'b'+i})),...DB.extra.map((q,i)=>({...q,id:'e'+i}))];
function showQuiz(a){let list=page==='original'?all.slice(0,10):page==='practice'?all.slice(10):all.filter(q=>state.results[q.id]===false);let total=list.filter(q=>q.id in state.results).length,correct=list.filter(q=>state.results[q.id]===true).length;a.innerHTML=`<h2>${page==='original'?'📝 10 câu theo sách':page==='practice'?'🎯 30 câu luyện mở rộng':'🔁 Ôn câu sai'}</h2><p class="muted">${page==='original'?'Trích từ mục 综合练习 trang 151–152 của giáo trình.':'Quiz mở rộng được biên soạn từ từ vựng và ngữ pháp bài học.'}</p><div class="quizstats">Đã làm ${total}/${list.length} · Đúng ${correct}</div>${list.length?list.map((q,i)=>{let sel=state.answers[q.id],graded=q.id in state.results;return `<article class="quiz"><span class="badge">Câu ${i+1} · ${esc(q.tag)}</span><h3 class="qtitle">${esc(q.q)}</h3>${q.opts.map((s,j)=>`<button class="option ${sel===j?'sel':''} ${graded&&j===q.ans?'good':''} ${graded&&sel===j&&j!==q.ans?'bad':''}" onclick="chooseQ('${q.id}',${j})">${'ABCDE'[j]}. ${esc(s)}</button>`).join('')}<button class="btn" onclick="gradeQ('${q.id}')">Kiểm tra đáp án</button>${graded?`<div class="feedback ${state.results[q.id]?'good':'bad'}"><b>${state.results[q.id]?'✅ Đúng':'❌ Sai'} · Đáp án: ${esc(q.opts[q.ans])}</b><p><b>Feynman:</b> ${esc(q.ex)}</p><div class="socrates"><b>Socrates:</b> Trong câu có dấu hiệu nào dẫn em đến đáp án đó?</div></div>`:''}</article>`}).join(''):'<div class="card">Bạn chưa có câu sai nào.</div>'}`}
function chooseQ(k,j){state.answers[k]=j;delete state.results[k];save();keep()}function gradeQ(k){if(!(k in state.answers)){alert('Chọn đáp án trước nhé.');return}let q=all.find(q=>q.id===k);state.results[k]=state.answers[k]===q.ans;save();keep()}
function keep(){let y=window.scrollY;render();requestAnimationFrame(()=>scrollTo(0,y))}render();
</script></body></html>
