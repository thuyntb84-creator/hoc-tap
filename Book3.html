_____.", "opts": {"A": "will be remembered only by the elderly", "B": "will soon fall into disuse", "C": "seems likely to be favored by newspapers but not by television", "D": "will replace the Fahrenheit one", "E": "will improve and become more reliable"}, "context": "", "page": 17, "answer": "D", "passage": "Fahrenheit is the system of measuring the temperature, how hot or cold something is, used by many people in Britain. The freezing point of Fahrenheit is 32 degrees. So a cold winter’s day in Britain would have a temperature of 38 F (3 centigrade), and a hot summer’s day would have a temperature of 90 F (32 centigrade). The Fahrenheit scale was invented by the German scientist Gabriel Fahrenheit in 1710. Today in Britain most people over twenty-five know the Fahrenheit scale but the centigrade system (Celsius) is being used more and more. Weather forecasts on television and in newspapers show temperature in both scales."}, {"n": 198, "q": "The passage deals with _____.", "opts": {"A": "two different systems of measuring the temperature", "B": "the advantages of the Fahrenheit scale over the Celsius scale", "C": "the scientific research carried out by Gabriel Fahrenheit", "D": "the range in temperature to be found in the British isles", "E": "the declining popularity of the Celsius scale in Britain The Falklands are a group of small islands in the South Atlantic close to Argentina, with a population of 1,200 British citizens. They have been British territory since 1892. Disputes about who owns the islands go back to the eighteenth century. Argentina has long claimed that these islands, which they call the Malvinas, belong to them. They occupied the islands in April 1982 and the Falklands War lasted until July 1982 when British forces won them back. The Falklands War had an enormous impact on Britain and is still controversial. Some people see it as a restoration of Britain’s old imperial power."}, "context": "", "page": 17, "answer": "A", "passage": "Fahrenheit is the system of measuring the temperature, how hot or cold something is, used by many people in Britain. The freezing point of Fahrenheit is 32 degrees. So a cold winter’s day in Britain would have a temperature of 38 F (3 centigrade), and a hot summer’s day would have a temperature of 90 F (32 centigrade). The Fahrenheit scale was invented by the German scientist Gabriel Fahrenheit in 1710. Today in Britain most people over twenty-five know the Fahrenheit scale but the centigrade system (Celsius) is being used more and more. Weather forecasts on television and in newspapers show temperature in both scales."}, {"n": 199, "q": "It is pointed out in the passage that both Britain and Argentina _____.", "opts": {"A": "were reluctant to start the Falklands War", "B": "regard the Falklands as their own territory", "C": "realize that these islands are of no importance to anyone", "D": "prefer to use the name ‘Malvinas’ for these islands", "E": "only laid claim to the islands after 1982"}, "context": "", "page": 17, "answer": "B", "passage": "The Falklands are a group of small islands in the South Atlantic close to Argentina, with a population of 1,200 British citizens. They have been British territory since 1892. Disputes about who owns the islands go back to the eighteenth century. Argentina has long claimed that these islands, which they call the Malvinas, belong to them. They occupied the islands in April 1982 and the Falklands War lasted until July 1982 when British forces won them back. The Falklands War had an enormous impact on Britain and is still controversial. Some people see it as a restoration of Britain’s old imperial power."}, {"n": 200, "q": "According to the passage, the Falklands War _____.", "opts": {"A": "was being fought, on and off, between 1892 and 1982", "B": "was largely ignored by the British public", "C": "showed how right Argentina was in claiming the islands", "D": "was followed by a withdrawal of most British citizens from the islands", "E": "broke out after the islands were invaded by Argentina"}, "context": "", "page": 17, "answer": "E", "passage": "The Falklands are a group of small islands in the South Atlantic close to Argentina, with a population of 1,200 British citizens. They have been British territory since 1892. Disputes about who owns the islands go back to the eighteenth century. Argentina has long claimed that these islands, which they call the Malvinas, belong to them. They occupied the islands in April 1982 and the Falklands War lasted until July 1982 when British forces won them back. The Falklands War had an enormous impact on Britain and is still controversial. Some people see it as a restoration of Britain’s old imperial power."}, {"n": 201, "q": "One may conclude from the passage that, even today, Britain’s hold over the Falkland Islands _____.", "opts": {"A": "is regarded as politically and economically unnecessary by everyone in Britain", "B": "could, in all likelihood, lead to another war between Britain and other powers", "C": "causes more problems than benefits to the British public", "D": "is felt by some people to be a continuation of the British imperial rule", "E": "has not been accepted anywhere but in Argentina"}, "context": "", "page": 17, "answer": "D", "passage": "The Falklands are a group of small islands in the South Atlantic close to Argentina, with a population of 1,200 British citizens. They have been British territory since 1892. Disputes about who owns the islands go back to the eighteenth century. Argentina has long claimed that these islands, which they call the Malvinas, belong to them. They occupied the islands in April 1982 and the Falklands War lasted until July 1982 when British forces won them back. The Falklands War had an enormous impact on Britain and is still controversial. Some people see it as a restoration of Britain’s old imperial power."}]}, {"id": 2, "name": "Paragraph Completion", "items": [{"n": 1, "q": "Every year 100 million holiday-makers go to the Mediterranean. With one third of the world's tourist trade it is the most popular of all the holiday areas: yet, it is also the most polluted. _____", "opts": {"A": "Therefore, the tourist industry here is in great danger.", "B": "Several European countries have changed their economic policies.", "C": "The housing problem has increased over the years.", "D": "However, the great civilizations of the past are no longer tourist attractions.", "E": "The average tourist prefers guest houses to hotels."}, "context": "Complete the following paragraphs.", "page": 18, "answer": "A"}, {"n": 2, "q": "Veronica Moss is a small British firm which makes wedding dresses.  It is now expanding into European markets. _____ This will only be possible if sufficient, highly skilled workers can be recruited.", "opts": {"A": "Then management has the full support of all its workers.", "B": "Many governments have raised the tax on luxury goods.", "C": "An advertising campaign has already proved successful.", "D": "The new designs are well illustrated in the catalogue.", "E": "However, to be successful,  it needs to increase its production."}, "context": "", "page": 18, "answer": "E"}, {"n": 3, "q": "When people are ill they frequently seek medical help. _____ When they feel they are not well, they either go to a quiet place and rest or look for the kind of herbs and plants they feel will do them good.", "opts": {"A": "The majority of medicines are not very expensive.", "B": "Animals, on the other hand, are their own doctors.", "C": "Unfortunately,  it is children who suffer most in this respect.", "D": "In the case of animals, medical care is even more essential.", "E": "People suffer from certain incurable diseases."}, "context": "", "page": 18, "answer": "B"}, {"n": 4, "q": "It is surprising how little known, even today, about memory is. This is largely due to the fact that we have no way of watching the memory function. _____ Hopefully, with the advances in high technology, the secrets of the mechanism of the memory will soon be revealed.", "opts": {"A": "The harder people try to remember something the less they are able to remember.", "B": "When people get older-their memory often fails them.", "C": "In the past many books were written on medicine.", "D": "Still, a great deal of research on the subject is being carried out.", "E": "One way in which animals differ from man is that they have no memory."}, "context": "", "page": 18, "answer": "D"}, {"n": 5, "q": "_____ Many came willingly, to find a better life-, some were forced to come, as slaves or to be used as cheap labor; some were driven from their homelands for political reasons and some fled from war.", "opts": {"A": "In the past many of the American tribes were at war with each other.", "B": "The history of the United States is filled with accounts of people who came here from all over the world for several reasons.", "C": "In the last century Africa was a continent that attracted few people except scientists and explorers.", "D": "Technological advances in agriculture have change the face of the earth.", "E": "Environmental pollution  still continues to be a major threat throughout the continent."}, "context": "", "page": 18, "answer": "B"}, {"n": 6, "q": "A well written essay should be unified; _____ The first requirement for unity is that the main idea should be clear. The second requirement is that there are no unrelated parts.", "opts": {"A": "the selection of an interesting subject is therefore of vital importance.", "B": "even so, essays may vary considerably in length.", "C": "that is, everything in it should be related to the main idea.", "D": "in fact most essays are carefully planned.", "E": "essay competitions have recently become quite popular."}, "context": "", "page": 18, "answer": "C"}, {"n": 7, "q": "In China, the style of decoration of these bowls developed through the years. Early examples had narrow bands of geometric designs _____ Often, those designs included stylized dragons, birds and snakes.", "opts": {"A": "while later ones had complex patterns covering the entire vessel.", "B": "because the Chinese worshipped animals.", "C": "and they developed their technique in the course of time.", "D": "although Chinese casting has never been equaled.", "E": "moreover they are fairly primitive."}, "context": "", "page": 18, "answer": "A"}, {"n": 8, "q": "_____ Until a program is prepared and stored in the computer's memory, the computer \"knows\" absolutely nothing, not even how to accept or reject data. Even the most sophisticated computer must be told what to do.", "opts": {"A": "A computer is similar to a typewriter.", "B": "A computer can repeat the same operation over and over again forever  if permitted.", "C": "Computers are widely used because they save time.", "D": "Computers solve problems by means of various mathematical and decision-making operations.", "E": "Like all machines, a computer needs to be directed and controlled if it is to perform a task successfully."}, "context": "", "page": 18, "answer": "E"}, {"n": 9, "q": "There is something more in bringing up children than feeding them well, housing them healthily and washing them regularly. The emotional development of children depends greatly on the actions of their parents. _____ The adult may need social security but for the child, family security is of even greater importance.", "opts": {"A": "Every child imitates his parents.", "B": "Children need the security of a peaceful family life.", "C": "Friendship is not an important factor in a child's life.", "D": "Family life has little effect on a child's social development.", "E": "However, a child does not learn much from his parents."}, "context": "", "page": 18, "answer": "B"}, {"n": 10, "q": "Getting through a day without being touched by the press would be difficult. We have daily morning and evening newspapers and weekly news magazines. _____ What we eat, what we buy, what we do, what we think is influenced by the press.", "opts": {"A": "The power of the press upon us is really enormous.", "B": "One should not start the day without reading a newspaper.", "C": "Newspaper sales are less than magazine sales.", "D": "The effect of the press on the public is not so important as some people like to suggest.", "E": "The number of newspaper readers is decreasing day by day."}, "context": "", "page": 18, "answer": "A"}, {"n": 11, "q": "A green leaf is a factory in which a plant manufactures its own food. _____ In this case the raw materials are water and carbon dioxide, which is obtained from the air. The sun provides the energy.", "opts": {"A": "As in all factories, raw materials and energy are essential.", "B": "This process is called photosynthesis.", "C": "That is why some leaves are broader than others.", "D": "Plants take in carbon dioxide and give off oxygen.", "E": "That's why we should keep plants in our homes."}, "context": "", "page": 18, "answer": "A"}, {"n": 12, "q": "Man has been polluting the Earth from the time he lit his first fire and washed his clothes in the river. _____ This is no longer true. The increase in population and the spread of industry has changed all this.", "opts": {"A": "Now motorways and super highways have reduced the amount of good farming land.", "B": "At first, the Earth could handle this problem because there was plenty of space, fresh air and water.", "C": "Crops have to be treated with chemicals and these are often poisonous.", "D": "In large cities, cars are responsible for about 80 per cent of the air pollution.", "E": "There are two main causes of air pollution: fumes from vehicles and chimneys."}, "context": "", "page": 18, "answer": "B"}, {"n": 13, "q": "Napoleon was a very famous general. He also did a great deal to bring law and order back to his country. _____ People remember how he was defeated in the Russian campaign and how he died on the island of St. Helena.", "opts": {"A": "The people of France regarded him as a traitor.", "B": "The importance of the French Revolution is still being discussed.", "C": "Napoleon's rise to fame was fast.", "D": "He kept this title of Emperor until his death.", "E": "But somehow it is his failures that he is known for."}, "context": "", "page": 19, "answer": "E"}, {"n": 14, "q": "Sometimes it's good to get away after a long busy week and relax. As often as I can, I spend a quiet weekend with my aunt who lives on the coast. _____ I always come back rested and ready to work again.", "opts": {"A": "Unfortunately she expects me to help her run the hotel.", "B": "There, the air is clean and it is always quiet and peaceful.", "C": "So next weekend I shan't be able to go.", "D": "The house is always crowded and noisy.", "E": "She is old and cannot live by herself."}, "context": "", "page": 19, "answer": "B"}, {"n": 15, "q": "Smoking can be an expensive habit. _____ Since smoke has a bad smell, smokers often find that their clothes need to be cleaned more frequently, and this too is expensive.", "opts": {"A": "In many countries cigarettes are not advertised.", "B": "It is also hazardous to your health.", "C": "It can give one a \"smoker's cough.\"", "D": "The price of cigarettes or tobacco is not the only expense smokers incur.", "E": "Governments should take steps to prevent smoking in public places."}, "context": "", "page": 19, "answer": "D"}, {"n": 16, "q": "When we were halfway through the valley, I looked at the others; _____ I was very worried, for we still had a long way to walk; and there wasn't more than an hour's daylight left.", "opts": {"A": "they all looked as tired as I felt.", "B": "they were all sitting in the bus.", "C": "it was still early in the morning.", "D": "some of us are still eating.", "E": "next we organized a game of cards."}, "context": "", "page": 19, "answer": "A"}, {"n": 17, "q": "In the arctic, winters are not so cold as is usually believed.  The fairly warm water of the Gulf Stream flows under the ice of the polar seas. This warm water acts like a great radiator _____", "opts": {"A": "over 120 different kinds of plants grow in the Arctic.", "B": "the ice is several meters thick.", "C": "the ice flows slowly to the sea where  it breaks off into great pieces.", "D": "sometimes Iceland has less snow than some other northern countries.", "E": "by giving off a little heat it keeps the weather from becoming too cold."}, "context": "", "page": 19, "answer": "E"}, {"n": 18, "q": "I've just finished reading his latest novel, and  I must say  I found it rather disappointing. _____ In fact I think I could write a better novel myself!", "opts": {"A": "The story was weak and the characters were not at all true to life.", "B": "It was much better than his earlier novels.", "C": "He has written ten novels and  I have read them all.", "D": "I think it has received some good reviews.", "E": "The main character is a delightful person."}, "context": "", "page": 19, "answer": "A"}, {"n": 19, "q": "Bees can fly quite long distances very easily. Moreover, they can fly as fast as ten meters a second. _____ In search of food, bees usually fly out from home for about two miles. Some have been known to return home from as far as ten miles away.", "opts": {"A": "The bees go to the place where the hive used to be.", "B": "What guides the bee when it flies home?", "C": "Thus a trip of several miles takes only a few minutes.", "D": "They find their way home because they know all the landmarks around the hive.", "E": "Several scientists have studied how bees fly home."}, "context": "", "page": 19, "answer": "C"}, {"n": 20, "q": "It was about midday when they came to a small village. They had been driving for over five hours and felt a little tired. _____ It had been converted from a nineteenth century house. They enjoyed the food and were very pleased with the service.", "opts": {"A": "The hotel they stayed in was extremely uncomfortable.", "B": "The restaurant was very disappointing.", "C": "The people were very friendly and invited them to their homes.", "D": "They decided to rest and have lunch at the restaurant by the road side there.", "E": "All the passengers on the bus were asleep."}, "context": "", "page": 19, "answer": "D"}, {"n": 21, "q": "At seven o'clock, I suddenly remembered I had promised to have dinner with the Johnsons.   I was expected there at 7:30. _____ In other words, I was very short of time. Still, I managed to get there on time.", "opts": {"A": "Luckily they only lived across the road from me.", "B": "The Johnsons are very close friends of mine.", "C": "I knew it would take me at least an hour to get there.", "D": "This only gave me half an hour to change my clothes and get there.", "E": "So I decided not to go by taxi."}, "context": "", "page": 19, "answer": "D"}, {"n": 22, "q": "_____ I got there at 9:15, just 15 minutes early. 10 minutes later I was still waiting for him. I began to get worried. Then I saw him coming towards me.", "opts": {"A": "Peter prefers to travel by bus.", "B": "We have decided to go by bus.", "C": "Buses leave from the centre of town every 15 minutes.", "D": "Peter and I had agreed to meet at the bus stop.", "E": "My father got to the bus stop first."}, "context": "", "page": 19, "answer": "D"}, {"n": 23, "q": "Stealing from shops has become quite a common problem. More and more measures are being taken to prevent it. _____ There are televisions too, to \"keep and eye on\" people. But in spite of all these precautions, stealing is on the increase.", "opts": {"A": "Most thieves are soon caught by the police.", "B": "People can no longer afford all they want.", "C": "Many people from other countries go to London for shopping.", "D": "People don't steal from a small shop.", "E": "Usually all big stores employ plainclothes detectives."}, "context": "", "page": 19, "answer": "E"}, {"n": 24, "q": "Jane and Tim were married last year. _____ Then they found a small house for themselves. They moved in two months ago and are very happy.", "opts": {"A": "Jane works in my office.", "B": "I often see them on Fridays.", "C": "For six months they lived with Tim's parents.", "D": "Tim has a good job in a bank.", "E": "We haven't seen them since they married."}, "context": "", "page": 19, "answer": "C"}, {"n": 25, "q": "We call such things as earthquakes and floods \"natural disaster.\" If these were predictable, the damage they cause could be much reduced. As it is, some remote area is often hit. _____ And relief, when it comes, often comes too late.", "opts": {"A": "It then takes days to get adequate help out.", "B": "Last year there was an earthquake in the East.", "C": "Blood was urgently needed.", "D": "People usually give very generously in such emergencies.", "E": "Many foreign countries also send aid."}, "context": "", "page": 19, "answer": "A"}, {"n": 26, "q": "Almost all the people we knew well and liked, used to go to the Moonlight Restaurant. We went there nearly every night, too. There were other similar places around, but we did not go to them. _____", "opts": {"A": "I took my wife to one of them the other night.", "B": "I know she is very fond of strawberries with ice cream.", "C": "In fact all the restaurants are very expensive.", "D": "This was largely because we did not like the people who went to them.", "E": "We always liked the food they served."}, "context": "", "page": 19, "answer": "D"}, {"n": 27, "q": "Jane held the string of the balloon tightly. she was smiling very happily, but her mother was not quite so happy _____; and then, there would be tears.", "opts": {"A": "if she thought her daughter was being silly", "B": "as it hadn't cost much", "C": "although she had wanted a blue balloon", "D": "before she was frightened of balloons", "E": "because she knew the balloon would burst before long"}, "context": "", "page": 20, "answer": "E"}, {"n": 28, "q": "I don't know how long I had been asleep, but when I woke up, the telephone was ringing. _____ I got out of bed and felt my way through the darkness to the telephone. After I had finished on the telephone, I was completely awake and didn't want to sleep any more.", "opts": {"A": "As I had a head ache, I couldn't sleep well.", "B": "I had just got home from an evening out.", "C": "It seemed to have been ringing for a long, long time.", "D": "The people upstairs had invited me to their homes.", "E": "It has never been my habit to stay up late."}, "context": "", "page": 20, "answer": "C"}, {"n": 29, "q": "Paul saw the ball not far off. He ran up to it and, turning, kicked it. But the grass was wet, and he couldn't kick it clearly. _____ Everyone in the other team was happy, but his own team was very sad.", "opts": {"A": "Obviously, this was the first match of the season.", "B": "Yet he was very pleased with himself.", "C": "In fact, the ball was very muddy.", "D": "So the ball went straight into his own goal.", "E": "Then the referee blew his whistle."}, "context": "", "page": 20, "answer": "D"}, {"n": 30, "q": "My brother Martin is interested in photography.  Wherever he goes he takes his camera with him. _____ Moreover, I read a lot about paintings and painters, and  I also go to art exhibitions.", "opts": {"A": "As for me, I am fond of painting.", "B": "He intends to study art in the university.", "C": "Recently he has bought a new camera.", "D": "Some of his photographs have won prizes.", "E": "I don't have a camera of my own."}, "context": "", "page": 20, "answer": "A"}, {"n": 31, "q": "_____ Andy said it was south. So we got out the map and looked. Andy was right, Jane was wrong. Canterbury is south of London.", "opts": {"A": "Jane said Canterbury was north of London.", "B": "Jane wants to go to Canterbury.", "C": "Jane lives in Canterbury which is south of London.", "D": "Jane has just visited Canterbury.", "E": "Jane has bought a map of Canterbury."}, "context": "", "page": 20, "answer": "A"}, {"n": 32, "q": "Istanbul is one of the most beautiful cities in the world. Besides the Bosphorus which is famous for its natural beauty, historical houses and modem bridge, the city has magnificent mosques, marvelous museums and interesting shops. _____ Most of them become so fond of it that they come again and again to see it.", "opts": {"A": "All the year round it is visited by a lot of foreign tourists.", "B": "A boat trip on the Bosphorus is really very enjoyable.", "C": "Some of the hotels are quite expensive.", "D": "The Bosphorus Bridge is a wonderful work of modem engineering.", "E": "As in any other big city, the streets are always very crowded."}, "context": "", "page": 20, "answer": "A"}, {"n": 33, "q": "Jane often visits her grandmother in Brighton. Her grandmother is an old lady now, over eighty. Even so, she lives by herself and cooks for herself. _____", "opts": {"A": "She can't manage without Jane.", "B": "Jane doesn't know how to cook, either.", "C": "She really manages very well indeed.", "D": "One day she hopes Jane will visit her.", "E": "Jane has never been to Brighton before."}, "context": "", "page": 20, "answer": "C"}, {"n": 34, "q": "I need a new secretary.  I had to get rid of the last one because she was so lazy. _____ I am not interested in whether she is good looking or not.", "opts": {"A": "I am now looking for someone who is hardworking.", "B": "She used to arrive promptly at 8:30.", "C": "I found a good one yesterday, too.", "D": "My new secretary need not be hardworking.", "E": "Would you like to work for me? 35   _____ First of all I have some good friends living there. Also I like the town itself, with its parks and pleasant environment. The climate attracts me too, for I am tired of the cold winters of Ankara."}, "context": "", "page": 20, "answer": "A"}, {"n": 36, "q": "An old woman got on the bus. It was very crowded. There was nowhere for her to sit. A man got up and gave her his seat. _____", "opts": {"A": "He didn't get off at the next stop.", "B": "She did not agree with him.", "C": "She thanked him and sat down comfortably.", "D": "She didn't think the man was polite enough.", "E": "She refused to give him her seat. 37   _____ Interestingly, it is about European history during the Napoleonic Era, but deals at the same time with the loves of 4 great Russian families. Along with these fictional characters are portrayals of great historical characters of Europe during that period. literature."}, "context": "", "page": 20, "answer": "C"}, {"n": 38, "q": "The teaching of English in Turkey has improved tremendously during the last few years. _____ In addition, the increase in the number of native speakers in universities has improved the education of our future English teachers.", "opts": {"A": "The majority of our teachers are taught by poor quality instructors in the universities.", "B": "This is probably due to the increased quality of the teachers who are graduating and becoming available to our children.", "C": "More and more of our students are able to pass the post study tests.", "D": "Teachers from other countries are coming to Turkey to replace the Turkish teachers.", "E": "Our children are more interested in working with Turkish educated teachers these days."}, "context": "", "page": 20, "answer": "B"}, {"n": 39, "q": "The health officials investigating the recent outbreak of measles said that most cases were present in school aged children. _____ This transmission later continued within the family, as sisters and brothers of infected children caught the illness because there were no visible symptoms during the incubation period.", "opts": {"A": "It is not difficult to catch measles at that age.", "B": "The incubation period is the only time that the illness is spreadable.", "C": "Children often play together in a rather rough fashion.", "D": "The high communicability of the disease caused a quick spread in the crowded classroom environment.", "E": "Parents don't believe it is necessary to isolate their children from those children that are  ill."}, "context": "", "page": 20, "answer": "D"}, {"n": 40, "q": "The famous \"Fleet Street\" of London is known as the area in which publishers, printers, booksellers and journalists may be found today. However, Fleet Street's preoccupation with this line of work stems back several hundreds of years. _____", "opts": {"A": "It can still be found to interest the world of this line of business", "B": "Among the many famous people that had frequented this street were Shakespeare, Ben Jonson, and others.", "C": "The number of areas of relaxation and pleasure that have increased in number in this area, make it an attractive area to visit.", "D": "Today people associate this street with its past history.", "E": "Printers are moving to the next street because it is too crowded."}, "context": "", "page": 21, "answer": "B"}, {"n": 41, "q": "_____ As a student she studied dancing in the University of Michigan. Then in 1982, she recorded her first successful song: 'Everybody\".", "opts": {"A": "Madonna has been interested in singing all her life, as can be seen from her early student years.", "B": "The famous pop singer Madonna, was born in Bay City, Michigan in the U.S.A.", "C": "The University of Michigan is where Madonna started her singing career.", "D": "Recording 'Everybody' started her musical career.", "E": "Madonna got married after making her first hit song."}, "context": "", "page": 21, "answer": "B"}, {"n": 42, "q": "In the old Roman calendar the month of March was considered the first month of the year. _____ This was later changed to our present calendar in which January is the first month of the year. The Scottish were the first people of the British Isles to change to this new calendar in 1599.", "opts": {"A": "January was named for the legendary Janus.", "B": "The British were not very interested in the calendar during these years.", "C": "No one knows who changed the calendar to the way it is now.", "D": "In fact, the first day of the year was the 25th of March.", "E": "The Romans preferred the spring to the winter months."}, "context": "", "page": 21, "answer": "D"}, {"n": 43, "q": "In the classic film 'Citizen Kane', Orson Welles portrays William Randolph Hearst. _____ The failures that are often not seen outside of a very private circle of friends and family of well known people, usually include shyness and loneliness as in the case of Hearst.", "opts": {"A": "His famous portrayal of this well known man revealed to the public not only his successes but also some of his failures.", "B": "All people can become as famous as Hearst  if they want to but one must always be careful.", "C": "Films give people an idea of the lives of rich people which they will never he able to see in real life. D) Private lives can be best revealed when actors as famous as Orson Wells, play these roles.", "E": "Orson Wells received an Academy Award for this role."}, "context": "", "page": 21, "answer": "A"}, {"n": 44, "q": "Mary Shelly, the wife of the well known romantic poet, wrote 'Frankenstein. _____ This was probably due to the strange subject of life from non-living matters which was a subject greatly discussed in her circle of acquaintances at those times.", "opts": {"A": "When she had it published in 1818 she did so anonymously.", "B": "Frankenstein was later made into famous movies.", "C": "The classic horror character of Frankenstein is still famous today.", "D": "She wrote this book as a fantasy.", "E": "The public liked the book and it is still enjoyed today."}, "context": "", "page": 21, "answer": "A"}, {"n": 45, "q": "The value of one's heritage is many times not understandable at a young age. _____ These young people are later able to realize that these social restrictions help maintain the values that all societies are built upon.", "opts": {"A": "Our parents often try to teach us what their parents had taught to them.", "B": "Measuring values is often difficult for people before they are in a position to understand them fully.", "C": "People prefer to use the values dictated to them by their elders.", "D": "The world today makes most of the old values useless.", "E": "Most teenagers have some feelings concerning the values their parents teach them, but most are negative due to the restrictions they encounter."}, "context": "", "page": 21, "answer": "E"}, {"n": 46, "q": "'Gone with the Wind' was one of the most expensive epic pictures made to that time. _____ After the waste of all the money and time to find the right woman for the part, the director's brother brought Vivien Leigh to his brother and said: 'I want you to meet Scarlett O'Hara.'", "opts": {"A": "The part of Scarlett O'Hara was carved by most actresses of the day.", "B": "The director had many problems with the production of this film.", "C": "One of the reasons for this expense was that so many screen test had been made to find the right Scarlett O'Hara.", "D": "The test films were as long as the picture itself because the director was having many problems.", "E": "The actors and actresses that were used for the parts in minor roles were in unusually large numbers."}, "context": "", "page": 21, "answer": "C"}, {"n": 47, "q": "The rate of crime in our area has increased dramatically. _____ The changes in the value of money, inflation, war, etc., have forced some people to revert to crime in order to live.", "opts": {"A": "People are always interested in obtaining an easy way of making a few dollars.", "B": "It is difficult for the police to deal with all these crimes by themselves.", "C": "This seems to be a common problem throughout our country and even the world.", "D": "People are not as kind as they have been in the past to those that are in need of support.", "E": "The whole country has a problem with crimes and there have been many new groups of young people enlisted into the services."}, "context": "", "page": 21, "answer": "C"}, {"n": 48, "q": "In my youth, my family and I spent our holidays at our village. _____ Although we had no financial ties left there, the relatives and friends that were all very special to us, lured us back, so that we returned every chance we had.", "opts": {"A": "These trips were full of especially joyful memories.", "B": "We had holidays from school three times a year.", "C": "Everyone waited for us to come.", "D": "We knew everyone who lived in the village.", "E": "We weren't able to swim or do any sports."}, "context": "", "page": 21, "answer": "A"}, {"n": 49, "q": "It was once said that one of the values of TV films, even old reruns, was that they gave a person a deeper understanding of life. _____ Today however, as many people do not really have the time to read, good films on TV seem to be the only alternative.", "opts": {"A": "I prefer to spend my free time reading a good book.", "B": "'IV films are many times better than discussing feelings and thoughts with neighbors.", "C": "Before these times, good books were said to do the same thing.", "D": "Life is probably one of the most difficult things to understand.", "E": "Wasting time watching TV is an alternative to thinking about reality."}, "context": "", "page": 21, "answer": "C"}, {"n": 50, "q": "Have you ever noticed how beautiful the web of a spider is? _____ This awe inspiring work of beauty is however, a deadly trap for unsuspecting insects.", "opts": {"A": "Some spiders can spin webs that are many times their own size.", "B": "There are many horror stories about people and animals who have been trapped in giant webs.", "C": "No matter how beautiful  it can be, when seen in sunlight, one must not forget it is not really of any value to people.", "D": "People have never really wanted to give any value to this natural masterpiece.", "E": "The intricate details of their web are so fine and so well crafted that even today no artist can reproduce it."}, "context": "", "page": 21, "answer": "E"}, {"n": 51, "q": "The audience at the concert hall viewed the performance with pleasure. _____ He slowly crossed to the grand piano, bowed towards the audience, gracefully sat down and began to play.", "opts": {"A": "The entrance of the long awaited pianist brought the audience to their feet.", "B": "Everyone watched with expressions of wonder on their faces.", "C": "The look of pleasure on their faces persisted during the whole performance.", "D": "The applause in the concert hall could be heard outside.", "E": "It is very important for solo performers to make an attractive entrance onto the stage."}, "context": "", "page": 21, "answer": "A"}, {"n": 52, "q": "Being a parent can be very difficult at times. _____ Older children on the other hand, don't want the assistance you offer them for anything.", "opts": {"A": "Parents sometimes resent the assistance they have to give their children.", "B": "Younger children need assistance with everything.", "C": "The more children you have the more difficult it is to find time for yourself.", "D": "No one wants to help but everyone offers advice about how to bring up your child.", "E": "Children never help around the house."}, "context": "", "page": 22, "answer": "B"}, {"n": 53, "q": "The storm had caused only minor damage on the vessel, and the crew and captain tried to reassure the passengers. _____ So it was decided to return the ship to port and cancel the excursion.", "opts": {"A": "The passengers had all tried to help keep the vessel afloat.", "B": "The water had flooded the lower levels of the small ship.", "C": "It was unfortunate that the crew did not want to help the passengers.", "D": "No one died in the accident on board the ship.", "E": "However, the passengers were on their first trip and became frightened."}, "context": "", "page": 22, "answer": "E"}, {"n": 54, "q": "The large sheepdog was one of the happiest creatures on the farm. _____ He was like one of the family who faithfully performed his duties and in return was loved and cared for by everyone.", "opts": {"A": "He hadn't been adopted by the family right after his birth.", "B": "He tended to be silly at times and to not listen.", "C": "His mother had died at his birth and the dog had been cared for by the farmer's family from then on.", "D": "The visitors had offered to buy the dog from the family.", "E": "He ate so much that the farmer and his family had a difficult time feeding him regularly."}, "context": "", "page": 22, "answer": "C"}, {"n": 55, "q": "'The Lady with the Lamp\", better known as Florence Nightingale, was a young English woman who trained to be a nurse in Germany . _____ At the end of this time she became accepted as the authority on nursing matters and became involved in establishing nursing schools which taught modem nursing.", "opts": {"A": "In her youth she had heard voices that told her of a mission.", "B": "There was a mystery about Florence.", "C": "Her fame was founded when she changed the situation of nursing soldiers during the Crimean War.", "D": "She caused many changes in the field of nursing when she decided to have nurses enter the wards of soldiers.", "E": "She spent most of her life working with politicians' various situations."}, "context": "", "page": 22, "answer": "D"}, {"n": 56, "q": "Loch Ness is well known as the lake in which a monster is said to live. _____ Many people have claimed to have seen this monster and some have even taken pictures which are not really clear enough to be good evidence for scientists.", "opts": {"A": "The lake is extremely deep and believed to be large enough to hide a huge animal in it.", "B": "The monster has disrupted many fishermen in the lake.", "C": "People around the lake have created the legend to attract tourists.", "D": "It is not possible to see' the monster easily.", "E": "At moments like this, the hobby of photography comes in handy"}, "context": "", "page": 22, "answer": "A"}, {"n": 57, "q": "Early settlers in America were not injured or hurt by the natives of this land. _____ It was only after they had lost their lands, hunting grounds, and were driven into poor lands, where staying alive was difficult, did they become the savage Indians of television.", "opts": {"A": "The Indians were living in the east of the Americas in those days.", "B": "The natives in those days were quite different from the Indians.", "C": "The cowboys of the wild west fought the Indians for may years before taking control of their lands.", "D": "The first colonists were in fact aided by the Indians who lived in this area of the word.", "E": "Staying alive was the only reason they had anything to do with the Indians."}, "context": "", "page": 22, "answer": "D"}, {"n": 58, "q": "The children had gotten dressed in their best clothes. The weather was sunny if not warm. _____ He finally got up and the children gave a cheerful yell and went running to the door.", "opts": {"A": "The rain had finally stopped.", "B": "The children had been stuck indoors all winter long.", "C": "Their new clothes had been hanging in their closet for several weeks and they had been looking forward to showing off while strolling through the town.", "D": "Their mother had told them that their father was too  ill to go anywhere and that they shouldn't try to take up his Sunday.", "E": "They had tried everything to get their father to take them out this Sunday but they had been unsuccessful up to now."}, "context": "", "page": 22, "answer": "E"}, {"n": 59, "q": "It is not easy really to understand and appreciate another culture. One needs to study the language and become fluent in it. One has to be familiar with the history, religion and the aesthetics of the society. _____", "opts": {"A": "One should not underestimate the value of what is generally referred to as 'folk' culture.", "B": "The study of language is, of course, essential to communication.", "C": "Recently, however, countries have been forced to interact.", "D": "But even after years of effort there are likely to be certain qualities that remain a mystery to us.", "E": "Everyone should be encouraged to learn a foreign language."}, "context": "", "page": 22, "answer": "E"}, {"n": 60, "q": "_____ She had been given to the United States by China. But last week she was found dead in her out-door enclosure at the Washington National Zoo. At 23 she was the oldest Panda in captivity outside of China.", "opts": {"A": "The panda, Ling-Ling, was one of the best-known and most-loved animals in the world.", "B": "A panda is a large black and white animal which lives in the bamboo forests of China.", "C": "A panda looks more like a toy than a real animal.", "D": "When the President of the United States visited China no one guessed the outcome of the negotiations.", "E": "National Zoos in the United States are really wildlife reserves."}, "context": "", "page": 22, "answer": "A"}, {"n": 61, "q": "More than 6,000 people have died in Chernobyl since the radiation disaster of 1986. _____ According to researchers childhood cancer in the Ukraine is far above the world average. Even more disturbing, however, is the obvious change in the genetics of the wildlife of the region.", "opts": {"A": "Even so the World Health Organization was asked to help the survivors.", "B": "Therefore, many people who left the region following the disaster are obviously in good health.", "C": "But, when you walk around, everything looks quite normal.", "D": "Now, one can say that it is no longer dangerous.", "E": "But that may be just the beginning: it's long term effects are only just starting to be felt."}, "context": "", "page": 22, "answer": "E"}, {"n": 62, "q": "The dominant form of mass communication today is television. Of course, people still buy thousands of copies of books and magazines each year. _____ The radio, movies and sound recordings also remain very popular. But none of these other mass media can compete with TV's high level of popularity.", "opts": {"A": "TV is the major form of entertainment and information.", "B": "Newspapers also continue to attract both general and special- interest readers.", "C": "It is important that everyone is a society should be literate.", "D": "Listening and reading are both ways of receiving information.", "E": "Certain inventions such as radio and television have been responsible for the recent decline in literacy."}, "context": "", "page": 22, "answer": "B"}, {"n": 63, "q": "Nothing spreads light better than our own sky. _____ To do this engineers have developed a system of prism panels that functions very much like our own atmosphere. They are thus able to diffuse incoming daylight uniformly. The result is a pleasant glare-free environment with all the beauty of the light indoors.", "opts": {"A": "As a result many engineers prefer to specialize in indoor lighting systems.", "B": "This new lighting system will enable the country to save energy.", "C": "Light travels through the atmosphere at a tremendous speed.", "D": "The company has already committed itself to finding economic but effective solutions.", "E": "The trick, however, is to get the same effect indoors without the use of electricity."}, "context": "", "page": 23, "answer": "E"}, {"n": 64, "q": "Some people take large amounts of vitamins and minerals over periods of years. _____ There is no evidence to support their view. In fact a recent study says that people who take vitamin supplements are not any healthier for it and do not live longer.", "opts": {"A": "Children suffer more from vitamin deficiencies than adults do.", "B": "Our bodies use vitamins in tiny amounts to build and repair tissues.", "C": "Exercise and no smoking are essential for good health.", "D": "They assume that if a little is good for them a lot must be better.", "E": "To work out your own nutritional needs, it's best to consult a doctor."}, "context": "", "page": 23, "answer": "D"}, {"n": 65, "q": "Antarctica is a potent symbol of the environmental crisis. It has been  called the  last great wilderness on  Earth. Many conservationists want this unique area to be protected forever as a world park _____ Its future is uncertain.", "opts": {"A": "but many governments want to begin mining operations there.", "B": "if waste chemicals from industry are deposited there.", "C": "and the only solution is to cut down the amount of harmful gases we discharge into the atmosphere.", "D": "but this would cause widespread environmental damage and loss of life.", "E": "even  if the planet heated and mountains of ice began to melt."}, "context": "", "page": 23, "answer": "A"}, {"n": 66, "q": "The primary purpose of notes is to aid learning. Whether the notes are taken from a lecture or a discussion, one obviously doesn't want to put all the material on record _____ The items selected in the notes should be sufficient to enable one to reconstruct the rest of the material.", "opts": {"A": "Even so, note-taking from lectures requires more skill than note- taking from books.", "B": "For many types of courses there are printed notes sold by booksellers.", "C": "Rather, one makes notes of the most important items only.", "D": "Unfortunately, some students can't see that notes are their primary source of information.", "E": "It is helpful to bear in mind that this is not the only way of taking notes."}, "context": "", "page": 23, "answer": "C"}, {"n": 67, "q": "Scientists measuring the global climate have found that the world's climate is changing. The average world temperature has increased by about half a degree Celsius since the 1850's. _____ By the middle of the next century it is likely the world will be 1.5 C warmer than today.", "opts": {"A": "If the ozone layer thins, the extra ultraviolet light may have an adverse effect on plan growth.", "B": "Flooding would also cause widespread environmental damage and loss of life.", "C": "Most nations are willing to accept the inevitable consequences of global warming.", "D": "Pollution of the land, sea and air occurs as a result of many human activities.", "E": "Scientists are predicting that this trend will continue."}, "context": "", "page": 23, "answer": "E"}, {"n": 68, "q": "In Britain during the nineteenth century, middle class women were usually expected to stay at home and look after their households. But in the early years of the twentieth century, this was beginning to change. _____ Some succeeded. For instance, Elizabeth Garrett Anderson became a qualified doctor and, in 1908, was England's first woman mayor.", "opts": {"A": "In the war years, thousands of women were needed to work in the factories.", "B": "Middle class women were struggling to enter the professions on equal terms with men.", "C": "Most women were indifferent to the issues of the time.", "D": "Therefore, most men withheld their support from the movement.", "E": "Some women are not allowed to work even though their families need the money they could earn."}, "context": "", "page": 23, "answer": "B"}, {"n": 69, "q": "Switzerland  is only a small country but has rich natural endowments, especially magnificent lakes surrounded by massive, snow-clad mountains. _____ - since it is this scenery that has brought so many tourists to the country.", "opts": {"A": "However it has no access to any sea", "B": "It is to its scenery that the country owes much of its wealth", "C": "The capital of the country is Bern", "D": "In the Alps the weather is generally cool even in the summer", "E": "There is a French speaking part and a German speaking part"}, "context": "", "page": 23, "answer": "B"}, {"n": 70, "q": "London has several dozen theatres. _____ Outside London some quite big towns have no professional theatres at all but usually there are amateur groups which produce interesting plays.", "opts": {"A": "You find people from all over the world gathering here", "B": "A successful play may run for even longer", "C": "Local authorities give financial aid to those who need  it", "D": "Many of them are professional but some of them are amateur", "E": "It takes an actor many years to learn his art"}, "context": "", "page": 23, "answer": "D"}, {"n": 71, "q": "For eating out in towns there is a marvelous variety of choice. Many of the Indian restaurants in particular, are very good indeed. _____. Some of them provide simple dishes, some more ambitious ones.", "opts": {"A": "On the whole the British prefer to eat at home", "B": "But there are several other restaurants of different nationalities that are also extremely good", "C": "Last night we had a most enjoyable dinner at that Chinese restaurant", "D": "Indeed, eating out need not be as expensive as most people think", "E": "Even so, a lot of English people like wine with their meals"}, "context": "", "page": 23, "answer": "B"}]}, {"id": 3, "name": "Paragraph Summarizing", "items": [{"n": 1, "q": "However much we may complain about the number of advertisements there are in a newspaper, the fact remains that without advertisements there would be no newspapers. It's the advertisements that finance the newspapers and make it possible for us to buy them cheaply.", "opts": {"A": "The larger the circulation of a newspaper is, the greater is its need for good advertisements.", "B": "Newspapers print so many advertisements that there is not much space left for the real news.", "C": "Nowadays all newspapers spend a great deal of money on advertising.", "D": "It is generally agreed that  it is profitable for large companies to advertise regularly in the newspapers.", "E": "Advertisements are essential to newspapers, without them they could not be produced economically."}, "context": "Select the sentence which gives a summary of the passage.", "page": 24, "answer": "E"}, {"n": 2, "q": "Brian and Gordon are brothers. People meeting them for the first time usually think Gordon is much the nicest. He's good looking, he's friendly and talks well. Later, they begin to notice he is rather spoilt. Then, they realize what a good person Brian is.", "opts": {"A": "Gordon and his brother are both very attractive people.", "B": "I have always preferred Brian to his brother Gordon.", "C": "Brian has clearly spoiled his brother Gordon.", "D": "Gordon makes a good first impression but his brother is a much better person.", "E": "Brian and Gordon are very different from each other; it is hard to believe they are brothers."}, "context": "", "page": 24, "answer": "D"}, {"n": 3, "q": "The average child is exceedingly curious. He investigates everything within reach; from electric plugs to piles of earth.  His favorite word is \"why\". The adult finds this period exhausting but he should not try to check the activities, unless they are dangerous, as the child is establishing the habit of learning.", "opts": {"A": "Curiosity in children should be encouraged as it creates a learning habit.", "B": "Children are often extremely curious but this is an unimportant stage and ends soon.", "C": "Curiosity in children should not be encouraged as it is responsible for very many accidents.", "D": "His curiosity leads a child to investigate a lot of unimportant things.", "E": "Children who lack curiosity will not grow up any different from those who are extremely curious."}, "context": "", "page": 24, "answer": "A"}, {"n": 4, "q": "Janet was very enthusiastic about the concert. She praised the pianist, the singer and the choice of program; but it was the violin concerto that she praised most of all.", "opts": {"A": "Janet went to the concert because she wanted to hear the violin concerto.", "B": "The piano is Jane's favorite instrument, although she is fond of violin concertos.", "C": "Jane thought the concert was wonderful and especially the violin concerto.", "D": "Except for the violin concerto, Jane didn't really enjoy the concert.", "E": "Not much of Jane's favorite music was included in the program."}, "context": "", "page": 24, "answer": "C"}, {"n": 5, "q": "Everyone I've talked to recently admits that Mr. Burton was not a very good manager. Now that Mr. Carr is in charge of the company, most people are expecting things to improve; he really is a natural leader, and liked and respected by everyone.", "opts": {"A": "It is generally agreed that Mr. Carr will manage the company much better than Mr. Burton did.", "B": "Mr. Carr didn't like the way Mr. Burton managed the company.", "C": "Mr. Burton was not popular, but under his management everything ran smoothly.", "D": "Mr. Carr may be a good manager but nobody wanted Mr. Burton to leave.", "E": "Most people think Mr. Carr will introduce few changes."}, "context": "", "page": 24, "answer": "A"}, {"n": 6, "q": "Most people don't realize that Paul and Mark are brothers. Paul is tall and fair, and interested in all types of sport. Mark, who is short and dark haired, is studying Math at the university. Math is his only hobby too.", "opts": {"A": "Brothers don't often have much in common.", "B": "Though brothers, Paul and Mark are very different in appearance and in interests.", "C": "Paul isn't nearly as clever as his brother Mark.", "D": "Paul wishes his brother were a better sportsman.", "E": "Paul and Mark are brothers but they disagree on various matters."}, "context": "", "page": 24, "answer": "B"}, {"n": 7, "q": "Patrick didn't even ask his father  if he could go to Barcelona for the weekend with Erick. He knew it would cost too much. But he didn't want to mention  it to Erick. So, next day, he said simply \"Father won't let me.\"", "opts": {"A": "Patrick didn't want Erick to know that he was going to spend the weekend in Barcelona.", "B": "Patrick's father didn't want Patrick to go to Barcelona with Erick.", "C": "Erick asked his father if he could take Patrick to Barcelona for the weekend.", "D": "Patrick went to Barcelona for the weekend without asking his father  if he could.", "E": "Patrick didn't want Erick to know that he couldn't afford to go to Barcelona for the weekend."}, "context": "", "page": 24, "answer": "E"}, {"n": 8, "q": "John is only 16 years old. Everyone else on the team is either 17 or 18. Even so, he's a much valued member of the team. In fact, some people think he's the best player the team has.", "opts": {"A": "When John is 17 or 1 8 he will probably be the best player on the team.", "B": "John joined the team when he was 16 but most people are at least 17 years old.", "C": "John is the youngest member of the team and also one of the best players.", "D": "John is one of the best players the team has had for 17 or 18 years.", "E": "The 17 and 18 year olds on the team are not valued enough."}, "context": "", "page": 24, "answer": "C"}, {"n": 9, "q": "Leroy walked slowly round the exhibition, looking at the pictures. None of them seemed very interesting. He felt very disappointed. Then suddenly he saw the portrait of an old man. He stopped in front of  it, and looked at  it for a long time. It was a wonderful portrait.", "opts": {"A": "While looking at the pictures at the exhibition, Leroy met an interesting old man.", "B": "Leroy was delighted with the exhibition, especially with some of the portraits.", "C": "Except for one portrait, Leroy thought the exhibition was very poor.", "D": "Leroy is very interested in paintings, especially in portraits of old people.", "E": "At the exhibition Leroy was disappointed to find that almost all the portraits were of old people."}, "context": "", "page": 24, "answer": "C"}, {"n": 10, "q": "Whenever  I need something, the first place  I go to is Dawson's store. There they sell just about everything. You can buy clothes there, things for the house and for the garden, and also sports equipment; They stock a wide variety of goods. Everything is a good quality, and prices are reasonable.", "opts": {"A": "Most people can't afford to go to Dawson's.", "B": "You can't find everything you need in Dawson's.", "C": "In my opinion, Dawson's is an excellent store and not too expensive.", "D": "Dawson's is famous for its goods but prices are high.", "E": "The rich and the famous all shop at Dawson's."}, "context": "", "page": 24, "answer": "C"}, {"n": 11, "q": "People who have never been in an aero plane usually think that flying must be fun. Perhaps  it is, the first time you fly. But few people who have flown a lot really enjoy flying. Most of the time you are in the air, there is nothing to see but clouds, and waiting around in an airport is the most boring experience.", "opts": {"A": "Flying is not as interesting as people who haven't flown think.", "B": "A lot of people won't fly because they think it is dangerous.", "C": "Airports are very boring places.", "D": "Traveling by air is one of the least popular ways of traveling.", "E": "Everybody likes flying, and shopping at airports is great fun."}, "context": "", "page": 25, "answer": "A"}, {"n": 12, "q": "During recent years, there has been a great increase in population. As a result of this, many countries are facing serious difficulties. These include food shortages, housing problems, unemployment, pollution and similar social and economic difficulties.", "opts": {"A": "Some countries have more social and economic problems than others.", "B": "The rapid growth in population has caused very many problems.", "C": "The increase in population has been to the benefit of some countries.", "D": "Rich countries should help poor countries.", "E": "Economic problems are not related to the increase in population."}, "context": "", "page": 25, "answer": "B"}, {"n": 13, "q": "Paul is pleased that his company is sending him to the new factory near Houston. The pay will be better and the work more interesting. Also, several of his friends live there and he likes the climate.", "opts": {"A": "Paul's company has many reasons for opening a new factory in Houston.", "B": "Paul is happy to be going to Houston for various reasons.", "C": "Paul is looking forward to making new friends in Houston.", "D": "It is not easy to find interesting, well-paid work in Houston.", "E": "Paul has never had such a good job as his present one in Houston."}, "context": "", "page": 25, "answer": "B"}, {"n": 14, "q": "Susan arrived at the library a few minutes before 12 o'clock. Jane had her coat on and was, waiting for her friend on the steps of the library. So they left together, crossed the street and went to their favorite restaurant.", "opts": {"A": "Susan and Jane both work in the same library and always have lunch together.", "B": "Jane was surprised to see Susan at the library and invited her to lunch.", "C": "Susan and Jane met at the library as arranged and then had lunch together.", "D": "Jane and Susan have lunch together once a week.", "E": "Jane put on her coat while she was waiting for her friend."}, "context": "", "page": 25, "answer": "C"}, {"n": 15, "q": "I don't know any French myself, and so  I don't know whether Jane's French is good or not. But I do know that she has spent the last two years in France. She was in Paris for 18 months and the remaining 6 months she spent at various places along the south coast. So she should know French well.", "opts": {"A": "Jane has spent two whole years in France, partly in Paris, partly on the south coast.", "B": "Jane's French ought to be good as she has recently spent two years in France.", "C": "If I had spent two years in France like Jane, I would have learned French well.", "D": "Jane's French is now very good indeed.", "E": "Jane thoroughly enjoyed the two years she spent in France, but I don't think her French is better than mine."}, "context": "", "page": 25, "answer": "B"}, {"n": 16, "q": "If Jane is willing to organize the picnic  I should let her. The last picnic she organized was a great success. Just now, too, she has plenty of spare time, which most of us don't have.  I don't think we'll find anyone as good as her.", "opts": {"A": "Jane always likes to do unusual things.", "B": "Everybody can organize a picnic as efficiently as Jane can.", "C": "Most of us don't want Jane to organize the picnic.", "D": "Jane has so much free time that she wants to organize a picnic.", "E": "Jane seems to be the best person to organize the picnic."}, "context": "", "page": 25, "answer": "E"}, {"n": 17, "q": "I know all the arguments about how important it is to advertise. I admit that the costs of advertising are quickly recovered in better sales. Yet I still think advertising is harmful because of the bad effect it has on children.", "opts": {"A": "Advertising helps sales, but children are badly affected by  it.", "B": "I am in favor of advertisements because children are fond of them.", "C": "It is important to advertise although children hate advertisements.", "D": "A lot of people argue about whether advertising really helps sales", "E": "Many people argue that advertisements are useful for children."}, "context": "", "page": 25, "answer": "A"}, {"n": 18, "q": "The story \"Robinson Crusoe\" was written by Daniel Defoe. This novel was based on the story of a real sailor who had been abandoned on a small island. Although the sailor, Alexander Selkirk's adventures are not the same as those of Robinson Crusoe there are some notable similarities.", "opts": {"A": "Daniel Defoe wrote the story of Alexander Selkirk but called  it \"Robinson Crusoe.\"", "B": "The abandoned sailor Alexander Selkirk was a typical colonialist.", "C": "The story: \"Robinson Crusoe\" by Daniel Defoe is a fictional account of the experiences of Alexander Selkirk.", "D": "Daniel Defoe wrote the story of the life of Alexander Selkirk and named  it \"Robinson Crusoe.\"", "E": "Being abandoned on a small island with a sailor named Alexander Selkirk gave Daniel Defoe the idea to write the story \"Robinson Crusoe.\""}, "context": "", "page": 25, "answer": "C"}, {"n": 19, "q": "Jane had had a terrible dream that night. She had dreamed that she was in a haunted house. The house was large and dark. It had broken stairs and windows. As she went through the house, she heard terrible noises and then she saw a white mist which turned into a strange animal, in front of her. She screamed and then woke to find that she was safe in her own home.", "opts": {"A": "Jane's dream frightened her into screaming all night.", "B": "The house that Jane was in was old and frightening but she went to sleep anyway.", "C": "The noises that she heard that night were made by a wild animal that had come in to get away from the fog.", "D": "Jane was very frightened by the nightmare she had the other night in which she visited an old abandoned house and saw a ghost.", "E": "Jane was afraid of the dark so her imagination played tricks on her that night and she thought she had seen a ghost."}, "context": "", "page": 25, "answer": "D"}, {"n": 20, "q": "Many people complain a great deal about the bad influences of television on the young. However, these are the same parents that don't seem to realize that what their children watch should be decided by them. It is the parents who are responsible to turn the program off  if it isn't appropriate for their children.", "opts": {"A": "It would be better  if people complained less about what their children watched on television.", "B": "Television programs are more valuable than most parents wish to believe.", "C": "Parents tend to allow their children to watch too much television and then complain about it.", "D": "Many parents make decisions about what is appropriate for their children and what is not.", "E": "Parents should take the initiative to prevent their children from watching what they feel is not appropriate for them."}, "context": "", "page": 25, "answer": "E"}, {"n": 21, "q": "The future is something that many people, especially young ones, worry about. Our elders tell us that making correct decisions about our futures is very important and making a mistake can ruin us forever. However, when one looks at the records, those people who have taken chances and tried to do things their own way, tend to make out much better than those who do things the way the system expects.", "opts": {"A": "Making decisions about the future should be the right of the person who will be living that life.", "B": "Taking risks is not considered to be the correct way of planning ones future and could cause failure.", "C": "Parents tell their children to plan their futures as the social and cultural rules advice.", "D": "Decisions that people make may at times seem incorrect but most of the time the results are good.", "E": "Although it is generally felt that people shouldn't take risks, many people who do have proved that being different is not always wrong."}, "context": "", "page": 26, "answer": "E"}, {"n": 22, "q": "Although we didn't know who she was or where she had come from it was easy to guess that she had some type of royal blood in her veins. The English she spoke was so carefully precise that she couldn't possibly be a native speaker. Her graceful movements and confident gestures indicated power and control. All in all, the appearance she presented was very impressive.", "opts": {"A": "We were not able to learn anything about this woman.", "B": "This woman was of rich and royal heritage.", "C": "This woman made us think that she was wealthy.", "D": "This unknown woman had a manner that impressed those who met her.", "E": "This woman was not brought up in our country."}, "context": "", "page": 26, "answer": "D"}, {"n": 23, "q": "From the very first, man has wondered if there was life on worlds other than our own. The mind of man has wandered to many light years away: to other planets and solar systems. Today man is still asking this question, but he seeks the answer in science and technology instead of religion ad magic.", "opts": {"A": "Man has always asked himself about life on other planets.", "B": "Since the beginning of man's history the question of whether there is life on other planets has been asked, but today new ways of answering this question are available.", "C": "Today scientists are the people that are asking  if man might be able to live on other planets in other solar systems.", "D": "We have and will always wonder about the possibility of life on other planets.", "E": "The answer to the question of whether there is life on other planets or not could not be answered in the past, but will probably be answered by the scientists of today."}, "context": "", "page": 26, "answer": "B"}, {"n": 24, "q": "There are many different reasons why a poet writes poetry.  I would suppose that some write poems for themselves and to please their own senses. Others however, write to share thoughts, or rather feelings with others. Most poems are meant to appeal to the heart and senses rather than to the mind and reason.", "opts": {"A": "Poets usually write poems to share their thoughts with other people.", "B": "Poets write poems for themselves and for others.", "C": "Poems are not written for the mind they are written for the heart.", "D": "Poets are sentimental people who have to show their emotions with their writing.", "E": "Among the different reasons for writing poetry, the need to express emotions is probably the strongest motive for most poets."}, "context": "", "page": 26, "answer": "E"}, {"n": 25, "q": "The art form which is best known under the name of Impressionism evolved in France with the Realist movement of the mid to late 1800's. Although this style only lasted for about 15 years in a pure form, it has influenced the style of art that has come after  it  till today. The motivating thought in this style of art comes from the idea that \"Nothing is seen without light.\"", "opts": {"A": "Impressionism is an art form which is still presently used today.", "B": "The Impressionism style of art which started in France in the late 1800's and  still has a strong effect on artists today, gives importance to light.", "C": "The artists of the 1800's decided that light was very important in their work and thus created a new style of painting called Impressionism.", "D": "The art style called Impressionism was around for about 15 years in France during the 1800's and used light for the first time in its paintings.", "E": "The various uses of lights played an important role in the development of the form of painting called Impressionism."}, "context": "", "page": 26, "answer": "B"}, {"n": 26, "q": "War is one of the most terrible parts of human history. Death, destruction and pain, both physical and emotional are the primary results of war. Still man seems to be incapable of doing without it.", "opts": {"A": "As bad as it is, man likes to make war.", "B": "People have no gain from war but are unable to stop it.", "C": "The death and misery that war produces is not enough to stop man from fighting.", "D": "No one wants to fight a war.", "E": "Even though fighting is useless people will not stop."}, "context": "", "page": 26, "answer": "C"}, {"n": 27, "q": "Our world seems to be changing too fast to keep up with. In my youth, life was much more simple. Our parents worried about feeding and educating us. We worried about simple things life school and friends. Today however, children have become selfish and materialistic.", "opts": {"A": "Life changes people as they grow.", "B": "Everyone changes with time.", "C": "The world makes people selfish as they grow older.", "D": "Children are, brought up differently these days.", "E": "Time has changed the needs and attitudes of people."}, "context": "", "page": 26, "answer": "E"}]}, {"id": 4, "name": "Appropriate Questions", "items": [{"n": 1, "q": "The river is very wide and from the Hermitage you can look across at the Peter and Paul fortress or in the other direction you can see the University and other old buildings.", "opts": {"A": "What can you see at the fortress?", "B": "You can see universities and fortresses, can't", "C": "What is the sight from the Hermitage?", "D": "The Peter and Paul fortress is in the other direction, isn't it?", "E": "What University can you see?"}, "context": "Find the appropriate questions for the following answers.", "page": 27, "answer": "C"}, {"n": 2, "q": "There was not enough money.", "opts": {"A": "Had the girl enough money?", "B": "How much money had she?", "C": "What are there?", "D": "What is enough?", "E": "How much money was there?"}, "context": "", "page": 27, "answer": "E"}, {"n": 3, "q": "Lincoln was President during the Civil War. In this critical period Lincoln led the fight to keep the nation together and to free the slaves.", "opts": {"A": "When was Lincoln born?", "B": "What kind of man was he?", "C": "In what place of the United Kingdom has the memorial been built?", "D": "What did Lincoln lead during the Civil War?", "E": "When did the North win?"}, "context": "", "page": 27, "answer": "D"}, {"n": 4, "q": "Richard and his girl were late for the performance. When they got to the theatre the play had already begun.", "opts": {"A": "When did they come to the theatre?", "B": "How did they get to the theatre?", "C": "Who was late?", "D": "Who plays the leading part?", "E": "Where did they go after the performance?"}, "context": "", "page": 27, "answer": "A"}, {"n": 5, "q": "Charlie worked for a year in his father's business. He worked very hard. He had no time for entertainments. His father decided to sent him to Paris for a short holiday.", "opts": {"A": "Why did Charlie decide to go to Paris?", "B": "Why did his father decide to send him to Paris?", "C": "For whom did he buy tickets?", "D": "How long did Charlie work in his father's", "E": "Did he like his father's business?"}, "context": "", "page": 27, "answer": "B"}, {"n": 6, "q": "Professor Peterson did his research in astronomy.", "opts": {"A": "Was Professor Peterson a famous astronomer?", "B": "Who did research in mathematics and", "C": "Did Professor Peterson develop science?", "D": "What branch did Professor Peterson do his research in?", "E": "What did Professor Peterson do in his life?"}, "context": "", "page": 27, "answer": "D"}, {"n": 7, "q": "George Stephenson was an outstanding English engineer and inventor. He is a man whose name is connected with the first railway in Great Britain. He built a new engine for a steam locomotive and replaced wooden rails by metal ones.", "opts": {"A": "Was G.Stephenson a famous scientist?", "B": "Where did outstanding inventor live?", "C": "Whose name is connected with the first locomotive", "D": "What was the famous engineer's invention?", "E": "Where did G. Stephenson build his railway?"}, "context": "", "page": 27, "answer": "D"}, {"n": 8, "q": "My father is an excellent bowler. He has been bowling since he was ten years old.", "opts": {"A": "Did they like to bowl?", "B": "How long has his father been bowling?", "C": "Do you know the story of bowling", "D": "Did they often get together with friends to bowl.", "E": "How did they call themselves?"}, "context": "", "page": 27, "answer": "B"}, {"n": 9, "q": "I like figure-skating best.", "opts": {"A": "Do you like figure-skating?", "B": "You like figure-skating, don't you?", "C": "What is your favorite sport?", "D": "Who liked figure-skating best?", "E": "Do you go in for figure-skating?"}, "context": "Appropriate questions", "page": 27, "answer": "C"}, {"n": 10, "q": "Cinderella is sitting alone by the fire-place in her old dress. She is unhappy. Her stepmother and her sisters have gone to the King's palace. The guests are dancing and listening to the beautiful music. They are happy. Cinderella wants to be at the party too, but she is not allowed.", "opts": {"A": "Why is Cinderella unhappy?", "B": "What is Cinderella going to do?", "C": "Where have her relatives gone?", "D": "Is Cinderella happy?", "E": "What is king doing?"}, "context": "", "page": 27, "answer": "A"}, {"n": 11, "q": "In the 17th century the streets of London were so narrow that it was often possible for a person at a window on one side of the street to shake hands with a neighbor on the other side.", "opts": {"A": "Was it possible for a person to shake hands in the street?", "B": "What kind of streets were there in the 17th century?", "C": "Where neighbors friends in the B": "How long does it take him to get to the", "C": "Is it difficult for Pete to get to the stadium?", "D": "How long and how does he get to the place?", "E": "Where is the stadium situated?"}, "context": "", "page": 27, "answer": "D"}, {"n": 17, "q": "A good memory is a great help in learning a language. Everybody learns his native language by remembering what he hears when he is a small child and some children who live abroad with their parents seem to learn two languages almost as easily as one. At school it is not so easy to learn a second language, because the pupils have so little time for  it, and they are busy with other subjects.", "opts": {"A": "Why is it easier to learn a foreign language for grown-ups than for little?", "B": "Why do children learn a second language first?", "C": "Parents don't want their children to learn a second language, do they?", "D": "Why is it difficult to learn a second language at school?", "E": "Why doesn't school curriculum pay attention to foreign language teaching?"}, "context": "", "page": 28, "answer": "D"}, {"n": 18, "q": "The top of the mountain was covered with snow.", "opts": {"A": "What is the season?", "B": "Who was at the top of the mountain?", "C": "How much snow was there?", "D": "Where was the mountain?", "E": "What was the mountain covered with?"}, "context": "", "page": 28, "answer": "E"}, {"n": 19, "q": "There was a small demonstration in Hyde Park on Sunday.", "opts": {"A": "What was there in Hyde Park on Sunday?", "B": "Was there a demonstration in Hyde Park?", "C": "Were there many demonstrators in Hyde Park?", "D": "Who takes part in the demonstration on Sunday?", "E": "Who took part in demonstration in Hyde Park on Sunday?"}, "context": "", "page": 28, "answer": "A"}, {"n": 20, "q": "\"I'd like coffee with milk.\"", "opts": {"A": "How would you like coffee?", "B": "Will you give me coffee?", "C": "Will you give me tea with milk?", "D": "Would you like some sugar?", "E": "Would you like another cup of coffee?"}, "context": "", "page": 28, "answer": "A"}, {"n": 21, "q": "A: ... B: At home.", "opts": {"A": "When do you have your meals?", "B": "What do you have for meals?", "C": "Where do you have your meals?", "D": "Why do you have your meals?", "E": "Do you have meals at home?"}, "context": "", "page": 28, "answer": "C"}, {"n": 22, "q": "A: ... B:  I'll try.", "opts": {"A": "Will you tell me the way to the theatre?", "B": "When will you tell me the way to the theatre?", "C": "How will you try to tell me the way to the theatre?", "D": "I'll tell you the way to the theatre, shall I?", "E": "This is the way to the theatre, isn't it?"}, "context": "", "page": 28, "answer": "A"}, {"n": 23, "q": "The British Museum Library is famous all over the world. The library contains millions of books. People come to this famous library to get an information they need. There are scientists, economists, artists among its readers.", "opts": {"A": "Is it a modern library?", "B": "How old is the library?", "C": "When did the library begin to work?", "D": "Why do people come to this library?", "E": "Who worked at this library?"}, "context": "", "page": 28, "answer": "D"}, {"n": 24, "q": "A. ... .", "opts": {"B": "He was born in England.", "A": "When was Dickens born?", "C": "Where was Dickens born?", "D": "Who was born in England?", "E": "Was Dickens born in England?"}, "context": "", "page": 28, "answer": "C"}, {"n": 25, "q": "Philip of Macedon wanted to occupy all Greece.", "opts": {"A": "Did Philip of Macedon want to occupy the Southern Greece?", "B": "Who wanted to occupy part of Greece?", "C": "What did Philip of Macedon want to do?", "D": "Did Philip of Macedon want to occupy all Greece?", "E": "Philip of Macedon didn't want to occupy all Greece, did he?"}, "context": "", "page": 28, "answer": "C"}, {"n": 26, "q": "The Lacons were known for their bravery and short speeches.", "opts": {"A": "Why were the Lacons known for their bravery, a very and short speeches?", "B": "Who were known
