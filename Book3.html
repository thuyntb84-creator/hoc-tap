nswer": "C"}, {"n": 5, "q": "So _____ so done.", "opts": {"A": "thought", "B": "done", "C": "had", "D": "saw", "E": "said"}, "context": "", "page": 47, "answer": "E"}, {"n": 6, "q": "\"While there is _____ there is hope.\"", "opts": {"A": "will", "B": "wish", "C": "love", "D": "life", "E": "water"}, "context": "", "page": 47, "answer": "D"}, {"n": 7, "q": "\"Better face a danger than be always in _____.", "opts": {"A": "favor", "B": "moon", "C": "fear", "D": "fire", "E": "flight"}, "context": "", "page": 47, "answer": "C"}, {"n": 8, "q": "I have a young sister. From her childhood she dreamt of becoming a pianist. When she was seven our mother sent her to the music school. At first  it was difficult for a little girl to spend hours playing the piano and she could not achieve much progress; but my sister didn't give up. Time passed. From year to year she became more skillful and succeeded in her dream.", "opts": {"A": "Practice makes perfect.", "B": "As clear as a day.", "C": "Everything is good in its season.", "D": "East of west - home the best.", "E": "There is no place like home."}, "context": "", "page": 47, "answer": "A"}, {"n": 9, "q": "Mr. Brown was very afraid of dentist. Once he had a terrible toothache, and couldn't sleep. The next day, he decided to go to the dentists and have his tooth extracted.", "opts": {"A": "While there is life there is hope.", "B": "Where there is smoke, there is fire.", "C": "Where there is a will, there's a way.", "D": "An able sailor hails in stormy weather.", "E": "Better face a danger than be always in fear."}, "context": "", "page": 47, "answer": "E"}, {"n": 10, "q": "An hour in the morning _____.", "opts": {"A": "as near as today and tomorrow", "B": "is better than richness", "C": "has wings", "D": "is worth two in the evening", "E": "as clear as day"}, "context": "", "page": 47, "answer": "D"}, {"n": 11, "q": "John was a very lazy pupil. During the school years he didn't learn his lessons and always played truant. When the examination time came he was also to take his exams. But, alas, he didn't pass them and he cried bitterly.", "opts": {"A": "Living dog is better than a dead man.", "B": "The rotten apple injures its neighbors.", "C": "The appetite comes with eating.", "D": "A good beginning makes a good ending.", "E": "You have made your bed and you must lie on it."}, "context": "Proverbs", "page": 47, "answer": "E"}, {"n": 12, "q": "Promise little _____.", "opts": {"A": "who laughs last", "B": "but do much", "C": "that ends well", "D": "while the sun shines", "E": "never found again"}, "context": "", "page": 47, "answer": "B"}, {"n": 13, "q": "Joe had a very big supper. When he asked for a piece of bread and butter at bedtime, his mother said,  \" I've never seen anyone eat so much. You are always as hungry as _____.\"", "opts": {"A": "a lark", "B": "a wolf", "C": "a bee", "D": "a horse", "E": "a mouse"}, "context": "", "page": 47, "answer": "B"}, {"n": 14, "q": "The last drop makes _____.", "opts": {"A": "both ends meet", "B": "the cat out of the bag", "C": "a horse laugh", "D": "the cup run over", "E": "a cat laugh"}, "context": "", "page": 47, "answer": "D"}, {"n": 15, "q": "_____ makes the world go round.", "opts": {"A": "love", "B": "hatred", "C": "gravity", "D": "money", "E": "poor mouse."}, "context": "", "page": 47, "answer": "D"}, {"n": 16, "q": "_____ repeats itself.", "opts": {"A": "children", "B": "language", "C": "everybody", "D": "stories", "E": "history"}, "context": "", "page": 47, "answer": "E"}, {"n": 17, "q": "One of our classmates fell  ill, and was taken to hospital. In three months he was out and about, but lagged behind the pupils with his studying. He asked many pupils to help him, nobody came to his rescue, but me. After that we became friends.", "opts": {"A": "Facts are stubborn things", "B": "Experience is the mother of wisdom", "C": "Live and learn", "D": "Everything is good in its season", "E": "A friend in need is a friend indeed"}, "context": "", "page": 47, "answer": "E"}, {"n": 18, "q": "A man's best friend is his _____.", "opts": {"A": "shirt", "B": "bag", "C": "dog", "D": "house", "E": "money"}, "context": "", "page": 47, "answer": "C"}, {"n": 19, "q": "Lost time is _____.", "opts": {"A": "known by its tree.", "B": "never found again.", "C": "not so black as he painted.", "D": "never too late to learn.", "E": "makes the cup run."}, "context": "", "page": 47, "answer": "B"}, {"n": 20, "q": "\"Out of sight-out of _____.", "opts": {"A": "light", "B": "fight", "C": "guide", "D": "might", "E": "mind"}, "context": "", "page": 47, "answer": "E"}, {"n": 21, "q": "Everything is _____.", "opts": {"A": "shooting without aim", "B": "better than saying", "C": "good in its season", "D": "better to do well than to say well", "E": "worth two tomorrow"}, "context": "", "page": 47, "answer": "C"}, {"n": 22, "q": "My friend Ann is a very clever girl. She is quick in everything she does. She is not lazy. She always does everything in time. She doesn't like lazy people who always try to put off their work and she says _____.", "opts": {"A": "Speech is silver but silence is gold.", "B": "A bad wound is cured, not a bad name.", "C": "What is done can't be undone.", "D": "Never put off till tomorrow what you can do today.", "E": "As is the workman so is the work."}, "context": "", "page": 48, "answer": "D"}, {"n": 23, "q": "My mother loves my younger sister very much and the latter makes use of it. She always asks to buy her nice dresses, sweets. My sister likes only to play and is a poor pupil. My sister is just a bad naughty girl.  I say this because  I always _____.", "opts": {"A": "call the shots", "B": "change horses in midstream", "C": "call a spade a spade", "D": "cry over spilt milk", "E": "give someone the cold shoulder"}, "context": "", "page": 48, "answer": "C"}, {"n": 24, "q": "- Hello, Ann? I haven't seen you for ages. Where have you been? - I've been to Moscow. I was there for a month and came back last week. I'm glad I'm at home.", "opts": {"A": "I liked Moscow very much.", "B": "East or West, home is best.", "C": "I met our friends there.", "D": "My family stayed in Moscow.", "E": "Have you been to Moscow?"}, "context": "", "page": 48, "answer": "B"}, {"n": 25, "q": "Nobody expected them to part so suddenly. They loved each other and they were to get married. One day he told her he was going to Italy on business. He stayed 2 years there. Meanwhile she completely forgot him and married Mr. Black, a rich man.", "opts": {"A": "A bad wound is cured, not a bad name.", "B": "No news good news.", "C": "As is the workman so is the work.", "D": "Out of sight - out of mind.", "E": "False friend are worse than open enemies."}, "context": "", "page": 48, "answer": "D"}, {"n": 26, "q": "Mother gave Ann some money. The girl wanted to go to the cinema very much; at the same time she wanted to buy a book, but there was not enough money for both, \"I'll buy the book and go to the cinema next time when I have money\" she said.", "opts": {"A": "A man can die but once.", "B": "A cat in gloves catches no mice.", "C": "You cannot eat your cake and have it.", "D": "He laughs best who laughs last.", "E": "So many men, so many minds."}, "context": "", "page": 48, "answer": "C"}, {"n": 27, "q": "_____ loose all.", "opts": {"A": "He that never climbed", "B": "Grasp all", "C": "If you run after two hares", "D": "If wishes were horses", "E": "Least said"}, "context": "", "page": 48, "answer": "B"}, {"n": 28, "q": "What will the travelers say when they come safe to the end of their journey, having gone through many dangerous adventures?", "opts": {"A": "To take the bull by the horn.", "B": "To kill two birds with one stone.", "C": "Two heads are better than one.", "D": "There is no smoke without fire.", "E": "All is well that ends well."}, "context": "", "page": 48, "answer": "E"}, {"n": 29, "q": "What would you say to a grumbling group mate who is finding fault with everything around?", "opts": {"A": "Better late than never.", "B": "East or West, home is best.", "C": "To get out of bed on the wrong side.", "D": "Promise little, but do much.", "E": "Make hay while the sun shines."}, "context": "", "page": 48, "answer": "C"}, {"n": 30, "q": "Your friend has been suffering from a bad toothache for a long time as he is afraid to go to the dentist. How would you urge him to overcome his fear.", "opts": {"A": "He laughs best who laughs last.", "B": "The devil is not so black as is painted.", "C": "A burnt child dreads the fire.", "D": "One swallow doesn't make a summer.", "E": "If you want a thing well done, do it yourself."}, "context": "", "page": 48, "answer": "B"}, {"n": 31, "q": "A.: It's risky to take an exam without reading the whole book. B.: But it's my last chance. _____.", "opts": {"A": "New brooms sweep clean.", "B": "No new is good news", "C": "Once bitten, twice shy.", "D": "Sink or swim.", "E": "Poverty is no sin."}, "context": "", "page": 48, "answer": "D"}, {"n": 32, "q": "A.: You say this green dress doesn't suit me and I look dull in it. What about the blue one? B.: Oh, it's quite different. You must always wear  it, you are lively in  it. A.: You see, and my mother hates it. _____.", "opts": {"A": "Rome wasn't built in a day.", "B": "A round peg in a square hole.", "C": "There is no place like home.", "D": "That's another pair of shoes.", "E": "Tastes differ."}, "context": "", "page": 48, "answer": "E"}, {"n": 33, "q": "A.: What kind of person is our director? B.: Can't make out. Neither kind nor strict. _____.", "opts": {"A": "Neither fish nor flesh.", "B": "Too good to be true.", "C": "To turn over a new leaf.", "D": "Woken pigs fly.", "E": "Well begun is half done."}, "context": "", "page": 48, "answer": "A"}, {"n": 34, "q": "_____, soonest mended.", "opts": {"A": "If the sky falls", "B": "All covet", "C": "As you make your bed", "D": "As you sow", "E": "Least said"}, "context": "", "page": 48, "answer": "E"}, {"n": 35, "q": "When angry _____.", "opts": {"A": "do as the Romans do", "B": "sweep clean", "C": "you will catch neither", "D": "you shall mow", "E": "count a hundred"}, "context": "", "page": 48, "answer": "E"}, {"n": 36, "q": "Many men, many _____.", "opts": {"A": "servants", "B": "hands", "C": "minds", "D": "ways", "E": "thoughts"}, "context": "", "page": 48, "answer": "C"}, {"n": 37, "q": "Well begun is half _____.", "opts": {"A": "gone", "B": "done", "C": "undone", "D": "a way", "E": "come"}, "context": "", "page": 48, "answer": "B"}, {"n": 38, "q": "East or West _____ is best.", "opts": {"A": "castle", "B": "hut", "C": "home", "D": "palace", "E": "country"}, "context": "", "page": 48, "answer": "C"}, {"n": 39, "q": "A bird in the hand _____.", "opts": {"A": "is worth two in the bush", "B": "makes even a cat laugh", "C": "has brought forth a mouse", "D": "speaks louder than words", "E": "changes his spots"}, "context": "", "page": 48, "answer": "A"}, {"n": 40, "q": "We have got two neighbors. One of them is a clever and polite man. He is an educated, cultural man. The other is rather selfish and stupid. He thinks he can buy everything as he is rich enough. He is a narrow-minded person. We don't like him.", "opts": {"A": "As the tree so the fruit.", "B": "Health is above wealth.", "C": "No pains, no gains.", "D": "It's never too late to learn.", "E": "Better short of pence than short of sense."}, "context": "", "page": 48, "answer": "E"}, {"n": 41, "q": "When faced with a difficult problem, it is better to consult other people.", "opts": {"A": "To kill two birds with one stone.", "B": "Two heads are better than one.", "C": "If you want a thing well done, do it yourself.", "D": "The devil is not so black as he is painted.", "E": "East or West home is best."}, "context": "", "page": 49, "answer": "B"}, {"n": 42, "q": "First catch your _____ then cook  it.", "opts": {"A": "hare", "B": "hair", "C": "heir", "D": "car", "E": "bear"}, "context": "", "page": 49, "answer": "A"}, {"n": 43, "q": "A stitch in time _____.", "opts": {"A": "saves nine", "B": "before they hatch", "C": "makes a good ending", "D": "before they are easy", "E": "makes perfect"}, "context": "", "page": 49, "answer": "A"}, {"n": 44, "q": "Mr. Smith was rather lazy. He didn't like to work hard and always spared himself. He was sure that his father would support him all his life. But his father died and Mr. Smith had a miserable life.", "opts": {"A": "Don't trouble trouble until trouble troubles you.", "B": "Speech is silver but silence is gold.", "C": "No sweet without sweat.", "D": "As the tree so the fruit.", "E": "First think then speak."}, "context": "", "page": 49, "answer": "C"}, {"n": 45, "q": "It was raining very hard. A lot of people were standing at the bus- stop and were sorry they had not taken their umbrellas with them. But one man among them was cheerful and pleased. He always repeated \"the harder  it rains the better  I like  it.\" Asked why he was happy with rain he answered ...", "opts": {"A": "Like to like.", "B": "The fist blow is half the battle.", "C": "Actions speak louder than words.", "D": "An idle brain is the devil's workshop.", "E": "One man's meat is another man's poison."}, "context": "", "page": 49, "answer": "E"}, {"n": 46, "q": "- What time do you get up on Sundays? - About half past six. - Why so early? - I get up at that time on week-days, and _____, you know.", "opts": {"A": "deeds, not words", "B": "neck or nothing", "C": "custom is a second nature", "D": "no rose without a thorn", "E": "when angry, count a hundred"}, "context": "", "page": 49, "answer": "C"}, {"n": 47, "q": "Mr. Brown was the owner of our local newspaper. He was a good and clever man but he had the habit of talking to himself all the time. One day my friend came and asked him why he did that. \"Well, there are two reasons,\" he said. \"First  I like to hear a wise man speak, secondly, when  I speak  it is a pleasure to have an intelligent audience.\"", "opts": {"A": "Hear much speak little.", "B": "Penny-wise and pound-foolish.", "C": "He laughs best who laughs last.", "D": "Wealth is nothing without health.", "E": "Hunger is the best source."}, "context": "", "page": 49, "answer": "A"}, {"n": 48, "q": "Some people use fine words when they talk about what they have done, but their actions may be quite different and not at all fine.", "opts": {"A": "Fine words dress  ill deeds.", "B": "You can't eat your cake and have it.", "C": "Fortune favors the brave.", "D": "All work and no play makes Jack a dull boy.", "E": "An apple a day keeps the doctor away."}, "context": "", "page": 49, "answer": "A"}, {"n": 49, "q": "A man mustn't think that his task is too difficult before he begins doing it.", "opts": {"A": "Everything comes to him who waits.", "B": "No living man all things can.", "C": "Live not to eat but eat to live.", "D": "Keep your mouth shut and your ears open.", "E": "Don't cross the bridge before you come to it"}, "context": "", "page": 49, "answer": "E"}, {"n": 50, "q": "Still waters run _____.", "opts": {"A": "quick", "B": "important", "C": "careful", "D": "deep", "E": "strong"}, "context": "", "page": 49, "answer": "D"}, {"n": 51, "q": "Be slow to promise and _____.", "opts": {"A": "speak little", "B": "life is short", "C": "never fell", "D": "quick to perform", "E": "half is done"}, "context": "", "page": 49, "answer": "D"}, {"n": 52, "q": "-  I am lucky today, your turn will come later on. Tomorrow our positions may be reversed. - Yes, _____.", "opts": {"A": "Deeds not words", "B": "Every dog has his day", "C": "Scratch my back and  I'll scratch yours", "D": "Everything is good in its season", "E": "All is well that ends well"}, "context": "", "page": 49, "answer": "B"}, {"n": 53, "q": "If you _____ to be a friend, never borrow, never _____.", "opts": {"A": "want / lend", "B": "wanted / lent", "C": "wants / lends", "D": "will want / lend", "E": "want / lent"}, "context": "", "page": 49, "answer": "A"}]}, {"id": 9, "name": "Idioms", "items": [{"n": 1, "q": "\"A bit\" means _____.", "opts": {"A": "some thing to eat", "B": "to help someone", "C": "a small amount"}, "context": "", "page": 50, "answer": "C"}, {"n": 2, "q": "\"About time\" means _____.", "opts": {"A": "at the right time", "B": "soon", "C": "at last"}, "context": "", "page": 50, "answer": "C"}, {"n": 3, "q": "\"Across the board\" means _____.", "opts": {"A": "everyone or everything is included", "B": "to travel between countries", "C": "uninteresting"}, "context": "", "page": 50, "answer": "A"}, {"n": 4, "q": "To \"act up\" means _____.", "opts": {"A": "to share an idea", "B": "to behave badly", "C": "to pretend to be rich"}, "context": "", "page": 50, "answer": "B"}, {"n": 5, "q": "A man \"after my own heart\" means _____.", "opts": {"A": "liking the same things as me", "B": "looks like me", "C": "follows me"}, "context": "", "page": 50, "answer": "A"}, {"n": 6, "q": "\"Against the clock\" means _____.", "opts": {"A": "a new record", "B": "a test of speed or time", "C": "an impossible task"}, "context": "", "page": 50, "answer": "B"}, {"n": 7, "q": "\"All along\" means _____.", "opts": {"A": "all the time", "B": "to agree", "C": "altogether"}, "context": "", "page": 50, "answer": "A"}, {"n": 8, "q": "\"All hours\" means _____.", "opts": {"A": "at regular times", "B": "at irregular times", "C": "every hour"}, "context": "", "page": 50, "answer": "B"}, {"n": 9, "q": "\"Along in years\" means _____.", "opts": {"A": "getting old", "B": "getting tired", "C": "becoming successful"}, "context": "", "page": 50, "answer": "A"}, {"n": 10, "q": "\"And then some\" means _____.", "opts": {"A": "not many", "B": "and only a few", "C": "and a lot more"}, "context": "", "page": 50, "answer": "C"}, {"n": 11, "q": "A \"babe in the woods\" means _____.", "opts": {"A": "someone who cuts trees", "B": "someone who is young", "C": "someone who is innocent"}, "context": "", "page": 50, "answer": "C"}, {"n": 12, "q": "To \"back down\" means _____.", "opts": {"A": "to give const KEY='english_test_lab_book3_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}let tid=1,mode='all',index=0,selected=null,checked=false,attempts={};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function persist(){localStorage.setItem(KEY,JSON.stringify(saved))}
function test(){return DATA.find(t=>t.id===tid)}
function key(q){return tid+'_'+q.n}
function list(){return test().items.filter(q=>mode==='all'||(mode==='wrong'&&saved[key(q)]&&saved[key(q)].wrong)||(mode==='unseen'&&!saved[key(q)]))}
function setTest(n){tid=n;mode='all';index=0;selected=null;checked=false;render()}
function setMode(m){mode=m;index=0;selected=null;checked=false;render()}
function choose(l){if(checked)return;selected=l;renderQuestion()}
function check(){const a=list();let q=a[index];if(!q||!selected||checked)return;checked=true;let k=key(q),good=selected===q.answer;let old=saved[k]||{};saved[k]={choice:selected,correct:good,wrong:old.wrong||!good,tries:(old.tries||0)+1};persist();render()}
function next(){const a=list();if(index<a.length-1){index++;selected=null;checked=false;render()}else{index=0;selected=null;checked=false;render()}}
function prev(){if(index>0){index--;selected=null;checked=false;render()}}
function jump(){const n=Number(document.getElementById('jumpNumber').value);let ix=list().findIndex(q=>q.n===n);if(ix>=0){index=ix;checked=false;selected=null;render()}}
function render(){const t=test();document.getElementById('menu').innerHTML=DATA.map(v=>`<button class="test ${v.id===tid?'active':''}" onclick="setTest(${v.id})"><span class="num">${v.id}</span><span>${esc(v.name)}<div class="tiny">${v.items.length} câu</div></span></button>`).join('');document.getElementById('title').textContent=`Test ${tid} · ${t.name}`;document.getElementById('subtitle').textContent=`${t.items.length} câu trích xuất từ tài liệu, giữ nguyên số câu gốc.`;for(let m of ['all','wrong','unseen'])document.getElementById(({all:'normal',wrong:'wrong',unseen:'unseen'})[m]).classList.toggle('active',m===mode);let done=t.items.filter(q=>saved[key(q)]).length,correct=t.items.filter(q=>saved[key(q)]?.correct).length,wrong=t.items.filter(q=>saved[key(q)]?.wrong).length;document.getElementById('stats').innerHTML=`<span class="chip">✅ Đúng lần gần nhất: <b>${correct}</b></span><span class="chip">📝 Đã làm: <b>${done}/${t.items.length}</b></span><span class="chip">🔁 Từng sai: <b>${wrong}</b></span>`;document.getElementById('overall').textContent=`${Math.round(done/t.items.length*100)}% hoàn thành`;document.getElementById('fill').style.width=done/t.items.length*100+'%';const a=list();if(index>=a.length)index=Math.max(0,a.length-1);renderQuestion()}
function reasoning(q){const a=q.answer,chosen=q.opts[selected]||'',right=q.opts[a]||'',reading=tid===1;let type=tid===1?'Reading Comprehension':tid===2?'Paragraph Completion':tid===3?'Paragraph Summarizing':tid===4?'Appropriate Questions':tid===5?'Appropriate Answers':tid===6?'Making up a Story':tid===7?'Dialogue Completion':tid===8?'Proverbs':tid===9?'Idioms':'Slang';let desc={1:'Trở lại đoạn đọc, xác định câu văn làm bằng chứng. Phân biệt thông tin được nêu trực tiếp, suy luận hợp lý và điều mà bài không hề nói.',2:'Đọc câu trước và sau chỗ trống. Kiểm tra từ nối, đại từ thay thế, mạch nguyên nhân–kết quả và chủ đề xuyên suốt.',3:'Tìm ý chính được nhắc lại xuyên đoạn; loại đáp án chỉ nói về một chi tiết hoặc khái quát quá mức.',4:'Xác định thông tin được trả lời: người, thời gian, địa điểm, lý do hay cách thức. Sau đó kiểm tra thì, chủ ngữ và trợ động từ.',5:'Tìm ý định giao tiếp của câu hỏi: đề nghị, xác nhận, xin lỗi, cảm ơn hay hỏi thông tin. Câu trả lời phải phù hợp ngữ nghĩa và thì.',6:'Xác định câu mở đầu (giới thiệu nhân vật/hoàn cảnh), trình tự thời gian, đại từ chỉ lại và câu kết. Đối chiếu từng chuỗi với phương án.',7:'Xem lượt nói ngay trước và sau chỗ trống. Phương án đúng phải vừa đúng ngữ pháp vừa tạo hội thoại tự nhiên.',8:'Nhận diện cấu trúc cố định của câu tục ngữ; xét ý nghĩa của cả câu, không dịch máy móc từng từ.',9:'Hiểu thành ngữ như một đơn vị nghĩa; đừng suy ra nghĩa bằng cách cộng nghĩa đen các từ.',10:'Xác định từ lóng phù hợp sắc thái và hoàn cảnh; lưu ý mức độ trang trọng và cách dùng tự nhiên.'}[tid];const query=reading?'Câu nào trong đoạn văn là bằng chứng trực tiếp? Lựa chọn của em có thêm thông tin nào không được nêu?':`Vì sao “${chosen.replace(/["<>]/g,'').slice(0,75)}” không phù hợp bằng “${right.replace(/["<>]/g,'').slice(0,75)}” trong ngữ cảnh này?`;return `<div class="feedback ${selected===a?'good':'bad'}"><h3>${selected===a?'✓ Chính xác':'✗ Cần xem lại lập luận'}</h3><p><b>Đáp án theo file Key:</b> ${esc(a)} — ${esc(right)}</p><p><b>Em đã chọn:</b> ${esc(selected)} — ${esc(chosen)}</p><p><b>Bước 1 · Cách suy luận (${esc(type)}):</b> ${desc}</p>${reading?`<p><b>Bước 2 · Truy ngược bằng chứng:</b> Xem đoạn văn phía trên, tìm chi tiết trùng nghĩa với đáp án. Chú ý bẫy diễn đạt quá tuyệt đối như “always”, “only”, “never”.</p>`:`<p><b>Bước 2 · Phương pháp loại trừ:</b> So sánh nghĩa đầy đủ của phương án đúng và đáp án đã chọn, chú ý từ khóa, tình huống và chức năng của từng câu.</p>`}<p><b>Câu hỏi Socrates:</b> ${esc(query)}</p><p class="tiny">Đây là khung hướng dẫn suy luận theo dạng bài, không phải lời giải chuyên biệt đã thẩm định cho từng câu.</p></div>`}
function renderQuestion(){const a=list(),root=document.getElementById('content');if(!a.length){root.innerHTML=`<div class="paper empty">${mode==='wrong'?'Chưa có câu sai trong Test này.':mode==='unseen'?'Bạn đã làm tất cả câu của Test này.':'Chưa có câu hợp lệ.'}</div>`;return}let q=a[index];let opts=Object.entries(q.opts).sort(([x],[y])=>x.localeCompare(y));const pa=(tid===1 && q.passage)?`<div class="passage"><b>📖 Đoạn đọc để trả lời câu hỏi</b>\n\n${esc(q.passage)}</div>`:'';root.innerHTML=`<article class="paper"><div class="navtop"><span class="pill">Câu ${q.n} · Trang PDF ${q.page}</span><span class="tiny">${index+1}/${a.length}</span></div>${pa}<div class="question">${esc(q.q)}</div>${opts.map(([l,v])=>`<button class="opt ${selected===l?'selected':''} ${checked&&l===q.answer?'correct':''} ${checked&&selected===l&&l!==q.answer?'wrong':''}" onclick="choose('${l}')" ${checked?'disabled':''}><span class="letter">${l}</span><span>${esc(v)}</span></button>`).join('')}${checked?reasoning(q):''}<div class="actions"><button class="btn secondary" onclick="prev()" ${index===0?'disabled':''}>← Câu trước</button>${!checked?`<button class="btn" onclick="check()" ${!selected?'disabled':''}>Kiểm tra đáp án ↵</button>`:`<button class="btn" onclick="next()">${index===a.length-1?'Quay lại đầu':'Câu tiếp theo →'}</button>`}<div class="jump"><span class="tiny">Tới câu</span><input id="jumpNumber" type="number" min="1" placeholder="Số câu"><button class="btn secondary" onclick="jump()">Đi</button></div></div></article>`}
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;const a=list(),q=a[index];if(!q)return;let letters=Object.keys(q.opts).sort();if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();let n=Math.max(0,letters.indexOf(selected));choose(letters[(n+(e.key==='ArrowDown'?1:letters.length-1))%letters.length])}else if(/^[1-5]$/.test(e.key))choose(letters[Number(e.key)-1]);else if(e.key==='Enter'){e.preventDefault();checked?next():check()}});
render();
