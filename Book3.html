:root{font-family:Inter,system-ui,'Segoe UI',sans-serif;background:#f5f7fb;color:#172334}*{box-sizing:border-box}body{margin:0}.layout{display:grid;grid-template-columns:292px 1fr;min-height:100vh}aside{background:#fff;border-right:1px solid #e4e9f1;padding:26px 17px;position:sticky;top:0;max-height:100vh;overflow:auto}.logo{font-weight:850;font-size:23px;color:#0b6585;letter-spacing:-.7px}.tiny{color:#64748b;font-size:13px}.lab{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#8293a5;margin:26px 10px 10px;font-weight:800}.test{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:13px 10px;margin:3px 0;color:#25374b;cursor:pointer;font:inherit}.test.active{background:#e8f5fc;color:#056587;font-weight:800}.num{background:#eaf0f6;padding:6px 9px;border-radius:8px;font-weight:800;font-size:12px}.test.active .num{background:#c4eafa}main{padding:32px 5vw;max-width:1180px;width:100%;margin:auto}.eyebrow{font-size:13px;font-weight:750;color:#057196;letter-spacing:1.5px;text-transform:uppercase}h1{font-size:clamp(24px,3vw,37px);margin:8px 0}header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chip{padding:9px 12px;border-radius:9px;background:#fff;border:1px solid #e4eaf1;font-size:13px}.bar{height:9px;border-radius:10px;background:#e5edf4;overflow:hidden;margin-bottom:22px}.fill{height:100%;background:#1d96bd;transition:width .2s}.paper{background:#fff;border:1px solid #e0e7ee;box-shadow:0 14px 45px #17304b0b;border-radius:20px;padding:clamp(20px,3.5vw,38px)}.passage{white-space:pre-wrap;line-height:1.8;background:#f3f7fc;color:#35485b;border-left:4px solid #58a9c6;padding:20px;border-radius:10px;margin-bottom:25px;font-size:15px;max-height:340px;overflow:auto}.question{font-size:19px;line-height:1.65;font-weight:650;white-space:pre-wrap;margin:15px 0 22px}.opt{width:100%;text-align:left;display:flex;align-items:flex-start;gap:12px;padding:14px 15px;margin:9px 0;background:#fff;border:1.5px solid #dae4ef;border-radius:12px;font-size:15px;line-height:1.5;cursor:pointer;color:#203245}.opt .letter{flex:none;font-weight:800;background:#edf3f8;border-radius:7px;padding:4px 8px}.opt.selected{border-color:#1689b6;background:#eef9ff}.opt.correct{border-color:#209a63;background:#e9f9ee}.opt.wrong{border-color:#d95c62;background:#fff0f0}.opt:disabled{cursor:default}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:24px}.btn{border:0;border-radius:10px;padding:12px 18px;background:#087aa4;color:white;font-weight:750;cursor:pointer;font-size:14px}.btn.secondary{background:#e9f1f7;color:#20516c}.btn:disabled{opacity:.4;cursor:not-allowed}.feedback{border-radius:12px;padding:20px;margin-top:23px;background:#f0f7fc;line-height:1.7}.feedback.good{background:#eaf9f0}.feedback.bad{background:#fff4f2}.feedback h3{margin:0 0 8px;font-size:17px}.feedback p{margin:8px 0}.navtop{display:flex;gap:10px;align-items:center;justify-content:space-between}.pill{background:#e6f5fa;border-radius:30px;color:#087297;padding:7px 12px;font-size:12px;font-weight:800}.hint{font-size:12px;color:#718096;margin-top:24px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tab{border:1px solid #d6e4ee;background:#fff;padding:9px 13px;border-radius:9px;cursor:pointer}.tab.active{background:#137ea5;color:white}.jump{display:flex;gap:8px;align-items:center}.jump input{max-width:85px;padding:10px;border:1px solid #cbd8e4;border-radius:9px}.empty{padding:45px 20px;text-align:center;color:#607185}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{position:static;max-height:none;padding:15px}.menu{display:flex;overflow:auto;gap:8px}.test{min-width:180px;margin:0}main{padding:20px 13px}header{align-items:start}.paper{padding:18px}}
</style></head><body><div class="layout"><aside><div class="logo">✦ English Test Lab</div><div class="tiny">BOOK 3 · HỌC & CHỮA LỖI</div><div class="lab">CHỌN CHUYÊN ĐỀ</div><div class="menu" id="menu"></div><div class="hint">Tự lưu kết quả trên trình duyệt. Không cần mạng.</div></aside><main><header><div><div class="eyebrow">Book 3 • Practice & Reasoning</div><h1 id="title"></h1><div class="tiny" id="subtitle"></div></div><div class="pill" id="overall"></div></header><div class="stats" id="stats"></div><div class="bar"><div class="fill" id="fill"></div></div><div class="tabs"><button class="tab active" id="normal" onclick="setMode('all')">Luyện toàn bộ</button><button class="tab" id="wrong" onclick="setMode('wrong')">Luyện câu sai</button><button class="tab" id="unseen" onclick="setMode('unseen')">Câu chưa làm</button></div><div id="content"></div><div class="hint">Điều khiển: ↑ ↓ chọn đáp án · 1–5 chọn nhanh · Enter kiểm tra/chuyển câu. Dữ liệu đối chiếu: Book 3 và Book 3 – Key.</div></main></div><script>
const DATA=[{"id": 1, "name": "Reading Comprehension", "items": [{"n": 1, "q": "In Mr. Wilson’s opinion, horror films _____.", "opts": {"A": "cost more than other kinds of films.", "B": "are more popular among the elderly than among the young.", "C": "should be banned altogether.", "D": "are less damaging to young people that films of violent crime.", "E": "have recently ceased to appeal to the young."}, "context": "", "page": 2, "answer": "D", "passage": "In an interview yesterday Mr. Wilson was questioned about the harmful effects of horror movies on teenagers. He argued that such effects were often exaggerated and claimed that other types of films were far more dangerous for young people. When asked to prove this, he pointed out that horror films were often set in unreal situations and were clearly not to be taken seriously. In contrast, he claimed that films showing violent crime were often set in everyday life, and were therefore more damaging."}, {"n": 2, "q": "For Mr. Wilson the main difference between a horror film and one showing violent crime is that the former _____.", "opts": {"A": "is mainly concerned with everyday situations.", "B": "is liked by the young, and the latter by the old.", "C": "is unrelated to real life, whereas the latter is.", "D": "is less expensive to produce than the latter.", "E": "rarely receives any attention from the young."}, "context": "", "page": 2, "answer": "C", "passage": "In an interview yesterday Mr. Wilson was questioned about the harmful effects of horror movies on teenagers. He argued that such effects were often exaggerated and claimed that other types of films were far more dangerous for young people. When asked to prove this, he pointed out that horror films were often set in unreal situations and were clearly not to be taken seriously. In contrast, he claimed that films showing violent crime were often set in everyday life, and were therefore more damaging."}, {"n": 3, "q": "The interviewer wanted to find out whether _____.", "opts": {"A": "young people were being harmed by horror films.", "B": "Mr. Wilson had himself been affected by horror films.", "C": "Mr. Wilson preferred horror films to films of violence.", "D": "people were seriously objecting to horror films.", "E": "the effects of crime films were being exaggerated. The famous Tower of London was built as a fortress by William the Conqueror.  Early in the Middle Ages the kings used it as a palace; later on it was turned into a prison, but only distinguished prisoners, including statesmen and princes, were held there. Today the Tower is a national museum, where, among other things, the jewelry of the English kings and queens is on display."}, "context": "", "page": 2, "answer": "A", "passage": "In an interview yesterday Mr. Wilson was questioned about the harmful effects of horror movies on teenagers. He argued that such effects were often exaggerated and claimed that other types of films were far more dangerous for young people. When asked to prove this, he pointed out that horror films were often set in unreal situations and were clearly not to be taken seriously. In contrast, he claimed that films showing violent crime were often set in everyday life, and were therefore more damaging."}, {"n": 4, "q": "It is obvious from the passage that the functions of the Tower of London _____.", "opts": {"A": "were all established by William the Conqueror.", "B": "have always been controlled by the kings.", "C": "have varied greatly over the centuries.", "D": "are all of a military nature.", "E": "have not changed at all since the Middle Ages."}, "context": "", "page": 2, "answer": "C", "passage": "The famous Tower of London was built as a fortress by William the Conqueror. Early in the Middle Ages the kings used it as a palace; later on it was turned into a prison, but only distinguished prisoners, including statesmen and princes, were held there. Today the Tower is a national museum, where, among other things, the jewelry of the English kings and queens is on display."}, {"n": 5, "q": "We learn from the passage that the Tower _____.", "opts": {"A": "was not originally intended to be a fortress.", "B": "was never a prison for ordinary people.", "C": "is still a unique example of medieval architecture.", "D": "was never a residence of English kings.", "E": "functions today only as a jewelers museum."}, "context": "", "page": 2, "answer": "B", "passage": "The famous Tower of London was built as a fortress by William the Conqueror. Early in the Middle Ages the kings used it as a palace; later on it was turned into a prison, but only distinguished prisoners, including statesmen and princes, were held there. Today the Tower is a national museum, where, among other things, the jewelry of the English kings and queens is on display."}, {"n": 6, "q": "William the Conqueror’s original purpose in building the Tower of London _____.", "opts": {"A": "was one of defense", "B": "was to exhibit his valuable jewellery.", "C": "was strongly criticized later in the Middle Ages.", "D": "remains unknown even now.", "E": "is still being debated among historians."}, "context": "", "page": 2, "answer": "A", "passage": "The famous Tower of London was built as a fortress by William the Conqueror. Early in the Middle Ages the kings used it as a palace; later on it was turned into a prison, but only distinguished prisoners, including statesmen and princes, were held there. Today the Tower is a national museum, where, among other things, the jewelry of the English kings and queens is on display."}, {"n": 7, "q": "The passage emphasizes that whatever goes on in the world today _____.", "opts": {"A": "is quickly forgotten by the majority.", "B": "only concerns the sociologist.", "C": "first makes the headlines in the press.", "D": "is of great interest to everyone.", "E": "can easily be ignored by people in power."}, "context": "", "page": 2, "answer": "D", "passage": "Never before in history have people been so aware of what is going on in the world. Television, newspapers and radio keep us continually informed and stimulate our interest. The sociologist’s interest in the world around him is intense, for society is his field of study. Indeed, he needs to know what is happening in society; he wants to know what makes the social world what it is, how it is organized, why it changes in the ways that it does. Such knowledge is valuable not only for those who make great decisions, but also for you, since this is the world in which you live and make your way."}, {"n": 8, "q": "It is pointed out in the passage that, among other things, sociologists are very much interested in _____.", "opts": {"A": "our reaction to their studies.", "B": "the effect of television on education.", "C": "the reasons for social change.", "D": "how people make a living in the world.", "E": "environmental problems."}, "context": "", "page": 2, "answer": "C", "passage": "Never before in history have people been so aware of what is going on in the world. Television, newspapers and radio keep us continually informed and stimulate our interest. The sociologist’s interest in the world around him is intense, for society is his field of study. Indeed, he needs to know what is happening in society; he wants to know what makes the social world what it is, how it is organized, why it changes in the ways that it does. Such knowledge is valuable not only for those who make great decisions, but also for you, since this is the world in which you live and make your way."}, {"n": 9, "q": "One may conclude from the passage that the studies made by sociologists _____.", "opts": {"A": "are extremely useful both to decision makers and to ordinary people.", "B": "are of little general interest.", "C": "receive a lot of attention from the media.", "D": "are primarily intended for students of sociology.", "E": "do not adequately reflect real conditions in the world. Every summer many people, girls and women as well as boys and men, try to swim from England to France or from France to England. The distance at the nearest points is only about twenty miles, but because of the strong currents the distance that must be swum is usually twice as far. The first man to succeed in swimming across the Channel was Captain Webb, an Englishman. This was in August 1875. He landed in France 21 hours 45 minutes after entering the water at Dover. Since then there have been many successful swims and the time has been shortened. One French swimmer crossed in 11 hours and 5 minutes."}, "context": "", "page": 2, "answer": "A", "passage": "Never before in history have people been so aware of what is going on in the world. Television, newspapers and radio keep us continually informed and stimulate our interest. The sociologist’s interest in the world around him is intense, for society is his field of study. Indeed, he needs to know what is happening in society; he wants to know what makes the social world what it is, how it is organized, why it changes in the ways that it does. Such knowledge is valuable not only for those who make great decisions, but also for you, since this is the world in which you live and make your way."}, {"n": 10, "q": "Swimming the Channel is not as easy as it might seem _____.", "opts": {"A": "as the distance between the two counties is far too much.", "B": "and it always takes more or less 20 hours.", "C": "and only two people have managed to do it so far.", "D": "so few people even try to swim it.", "E": "for there are very strong currents."}, "context": "", "page": 2, "answer": "E", "passage": "Every summer many people, girls and women as well as boys and men, try to swim from England to France or from France to England. The distance at the nearest points is only about twenty miles, but because of the strong currents the distance that must be swum is usually twice as far. The first man to succeed in swimming across the Channel was Captain Webb, an Englishman. This was in August 1875. He landed in France 21 hours 45 minutes after entering the water at Dover. Since then there have been many successful swims and the time has been shortened. One French swimmer crossed in 11 hours and 5 minutes."}, {"n": 11, "q": "The first time anyone swam across the Channel _____.", "opts": {"A": "was in the last century.", "B": "was when England and France organized a swimming competition.", "C": "no one really believed him.", "D": "he was helped by favorable currents.", "E": "he reached Dover just before 10 in the evening."}, "context": "", "page": 2, "answer": "A", "passage": "Every summer many people, girls and women as well as boys and men, try to swim from England to France or from France to England. The distance at the nearest points is only about twenty miles, but because of the strong currents the distance that must be swum is usually twice as far. The first man to succeed in swimming across the Channel was Captain Webb, an Englishman. This was in August 1875. He landed in France 21 hours 45 minutes after entering the water at Dover. Since then there have been many successful swims and the time has been shortened. One French swimmer crossed in 11 hours and 5 minutes."}, {"n": 12, "q": "The time Captain Webb needed to swim across the Channel _____.", "opts": {"A": "was unbelievably short.", "B": "has since been nearly reduced to half", "C": "still remains a record.", "D": "was thought to be far too long.", "E": "hasn’t been equaled by any French swimmer."}, "context": "", "page": 2, "answer": "B", "passage": "Every summer many people, girls and women as well as boys and men, try to swim from England to France or from France to England. The distance at the nearest points is only about twenty miles, but because of the strong currents the distance that must be swum is usually twice as far. The first man to succeed in swimming across the Channel was Captain Webb, an Englishman. This was in August 1875. He landed in France 21 hours 45 minutes after entering the water at Dover. Since then there have been many successful swims and the time has been shortened. One French swimmer crossed in 11 hours and 5 minutes."}, {"n": 13, "q": "It is only recently that _____.", "opts": {"A": "important scientific studies about the Southern Hemisphere have been carried out.", "B": "scientists have been seriously interested in fossils.", "C": "a dinosaur fossil has been discovered in Antarctica.", "D": "some new facts about the Northern Hemisphere have come to light.", "E": "Antarctica has been discovered."}, "context": "", "page": 3, "answer": "C", "passage": "A new discovery of a dinosaur fossil in Antarctica has confirmed the idea that dinosaurs lived not only in the Northern Hemisphere but in the Southern Hemisphere as well. Up until this discovery, scientists had found dinosaur remains on every continent except Antarctica. This new discovery now confirms the idea that dinosaurs were distributed worldwide. If the dinosaur fossil is shown to be related to other dinosaurs of the same period in South America, it will also support the idea that South America and Antarctica were once linked together."}, {"n": 14, "q": "One can understand from the passage that _____.", "opts": {"A": "dinosaurs, at one time in the past, lived in both hemispheres.", "B": "dinosaurs were in fact, more commonly found in the Southern Hemisphere.", "C": "scientists had long since realized that dinosaurs had actually lived in Antarctica.", "D": "the dinosaur fossil, discovered in Antarctica, was significantly different from those found in other continents.", "E": "the discovery of the dinosaur fossil in Antarctica was actually of little importance to scientists."}, "context": "", "page": 3, "answer": "A", "passage": "A new discovery of a dinosaur fossil in Antarctica has confirmed the idea that dinosaurs lived not only in the Northern Hemisphere but in the Southern Hemisphere as well. Up until this discovery, scientists had found dinosaur remains on every continent except Antarctica. This new discovery now confirms the idea that dinosaurs were distributed worldwide. If the dinosaur fossil is shown to be related to other dinosaurs of the same period in South America, it will also support the idea that South America and Antarctica were once linked together."}, {"n": 15, "q": "It is hoped that the discovery of the dinosaur fossil in Antarctica _____.", "opts": {"A": "would contribute significantly to our knowledge of the Northern Hemisphere.", "B": "will throw further light on the existence of dinosaurs in the past.", "C": "would lead to further similar discoveries in the Southern Hemisphere.", "D": "could answer the question whether South America and Antarctica were originally connected.", "E": "will attract more scientists to this type of work A popular method of treating frozen fingers and toes in very cold, even freezing weather is to slowly rewarm them or rub them with snow. The best treatment, however, is not slow rewarming but rapid rewarming. Putting the frozen fingers or toes in a warm bath or using a hot water bottle are both good ways to treat them. Hot drinks to warm the body from within are also helpful. One must be careful about burning the skin, however. The temperature of any heat applied should not be greater than 43 C."}, "context": "", "page": 3, "answer": "D", "passage": "A new discovery of a dinosaur fossil in Antarctica has confirmed the idea that dinosaurs lived not only in the Northern Hemisphere but in the Southern Hemisphere as well. Up until this discovery, scientists had found dinosaur remains on every continent except Antarctica. This new discovery now confirms the idea that dinosaurs were distributed worldwide. If the dinosaur fossil is shown to be related to other dinosaurs of the same period in South America, it will also support the idea that South America and Antarctica were once linked together."}, {"n": 16, "q": "The main concern of the passage is _____.", "opts": {"A": "why frozen fingers and toes should be slowly rewarmed.", "B": "how to keep adequately warm in the winter.", "C": "how to treat fingers and toes that have been frozen.", "D": "the dangers of freezing weather for the body.", "E": "why one should have plenty of hot drinks in winter."}, "context": "", "page": 3, "answer": "C", "passage": "A popular method of treating frozen fingers and toes in very cold, even freezing weather is to slowly rewarm them or rub them with snow. The best treatment, however, is not slow rewarming but rapid rewarming. Putting the frozen fingers or toes in a warm bath or using a hot water bottle are both good ways to treat them. Hot drinks to warm the body from within are also helpful. One must be careful about burning the skin, however. The temperature of any heat applied should not be greater than 43 C."}, {"n": 17, "q": "It is pointed out in the passage that _____.", "opts": {"A": "the use of hot water bottles to rewarm the body is not advisable.", "B": "one should try to rewarm frozen fingers and toes fairly rapidly.", "C": "in rewarming the body the higher the temperature the better the result is.", "D": "people should be warned not to go out in freezingly cold weather.", "E": "one should take a bath as often as possible in winter."}, "context": "", "page": 3, "answer": "B", "passage": "A popular method of treating frozen fingers and toes in very cold, even freezing weather is to slowly rewarm them or rub them with snow. The best treatment, however, is not slow rewarming but rapid rewarming. Putting the frozen fingers or toes in a warm bath or using a hot water bottle are both good ways to treat them. Hot drinks to warm the body from within are also helpful. One must be careful about burning the skin, however. The temperature of any heat applied should not be greater than 43 C."}, {"n": 18, "q": "The author warns that _____.", "opts": {"A": "the minimum temperature required is 43 C.", "B": "in rewarming the body, care must be taken not to burn the skin.", "C": "one should never rub frozen fingers and toes with snow.", "D": "hot drinks must not be taken in immediately.", "E": "recovery cannot be as rapid as one would expect."}, "context": "", "page": 3, "answer": "B", "passage": "A popular method of treating frozen fingers and toes in very cold, even freezing weather is to slowly rewarm them or rub them with snow. The best treatment, however, is not slow rewarming but rapid rewarming. Putting the frozen fingers or toes in a warm bath or using a hot water bottle are both good ways to treat them. Hot drinks to warm the body from within are also helpful. One must be careful about burning the skin, however. The temperature of any heat applied should not be greater than 43 C."}, {"n": 19, "q": "In the passage it is emphasized that, in America _____.", "opts": {"A": "more and more people of all ages are now using bicycles.", "B": "few college students can afford to run a car.", "C": "no executive feels he can cycle to work.", "D": "most parents feel it is dangerous for children to cycle to school.", "E": "a great many traffic jams are being caused by cyclists."}, "context": "", "page": 3, "answer": "A", "passage": "Bicycling in America has been growing at an amazing rate. Bicycles used to be sold to parents for their children. Now those same parents are buying them for themselves, as well as for their children. And grandparents are cycling, too. Moreover, people don’t simply cycle for fun and for the exercise. Many young executives ride bikes to work as an alternative to adding to the pollution of cities, and to fighting traffic jams, while college and high school students find bikes an economical alternative to cars or buses."}, {"n": 20, "q": "Cycling is also a hobby that _____.", "opts": {"A": "attracts fewer and fewer people.", "B": "is getting increasingly more expensive.", "C": "only appeals to the young.", "D": "has a high-accident rate.", "E": "the whole family can enjoy."}, "context": "", "page": 3, "answer": "E", "passage": "Bicycling in America has been growing at an amazing rate. Bicycles used to be sold to parents for their children. Now those same parents are buying them for themselves, as well as for their children. And grandparents are cycling, too. Moreover, people don’t simply cycle for fun and for the exercise. Many young executives ride bikes to work as an alternative to adding to the pollution of cities, and to fighting traffic jams, while college and high school students find bikes an economical alternative to cars or buses."}, {"n": 21, "q": "From the passage we can infer that _____.", "opts": {"A": "different people have different reasons for preferring bicycles to a car.", "B": "most Americans can no longer afford to run a car.", "C": "young children should not be allowed to cycle on main roads.", "D": "a lot of parents are borrowing their children’s bicycles.", "E": "cycling is fun in the country but not in a city. On the day of my first piano recital,  I became more and more nervous. To help me calm down, my piano teacher told me to place several cabbages in the room where I practiced. I was so eager to get over my nerves that  I was willing to try anything. For the next few hours,  I played to an audience of cabbages. When the time of the recital finally arrived,  I was still terribly nervous. My hands felt like ice. When I finally walked across the stage, I looked out into the dark audience.  I could not see anyone! All those people out there could just as easily have been cabbages. As  I sat down to play, my hands relaxed. Before I knew it, I had played all my pieces without a mistake. For the first time, the cabbage heads applauded."}, "context": "", "page": 3, "answer": "A", "passage": "Bicycling in America has been growing at an amazing rate. Bicycles used to be sold to parents for their children. Now those same parents are buying them for themselves, as well as for their children. And grandparents are cycling, too. Moreover, people don’t simply cycle for fun and for the exercise. Many young executives ride bikes to work as an alternative to adding to the pollution of cities, and to fighting traffic jams, while college and high school students find bikes an economical alternative to cars or buses."}, {"n": 22, "q": "On the day of the recital the music teacher _____.", "opts": {"A": "advised the writer to put cabbages in the room where he practiced and play for them.", "B": "warned the writer not to look at the audience.", "C": "had no patience with the writer because he was nervous too.", "D": "felt nearly as nervous about the recital as the writer did.", "E": "couldn’t think of a way of helping the writer to stay calm."}, "context": "", "page": 3, "answer": "A", "passage": "On the day of my first piano recital, I became more and more nervous. To help me calm down, my piano teacher told me to place several cabbages in the room where I practiced. I was so eager to get over my nerves that I was willing to try anything. For the next few hours, I played to an audience of cabbages. When the time of the recital finally arrived, I was still terribly nervous. My hands felt like ice. When I finally walked across the stage, I looked out into the dark audience. I could not see anyone! All those people out there could just as easily have been cabbages. As I sat down to play, my hands relaxed. Before I knew it, I had played all my pieces without a mistake. For the first time, the cabbage heads applauded."}, {"n": 23, "q": "The writer stopped feeling nervous _____.", "opts": {"A": "because he had practiced a great deal", "B": "when the audience began to applaud", "C": "before he walked onto the stage", "D": "as soon as the concert was over", "E": "when he found he couldn’t see the audience."}, "context": "", "page": 3, "answer": "E", "passage": "On the day of my first piano recital, I became more and more nervous. To help me calm down, my piano teacher told me to place several cabbages in the room where I practiced. I was so eager to get over my nerves that I was willing to try anything. For the next few hours, I played to an audience of cabbages. When the time of the recital finally arrived, I was still terribly nervous. My hands felt like ice. When I finally walked across the stage, I looked out into the dark audience. I could not see anyone! All those people out there could just as easily have been cabbages. As I sat down to play, my hands relaxed. Before I knew it, I had played all my pieces without a mistake. For the first time, the cabbage heads applauded."}, {"n": 24, "q": "In the passage  it is explained that _____.", "opts": {"A": "the writer was always nervous on the day of a concert", "B": "the writer played to some cabbages because there was no real audience", "C": "the writer finally began to relax just before he began his recital", "D": "the room was so cold the writer’s hands felt like ice", "E": "the writer always practiced in a room where there were cabbages"}, "context": "", "page": 3, "answer": "C", "passage": "On the day of my first piano recital, I became more and more nervous. To help me calm down, my piano teacher told me to place several cabbages in the room where I practiced. I was so eager to get over my nerves that I was willing to try anything. For the next few hours, I played to an audience of cabbages. When the time of the recital finally arrived, I was still terribly nervous. My hands felt like ice. When I finally walked across the stage, I looked out into the dark audience. I could not see anyone! All those people out there could just as easily have been cabbages. As I sat down to play, my hands relaxed. Before I knew it, I had played all my pieces without a mistake. For the first time, the cabbage heads applauded."}, {"n": 25, "q": "As  it is pointed out in the passage, mountaineering is a sport _____.", "opts": {"A": "in which nobody wins and nobody loses", "B": "that is not suitable for the old", "C": "in which technique is not easy to learn", "D": "which can be  people applied for the job but, except for Jenny none were suitable. Jenny, however, was just what he wanted."}, "context": "", "page": 8, "answer": "A", "passage": "By the end of her first day at work Janet was terribly tired. She was also very happy, for she knew she had made a good beginning. Mr. Taylor was clearly very pleased with the way she had answered his telephone and looked after his visitors. He had also praised her typing. ‘Tomorrow,” she thought happily, “it will be much easier.”"}, {"n": 82, "q": "Dr. Maine _____.", "opts": {"A": "is obviously, a very rich man.", "B": "doesn’t get on well with people.", "C": "knew what sort of person he needed for his clinic.", "D": "works only on Saturday mornings.", "E": "is himself a cheerful and attractive person."}, "context": "", "page": 8, "answer": "C", "passage": "Dr. Maine advertised for someone to work as a receptionist at his dental clinic. He wanted someone who was cheerful and attractive and also willing to work on Saturdays. Several people applied for the job but, except for Jenny none were suitable. Jenny, however, was just what he wanted."}, {"n": 83, "q": "Which of the following is a suitable TITLE for this passage?", "opts": {"A": "Training to be a Dentist", "B": "Dr. Maine and Others", "C": "The Right Receptionist", "D": "Working Hours", "E": "Advertisements"}, "context": "", "page": 8, "answer": "C", "passage": "Dr. Maine advertised for someone to work as a receptionist at his dental clinic. He wanted someone who was cheerful and attractive and also willing to work on Saturdays. Several people applied for the job but, except for Jenny none were suitable. Jenny, however, was just what he wanted."}, {"n": 84, "q": "Dr. Maine felt sure that _____.", "opts": {"A": "nobody would want to work on Saturday.", "B": "Jenny would be a good dentist.", "C": "Jenny wouldn’t agree to work for him.", "D": "Jenny was the right person for the job.", "E": "all of those who applied would be suitable. James has alway ment.", "C": "the writer describes the pleasure of catching fish at dawn.", "D": "the writer’s intention is to describe the movements of fish in a lake.", "E": "we see that the two friends are interested in catching a special kinds of fish."}, "context": "", "page": 9, "answer": "B", "passage": "“James and I set off an hour before sunset when it was getting cooler and the shadows were long. We took it in turns to row the little boat and moved slowly, following the edge of the lake, and looking rather lazily about us for fish. We had no intention of catching any, but it was pleasant to watch them swim so close to us.”"}, {"n": 95, "q": "The two friends _____.", "opts": {"A": "woke up early and went fishing.", "B": "got in their boat and rowed across the lake.", "C": "were too lazy to row the boat together.", "D": "took the boat out to enjoy themselves rather than to catch fish.", "E": "stayed out in their boat until it was dark."}, "context": "", "page": 9, "answer": "D", "passage": "“James and I set off an hour before sunset when it was getting cooler and the shadows were long. We took it in turns to row the little boat and moved slowly, following the edge of the lake, and looking rather lazily about us for fish. We had no intention of catching any, but it was pleasant to watch them swim so close to us.”"}, {"n": 96, "q": "The writer and his friend enjoyed _____.", "opts": {"A": "catching fish after it was dark.", "B": "fishing late in the afternoon on a cool day.", "C": "watching the setting of the sun on the lake.", "D": "rowing together when the sun was setting.", "E": "observing the movements of fish around their boat. “John Fuller has really surprised us all. At school he seemed such a boring and ordinary boy. As far as I can remember, he made no close friends. I don’t think we actually disliked him, but we certainly ignored him.  I would really like to meet him again now. It’s clear from his wonderful films that he must be a most interesting man.”"}, "context" hotography that he began to neglect his school work. Soon a large part of his conversation was about photographs. When the newspapers came he examined the photographs first and said what was wrong with them, before starting to read the news."}, {"n": 102, "q": "Tom _____.", "opts": {"A": "read the news first and then examined the photographs.", "B": "always talked about his camera.", "C": "talked about photography more than anything else.", "D": "usually took beautiful pictures.", "E": "had his pictures published in the newspapers. Leslie comes from a big city. During the holiday she went to spend a week on her uncle’s farm.  It was her first visit there. Her uncle, who was very pleased to see his niece, did his best to make her stay an enjoyable one. On the farm she rode a horse, fed chickens ran in the fields and ate fruit fresh from the trees. She enjoyed her holiday so much that, when the day for her to return to the city came, she was very sad to leave."}, "context": "", "page": 9, "answer": "C", "passage": "Mr. Smith made a mistake when he gave his son Tom a camera. For soon Tom became so interested in photography that he began to neglect his school work. Soon a large part of his conversation was about photographs. When the newspapers came he examined the photographs first and said what was wrong with them, before starting to read the news."}, {"n": 103, "q": "Leslie‘s _____.", "opts": {"A": "holiday lasted for a week.", "B": "parents often sent her to the farm.", "C": "uncle left the farm and went to the city.", "D": "greatest pleasure was to ride a horse.", "E": "life on the farm was a very sad one."}, "context": "", "page": 9, "answer": "A", "passage": "Leslie comes from a big city. During the holiday she went to spend a week on her uncle’s farm. It was her first visit there. Her uncle, who was very pleased to see his niece, did his best to make her stay an enjoyable one. On the farm she rode a horse, fed chickens ran in the fields and ate fruit fresh from  his niece, did his best to make her stay an enjoyable one. On the farm she rode a horse, fed chickens ran in the fields and ate fruit fresh from the trees. She enjoyed her holiday so much that, when the day for her to return to the city came, she was very sad to leave."}, {"n": 106, "q": "Meteors that hit the Earth _____.", "opts": {"A": "are known as meteorites.", "B": "are called falling stars.", "C": "are found in the Hoba.", "D": "will land in Nambia.", "E": "bum up due to friction."}, "context": "", "page": 9, "answer": "A", "passage": "Occasionally during the night one can see meteors. They resemble streaks of light and for this reason are called falling stars. As meteors travel through space they sometimes fall into the Earth’s gravitational pull and the friction between these rocks and the atmosphere causes most of them to burn up before they reach the surface of the Earth. At times, however, very big pieces of meteors fall to Earth and although they are burned up to a large extent, some pieces do reach the surface. These are then called meteorites. The largest meteorite to have been founded is the Hoba meteorite. It was found in Nambia and weighs 60 tons."}, {"n": 107, "q": "The Earth’s atmosphere _____.", "opts": {"A": "has many meteors in it but we cannot see them.", "B": "prevents most meteors from falling into the Earth’s gravitational pull.", "C": "and the friction  it causes prevent many meteors from becoming meteorites.", "D": "attracts the large falling stars to the Earth.", "E": "is so hot that it burns up rocks easily."}, "context": "", "page": 9, "answer": "C", "passage": "Occasionally during the night one can see meteors. They resemble streaks of light and for this reason are called falling stars. As meteors travel through space they sometimes fall into the Earth’s gravitational pull and the friction between these rocks and the atmosphere causes most of them to burn up before they reach the surface of the Earth. At times, however, very big piec : "are vampires.", "B": "transmit many illnesses.", "C": "feed on a diet of insects.", "D": "are dangerous to man.", "E": "live in the Americas."}, "context": "", "page": 10, "answer": "C", "passage": "There are about 980 flying mammals referred to as bats. They are the only real flying mammals on Earth. Most bats feed on a diet of insects. Some feed on flowers and fruits, but the most interesting are the vampire bats of the Americas, which suck the blood of large birds and other mammals. Unfortunately, these vampire bats are capable of transmitting rabies and are for this reason considered dangerous. The other types of bats are of no danger to man and are even considered helpers of nature by way of their diet which helps control the insect population in various areas of the world. Although the misunderstood bat has represented fear and terror in the west, it is seen as a sign of good luck and long life in the east."}, {"n": 110, "q": "According to the passage the bat is misunderstood because _____.", "opts": {"A": "it is capable of transmitting rabies.", "B": "it has been associated with fear in the west.", "C": "its value as a natural enemy of insects is not generally known.", "D": "it is the only flying mammal.", "E": "animals are endangered by most bats."}, "context": "", "page": 10, "answer": "C", "passage": "There are about 980 flying mammals referred to as bats. They are the only real flying mammals on Earth. Most bats feed on a diet of insects. Some feed on flowers and fruits, but the most interesting are the vampire bats of the Americas, which suck the blood of large birds and other mammals. Unfortunately, these vampire bats are capable of transmitting rabies and are for this reason considered dangerous. The other types of bats are of no danger to man and are even considered helpers of nature by way of their diet which helps control the insect population in various areas of the world. Although the misunderstood bat has represented fear and terror in the wes
