s:15px;border:2px dashed #dccde7;padding:20px;background:linear-gradient(120deg,#fff9fc,#fffef5)}.grammar h3{margin:0 0 10px}.readingline{border-bottom:1px dashed #d7dfed;padding:12px 0;line-height:1.7}.readingline .hanzi{font-size:21px}.quiz{border:1px solid var(--line);padding:18px;border-radius:14px;background:white;margin-bottom:13px}.option{display:block;width:100%;padding:12px;text-align:left;background:#fbfcff;border:1px solid #dce3ed;border-radius:11px;margin:7px 0;color:var(--ink)}.option.sel{border:2px solid #4267ef;padding:11px;background:#edf2ff}.option.good{border-color:#24a17d;background:#e8f8ee}.option.bad{border-color:var(--red);background:#fff0f2}.feedback{background:#f2f5fb;border-radius:12px;padding:14px;margin:10px 0;line-height:1.8}.feedback.good{background:#e7f8f0}.feedback.bad{background:#fff0f2}.socrates{border-left:4px solid #daa34f;background:#fffaeb;padding:12px;margin-top:9px;border-radius:9px}textarea{width:100%;min-height:100px;padding:14px;border:1px solid #ccd5e5;border-radius:11px;line-height:1.7;resize:vertical}details{margin:12px 0}summary{color:#315ac4;cursor:pointer;font-weight:bold}.progress{height:9px;border-radius:10px;background:#e4eaf5;overflow:hidden}.progress>i{display:block;background:var(--blue);height:100%}.small{font-size:13px;color:#748198}.textnote{background:#fff9e5;padding:14px;border-radius:11px}.quizstats{padding:15px;border-radius:12px;background:#edf3ff;margin:14px 0}h2{margin:0 0 13px}h3{line-height:1.5}.empty{padding:24px;text-align:center}.voice{font-size:13px}.badge{background:#ffe4ed;color:#aa4669;border-radius:7px;padding:4px 9px;display:inline-block;font-size:12px;font-weight:bold}.qtitle{font-size:19px;line-height:1.7}.cover{background:linear-gradient(130deg,#fef1ef,#f2f2ff);border:2px dashed #e8c8cf;border-radius:16px;padding:18px;margin:12px 0}.cover .formula{margin-top:10px}.tabs{display:flex;flex-wrap:wrap;gap:8px}.alert{background:#fff9e7;border-radius:12px;padding:13px} @media(max-width:800px){.wr </style></head><body><header><span class="badge">新HSK教程 3 · LESSON 9</span><h1>打不好没关系</h1><div>Chơi không tốt cũng không sao · Học hiểu → luyện tập → tự chữa lỗi</div></header><div class="wrap"><nav id="nav"></nav><main id="main"></main></div><script>
const DB={"vocab": [["校园", "xiàoyuán", "khuôn viên trường"], ["卡", "kǎ", "thẻ"], ["球场", "qiúchǎng", "sân bóng"], ["为了", "wèile", "để; nhằm"], ["运动会", "yùndònghuì", "đại hội thể thao"], ["男生", "nánshēng", "nam sinh"], ["练", "liàn", "luyện tập"], ["参加", "cānjiā", "tham gia"], ["网球", "wǎngqiú", "quần vợt"], ["比赛", "bǐsài", "trận đấu; thi đấu"], ["练习", "liànxí", "luyện tập; bài tập"], ["好多", "hǎoduō", "rất nhiều"], ["几乎", "jīhū", "hầu như; gần như"], ["只是", "zhǐshì", "chỉ là; chỉ"], ["啤酒", "píjiǔ", "bia"], ["回", "huí", "lần (lượng từ chỉ sự kiện)"], ["紧张", "jǐnzhāng", "căng thẳng"], ["主要", "zhǔyào", "chủ yếu; chính"], ["受到", "shòudào", "chịu; nhận"], ["影响", "yǐngxiǎng", "ảnh hưởng"], ["得分", "défēn", "ghi điểm; điểm số"], ["体育", "tǐyù", "thể dục; thể thao"], ["世界", "shìjiè", "thế giới"], ["运动员", "yùndòngyuán", "vận động viên"], ["得到", "dédào", "nhận được; đạt được"], ["成绩", "chéngjì", "thành tích; kết quả"]], "readings": [{"title": "Bài khóa 1 – Gặp nhau tại thư viện", "where": "Trước cửa thư viện: 李文, 白家月", "lines": [["李文", "家月，对不起，我昨天忘了还你校园卡了。", "Gia Nguyệt, xin lỗi, hôm qua tôi quên trả thẻ trường cho bạn."], ["白家月", "没关系。你怎么这么快就过来了？", "Không sao. Sao bạn đến nhanh thế?"], ["李文", "我正在球场打球呢，接了你的电话就跑过来了。", "Tôi đang chơi bóng ở sân, nhận được điện thoại của bạn liền chạy qua."], ["白家月", "听说为了准备运动会，你们几个男生每天都练球。", "Nghe nói để chuẩn bị đại hội thể thao, mấy bạn nam các bạn ngày nào cũng tập bóng."], ["李文", "是啊！你打算参加运动会吗？", "Đúng vậy! Bạn dự định tham gia đại hội thể thao không?"], ["白家月", "我想参加网球比赛，最近一直在练习。", "Tôi muốn tham gia thi đấu quần vợt, gần đây luôn tập luyện."], ["李文", "好，到时候我去看你的比赛。", "Được, đến lúc ấy tôi đi xem bạn thi đấu."]]}, {"title": "Bài khóa 2 – Rủ nhau chơi cầu lông", "where": "Trong khuôn viên trường: 李文, 白家月", "lines": [["李文", "家月，你跟我们一起打羽毛球吧？", "Gia Nguyệt, bạn cùng chúng tôi chơi cầu lông nhé?"], ["白家月", "我好多年没打羽毛球了，几乎忘了怎么打了。", "Tôi đã nhiều năm không chơi cầu lông, gần như quên cách chơi rồi."], ["李文", "不是比赛，打不好没关系。", "Đâu phải thi đấu, đánh không hay cũng không sao."], ["白家月", "这么多同学一起打，如果总是接不住球，就太不好意思了。", "Nhiều bạn cùng chơi như thế, nếu cứ đỡ không được cầu thì ngại quá."], ["李文", "你想得太多了！大家打球只是为了锻炼身体。", "Bạn nghĩ nhiều quá rồi! Mọi người chơi bóng chỉ để rèn luyện sức khỏe thôi."], ["白家月", "我先自己练练吧，下周再跟你们一起打。", "Để tôi tự tập trước đã, tuần sau chơi cùng các bạn."], ["李文", "我在教天中打羽毛球，你可以过来跟我们一起练。", "Tôi đang dạy Thiên Trung chơi cầu lông, bạn có thể đến tập cùng chúng tôi."]]}, {"title": "Bài khóa 3 – Xem trận bóng đá", "where": "Tại nhà 李文: 李文, 白家月, 陈天中", "lines": [["陈天中", "足球比赛已经开始了，快过来看吧！", "Trận bóng đá đã bắt đầu rồi, mau lại đây xem!"], ["李文", "你们先看，冰箱里有啤酒和饮料，我去拿一下。", "Các bạn xem trước đi, trong tủ lạnh có bia và đồ uống, tôi đi lấy một chút."], ["白家月", "今天怎么回事？总是踢不进去！", "Hôm nay sao vậy? Cứ đá mãi không vào!"], ["陈天中", "几个老球员生病了，新球员第一次参加这么重要的比赛，太紧张了。", "Mấy cầu thủ kỳ cựu bị ốm, cầu thủ mới lần đầu dự trận quan trọng như vậy nên quá căng thẳng."], ["李文", "是啊，主要的球员没参加比赛，所以大家也都受到了影响。", "Đúng vậy, cầu thủ chủ chốt không tham gia nên mọi người đều bị ảnh hưởng."], ["白家月", "越看越着急。我不看了，你们告诉我得分吧。", "Càng xem càng sốt ruột. Tôi không xem nữa, các bạn báo tỷ số cho tôi nhé."]]}, {"title": "Bài khóa 4 – Olympic và vận động viên 刘长春", "where": "Tại nhà: 李文 chuẩn bị bài phát biểu", "lines": [["李文", "我喜欢看体育比赛，最爱看的就是奥运会。", "Tôi thích xem thi đấu thể thao, thích xem nhất là Olympic."], ["李文", "奥运会是世界上影响最大的体育比赛。", "Olympic là sự kiện thể thao có ảnh hưởng lớn nhất thế giới."], ["李文", "从1896年到2024年，每次奥运会都有非常多的运动员参加。", "Từ năm 1896 đến 2024, mỗi kỳ Olympic đều có rất nhiều vận động viên tham dự."], ["李文", "第一个参加奥运会的中国运动员是刘长春，他1932年参加了100米和200米短跑比赛。", "Vận động viên Trung Quốc đầu tiên tham gia Olympic là Lưu Trường Xuân; năm 1932 ông tham gia thi chạy 100 mét và 200 mét."], ["李文", "虽然他没有得到好成绩，但是他让世界认识了中国。", "Mặc dù ông không đạt thành tích cao, nhưng ông đã giúp thế giới biết đến Trung Quốc."]]}], "grammar": [{"name": "Câu mục đích 为了……", "formula": "为了 + mục đích，+ hành động", "meaning": "Để đạt mục đích nào đó const {vocab,readings,grammar,book,extra}=DB;
let page='home',ri=0,vm='hv',state={};try{state=JSON.parse(localStorage.getItem('HSK3_L9_fixed_2026')||'{}')}catch(e){};
for(const name of ['answer','graded','vanswer','vgraded','translation'])if(!state[name])state[name]={};
const save=()=>{try{localStorage.setItem('HSK3_L9_fixed_2026',JSON.stringify(state))}catch(e){}};
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs=[['home','🏠 Tổng quan'],['vocab','🀄 26 từ vựng'],['vquiz','🧩 Quiz từ vựng'],['grammar','📒 3 điểm ngữ pháp'],['reading','📖 4 bài khóa'],['translate','🌏 Luyện dịch'],['original','📝 Bài tập gốc'],['practice','🎯 30 câu mở rộng'],['mistakes','🔁 Ôn câu sai']];
function setPage(p){page=p;render();window.scrollTo(0,0)}function setRi(i){ri=i;render()}function setVM(m){vm=m;render()}
function speak(t){if(!('speechSynthesis'in window)){alert('Thiết bị không hỗ trợ giọng đọc.');return}speechSynthesis.cancel();let a=new SpeechSynthesisUtterance(t);a.lang='zh-CN';a.rate=.77;speechSynthesis.speak(a)}
function render(){document.getElementById('nav').innerHTML=tabs.map(([k,t])=>`<button class="${page===k?'active':''}" onclick="setPage('${k}')">${t}</button>`).join('');let a=document.getElementById('main');({home,vocab:showVocab,vquiz:showVQuiz,grammar:showGrammar,reading:showReading,translate:showTranslation,original:showExercises,practice:showExercises,mistakes:showExercises})[page](a)}
function home(a){let marks=Object.values(state.graded),done=marks.length,acc=marks.filter(Boolean).length;a.innerHTML=`<h2>Chào mừng đến HSK 3 – Bài 9 🚄</h2><p class="muted">Nội dung dựa trên trang 76–85 của giáo trình đính kèm. Quiz từ vựng và bài tập mở rộng có ghi rõ là nội dung biên soạn thêm.</p><div class="grid"><div class="stat">Từ vựng<strong>26</strong></div><div class="stat">Bài khóa<strong>4</strong></div><div class="stat">Đã làm<strong>${done}/40</strong><span class="small">Đúng ${acc}/${done||0}</span></div></div><div class="card"><h2>🧠 Tổng quan · Công thức trọng tâm</h2><p class="muted">Ba thẻ ngữ pháp hiển thị ngay dưới đây, bấm để học ví dụ và luyện tập.</p>${grammar.map((g,i)=>`<div class="cover"><h3>${i+1}. ${E(g.name)}</h3><div class="formula">${E(g.formula)}</div><p>${E(g.meaning)}</p><div class="hanzi">${E(g.example)}</div><p>${E(g.vi)}</p><button class="btn alt" onclick="ri=${i};setPage('grammar')">Học sâu chủ điểm này →</button></div>`).join('')}</div><div class="card"><h3>Lộ trình đề xuất</h3>① Học 26 từ → ② Quiz từ vựng → ③ Học 4 công thức → ④ Đọc và dịch 4 bài khóa → ⑤ Làm 10 câu sách → ⑥ Làm 30 câu mở rộng → ⑦ Ôn câu sai.<div class="toolbar"><button class="btn" onclick="setPage('vocab')">Bắt đầu học</button><button class="btn alt" onclick="setPage('original')">Làm bài gốc</button></div></div><div class="alert">Lưu ý: Tài liệu là trang scan; phần dịch tiếng Việt là bản tham khảo biên soạn. Chưa tích hợp audio gốc của sách.</div>`}
function showVocab(a){a.innerHTML=`<h2>🀄 26 từ vựng Bài 9</h2><p class="muted">Chữ Hán · Pinyin · nghĩa Việt · giọng đọc tiếng Trung của trình duyệt.</p><div class="toolbar"><input id="findv" placeholder="Tìm chữ Hán / Pinyin / nghĩa Việt" oninput="drawVocab(this.value)" style="padding:12px;border:1px solid #dbe1ed;border-radius:10px;max-width:350px;width:100%"><button class="btn" onclick="setPage('vquiz')">Luyện quiz →</button></div><div class="vgrid" id="vitems"></div>`;drawVocab('')}
function drawVocab(term){let g=document.getElementById('vitems');if(!g)return;g.innerHTML=vocab.filter(v=>v.join(' ').toLowerCase().includes(term.toLowerCase())).map(v=>`<div class="card"><div class="hanzi">${E(v[0])}</div><div class="py">${E(v[1])}</div><p>${E(v[2])}</p><button class="btn alt voice" onclick="speak('${E(v[0])}')">🔊 Nghe</button></div>`).join('')}
function vkey(i){return vm+'_'+i}function vopts(i){let inds=[i];for(let k=1;inds.length<4;k++){let j=(i+k*7)%vocab.length;if(!inds.includes(j))inds.push(j)}return inds.sort((a,b)=>((a*17+5)%29)-((b*17+5)%29))}
function showVQuiz(a){let n=vocab.filter((_,i)=>vkey(i) in state.vgraded).length,ok=vocab.filter((_,i)=>state.vgraded[vkey(i)]===true).length;a.innerHTML=`<h2>🧩 Quiz từ vựng · 26 từ</h2><p class="muted">3 chế độ: Hán → nghĩa, nghĩa → Hán, chữ Hán → Pinyin. 78 lượt câu hỏi.</p><div class="card"><div class="toolbar"><button class="pill ${vm==='hv'?'on':''}" onclick="setVM('hv')">Hán → Việt</button><button class="pill ${vm==='vh'?'on':''}" onclick="setVM('vh')">Việt → Hán</button><button class="pill ${vm==='hp'?'on':''}" onclick="setVM('hp')">Hán → Pinyin</button></div><b>Đã chấm ${n}/26 · Đúng ${ok}</b><div class="progress"><i style="width:${n/26*100}%"></i></div></div>${vocab.map((v,i)=>{let k=vkey(i),pick=state.vanswer[k],graded=k in state.vgraded,opts=vopts(i),show=j=>vm==='hv'?vocab[j][2]:vm==='vh'?vocab[j][0]:vocab[j][1];return `<div class="quiz"><span class="badge">Từ ${i+1}/26</span><div class="qtitle">${E(vm==='vh'?v[2]:v[0])}</div>${opts.map((j,n)=>`<button class="option ${pick===j?'sel':''} ${graded&&j===i?'good':''} ${graded&&pick===j&&j!==i?'bad':''}" onclick="chooseV(${i},${j})">${'ABCD'[n]}. ${E(show(j))}</button>`).join('')}<button class="btn" onclick="checkV(${i})">Chấm đáp án</button> <button class="btn alt" onclick="speak('${E(v[0])}')">🔊 Nghe</button>${graded?`<div class="feedback ${state.vgraded[k]?'good':'bad'}"><b>${state.vgraded[k]?'✅ Đúng':'❌ Sai'}</b><p><b>Feynman:</b> ${E(v[0])} đọc là <b>${E(v[1])}</b>, nghĩa <b>${E(v[2])}</b>.</p><div class="socrates"><b>Socrates:</b> Em thử đặt một câu ngắn có từ này trong tình huống đi tàu cao tốc?</div></div>`:''}</div>`}).join('')}`}
function chooseV(i,j){let k=vkey(i);state.vanswer[k]=j;delete state.vgraded[k];save();keep()}function checkV(i){let k=vkey(i);if(!(k in state.vanswer)){alert('Hãy chọn đáp án.');return}state.vgraded[k]=state.vanswer[k]===i;save();keep()}
function showGrammar(a){a.innerHTML=`<h2>📒 Ngữ pháp 1–3</h2><div class="toolbar">${grammar.map((g,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">${i+1}. ${E(g.name)}</button>`).join('')}</div>${(()=>{let g=grammar[Math.min(ri,2)];return `<div class="card grammar"><h2>${E(g.name)}</h2><div class="formula">${E(g.formula)}</div><h3>Ý nghĩa</h3><p>${E(g.meaning)}</p><h3>Ví dụ trong bài</h3><div class="hanzi">${E(g.example)}</div><p>${E(g.vi)}</p><p class="textnote"><b>Feynman:</b> ${E(g.tip)}</p><div class="socrates"><b>Câu hỏi Socrates:</b> Nếu thay cụm này bằng cách nói khác, sắc thái của người nói sẽ thay đổi như thế nào?</div></div>`})()}<button class="btn" onclick="setPage('practice')">Luyện vận dụng ngữ pháp →</button>`}
function showReading(a){let r=readings[ri%4];a.innerHTML=`<h2>📖 Đọc hiểu 4 bài khóa</h2><div class="toolbar">${readings.map((x,i)=>`<button class="pill ${i===ri?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div><div class="card"><h2>${E(r.title)}</h2><p class="muted">${E(r.where)}</p>${r.lines.map(([sp,cn,vi],i)=>`<div class="readingline"><div class="hanzi"><b>${E(sp)}：</b>${E(cn)}</div><button class="btn alt voice" onclick="speak('${E(cn)}')">🔊 Đọc</button> <details><summary>Xem bản dịch</summary>${E(vi)}</details></div>`).join('')}<h3>Vấn đáp Socrates · Đọc hiểu</h3>${r.questions.map((q,i)=>`<p>${i+1}. ${E(q)}</p>`).join('')}<button class="btn" onclick="setPage('translate')">Tự dịch bài khóa →</button></div>`}
function showTranslation(a){let r=readings[ri%4];a.innerHTML=`<h2>🌏 Dịch từng câu · Trung → Việt</h2><p class="muted">Viết trước khi xem đáp án mẫu. Nội dung tự lưu trên trình duyệt.</p><div class="toolbar">${readings.map((x,i)=>`<button class="pill ${i===ri?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div><div class="card"><h3>${E(r.title)}</h3>${r.lines.map(([sp,cn,vi],i)=>{let key='r'+ri+'_'+i;return `<div class="readingline"><div class="hanzi">${E(sp)}：${E(cn)}</div><textarea placeholder="Viết bản dịch tiếng Việt của bạn..." oninput="transInput('${key}',this.value)">${E(state.translation[key]||'')}</textarea><details><summary>🔎 Xem bản dịch mẫu và tự đối chiếu</summary><div class="feedback good">${E(vi)}</div><p class="small">Socrates: Hãy tìm chủ ngữ, động từ chính, từ chỉ thời gian và thành phần chỉ kết quả.</p></details></div>`}).join('')}<button class="btn alt" onclick="downloadTrans()">Xuất bản dịch (.txt)</button></div>`}
function transInput(k,v){state.translation[k]=v;save()}function downloadTrans(){let r=readings[ri%4],txt=r.title+'\n\n'+r.lines.map(([sp,cn],i)=>sp+'：'+cn+'\n'+(state.translation['r'+ri+'_'+i]||'')).join('\n\n');let u=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='HSK3_Bai9_Dich_Bai'+(ri+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),800)}
const questions=[...book.map((e,i)=>({id:'b'+i,q:e[0],opts:e[1],ans:e[1].indexOf(e[2]===undefined?'':e[1][e[2]]),ex:e[3],source:true})),...extra.map((e,i)=>({id:'e'+i,q:e[0],opts:e[1],ans:e[2],ex:e[3],source:false}))];
// For source questions the numeric answer key is recorded in DB.book's 3rd item.
book.forEach((e,i)=>questions[i].ans=e[2]);
function showExercises(a){let list=page==='original'?questions.filter(q=>q.source):page==='practice'?questions.filter(q=>!q.source):questions.filter(q=>state.graded[q.id]===false);let n=list.filter(q=>q.id in state.graded).length,ok=list.filter(q=>state.graded[q.id]===true).length;a.innerHTML=`<h2>${page==='original'?'📝 10 câu điền từ từ sách · tr. 82–83':page==='practice'?'🎯 30 câu luyện vận dụng':'🔁 Ôn lại câu sai'}</h2><p class="muted">${page==='original'?'Câu gốc dựa trên mục 综合练习, mỗi câu có các lựa chọn của nhóm từ tương ứng.':'Các câu trắc nghiệm mở rộng do app biên soạn, không phải bài gốc.'}</p><div class="quizstats">Đã chấm <b>${n}/${list.length}</b> · Đúng <b>${ok}</b><div class="progress"><i style="width:${list.length?n/list.length*100:0}%"></i></div></div>${list.length?list.map((q,i)=>{let p=state.answer[q.id],g=q.id in state.graded;return `<article class="quiz"><span class="badge">Câu ${i+1} ${q.source?'· Theo sách':'· Mở rộng'}</span><h3 class="qtitle">${E(q.q)}</h3>${q.opts.map((o,j)=>`<button class="option ${p===j?'sel':''} ${g&&j===q.ans?'good':''} ${g&&p===j&&p!==q.ans?'bad':''}" onclick="pick('${q.id}',${j})">${'ABCDE'[j]}. ${E(o)}</button>`).join('')}<button class="btn" onclick="check('${q.id}')">Kiểm tra đáp án</button>${g?`<div class="feedback ${state.graded[q.id]?'good':'bad'}"><b>${state.graded[q.id]?'✅ Chính xác':'❌ Chưa đúng'}. Đáp án: ${E(q.opts[q.ans])}</b><p><b>Feynman:</b> ${E(q.ex)}</p><div class="socrates"><b>Socrates:</b> Từ nào trong ngữ cảnh giúp em chọn đáp án này và loại những từ còn lại?</div></div>`:''}</article>`}).join(''):'<div class="card empty">Chưa có câu sai. Hãy làm bài tập trước nhé!</div>'}`}
function pick(id,j){state.answer[id]=j;delete state.graded[id];save();keep()}function check(id){if(!(id in state.answer)){alert('Hãy chọn đáp án trước.');return}let q=questions.find(x=>x.id===id);state.graded[id]=state.answer[id]===q.ans;save();keep()}
function keep(){let y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,y))}render();
</script></body></html>
