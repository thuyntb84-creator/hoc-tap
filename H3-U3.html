x}.vocab .card{margin:0;padding:16px}.vocab .hanzi{font-size:29px;font-weight:750}.q{border:1px solid var(--line);border-radius:15px;padding:19px;margin:14px 0;background:white}.q h3{font-size:17px;margin:6px 0 12px}.choice{display:block;text-align:left;width:100%;margin:8px 0;padding:12px;border:1px solid #dce2ed;background:#fbfcff;border-radius:11px;color:var(--ink)}.choice.selected{border:2px solid #5471e5;background:#eef2ff;padding:11px}.choice.correct{border-color:#0c9669;background:#e8faf2}.choice.wrong{border-color:#dc475e;background:#fff0f1}.feedback{margin-top:12px;border-radius:11px;padding:15px;background:#f4f6fb;line-height:1.75}.feedback.ok{background:#e8faf2}.feedback.no{background:#fff1f2}.socratic{margin-top:12px;padding:15px;border-left:4px solid #da9c39;background:#fff8e9;border-radius:9px}.inputline{padding:12px;width:100%;border:1px solid #dbe1ed;border-radius:10px}.progress{height:9px;background:#e7eafa;border-radius:50px;overflow:hidden}.progress i{display:block;height:100%;background:#4267ef}.note{background:#fff7de;padding:12px 15px;border-radius:11px}.reading{white-space:pre-wrap;font-size:19px;line-height:2.15}.tabs{display:flex;gap:8px;flex-wrap:wrap}.notice{color:#815c1e;background:#fff8e8;padding:12px;border-radius:10px}.small{font-size:13px;color:var(--muted)}img.poster{width:100%;max-width:650px;display:block;margin:16px auto;border-radius:13px}.hidden{display:none}h2{margin:0 0 10px}h3{margin:12px 0} @media(max-width:800px){.shell{display:block}nav{display:flex;overflow:auto;padding:8px;gap:4px;position:sticky;top:0;z-index:5}nav button{min-width:max-content;width:auto;font-size:12px;padding:10px}main{padding:14px}.grid{grid-template-columns:1fr}header{padding:18px}header h1{font-size:19px}.card{padding:16px}}

.grammarShow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grammarTile{background:linear-gradient(155deg,#fff7f5,#f4f3ff);border:1px solid #e5dbea;border-radius:18px;padding:18px;min-width:0}.grammarTile h3{color:#7043a2}.formula{background:#fff4b8;padding:14px;border:1px dashed #cda958;border-radius:14px;font-size:20px;color:#9a3847;font-weight:700;line-height:1.7;overflow-wrap:anywhere}.quote{padding:12px 0;border-bottom:1px dashed #d8dce5;line-height:1.75}.quote .hanzi{font-size:20px}.studyGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.studyBox{padding:18px;background:white;border:1px solid #e6eaf2;border-radius:16px}.studyText{font-size:21px;line-height:2.2;white-space:pre-wrap}.translationInput{width:100%;min-height:85px;resize:vertical;border:1px solid #ccd4e5;border-radius:12px;padding:13px;font:inherit;line-height:1.8}.bigscore{font-size:24px;color:#3b5fc9}.mini{font-size:13px;color:#60708b}.glist{display:grid;gap:12px}.intro{font-size:15px;line-height:1.7}.fullwidth{width:100%}.look{background:#f6f8fc;border:1px dashed #cfdaef;border-radius:14px;padding:15px}.answer{background:#ebf8ee;border-radius:12px;padding:13px;line-height:1.8}.noanswer{background:#fff0f0}.readingBlock{border:1px solid #e8edf4;padding:14px 16px;margin:8px 0;border-radius:12px}.readCN{font-size:20px;line-height:1.8}.tog{padding:9px;background:#eaf0ff;border:0;border-radius:10px;color:#3154bc;cursor:pointer}.photoGallery{display:grid;gap:20px}.photoItem{padding:14px;border:1px solid #e0e7f3;border-radius:16px;background:white}.photoItem img{display:block;width:100%;max-width:820px;margin:10px auto;border-radius:14px;box-shadow:0 7px 24px #22335520}.photoItem h3{margin:6px 0 12px}.posterStudy{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.posterStyle{padding:16px;background:linear-gradient(#fffef8,#fff8e9);border:2px dashed #efbfc9;border-radius:15px}.posterStyle:nth-child(2){border-color:#bbb7ee;background:linear-gradient(#fcfbff,#f1f4ff)}.posterStyle:nth-child(3){border-color:#a5d9c3;background:linear-gradient(#f8fffa,#effbf5)}.posterStyle .formula{font-size:17px}.quizstats{margin:12px 0;padding:15px;background:#edf3ff;border-radius:12px}.inputTranslate{display:block;width:100%;margin:12px 0;padding:14px;min-height:100px;border-radius:12px;border:1px solid #ccd6e5;resize:vertical;font:inherit;line-height:1.7}summary{cursor:pointer} @media(max-width:850px){.grammarShow,.posterStudy,.studyGrid{grid-template-columns:1fr}}
</style></head><body><header><span class="tag">新HSK教程 3 · LESSON 3</span><h1>这个小区挺好的</h1><p>Học theo giáo trình · Hiểu bản chất · Luyện tập thông minh · Dịch 4 bài khóa</p></header><div class="shell"><nav id="nav"></nav><main id="app"></main></div><script>const DB={"vocab": [["初中", "chūzhōng", "trường trung học cơ sở"], ["咱们", "zánmen", "chúng ta"], ["换", "huàn", "đổi, thay"], ["房子", "fángzi", "nhà"], ["小区", "xiǎoqū", "khu dân cư"], ["环境", "huánjìng", "môi trường"], ["挺", "tǐng", "khá, tương đối"], ["空调", "kōngtiáo", "máy điều hòa"], ["洗衣机", "xǐyījī", "máy giặt"], ["层", "céng", "tầng"], ["花园", "huāyuán", "vườn hoa"], ["灯", "dēng", "đèn"], ["关", "guān", "tắt; đóng"], ["冰箱", "bīngxiāng", "tủ lạnh"], ["卫生间", "wèishēngjiān", "nhà vệ sinh"], ["打扫", "dǎsǎo", "quét dọn"], ["搬家", "bānjiā", "chuyển nhà"], ["办", "bàn", "làm, xử lý"], ["信用卡", "xìnyòngkǎ", "thẻ tín dụng"], ["还", "huán", "trả lại; hoàn trả"], ["听说", "tīngshuō", "nghe nói"], ["银行", "yínháng", "ngân hàng"], ["才", "cái", "mới (muộn, chậm)"], ["纸", "zhǐ", "giấy"], ["搬", "bān", "bê, chuyển"], ["需要", "xūyào", "cần"]], "readings": [{"title": "课文 1 · Đổi nhà", "lines": [["王一雪", "小雪的初中离家有点儿远，咱们换一个近点儿的房子吧。", "Trường cấp hai của Tiểu Tuyết hơi xa nhà, chúng ta đổi sang một căn nhà gần hơn nhé."], ["刘明", "好啊，我上网看看。你觉得这个小区怎么样？", "Được đấy, để anh xem trên mạng. Em thấy khu dân cư này thế nào?"], ["王一雪", "环境挺好的，离地铁站还不远。", "Môi trường khá tốt, lại không xa ga tàu điện ngầm."], ["刘明", "房子里面也不错，空调和洗衣机都是新的。", "Bên trong nhà cũng không tệ, điều hòa và máy giặt đều mới."], ["王一雪", "是不错，但是我不喜欢住一层。", "Đúng là khá tốt, nhưng em không thích ở tầng một."], ["刘明", "这个一层带一个小花园，我觉得咱们可以去看看。", "Căn ở tầng một này có một khu vườn nhỏ, anh nghĩ chúng ta có thể đến xem thử."]], "questions": [["他们为什么要换房子？", "因为小雪的初中离家有点儿远。"], ["王一雪觉得新小区怎么样？", "环境挺好的，离地铁站还不远。"], ["刘明为什么喜欢这个房子？", "因为一层带一个小花园。"]]}, {"title": "课文 2 · Dọn nhà mới", "lines": [["王一雪", "我今天早上来的时候，灯还开着。", "Sáng nay khi em đến, đèn vẫn còn bật."], ["刘明", "我这几天忙坏了，可能走的时候忘关了。", "Mấy hôm nay anh bận quá, có lẽ lúc đi đã quên tắt."], ["王一雪", "冰箱不能用，这些吃的东西放在哪儿？", "Tủ lạnh không dùng được, những đồ ăn này để ở đâu?"], ["刘明", "不可能吧？冰箱是新买的，我来看看。", "Không thể nào nhỉ? Tủ lạnh mới mua mà, để anh xem."], ["王一雪", "洗衣机也坏了吗？", "Máy giặt cũng hỏng rồi sao?"], ["刘明", "没坏，但是卫生间没打扫好，还不能洗衣服。", "Không hỏng, nhưng nhà vệ sinh chưa dọn xong nên vẫn chưa giặt quần áo được."], ["王一雪", "星期天我们真的能搬家吗？", "Chủ nhật chúng ta thực sự có thể chuyển nhà chứ?"]], "questions": [["他们家的冰箱怎么了？", "冰箱不能用。"], ["为什么不能洗衣服？", "因为卫生间没打扫好。"], ["你觉得星期天他们能不能搬家？为什么？", "开放问题：结合新家还没整理好来说明理由。"]]}, {"title": "课文 3 · Làm thẻ tín dụng", "lines": [["王一雪", "这个月花了不少钱。", "Tháng này đã tiêu khá nhiều tiền."], ["刘明", "是的，我们买了很多搬家时要用的东西。", "Đúng vậy, chúng ta đã mua nhiều đồ cần dùng khi chuyển nhà."], ["王一雪", "咱们办张信用卡吧，花的钱可以慢慢还。听说中国银行的服务不错，办了信用卡买东西还能便宜。", "Chúng ta làm một thẻ tín dụng nhé, tiền đã tiêu có thể trả dần. Nghe nói dịch vụ ngân hàng Trung Quốc khá tốt, dùng thẻ tín dụng mua đồ còn có thể được giảm giá."], ["刘明", "好啊！中国银行很近，走路几分钟就能到。咱们什么时候去？", "Được! Ngân hàng Trung Quốc rất gần, đi bộ vài phút là đến. Khi nào chúng ta đi?"], ["王一雪", "今天下午？", "Chiều nay nhé?"], ["刘明", "我下午要去医院，很晚才能回来。", "Chiều nay anh phải đến bệnh viện, rất muộn mới về được."], ["王一雪", "那我下午自己去吧。", "Vậy chiều nay em tự đi nhé."]], "questions": [["王一雪为什么想办信用卡？", "因为可以慢慢还钱，买东西还能便宜。"], ["王一雪想什么时候去银行？", "今天下午。"], ["刘明为什么今天不能去银行？", "因为他下午要去医院，很晚才能回来。"]]}, {"title": "课文 4 · Kế hoạch chuyển nhà", "lines": [["刘明", "我觉得这个星期就能搬家。我明天去买一些纸箱，很快就能准备好。搬家那天，我想请几个朋友来帮忙，最多一天就能搬完。", "Anh nghĩ tuần này là có thể chuyển nhà. Ngày mai anh đi mua vài thùng giấy, sẽ chuẩn bị nhanh thôi. Hôm chuyển nhà anh muốn nhờ mấy người bạn giúp, nhiều nhất một ngày là chuyển xong."], ["王一雪", "我觉得下个月才能搬家。这周开始准备，下周去打扫新家，这么多事情最少需要两个星期才能做完。搬家那天，我们应该找一家搬家公司。", "Em nghĩ phải đến tháng sau mới chuyển được. Tuần này bắt đầu chuẩn bị, tuần sau dọn nhà mới; nhiều việc như vậy ít nhất cần hai tuần mới xong. Hôm chuyển nhà chúng ta nên tìm một công ty chuyển nhà."]], "questions": [["刘明明天去买什么？", "一些纸箱。"], ["王一雪打算下周做什么？", "去打扫新家。"], ["刘明打算找谁搬家？王一雪呢？", "刘明想请朋友帮忙；王一雪想找搬家公司。"]]}], "grammar": [{"title": "挺……的", "meaning": "挺 đứng trước tính từ hay động từ tâm lý để chỉ mức độ khá cao, thường dùng trong hội thoại.", "formula": "Chủ ngữ + 挺 + tính từ / động từ tâm lý + 的", "examples": [["这个小区环境挺好的。", "Môi trường khu dân cư này khá tốt."], ["买这个吧，我挺喜欢这个颜色的。", "Mua cái này nhé, tôi khá thích màu này."]], "trap": "挺 là khá/tương đối, không mang nghĩa quá mức; 的 thường xuất hiện cuối mẫu.", "q": "Khi nhận xét khu dân cư khá tốt chứ không phải tốt nhất, em chọn 挺 hay 坏了?"}, {"title": "程度补语：坏了", "meaning": "坏了 đứng sau từ chỉ tính chất/trạng thái để nhấn mạnh mức độ rất cao, thường với cảm giác khó chịu.", "formula": "Tính từ / trạng thái + 坏了", "examples": [["我这几天忙坏了。", "Mấy ngày nay tôi bận quá trời."], ["大家都累坏了。", "Mọi người đều mệt rã rời."]], "trap": "Ở 忙坏了, 坏了 không có nghĩa là đồ vật bị hỏng; phân biệt với 洗衣机坏了 (máy giặt hỏng).", "q": "Vì sao 忙坏了 và 洗衣机坏了 có cách hiểu khác nhau?"}, {"title": "就 và 才", "meaning": "就 thể hiện sớm/nhanh/thuận lợi; 才 thể hiện muộn/chậm/khó khăn hơn kỳ vọng.", "formula": "[Thời gian / điều kiện] + 就 / 才 + động từ", "examples": [["走路几分钟就能到。", "Đi bộ vài phút là đến."], ["我下午要去医院，很晚才能回来。", "Chiều nay tôi phải đến bệnh viện, rất muộn mới về được."]], "trap": "Không thể chỉ dựa vào số phút/giờ; phải hiểu thái độ và mong đợi của người nói.", "q": "Cùng là 5 giờ, khi người nói thấy sớm sẽ dùng 就 hay 才?"}], "book": [["你走的时候要______灯。", ["才", "挺", "办", "关", "还"], 3, "关灯 là tắt đèn."], ["我要去银行______一张信用卡。", ["才", "挺", "办", "关", "还"], 2, "办信用卡 nghĩa là làm thẻ tín dụng."], ["搬家要准备的东西______多的。", ["才", "挺", "办", "关", "还"], 1, "挺 + tính từ + 的 diễn tả khá nhiều."], ["这本书不是我的，明天我要______给朋友。", ["才", "挺", "办", "关", "还"], 4, "还给朋友 = trả lại cho bạn."], ["我太忙了，没时间打扫新家，可能下个月______搬家。", ["才", "挺", "办", "关", "还"], 0, "才 nói việc chuyển nhà diễn ra muộn."], ["你去哪儿了？怎么这么晚才回来？— 我一直在______新家，今天真是累坏了。", ["环境", "需要", "搬家", "听说", "打扫"], 4, "打扫新家: dọn vệ sinh nhà mới."], ["这个小区离学校有点儿远。— 虽然有点儿远，但是我们很喜欢这个小区的______。", ["环境", "需要", "搬家", "听说", "打扫"], 0, "环境: môi trường/sinh hoạt xung quanh."], ["你知道她为什么不喜欢这个房子吗？— 我______她不喜欢住一层。", ["环境", "需要", "搬家", "听说", "打扫"], 3, "听说: nghe nói."], ["这个小区明天不能______，你知道吗？— 我知道，我已经告诉搬家公司的工人了，他们下周一再来。", ["环境", "需要", "搬家", "听说", "打扫"], 2, "搬家: chuyển nhà."], ["她家真大，还有个大花园。— 因为她家人多，______一个大房子。", ["环境", "需要", "搬家", "听说", "打扫"], 1, "需要: cần."]], "extra": [["这个小区环境______好的。", ["挺", "才", "关", "还"], 0, "挺…的: khá…"], ["我最近______坏了。", ["办", "忙", "挺", "纸"], 1, "忙坏了: bận quá."], ["几分钟______能到。", ["才", "就", "换", "搬"], 1, "就 biểu thị đến nhanh."], ["很晚______能回家。", ["才", "挺", "就", "办"], 0, "才 chỉ về muộn."], ["电灯还开着，请______灯。", ["关", "还", "挺", "需要"], 0, "关灯 = tắt đèn."], ["我们的______坏了，不能洗衣服。", ["银行", "洗衣机", "小区", "环境"], 1, "洗衣机 = máy giặt."], ["小雪的______离家很远。", ["初中", "冰箱", "花园", "空调"], 0, "初中 = trường cấp hai."], ["这个房子带一个小______。", ["环境", "纸", "花园", "灯"], 2, "花园: vườn hoa."], ["我想______一个离学校近的房子。", ["换", "关", "还", "才"], 0, "换房子: đổi nhà."], ["新家的卫生间还没______。", ["打扫", "搬家", "银行", "挺"], 0, "打扫 = dọn vệ sinh."], ["中国银行的______挺好的。", ["洗衣机", "服务", "层", "花园"], 1, "服务 = dịch vụ, từ đã học."], ["他今天下午要去______。", ["医院", "冰箱", "初中", "纸"], 0, "医院 = bệnh viện."], ["走路五分钟______到银行。", ["就", "才", "坏了", "挺"], 0, "就: chỉ thời gian ngắn."], ["坐火车五小时______到。", ["就", "才", "关", "办"], 1, "才: phải mất năm giờ mới đến."], ["我______很喜欢这个小区。", ["挺", "才", "坏", "层"], 0, "挺喜欢: khá thích."], ["我们打算星期天______。", ["搬家", "打扫", "纸", "环境"], 0, "搬家: chuyển nhà."], ["搬家______很多纸箱。", ["需要", "还", "听说", "关"], 0, "需要: cần."], ["今天我们去银行______卡。", ["办", "挺", "花园", "初中"], 0, "办卡: làm thẻ."], ["这本书我下周______给你。", ["还", "搬", "换", "挺"], 0, "还给你: trả lại cho bạn."], ["______中国银行很近。", ["听说", "搬家", "冰箱", "需要"], 0, "听说: nghe nói."], ["我住在三______。", ["层", "空调", "环境", "信用卡"], 0, "层: tầng."], ["家里买了一个新______，可以放水果。", ["冰箱", "纸", "灯", "花园"], 0, "冰箱: tủ lạnh."], ["家里有______，夏天不太热。", ["空调", "纸", "房子", "初中"], 0, "空调: máy điều hòa."], ["大家都累______了。", ["坏", "就", "才", "挺"], 0, "累坏了 nhấn mạnh cực mệt."], ["她早上五点______起床了。", ["就", "才", "挺", "需要"], 0, "就 nhấn mạnh dậy sớm."], ["他晚上十二点______回家。", ["才", "就", "挺", "搬"], 0, "才: đến tận nửa đêm mới về."], ["房子______学校比较近。", ["离", "还", "办", "关"], 0, "离…近 là cách diễn đạt khoảng cách."], ["我想______一个更大的房子。", ["换", "听说", "才", "纸"], 0, "换 một căn nhà khác."], ["把______放进箱子里。", ["东西", "环境", "银行", "层"], 0, "东西: đồ vật."], ["我们需要找一家搬家______。", ["公司", "信用卡", "卫生间", "洗衣机"], 0, "搬家公司: công ty chuyển nhà."]]};</script><script>
const {vocab,readings,grammar,book,extra}=DB;
const tabs=[['home','🏠 Tổng quan'],['vocab','🀄 26 từ vựng'],['vquiz','🧩 Quiz từ vựng'],['grammar','📒 3 chủ điểm ngữ pháp'],['reading','📖 4 bài khóa'],['translate','🌏 Dịch bài khóa'],['original','📝 Bài tập từ sách'],['practice','🎯 Luyện mở rộng'],['mistakes','🔁 Ôn câu sai']];
let page='home',which=0,vMode='meaning',filter='',state={};try{state=JSON.parse(localStorage.getItem('hsk3lesson2_v1')||'{}')}catch{};
state.ans??={};state.mark??={};state.vans??={};state.translation??={};
const save=()=>localStorage.setItem('hsk3lesson2_v1',JSON.stringify(state));
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setPage(v){page=v;render();window.scrollTo(0,0)};
function setWhich(v){which=v;render()};
function speak(s){if(!window.speechSynthesis){alert('Trình duyệt không hỗ trợ phát âm.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='zh-CN';u.rate=.79;speechSynthesis.speak(u)}
function render(){document.getElementById('nav').innerHTML=tabs.map(([k,t])=>`<button class="${page===k?'active':''}" onclick="setPage('${k}')">${t}</button>`).join('');let a=document.getElementById('app');if(page==='home')home(a);else if(page==='vocab')vocabPage(a);else if(page==='vquiz')vquiz(a);else if(page==='grammar')grammarPage(a);else if(page==='reading')readingPage(a);else if(page==='translate')translationPage(a);else exercises(a)}
function grammarCard(g,i,full=false){return `<article class="${full?'card':'posterStyle'}"><span class="tag">NGỮ PHÁP ${i+1}</span><h3>${E(g.title)}</h3><p>${E(g.meaning)}</p><div class="formula">${E(g.formula)}</div>${g.examples.map(([cn,vi])=>`<div class="quote"><div class="hanzi">${E(cn)}</div><div class="gloss">${E(vi)}</div><button class="btn ghost" onclick="speak('${E(cn)}')">🔊 Nghe</button></div>`).join('')}<p class="note"><b>⚠️ Bẫy dễ sai:</b> ${E(g.trap)}</p><div class="socratic"><b>🧠 Socrates</b><p>${E(g.q)}</p></div>${!full?`<div class="toolbar"><button class="btn secondary" onclick="which=${i};setPage('grammar')">Học chi tiết →</button></div>`:''}</article>`}
function home(a){let n=Object.keys(state.mark).length,correct=Object.values(state.mark).filter(Boolean).length,vc=Object.values(state.vans).filter(v=>v.checked).length;a.innerHTML=`<h2>HSK 3 · Bài 3 <span class="tag">Bài học mới</span></h2><p class="subtitle">Chủ đề nhà ở và chuyển nhà: xem nhà, sửa chữa thiết bị, làm thẻ tín dụng và kế hoạch dọn nhà (trang 19–28).</p><div class="grid"><div class="stat">Từ vựng <br><b>28</b><div class="small">Hán tự, Pinyin, nghĩa Việt</div></div><div class="stat">Quiz từ vựng<br><b>${vc}/78</b><div class="small">3 chế độ × 26 từ</div></div><div class="stat">Luyện câu<br><b>${n}/40</b><div class="small">Tỉ lệ đúng ${n?Math.round(correct/n*100):0}%</div></div></div><div class="card"><h2>Lộ trình học hiệu quả</h2><p>① Học từ vựng → ② Nắm 3 công thức ngữ pháp → ③ Đọc 4 bài khóa → ④ Dịch từng câu → ⑤ Làm bài sách và bài mở rộng → ⑥ Ôn câu sai.</p><button class="btn" onclick="setPage('vocab')">Bắt đầu học</button></div><div class="card"><h2>🖼️ Tổng quan · Bộ công thức cấu trúc ngữ pháp</h2><p class="subtitle">Ba ảnh ghi chú viết tay được hiển thị toàn bộ, kèm đường dẫn học chi tiết và bài tập vận dụng.</p><div class="photoGallery">${grammar.map((g,i)=>`<div class="photoItem"><h3>${i+1}. ${E(g.title)}</h3><img src="ngu_phap_${i+1}.png" alt="Ảnh công thức ngữ pháp ${i+1}" loading="lazy"><button class="btn secondary" onclick="which=${i};setPage('grammar')">Học ngữ pháp này →</button></div>`).join('')}</div></div><div class="card"><h3>🍜 Mục tiêu thực hành</h3><p>Biết mô tả khu dân cư, căn hộ, công việc chuyển nhà và dùng đúng 挺…的, 坏了, 就 / 才.</p></div><p class="notice">Lưu ý: PDF không kèm tệp âm thanh. Chức năng 🔊 dùng giọng tổng hợp tiếng Trung trên thiết bị; không thay thế bài nghe gốc.</p>`}
function vocabPage(a){let items=vocab.map((v,i)=>({v,i})).filter(x=>x.v.join(' ').toLowerCase().includes(filter.toLowerCase()));a.innerHTML=`<h2>🀄 Từ vựng bài 3 · 26 từ</h2><div class="toolbar"><input class="inputline" style="max-width:330px" placeholder="Tìm chữ Hán / Pinyin / nghĩa" oninput="filter=this.value;vocabPage(document.getElementById('app'))" value="${E(filter)}"><button class="btn" onclick="setPage('vquiz')">Luyện quiz 26 từ →</button></div><div class="vocab">${items.map(({v,i})=>`<div class="card"><span class="tag">#${i+1}</span><div class="hanzi">${E(v[0])}</div><div class="pinyin">${E(v[1])}</div><p>${E(v[2])}</p><button class="btn ghost" onclick="speak('${E(v[0])}')">🔊 Phát âm</button></div>`).join('')}</div>`}
function vocabOpts(i){let s=[i];for(let k=1;s.length<4;k++){let j=(i+k*9)%26;if(!s.includes(j))s.push(j)}return s.sort((a,b)=>((a*11+4)%31)-((b*11+4)%31))}
function vKey(i){return vMode+'_'+i}
function changeVMode(x){vMode=x;render()}
function vquiz(a){let completed=vocab.filter((v,i)=>state.vans[vKey(i)]?.checked).length,correct=vocab.filter((v,i)=>state.vans[vKey(i)]?.checked&&state.vans[vKey(i)].choice===i).length;a.innerHTML=`<h2>🧩 Quiz 26 từ vựng</h2><p class="subtitle">Chọn → kiểm tra → hiện đúng/sai, nghĩa, Pinyin và câu hỏi Socrates. Điểm được lưu riêng theo từng chế độ.</p><div class="card"><div class="toolbar"><button class="pill ${vMode==='meaning'?'active':''}" onclick="changeVMode('meaning')">Hán → Việt</button><button class="pill ${vMode==='hanzi'?'active':''}" onclick="changeVMode('hanzi')">Việt → Hán</button><button class="pill ${vMode==='sound'?'active':''}" onclick="changeVMode('sound')">Hán → Pinyin</button><button class="btn ghost" onclick="resetV()">Làm lại chế độ</button></div><b>${completed}/26 đã chấm · ${correct} đúng</b><div class="progress"><i style="width:${completed*100/26}%"></i></div></div>${vocab.map((v,i)=>{let k=vKey(i),r=state.vans[k]||{},opts=vocabOpts(i),show=(j)=>vMode==='meaning'?vocab[j][2]:vMode==='hanzi'?vocab[j][0]:vocab[j][1],question=vMode==='hanzi'?v[2]:v[0];return `<article class="q"><span class="tag">Câu ${i+1}/26</span><h3 class="hanzi">${E(question)}</h3>${opts.map((j,n)=>`<button class="choice ${r.choice===j?'selected':''} ${r.checked&&j===i?'correct':''} ${r.checked&&r.choice===j&&j!==i?'wrong':''}" onclick="setVAnswer(${i},${j})">${'ABCD'[n]}. ${E(show(j))}</button>`).join('')}<button class="btn" onclick="checkV(${i})">Kiểm tra đáp án</button> <button class="btn ghost" onclick="speak('${E(v[0])}')">🔊 Nghe</button>${r.checked?`<div class="feedback ${r.choice===i?'ok':'no'}"><b>${r.choice===i?'✅ Chính xác':'❌ Chưa đúng'}</b><p>${E(v[0])} · ${E(v[1])} · ${E(v[2])}</p><b>Feynman:</b> Ghép chữ Hán, âm đọc và nghĩa trong tình huống tình huống chuyển nhà.<div class="socratic"><b>🧠 Socrates:</b> Hãy đặt một câu ngắn sử dụng “${E(v[0])}”.</div></div>`:''}</article>`}).join('')}`}
function setVAnswer(i,j){state.vans[vKey(i)]={choice:j,checked:false};save();preserve()}
function checkV(i){let r=state.vans[vKey(i)];if(!r){alert('Bạn hãy chọn đáp án trước.');return}r.checked=true;save();preserve()}
function resetV(){if(!confirm('Xóa đáp án chế độ từ vựng này?'))return;vocab.forEach((v,i)=>delete state.vans[vKey(i)]);save();render()}
function preserve(){let y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,y))}
function grammarPage(a){a.innerHTML=`<h2>📒 3 điểm ngữ pháp</h2><div class="toolbar">${grammar.map((g,i)=>`<button class="pill ${which===i?'active':''}" onclick="setWhich(${i})">${i+1}. ${E(g.title)}</button>`).join('')}</div><div class="card"><img style="width:100%;max-width:800px;display:block;margin:auto;border-radius:13px" src="ngu_phap_${which+1}.png" alt="Ảnh ghi chú ngữ pháp"></div>${grammarCard(grammar[which],which,true)}<button class="btn" onclick="setPage('practice')">Luyện trắc nghiệm ứng dụng →</button>`}
function readingPage(a){let r=readings[which];a.innerHTML=`<h2>📖 Hội thoại / Nhật ký</h2><div class="toolbar">${readings.map((r,i)=>`<button class="pill ${which===i?'active':''}" onclick="setWhich(${i})">Bài khóa ${i+1}</button>`).join('')}</div><div class="card"><h2>${E(r.title)}</h2>${r.lines.map(([speaker,cn,vi],i)=>`<div class="readingBlock"><div class="readCN">${speaker?`<b>${E(speaker)}：</b>`:''}${E(cn)}</div><button class="btn ghost" onclick="speak('${E(cn)}')">🔊 Đọc câu</button> <button class="tog" onclick="document.getElementById('v${i}').hidden=!document.getElementById('v${i}').hidden">Xem / ẩn nghĩa</button><p class="gloss" id="v${i}" hidden>${E(vi)}</p></div>`).join('')}<h3>🧠 Câu hỏi đọc hiểu</h3>${r.questions.map(([q,an],i)=>`<details><summary class="quote">${i+1}. ${E(q)}</summary><div class="answer">${E(an)}</div></details>`).join('')}<p><button class="btn" onclick="setPage('translate')">Luyện dịch bài này →</button></p></div>`}
function translationPage(a){let r=readings[which];a.innerHTML=`<h2>🌏 Luyện dịch 4 bài khóa · Trung → Việt</h2><p class="subtitle">Tự viết bản dịch trước khi mở đáp án mẫu. App lưu nội dung bạn nhập trên thiết bị, không tự đánh giá chính xác mọi bản dịch tự do.</p><div class="toolbar">${readings.map((r,i)=>`<button class="pill ${which===i?'active':''}" onclick="setWhich(${i})">Bài khóa ${i+1}</button>`).join('')}</div><div class="card"><h3>${E(r.title)}</h3>${r.lines.map(([sp,cn,vi],i)=>{let k='b'+which+'_s'+i;return `<div class="readingBlock"><small>Câu ${i+1}</small><div class="readCN">${sp?`<b>${E(sp)}：</b>`:''}${E(cn)}</div><button class="btn ghost" onclick="speak('${E(cn)}')">🔊 Nghe</button><textarea class="inputTranslate" placeholder="Nhập bản dịch tiếng Việt của bạn..." oninput="saveTrans('${k}',this.value)">${E(state.translation[k]||'')}</textarea><details><summary>🔎 Xem bản dịch tham khảo</summary><div class="answer">${E(vi)}</div><p><b>Phân tích 5 bước:</b> Tách cụm → xác định chủ thể → tìm động từ chính → tìm bổ nghĩa → ghép nghĩa tự nhiên.</p></details></div>`}).join('')}<button class="btn secondary" onclick="exportTrans()">Xuất bản dịch của tôi (.txt)</button></div>`}
function saveTrans(k,v){state.translation[k]=v;save()}
function exportTrans(){let r=readings[which],txt=r.title+'\n\n'+r.lines.map(([sp,cn,vi],i)=>(sp?sp+'：':'')+cn+'\n'+(state.translation['b'+which+'_s'+i]||'')).join('\n\n');let u=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='HSK3_Bai3_Dich_Bai'+(which+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const allQ=[...book.map((e,i)=>({id:'b'+i,q:e[0],options:e[1],correct:e[2],explain:e[3],source:true})),...extra.map((e,i)=>({id:'x'+i,q:e[0],options:e[1],correct:e[2],explain:e[3],source:false}))];
function exercises(a){let list=page==='original'?allQ.filter(x=>x.source):page==='practice'?allQ.filter(x=>!x.source):allQ.filter(x=>state.mark[x.id]===false);let done=list.filter(x=>x.id in state.mark).length,correct=list.filter(x=>state.mark[x.id]).length;a.innerHTML=`<h2>${page==='original'?'📝 Bài tập chọn từ trong sách (trang 25–26)':page==='practice'?'🎯 30 câu vận dụng mở rộng':'🔁 Ôn tập các câu đã sai'}</h2><p class="subtitle">${page==='original'?'10 câu trong mục 综合练习; lựa chọn hiển thị riêng ở từng câu.':'Bài mở rộng do app biên soạn, dựa trên kiến thức Bài 3.'}</p><div class="card"><b>Đã chấm: ${done}/${list.length} · Đúng ${correct}</b><div class="progress"><i style="width:${list.length?done*100/list.length:0}%"></i></div><div class="toolbar"><button class="btn ghost" onclick="resetExercises()">Làm lại phần này</button></div></div>${list.length?list.map((x,i)=>{let picked=state.ans[x.id],ch=x.id in state.mark;return `<article class="q"><span class="tag">Câu ${i+1}${x.source?' · Sách':' · Mở rộng'}</span><h3>${E(x.q)}</h3>${x.options.map((option,j)=>`<button class="choice ${picked===j?'selected':''} ${ch&&j===x.correct?'correct':''} ${ch&&picked===j&&j!==x.correct?'wrong':''}" onclick="choose('${x.id}',${j})">${'ABCDE'[j]}. ${E(option)}</button>`).join('')}<button class="btn" onclick="grade('${x.id}')">Kiểm tra đáp án</button>${ch?`<div class="feedback ${state.mark[x.id]?'ok':'no'}"><b>${state.mark[x.id]?'✅ Đúng':'❌ Sai'} – Đáp án: ${'ABCDE'[x.correct]}. ${E(x.options[x.correct])}</b><p><b>Feynman:</b> ${E(x.explain)}</p><div class="socratic"><b>🧠 Socrates:</b> Từ nào trong câu là dấu hiệu giúp em loại các phương án còn lại?</div></div>`:''}</article>`}).join(''):'<div class="card">Chưa có câu trả lời sai. Hãy thử làm bài trước!</div>'}`}
function choose(id,j){state.ans[id]=j;delete state.mark[id];save();preserve()}
function grade(id){if(!(id in state.ans)){alert('Bạn hãy chọn đáp án trước.');return}let q=allQ.find(x=>x.id===id);state.mark[id]=q.correct===state.ans[id];save();preserve()}
function resetExercises(){let arr=page==='original'?allQ.filter(x=>x.source):page==='practice'?allQ.filter(x=>!x.source):allQ.filter(x=>state.mark[x.id]===false);if(!confirm('Xóa bài làm trong mục hiện tại?'))return;arr.forEach(x=>{delete state.ans[x.id];delete state.mark[x.id]});save();render()}
render();
</script></body></html>
