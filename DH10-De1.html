nated from the days of (2) ________ (~65,000 years ago)", "options": [], "answer": "art-filled caves", "ctx": "L1", "pts": 2}, {"n": 2, "cat": "Listening", "type": "text", "question": "about 400 (1) ________ (France & Spain) − famous sites: Lascaux Grotto, Chauvet-Pont-d’Arc Age and Creators − originated from the days of (2) ________ (~65,000 years ago) − radiocarbon dating: most artworks < 40,000 years old → created by Homo sapiens Subjects and Materials − mainly animals:", "options": [], "answer": "Neanderthals", "ctx": "L1", "pts": 2}, {"n": 3, "cat": "Listening", "type": "text", "question": "sapiens Subjects and Materials − mainly animals: mammoths, horses, lions, deer − some human figures and symbols − using rock-based (3) ________ − techniques: painting on walls or engraving into stone − visual depth achieved by using (4) ________ of cave walls Interpretations − possibly m", "options": [], "answer": "pigments", "ctx": "L1", "pts": 2}, {"n": 4, "cat": "Listening", "type": "text", "question": "es and symbols − using rock-based (3) ________ − techniques: painting on walls or engraving into stone − visual depth achieved by using (4) ________ of cave walls Interpretations − possibly made by shamans in (5) ________ to record spirit-world encounters − repeated symbols → shared meanings / e", "options": [], "answer": "natural contours", "ctx": "L1", "pts": 2}, {"n": 5, "cat": "Listening", "type": "text", "question": "n walls or engraving into stone − visual depth achieved by using (4) ________ of cave walls Interpretations − possibly made by shamans in (5) ________ to record spirit-world encounters − repeated symbols → shared meanings / early communication − purposes likely varied and not fully certain", "options": [], "answer": "trance-like state", "ctx": "L1", "pts": 2}, {"n": 6, "cat": "Listening", "type": "tristate", "question": "The notion of youth culture and the label teenager became widely recognized only in the mid-twentieth century, when social conditions began to distinguish adolescents from both children and adults.", "options": [{"key": "T", "text": "True"}, {"key": "F", "text": "False"}, {"key": "NG", "text": "Not Given"}], "answer": "T", "ctx": null, "pts": 2}, {"n": 7, "cat": "Listening", "type": "tristate", "question": "Following the Second World War, economic prosperity compelled most young people to leave school earlier in order to support the growing labour market.", "options": [{"key": "T", "text": "True"}, {"key": "F", "text": "False"}, {"key": "NG", "text": "Not Given"}], "answer": "F", "ctx": null, "pts": 2}, {"n": 8, "cat": "Listening", "type": "tristate", "question": "The fear of nuclear war may have contributed to teenagers adopting risk-taking behaviors and rejecting the tastes and values associated with their parents.", "options": [{"key": "T", "text": "True"}, {"key": "F", "text": "False"}, {"key": "NG", "text": "Not Given"}], "answer": "T", "ctx": null, "pts": 2}, {"n": 9, "cat": "Listening", "type": "tristate", "question": "Films and popular music of the 1950s, including the image of rebellious figures like James Dean, played a role in shaping a distinct generational identity that sought to systematically dismantle mainstream suburban values.", "options": [{"key": "T", "text": "True"}, {"key": "F", "text": "False"}, {"key": "NG", "text": "Not Given"}], "answer": "NG", "ctx": null, "pts": 2}, {"n": 10, "cat": "Listening", "type": "tristate", "question": "The Woodstock festival of 1969 was criticized for failing to attract large crowds and is generally considered a minor event in the history of the hippie movement.", "options": [{"key": "T", "text": "True"}, {"key": "F", "text": "False"}, {"key": "NG", "text": "Not Given"}], "answer": "F", "ctx": null, "pts": 2}, {"n": 11, "cat": "Listening", "type": "choice", "question": "What is NOT included in the role of a career coach?", "options": [{"key": "A", "text": "recognizing a client’s job-hunting weaknesses"}, {"key": "B", "text": "advising clients how to update their CVs"}, {"key": "C", "text": "locating and securing employment for clients"}, {"key": "D", "text": "assisting clients in improving their interview techniques"}], "answer": "C", "ctx": null, "pts": 2}, {"n": 12, "cat": "Listening", "type": "choice", "question": "According to Charles, the covering letter is important because ________", "options": [{"key": "A", "text": "it is an integral part of the CV."}, {"key": "B", "text": "it contains all the details of the applicant."}, {"key": "C", "text": "it is the same for every position."}, {"key": "D", "text": "it is the only part of the CV employers read."}], "answer": "A", "ctx": null, "pts": 2}, {"n": 13, "cat": "Listening", "type": "choice", "question": "Why does Charles use the example of a computer programmer?", "options": [{"key": "A", "text": "to highlight the need for relevant experience"}, {"key": "B", "text": "to illustrate the need for customizing your CV"}, {"key": "C", "text": "to clarify the importance of having a wide skills base"}, {"key": "D", "text": "to demonstrate the need for extensive details in CVs"}], "answer": "B", "ctx": null, "pts": 2}, {"n": 14, "cat": "Listening", "type": "choice", "question": "When discussing the Internet, Charles suggests that job seekers should ________", "options": [{"key": "A", "text": "socialize on the Internet to meet employers."}, {"key": "B", "text": "clean up data that exists about them on the Internet."}, {"key": "C", "text": "search for other job-seekers online."}, {"key": "D", "text": "apply to employers that use networking sites."}], "answer": "B", "ctx": null, "pts": 2}, {"n": 15, "cat": "Listening", "type": "choice", "question": "Charles believes one of his clients succeeded in his job search because he ________", "options": [{"key": "A", "text": "uploaded his CV to his profile"}, {"key": "B", "text": "had a detailed profile."}, {"key": "C", "text": "included keywords in his profile."}, {"key": "D", "text": "had a catchy headline on his profile."}], "answer": "D", "ctx": null, "pts": 2}, {"n": 16, "cat": "Listening", "type": "text", "question": "xplains how new ideas and technologies spread within a social system. The theory was developed by Everett M. Rogers, a communication scholar and (16) ________. It was first introduced in his 1962 book Diffusion of Innovations, and explains how innovations are adopted and disseminated within societies. The m", "options": [], "answer": "sociologist", "ctx": "L4", "pts": 2}, {"n": 17, "cat": "Listening", "type": "text", "question": "uct, or practice introduced to a community. Information about the innovation spreads through communication channels, either though mass media or (17) ________. The process unfolds over time within a social system consisting of interconnected (18) ________ that influence one another. Rogers also categorizes a", "options": [], "answer": "interpersonal communication", "ctx": "L4", "pts": 2}, {"n": 18, "cat": "Listening", "type": "text", "question": "unication channels, either though mass media or (17) ________. The process unfolds over time within a social system consisting of interconnected (18) ________ that influence one another. Rogers also categorizes adopters according to the speed at which they accept innovations. For instance, (19) ________, who", "options": [], "answer": "individuals or entities", "ctx": "L4", "pts": 2}, {"n": 19, "cat": "Listening", "type": "text", "question": "________ that influence one another. Rogers also categorizes adopters according to the speed at which they accept innovations. For instance, (19) ________, who take up 13.5%, are influential members of society who adopt new ideas relatively early and help spread them. At the other end of the spectrum are lag", "options": [], "answer": "early adopters", "ctx": "L4", "pts": 2}, {"n": 20, "cat": "Listening", "type": "text", "question": "members of society who adopt new ideas relatively early and help spread them. At the other end of the spectrum are laggards, often described as (20) ________ who tend to resist change. Several attributes of innovations influence their adoption rate, including relative advantage, compatibility, complexity, (", "options": [], "answer": "traditionalists", "ctx": "L4", "pts": 2}, {"n": 21, "cat": "Listening", "type": "text", "question": "to resist change. Several attributes of innovations influence their adoption rate, including relative advantage, compatibility, complexity, (21) ________. In fields such as nursing, the theory helps promote the adoption of (22) ________ and new healthcare technologies. It also supports teamwork through init", "options": [], "answer": "trialability, and observability", "ctx": "L4", "pts": 2}, {"n": 22, "cat": "Listening", "type": "text", "question": "ate, including relative advantage, compatibility, complexity, (21) ________. In fields such as nursing, the theory helps promote the adoption of (22) ________ and new healthcare technologies. It also supports teamwork through initiatives such as (23) ________. Despite its value, the theory has limitations. C", "options": [], "answer": "evidence-based practices", "ctx": "L4", "pts": 2}, {"n": 23, "cat": "Listening", "type": "text", "question": "g, the theory helps promote the adoption of (22) ________ and new healthcare technologies. It also supports teamwork through initiatives such as (23) ________. Despite its value, the theory has limitations. Critics argue that it may contain a (24) ________ because it was developed largely in Western contexts", "options": [], "answer": "interdisciplinary collaboration", "ctx": "L4", "pts": 2}, {"n": 24, "cat": "Listening", "type": "text", "question": "ports teamwork through initiatives such as (23) ________. Despite its value, the theory has limitations. Critics argue that it may contain a (24) ________ because it was developed largely in Western contexts. Researchers therefore recommend combining it with additional perspectives, including (25) ________,", "options": [], "answer": "cultural bias", "ctx": "L4", "pts": 2}, {"n": 25, "cat": "Listening", "type": "text", "question": "_____ because it was developed largely in Western contexts. Researchers therefore recommend combining it with additional perspectives, including (25) ________, to address complex real-world situations.", "options": [], "answer": "complimentary frameworks", "ctx": "L4", "pts": 2}, {"n": 26, "cat": "Lexico-Grammar", "type": "choice", "question": "________, the board of directors decided to proceed with the hostile takeover.", "options": [{"key": "A", "text": "All things being equal"}, {"key": "B", "text": "All things equaled"}, {"key": "C", "text": "Being equal all things"}, {"key": "D", "text": "Equaling all things"}], "answer": "A", "ctx": null, "pts": 1}, {"n": 27, "cat": "Lexico-Grammar", "type": "choice", "question": "It is not so much his lack of technical expertise ________ that concerns the hiring committee.", "options": [{"key": "A", "text": "as his reluctance to collaborate"}, {"key": "B", "text": "than his reluctance to collaborate"}, {"key": "C", "text": "but his reluctance to collaborate"}, {"key": "D", "text": "like his reluctance to collaborate"}], "answer": "A", "ctx": null, "pts": 1}, {"n": 28, "cat": "Lexico-Grammar", "type": "choice", "question": "The government needs to grasp the ________ and introduce the controversial economic reforms before the situation worsens.", "options": [{"key": "A", "text": "thorn"}, {"key": "B", "text": "thistle"}, {"key": "C", "text": "nettle"}, {"key": "D", "text": "bush"}], "answer": "C", "ctx": null, "pts": 1}, {"n": 29, "cat": "Lexico-Grammar", "type": "choice", "question": "After days of intense strikes and protests, the management finally ________ and granted the workers a pay rise.", "options": [{"key": "A", "text": "backed out"}, {"key": "B", "text": "caved in"}, {"key": "C", "text": "gave off"}, {"key": "D", "text": "held off"}], "answer": "B", "ctx": null, "pts": 1}, {"n": 30, "cat": "Lexico-Grammar", "type": "choice", "question": "She accepted the offer of promotion with ________, eager to take on the new responsibilities.", "options": [{"key": "A", "text": "trepidation"}, {"key": "B", "text": "alacrity"}, {"key": "C", "text": "reluctance"}, {"key": "D", "text": "apathy"}], "answer": "B", "ctx": null, "pts": 1}, {"n": 31, "cat": "Lexico-Grammar", "type": "choice", "question": "The young prodigy's violin performance was so breathtaking that it completely put the seasoned professionals in the ________.", "options": [{"key": "A", "text": "dark"}, {"key": "B", "text": "shadow"}, {"key": "C", "text": "shade"}, {"key": "D", "text": "background"}], "answer": "C", "ctx": null, "pts": 1}, {"n": 32, "cat": "Lexico-Grammar", "type": "choice", "question": "Despite being a famous author, he remained extremely ________ about his personal life, rarely giving interviews.", "options": [{"key": "A", "text": "garrulous"}, {"key": "B", "text": "effusive"}, {"key": "C", "text": "reticent"}, {"key": "D", "text": "loquacious"}], "answer": "C", "ctx": null, "pts": 1}, {"n": 33, "cat": "Lexico-Grammar", "type": "choice", "question": "The journalist was known for her integrity, and no one ever questioned the ________ of her reporting.", "options": [{"key": "A", "text": "mendacity"}, {"key": "B", "text": "fallibility"}, {"key": "C", "text": "duplicity"}, {"key": "D", "text": "veracity"}], "answer": "D", "ctx": null, "pts": 1}, {"n": 34, "cat": "Lexico-Grammar", "type": "choice", "question": "He was so ________ about his workspace that even a single pen out of place would disturb his concentration.", "options": [{"key": "A", "text": "slovenly"}, {"key": "B", "text": "fastidious"}, {"key": "C", "text": "nonchalant"}, {"key": "D", "text": "haphazard"}], "answer": "B", "ctx": null, "pts": 1}, {"n": 35, "cat": "Lexico-Grammar", "type": "choice", "question": "He is highly regarded in his field as a pioneer of quantum computing, and ________.", "options": [{"key": "A", "text": "so it is right"}, {"key": "B", "text": "rightly so"}, {"key": "C", "text": "so rightly"}, {"key": "D", "text": "so is it right"}], "answer": "B", "ctx": null, "pts": 1}, {"n": 36, "cat": "Lexico-Grammar", "type": "choice", "question": "With no formal training in management, she had to fly by the ________ of her pants during the first few months.", "options": [{"key": "A", "text": "seat"}, {"key": "B", "text": "edge"}, {"key": "C", "text": "fabric"}, {"key": "D", "text": "seam"}], "answer": "A", "ctx": null, "pts": 1}, {"n": 37, "cat": "Lexico-Grammar", "type": "choice", "question": "I'd never buy a used car without having it inspected first; I don't want to buy a ________ in a poke.", "options": [{"key": "A", "text": "pig"}, {"key": "B", "text": "dog"}, {"key": "C", "text": "cat"}, {"key": "D", "text": "rat"}], "answer": "A", "ctx": null, "pts": 1}, {"n": 38, "cat": "Lexico-Grammar", "type": "choice", "question": "During the lecture, she summarized the most ________ points of the lengthy dissertation so the audience could easily grasp the core argument.", "options": [{"key": "A", "text": "salient"}, {"key": "B", "text": "trivial"}, {"key": "C", "text": "covert"}, {"key": "D", "text": "dormant"}], "answer": "A", "ctx": null, "pts": 1}, {"n": 39, "cat": "Lexico-Grammar", "type": "choice", "question": "The lawyer presented a ________ argument that logically dismantled the opponent's case piece by piece.", "options": [{"key": "A", "text": "tenuous"}, {"key": "B", "text": "specious"}, {"key": "C", "text": "cogent"}, {"key": "D", "text": "fallacious"}], "answer": "C", "ctx": null, "pts": 1}, {"n": 40, "cat": "Lexico-Grammar", "type": "choice", "question": "It is absolutely imperative that the ambassador ________ strict diplomatic protocol during the upcoming peace summit.", "options": [{"key": "A", "text": "adhere to"}, {"key": "B", "text": "adheres to"}, {"key": "C", "text": "must adhere to"}, {"key": "D", "text": "is adhering to"}], "answer": "A", "ctx": null, "pts": 1}, {"n": 41, "cat": "Lexi ection. (IMPOSITION)", "options": [], "answer": "self-imposed", "ctx": null, "pts": 1}, {"n": 47, "cat": "Lexico-Grammar", "type": "text", "question": "Years of ________ in Hollywood—the rise of streaming, the pandemic, labour strikes and corporate consolidation—mean there are fewer buyers for indie movies than there were at the advent of streaming. (HEAVE)", "options": [], "answer": "upheaval", "ctx": null, "pts": 1}, {"n": 48, "cat": "Lexico-Grammar", "type": "text", "question": "Historical narratives are often ________ with cultural myths, making it difficult to distinguish fact from interpretation. (WEAVE)", "options": [], "answer": "interwoven", "ctx": null, "pts": 1}, {"n": 49, "cat": "Lexico-Grammar", "type": "text", "question": "Despite intense criticism and mounting pressure, the scientist remained ________ in her commitment to ethical research, refusing to compromise her principles. (SWERVE)", "options": [], "answer": "unswerving", "ctx": null, "pts": 1}, {"n": 50, "cat": "Lexico-Grammar", "type": "text", "question": "The doctor recommended a ________ procedure to diagnose the condition, allowing the patient to avoid surgery and recover more quickly. (INVADE)", "options": [], "answer": "non-invasive", "ctx": null, "pts": 1}, {"n": 51, "cat": "Lexico-Grammar", "type": "text", "question": "“Die with a smile” by Lady Gaga and Bruno Mars climbed charts in more than 30 countries and became the ________ daily number-one song on Spotify, a streaming platform. (RUN)", "options": [], "answer": "longest-running", "ctx": null, "pts": 1}, {"n": 52, "cat": "Lexico-Grammar", "type": "text", "question": "Despite its complex themes, the novel remains a compelling ________ that engages readers from beginning to end. (PAGE)", "options": [], "answer": "page-turner", "ctx": null, "pts": 1}, {"n": 53, "cat": "Lexico-Grammar", "type": "text", "question": "The fact that he cannot see is more than ________ by his heightened perception of sound and touch. (BALANCE)", "options": [] meanings / early communication\n   − purposes likely varied and not fully certain", "L4": "Rogers’ Diffusion of Innovations Theory explains how new ideas and technologies\nspread within a social system. The theory was developed by Everett M. Rogers, a\ncommunication scholar and (16) ________. It was first introduced in his 1962 book\n\nDiffusion of Innovations, and explains how innovations are adopted and disseminated\nwithin societies.\n    The model identifies several key elements in the diffusion process. The first is the\ninnovation itself, which refers to a new idea, product, or practice introduced to a\ncommunity. Information about the innovation spreads through communication channels,\neither though mass media or (17) ________. The process unfolds over time within a\nsocial system consisting of interconnected (18) ________ that influence one another.\n    Rogers also categorizes adopters according to the speed at which they accept\ninnovations. For instance, (19) ________, who take up 13.5%, are influential members\nof society who adopt new ideas relatively early and help spread them. At the other end\nof the spectrum are laggards, often described as (20) ________ who tend to resist change.\n    Several attributes of innovations influence their adoption rate, including relative\nadvantage, compatibility, complexity, (21) ________. In fields such as nursing, the\ntheory helps promote the adoption of (22) ________ and new healthcare technologies.\nIt also supports teamwork through initiatives such as (23) ________.\n    Despite its value, the theory has limitations. Critics argue that it may contain a (24)\n________ because it was developed largely in Western contexts. Researchers therefore\nrecommend combining it with additional perspectives, including (25) ________, to\naddress complex real-world situations.", "R1": "Mosquitoes, often (61) ________ as nothing more than irritating pests, may harbour\nvital clues about the course of human evolution. A groundbreaking study has (62)\n________ that certain species in Southeast Asia evolved a preference for human blood\nmillions of years ago — a dietary shift that coincided with the arrival of early hominins\nin the region. Scientists have traditionally relied on fossil evidence to piece together the\nmigratory history of our ancestors, but the tropical climate (63) ________ the\ndecomposition of organic remains, leaving few physical traces for researchers.\n    By analysing mosquito DNA, researchers have (64) ________ an innovative\nmethod to bridge the gaps in the archaeological record. The findings suggest that early\nhuman populations were present in sufficient numbers to (65) ________ a fundamental\n\nbehavioural change in forest-dwelling mosquitoes, which (66) ________ abandoned\ntheir usual primate hosts in favour of humans. This radical dietary transition represents\na (67) ________ moment in ecological history that modern genomic tools can now help\nto date with greater precision.\n    Scientists believe that (68) ________ on diverse sources of biological evidence will\nprove indispensable for reconstructing the full picture of human dispersal out of Africa.\nThe study also (69) ________ the profound interconnectedness of species within shared\necosystems and demonstrates that even the most (70) ________ creatures can illuminate\nsome of the deepest questions about our evolutionary past.", "R2": "HYPERMOBILITY\n    In 1950, the average Briton travelled 5 miles a day, mostly on foot. Nowadays it is\nabout 28 miles and most hardly (71) ________ of it on foot. When work is unusually\nbusy, it is possible to clock (72) ________ an extraordinary number of air miles in a\nvery short period.\n    The term ‘hypermobility’ has been (73) ________ for this relatively recent\nphenomenon of increased travel, (74) ________ a transatlantic flight for a short business\n\nmeeting has become commonplace. Professionals travel twice as far as (75) ________\nworkers. Although commuting and leisure (76) ________ for some of this difference,\nthe main reason is that their jobs require them to travel. (77) ________ hypermobile are\na growing class, mainly managerial, who are more or less permanently on the (78)\n________. Even those of us who do not consider ourselves as high-flyers are travelling\n(79) ________. Several studies have revealed that employers demand more travelling\nfrom their staff; work has become more mobile, international and intense.\n    By 2025, the average day’s travelling may reach 60 miles a day. Transport\nspecialists warn that we have (80) ________ to fully consider the serious social and\nenvironmental consequences of this trend.", "R3": "Although biological mechanisms do not work with the accuracy or stability of\nmodern clocks, a sense of time and its rhythm is built into the functioning of the human\nbody. Our heart, with its beating pulse, is the clocklike internal rhythm of which we are\nmost aware. In his discovery of the law of the pendulum, which turned out to have the\nmost profound effect on all later time-measuring devices, Galileo used—if legend can\nbe believed—his own pulse beat as the test. There are, however, other biological\ntimekeepers that play important roles in our lives. These inner clocks are generally very\nregular, but they can also be “reset” and will fall in step with a shifted rhythm. Even\nafter we take a long flight across the Atlantic or Pacific, our lack of synchronization\nwith the local time slowly disappears. The technical term, introduced in 1959, for the\ninternal timer that keeps track of this 24-hour periodicity and retains it even in the\nabsence of external cues is the circadian system (from the Latin circa for “about” or\n“approximately” and dies for “day”). [I] Though known to biologists for over 200 years,\nbiological clocks have been the subject of intensive research during the last half century.\n   The first human physiological variables that scientists observed to be governed by a\ncircadian rhythm were pulse rate and body temperature. Even if a person rests in bed\nand fasts, his or her deep-body temperature will vary by almost one degree centigrade\n\nbetween its low in the early morning hours and a high late in the afternoon. [II] More\nthan 100 additional physiological and psychological variables are also subject to diurnal\nperiodicities. For example, the speed with which children can do computations varies\nby about 10 percent between its slowest value in the early morning to a high before noon,\ndropping to a nadir in the early afternoon, rising again to a peak at about 6 o’clock and\nthen falling off in the evening. This pattern was first measured in 1907 and replicated a\nhalf century later.\n   The extremely controversial question that arose immediately was to what extent\nthis human circadian rhythm was an autonomous mechanism rather than a simple\nresponse to external signals, such as changes in the level of light, the times of meals, or\nsocial interactions with our surroundings. It has not been easy to find the answer, but\ncareful laboratory experiments have led to the definite conclusion that our body contains\nan autonomous timekeeper. [III] Individuals who volunteered to be kept in artificial\nisolation with no time cues of any kind also helped find the answer. In 1962 a French\nresearcher spent two months in a cold cave, 375 feet underground in the Alps. The\nFrenchman called his aboveground supporters by telephone whenever he ate, went to\nsleep, and woke, and he recorded in detail his thoughts and impressions of the passage\nof time. He and all such explorers found themselves subject to definite internal time\nsignals. It turned out, however, that the measured period of their bodily variables (all of\nwhich were consistent with one another), as well as their subjective impression of the\ntime of day and their periods of sleep and waking, was slightly longer than 25 hours. By\nthe time they emerged from their prolonged isolation, their internal timer was many\nhours out of phase with the external 24-hour clock.\n   Today, the autonomy of biological clocks is a well-established fact. Though running\nat a steady rate, our internal clock is “slow” by about an hour per day, but since it is\ncontinually automatically reset by cycles of light and dark, under normal circumstances\nthe loss of time is not cumulative. [IV]", "R4": "Continents Collide!\n   The idea that the continents are moving was first proposed by the German\nmeteorologist Alfred Wegener in a book published in 1915. He had gathered a great\ndeal of careful and tantalizing evidence, the most obvious being the simple observation\nthat the great landmasses of the world seem to fit together in a jigsaw-like way, a striking\nexample being the coastlines on either side of the Atlantic Ocean. Wegener also\n\ncorrectly theorized that all the continents had once been joined together in a\nsupercontinent, now called Pangaea. Pangaea later broke up into Laurasia, which gave\nrise to North America and Eurasia, and Gondwana, which included the southern\ncontinents.\n   Unfortunately, Wegener could propose no convincing propulsive force for this\nmovement, apart from the vague and erroneous suggestion that centrifugal force might\nplay a role. He also severely overestimated the speed of continental movement. These\nproblems, combined with the fact that he was a meteorologist rather than a geologist,\nmeant that when he published his ideas, the scientific community was resolutely hostile.\nIt is an interesting example of that not uncommon situation in which a scientist who was\nfundamentally correct received no recognition in his lifetime. Semmelweis, who\nadvocated handwashing before surgery as a way of reducing hospital deaths, is another\nexample. Wegener would later die unexpectedly on an expedition in Greenland,\nprobably of a heart attack — in death, as in life, left out in the cold.\n   The first hints of the existence of Gondwana came from the similarity of fossil plants\nand animals distributed across South America, Africa, Antarctica, India, and Australia\nduring the same geological periods. Similarly, the composition and nature of rocks along\ncorresponding coastlines told the same story. Yet for the theory to become scientifically\ncredible, evidence was still needed to explain how such enormous landmasses could\nmove, in much the same way that Semmelweis’s ideas needed the later development of\ngerm theory. It was only in the 1960s, half a century after Wegener’s death, that hard\nevidence began to accumulate and eventually became overwhelming.\n   Wegener’s continental-drift hypothesis later became an important precursor to the\nmodern theory of plate tectonics. According to this theory, the Earth’s outer shell is\nbroken into rigid plates that move very slowly relative to one another. These plates ride\natop hotter, weaker mantle material beneath them, and their movement is caused by a\ncombination of circulating mantle material, the downward pull of sinking plates, and\nthe gravitational force that pushes plates away from mid-ocean ridges. Although\nscientists do not agree on every detail of this process, the overall mechanism is far better\nunderstood than Wegener’s original proposal.\n\n   Of course, this motion is slow, typically at about the speed at which fingernails grow,\nthough in some cases it can be faster. But because it is constant and essentially\nunstoppable, the results can be spectacular, particularly where plates meet. Their\ninteractions give rise to earthquakes and to major geological features such as mountains,\nvolcanoes, oceanic ridges, and trenches. Most of the world’s active volcanoes occur\nnear plate boundaries, with the Pacific Ring of Fire being a particularly striking example.\nVolcanic activity can also occur in the middle of plates, and this is generally explained\nby hotspots: unusually hot regions of mantle material that generate magma capable of\nrising through the plate above.\n   Plate boundaries come in three types. First, there are transform boundaries, where\nplates grind past one another. California’s San Andreas Fault is a well-known example.\nSecond, there are divergent boundaries, where plates move apart from each other. Mid-\nocean ridges, such as the Mid-Atlantic Ridge, and active rift zones, such as those in East\nAfrica, are examples of this type. Finally, there are convergent boundaries, where plates\nmove towards one another. This can produce either a zone in which one plate descends\nbeneath another, or a continental collision. Deep ocean trenches are formed in the\nformer case, and as the descending slab sinks, it releases fluids into the overlying mantle,\nhelping to generate magma. This magma may then rise to the surface, producing\nvolcanic mountain chains such as the Andes. By contrast, continental collision crushes\nand uplifts the crust, forming vast fold mountain systems.\n   One of the best examples of a continental collision is the Indian plate, which is\nsteadily and relentlessly moving into Asia. The Himalayas of Nepal and northern India,\nthe Karakoram Range of northern Pakistan, and the highlands of Afghanistan are all part\nof the vast fold system that has resulted from this collision, producing some of the\nhighest peaks in the world, while their surrounding deep valleys channel snowmelt and\nglacial meltwater into major river systems, including the Indus, the Irrawaddy, and the\nMekong. The Himalayas are still rising today, so Mount Everest may now be slightly\nhigher than it was when it was first climbed in 1953.", "R5": "BODY LANGUAGE\nA Many people, on hearing the term body language, think of the unconscious\n   movements we make which convey our innermost feelings – ones which we may\n   prefer, on occasion, to keep hidden. Think, for example, of film footage of politicians\n   which has been studied by experts in the field, who suggest that the fleeting sideways\n   glance indicates that a lie is being told. But body language can be both voluntary and\n   involuntary. In fact, the boundaries between the two forms can often be blurred. Take\n   a smile, for instance. Which category would you say it fell into? However, to make\n   a distinction, let’s say that voluntary body language refers to gestures and poses made\n   intentionally with some sense of what they communicate. A goodbye wave can\n   usually be categorized thus. Gestures made with the hands and facial expressions\n   exhibited by someone unconsciously can be said to be involuntary. Many believe\n   these – in particular facial expressions and poses taken up during an interchange with\n   another individual – to be far more revealing of our innermost emotional state. For\n   this reason, perhaps, involuntary body language holds our interest more.\nB The origins of body language, while the subject of much research and discussion,\n   remain unclear. One theory suggests that it is a legacy from our ancestors – the form\n   of communication they used before speech had developed. In those non-linguistic\n   days, early humans must have found a means of conveying information and feelings\n   to others; they would have used paralanguage in other words. How closely related\n\n   today’s body language could be to that of our predecessors cannot be established.\n   However, many experts believe that it has undergone changes while co-existing with\n   verbal language. Some gestures may have become redundant; others may have\n   evolved over time.\nC Human body language seems to bear some relation to animal communication. Indeed,\n   some species have shown themselves to be particularly adept at recognizing human\n   body language. Attempts to teach sign language to chimpanzees have been much\n   more successful than any attempts to teach them to understand verbal language. In\n   fact, there are some forms of body language which bear a resemblance to the\n   communicative gestures of other apes, albeit often with a change in meaning.\nD While some forms of body language can be said to be picked up from observation of\n   the environment in which we live, others can be regarded as being genetic in origin.\n   Blind children, for example, will smile without ever having been in a position to\n   witness this particular form of non-verbal facial communication. It has also been\n   claimed that many fundamental elements of body language are universal; the\n   conclusion to be drawn is that these are instinctive actions. This is not to suggest that\n   variation between cultures does not exist, however. Gestures do tend to become\n   refined and these refined forms will be adopted by the young through unconscious\n   observation of the particular world they inhabit.\nE Body language is not solely displayed by individuals engaged in direct\n   communicative interaction. Eye-rolling – the movement of the pupils to the tops of\n   the eyes – may be used by a child in a classroom, for example, to indicate boredom.\n   The same movement can also be employed to convey exasperation or condescension.\n   However, just as verbal language is generally associated with some kind of\n   interaction – be it one-to-one or group – so is non-verbal language too. It has even\n   been suggested that body language may be more important during group interaction.\n   Verbal communication within the group is more likely to be confined to one person\n   at a time while body language can be expressed, and often ‘read’, by all involved.\n   The more people in the group, the more significant the role played by gesture and\n   expression.", "SIGN": "SIGN LANGUAGE\n Have you ever wished to be free from the hubbub of excited chatter or the raising\n voices of those who wish to dominate a discussion or argument? For those who do not\n have the power of speaking or hearing, this is an everyday reality forced upon them\n which they must cope with through sign language. Finger spelling and sign language\n\n\n were used in the school for the deaf founded in Paris about 250 years ago, and over\n 1,500 signs are in regular usage. However, sign language is not confined to special\n schools. In former time, monks who had taken a vow of silence communicated in this\n way, whereas nowadays its practicality in noisy factory environments is much\n appreciated. Over the ages it has proved useful whenever people from different\n cultures have first come into contact with each other. Although it is an essential tool\n for teachers who have a duty to educate the deaf or hard of hearing, it is obviously an\n accomplishment that is worth giving a go of, whoever you are."}, "writing": "D. WRITING (50 points)\nPart 1. (20 points)\n   The table below shows data for some countries on the annual expected population\naffected by river floods and the estimated annual GDP affected by inland flooding.\n   Summarize the information by selecting and reporting the main features, and make\ncomparisons where relevant. You should write about 150 words.\n                      Annual expected population        Estimated annual GDP\n       Country        affected by river floods          affected by inland flooding\n                      (millions)                        (% of total GDP)\n       Bangladesh                  3.48                             4.75\n       Vietnam                     0.93                             2.29\n       Myanmar                     0.39                             1.39\n       Cambodia                    0.19                             3.42\n       India                       4.84                             0.84\n       Egypt                       0.46                             1.18\n       Afghanistan                 0.33                             2.58\n\n\nPart 2: (30 points)\n    Some believe that economic globalisation has lifted millions out of poverty,\nwhile others argue that it primarily benefits wealthy nations and multinational\ncorporations at the expense of developing countries.\n    Discuss both views and give your own opinion.\n    Write an essay of about 300 words to answer the above question. Give reasons and\ninclude any relevant examples and explanations to support your answer. Write your\nanswer on your answer sheet.\n                            -------------- HẾT --------------\n", "transcripts": {"1": "Cave Art\nWooly mammoths, step bison, and other large mammals once roamed alongside people\nacross Eurasia. Tens of thousands of years later, we may have glimpse into this Ice Age\nworld through the cave art left behind by early humans. Around 400 art-filled caves\nand shelters predominately located in France and Spain have been discovered so far.\nSome of the most elaborate prehistoric artwork exists in caves in France known as\nLascaux Grotto and Chauvet-Pont-d'Arc. Cave art dates as far back as 65,000 years ago\nto the time of the neanderthals. Though, radiocarbon dating and other methods have\nrevealed most art to be less than 40,000 years old and created by homo sapiens.\nThe majority of cave art depicts animals that humans would have encountered or hunted\nduring the Ice Age, such as mammoths, horses, lions, aurochs, and deer. Some human\nfigures and other symbols have also been discovered. Cave paintings were mostly\ncreated with red or black pigments made from rocks. Some artworks were painted\ndirectly onto cave walls, while some were first engraved into the stone with tools.\nOccasionally, the artists would follow the natural contours of the stone walls to\naccentuate an animal's features. Ever since the late 1800s, people have debated the\nmeaning and purpose of cave art. Some scholars think cave paintings were created by\n\n\n\n                                                                                  Page 5 of 10\n\fshamans who would go deep into caves and enter a trance-like state, drawing animals\nthey encountered in the spirit world.\nSymbols repeated across artworks may indicate that those symbols had agreed upon\nmeaning among the artists. Thus, perhaps cave art also represents the earliest form of\ngraphic communication. In reality, cave art may have been created for a variety of\nreasons. While we may never know with absolute certainty why cave art was made, or\nthe meaning behind individual paintings, these works give us insight into the evolving\nminds of our prehistoric ancestors and the world in which they lived.\nSource: https://www.youtube.com/watch?v=QUng-iHhSzU", "2": "In this pod, we'll take a look at how youth culture developed in America in the 1950s\nand 60s.\nThe term youth culture refers to the lifestyles interests habits and values of teenagers.\nHowever, the concept of youth culture as well as the term “teenager” itself only\nemerged in the 1940s and 50s. Before this time, people were either adults or\nchildren. As soon as you left school you went straight to work. After the second world\nwar, however, the booming economy meant that young people had more free time and\nmore money to spend than ever before. They were encouraged to stay in school longer\nas there was less pressure on them to get jobs. This meant more time and money for\nleisure opening up a whole new lucrative market for businesses to take advantage of.\nIn addition, young people in the 50s lived under a bigger threat than previous\ngenerations. The idea that with the push of a button the world could be destroyed by\nnuclear war may have led to a mindset of living in the moment. They drank more heavily,\ndrove fast cars, and rebelled against the Fashion's music and values of their parents. This\ndifference in culture and values is known as “the generation gap”.\nThe idea of the radical rebelling teenager can be seen in the cinema of the time, for\nexample, James Dean in Rebel Without a Cause. Dean's death in a car crash, aged just\n24, made him something of a cult icon. The popularity of rock and roll music during the\n50s also helped to carve out the identity of this new Teenage generation.\n\n\n\n                                                                                   Page 6 of 10\n\fYoung people began to adopt their own distinct Fashions and styles of dress- they made\ndeliberate attempts to stand out from mainstream society and challenge dominant\ncultural values. This is known as counterculture. In the 1960s hippies grew their hair\nlong and wore bright flowing colorful clothes. Many were involved in taking illegal\ndrugs and promoted peace and sexual Freedom as epitomized in the popular slogan\nMake Love Not War.\nThe summer of 1967 is known as the summer of love and it saw tens of thousands of\nhippies travel to San Francisco. They disliked everything that mainstream American\nsociety stood for and many took a stand by not working. This led to a lot of friction and\ncriticism from older Generations. In 1969 the Woodstock festival took place in New\nYork. It was promoted as three days of peace and music and is widely seen as an\nimportant cultural moment and the peak of the hippie movements. Roughly half a\nmillion people gathered to watch artists such as the Grateful Dead, Jefferson Airplane,\nJanice Joplin and Jimi Hendrix and to promote the values of peace love and freedom.\nSource: https://www.youtube.com/watch?v=ZhwuEj_1ruM", "3": "Interviewer: Good morning and welcome back to the show. The current job market is\nvery competitive so to give any job seekers listening a helping hand we’ve got Charles\nNorris, a career coach, in the studio to tell us what we can do to stand out from the\ncrowd. Welcome to the show, Charles.\nCharles: Thank you, it’s good to be here.\nInterviewer: Now, first off, what do you do in your role as a career coach?\nCharles: As a career coach, my job is to identify which aspects of a client’s job-hunting\nskills are weak and empower them to take charge of their career aspirations in order for\nthem to fulfil their potential and find, and hopefully secure, the right position. I give\nthem advice on their CV, covering letters, online profiles and interview techniques. I\nalso assist in job searches but I don’t find them a job. I can help them discover what it\nis they want, and give them the tools to get it, but ultimately, they have to put in the leg\nwork.\n\n\n\n                                                                                    Page 7 of 10\n\fInterviewer: OK, well let’s talk a little bit about the advice you give clients. What\nwould you say is necessary for a successful CV?\nCharles: Well, when talking about the CV, I think the most important thing to remember\nis that it’s not complete without a covering letter. The covering letter should effectively\nbe the first page of the CV and it should tell any prospective employer when they read\nit all they need to know about you. The CV is there to fill in the details and give more\nbackground information. One of the biggest mistakes that applicants make is writing a\nblanket covering letter and CV. Because this is what employers will build their first\nimpression on, it should be tailored to the job.\nInterviewer: What do you mean by that?\nCharles: I mean that for each position you apply for you should have a different CV\nand covering letter containing the information about you which is specifically relevant\nto the job. For example, if you are applying for a job as a computer programmer in a\ncompany that uses a certain programming software there’s no point in detailing your\nexperience in a different software no matter how extensive it might be. That can be\nincluded as a footnote but not as a main selling point. To do this, it’s a good idea to go\nthrough the job description in the advert you are replying to and see how your skills and\npersonality fills the requirement of the position.\nInterviewer: And what about sending an email CV? Is that acceptable?\nCharles: Of course. Everything is online now so why not. Actually, a person’s online\npresence is an important factor when job hunting. Where the Internet was once a\nrevolution in socialising, it is now equally important when looking for a job. Employers\nwill often search for applicants they are interested in to find more information about\nthem so you should ensure that whatever they might find is suitable and that anything\ninappropriate is removed. The Internet is a wonderful tool for today’s job-seekers. A\nnumber of my clients use a business orientated networking site to find out about jobs\nand companies.\nInterviewer: Really? They’re that important?\nCharles: Oh yes! They are an essential networking tool and networking is key to finding\na job. They’re also a key resource for recruiters so it’s worth taking the time to make\nsure you include key words in your profile and the details you include show what you\n\n                                                                                   Page 8 of 10\n\fhave to offer and reflect your personality. Especially in the headline. The headline is the\nonly thing users see if they conduct a search so you have to make it count. I had a client\nwho posted a very catchy headline and he was snapped up by a company within two\nweeks. And, of course, you can upload your CV so anyone reading your profile can read\nit if they choose.\nInterviewer: OK, now what about the all-important interview? They can be a nerve\nwracking experience so how do you prepare your clients for them?\nCharles: Again, research is important here. You have to find out as much information\nas you can about the company, their client base and also their competitors. This is\nespecially important when it comes to the question about why you want to work for\nthem which they will undoubtedly ask. You can also search for frequently asked\ninterview questions and prepare answers for them in case they come up. And you should\nalways make sure that you have a selection of questions to ask the interviewer about the\nwork, the company, anything really to show your interest.\nInterviewer: Well, I’m afraid that’s all we’ve got time for. Thank you so much, Charles.\nI’m sure you’ve given our listeners a lot to think about.\nSource: onscreen_c1_wb_ex2_p34", "4": "Today I'm sharing Rogers diffusion of Innovations Theory, a foundational concept that\nhelps us understand how new ideas and Technology spread within a social system. This\ntheory was developed by Everett M Rogers, a communication scholar and sociologist.\nFirst introduced in his 1962 book “diffusion of Innovations”. His work was influenced\nby earlier research in anthropology sociology and marketing. Roger's Theory outlines\nthe process of how why and at what rate new ideas and Technologies are adopted.\nLet's break down the key components. first we have the Innovation. this is the new idea,\nproduct or practice being introduced. next, communication channels. these are the\nmeans by which information about The Innovation is transmitted, whether through mass\nmedia or interpersonal communication. then there's time- the adoption process unfolds\nover time and can be divided into stages. Lastly, the social system a group of individuals\nor entities that are interconnected and influence each other. The adoption process\n\n                                                                                   Page 9 of 10\n\finvolves five stages: knowledge: becoming aware of the Innovation; persuasion:\ndeveloping an attitude positive or negative toward the Innovation; decision: choosing to\nadopt or reject the Innovation; implementation: using the Innovation; confirmation:\ncontinuing to use the Innovation after confirming its benefits.\nindividuals adopt Innovations at different rates categorized into:\n- innovators 2.5%: risk-takers and the first to try new ideas,\n- early adopters 13.5%: opinion leaders who adopt early and influence others,\n- early majority 34%: deliberate individuals who adopt Innovations before the average\nperson,\n- late majority 34%: skeptical individuals who adopt only after most others have done\nso,\n- laggards 16%: traditionalists, resistant to change.\nKey attributes of an innovation that affect its adoption rate include: relative Advantage\ncompatibility, complexity, trialability, and observability.\nNow let's talk about applications in nursing Roger's diffusion of Innovations theory is\nwidely used to promote the adoption of evidence-based practices, Technologies and\ninterventions. this includes the implementation of new practices, patient care technology\nhealth education and interdisciplinary collaboration. in nursing understanding the\ncategories of adopters helps in targeting interventions and tailoring communication\nstrategies to improve the uptake of new practices. however, the theory has some\nlimitations. it often overemphasizes individual decision making, underestimating\norganizational and systemic factors; it assumes a linear model of adoption which may\nnot reflect real world complexities. there's also a cultural bias developed in Western\ncontexts and it focuses more on adoption rather than the sustainability of Innovations\nover time. by applying Roger diffusion of Innovations Theory effectively, nursing\nleaders can enhance the adoption of Innovations, improve patient care outcomes and\nstreamline Healthcare delivery. But remember addressing its limitations requires\nintegrating complimentary Frameworks and adapting strategies to specific contexts.\nSource: https://www.youtube.com/watch?v=bjzPLq88TUs\n\n\n\n\n                                                                                 Page 10 of 10"}}</script><script>

const navs=[['all','Toàn bộ 110 câu'],['Listening','🎧 Listening · 1–25'],['Lexico-Grammar','📗 Lexico-Grammar · 26–60'],['Reading','📖 Reading · 61–110'],['wrong','🔁 Luyện lại câu sai'],['unseen','📝 Câu chưa làm'],['writing','✍️ Writing · 2 bài']];function qset(){return Q.filter(q=>mode==='all'||mode==='wrong'&&(progress[q.n]?.wrongEver===true)||mode==='unseen'&&!progress[q.n]?.attempts?.length||q.cat===mode)}function changeMode(m){mode=m;expanded=false;let set=qset();current=set.length?set[0].n:1;render()};function renderNav(){$('nav').innerHTML=navs.map(([k,v])=>`<button class="navbtn ${mode===k?'active':''}" onclick="changeMode('${k}')">${v}${k==='wrong'?'<span>'+Q.filter(q=>progress[q.n]?.wrongEver).length+'</span>':''}</button>`).join('')};function renderStats(){let ps=Q.filter(q=>progress[q.n]?.attempts?.length),ok=ps.filter(q=>progress[q.n].lastCorrect),bad=Q.filter(q=>progress[q.n]?.wrongEver);$('doneCount').textContent=ps.length;$('rightCount').textContent=ok.length;$('wrongCount').textContent=bad.length};function part(n){return n<=5?1:n<=10?2:n<=15?3:4}function contextKey(q){return q.ctx}function typeHint(q){if(q.n<=5||q.n>=16&&q.n<=25)return 'Điền tối đa 3 từ';if(q.n>=46&&q.n<=55)return 'Word formation';if(q.n>=56&&q.n<=60)return 'Nhập dạng “từ sai → từ đúng”';if(q.n>=71&&q.n<=80)return 'Điền đúng 1 từ';if(q.n>=96&&q.n<=100)return 'Tối đa 3 từ trích từ bài đọc';return 'Chọn một đáp án'}

let input=q.type==='text'?`<input id="textAns" type="text" autocomplete="off" placeholder="Nhập đáp án của bạn…" oninput="draft=this.value">`:`<div>${q.options.map(x=>`<button class="choice" id="opt_${x.key.replace(' ','_')}" onclick="selectOption('${x.key}')"><span class="letter">${esc(x.key)}</span><span>${esc(x.text)}</span></button>`).join('')}</div>`;

function jump(n){current=n;expanded=false;render()};function move(dir){let set=qset(),i=set.findIndex(q=>q.n===current);if(i+dir>=0&&i+dir<set.length)jump(set[i+dir].n)}function selectOption(k){selected=k;document.querySelectorAll('.choice').forEach(b=>b.classList.remove('selected'));let b=document.getElementById('opt_'+k.replace(' ','_'));if(b)b.classList.add('selected')};function normalize(s){return String(s||'').toLowerCase().normalize('NFKD').replace(/[‘’]/g,"'").replace(/[–—→]/g,' ').replace(/[^a-z0-9]+/g,' ').trim()};function correct(q,a){let s=normalize(a),key=normalize(q.answer);if(q.n===1)return ['art filled caves','art filled shelters','caves','shelters'].includes(s);if(q.n===2)return ['the neanderthals','neanderthals'].includes(s);if(q.n===4)return ['the natural contours','natural contours'].includes(s);if(q.n===5)return ['a trance like state','trance like state'].includes(s);if(q.n===18)return ['individuals or entities','individuals','entities'].includes(s);if(q.n===21)return ['trialability and observability','trialability observability'].includes(s);if(q.n===25)return ['complimentary frameworks','complementary frameworks'].includes(s);if(q.n===55)return ['otherworldly','other worldly'].includes(s);if(q.n===75)return ['manual','blue collar'].includes(s);if(q.n===97)return ['essentially unstoppable','unstoppable'].includes(s);if(q.n===98)return ['major geological features','geological features'].includes(s);if(q.n>=56&&q.n<=60){let pairs=q.answer.split('→').map(normalize);return s===pairs.join(' ')||s===pairs[1]};return s===key}
function explain(q,user,ok){let correctOpt=q.options?.find(x=>x.key===q.answer),answerName=correctOpt?`${q.answer}. ${correctOpt.text}`:q.answer;let context=DB.context[q.ctx]||'';let stem=q.question||'';let pat='';if(q.type==='choice'){pat='Xác định đúng yêu cầu của câu hỏi, sau đó so sánh ngữ nghĩa và cấu trúc của từng phương án với ngữ cảnh. ';if(q.n>=26&&q.n<=45)pat='Với dạng từ vựng/ngữ pháp, thử đưa từng lựa chọn vào câu. Kiểm tra collocation, thành ngữ, từ loại, ý nghĩa và ngữ pháp. ';if(q.n>=61&&q.n<=70)pat='Với bài điền từ, xét cả câu trước/sau chỗ trống: từ phải đúng sắc thái, kết hợp từ và mạch lập luận. ';if(q.n>=81&&q.n<=90)pat='Đọc câu hỏi trước, tìm luận điểm tương ứng trong bài và phân biệt thông tin tác giả nói với suy diễn ngoài văn bản. ';if(q.n>=101)pat='Đối chiếu từ khóa trong nhận định với ý tương đương ở đoạn A–E; không chỉ tìm từ trùng bề mặt. '}else if(q.type==='tristate')pat='Chỉ chọn True/Yes khi văn bản xác nhận, False/No khi văn bản phủ định, Not Given khi không đủ chứng cứ. ';else pat='Chú ý số từ tối đa, chức năng ngữ pháp của vị trí trống và cụm từ khớp ngữ cảnh. ';let wrong=q.options?.filter(x=>x.key!==q.answer).map(x=>`<li><b>${esc(x.key)}:</b> ${esc(x.text)} — cần đối chiếu với bằng chứng; không phải phương án đáp án theo HDC.</li>`).join('')||'';let soc=q.type==='tristate'?'Bạn tìm thấy câu nào xác nhận hoặc bác bỏ mệnh đề, hay bài không cung cấp thông tin ấy?':q.type==='choice'?'Từ khóa hoặc quy tắc nào khiến đáp án đúng phù hợp hơn lựa chọn bạn đã chọn?':'Nếu che đáp án, vị trí trống yêu cầu loại từ/cấu trúc nào và dấu hiệu nằm ở đâu trong câu?';let note=q.n>=56&&q.n<=60?'Hãy thay từ sai bằng dạng đúng và đọc lại toàn bộ câu để kiểm tra tính tự nhiên.':q.n<=25?'Có thể mở transcript chính thức ở phía trên để đối chiếu cụm từ trong lời nghe.':q.ctx?'Mở đoạn văn gốc phía trên, tìm câu/đoạn mang bằng chứng và gạch dưới từ khóa.':'Áp dụng quy tắc vào chính câu gốc, không học thuộc chữ cái đáp án.';return `<div class="feedback ${ok?'':'bad'}"><h3>${ok?'✅ Chính xác!':'❌ Chưa đúng — hãy sửa được nguyên nhân sai'}</h3><div><b>Đáp án theo hướng dẫn chấm:</b> ${esc(answerName)}</div><div><b>Câu bạn trả lời:</b> ${esc(user)}</div><h3 style="margin-top:12px">🧠 Feynman — hiểu đơn giản theo từng bước</h3><p><b>1. Nhận diện:</b> ${esc(typeHint(q))}. ${esc(pat)}</p><p><b>2. Bằng chứng/quy tắc:</b> ${esc(note)}</p><p><b>3. Kiểm chứng:</b> ${q.options?.length?'Loại trừ những lựa chọn không phù hợp với toàn bộ câu, không chỉ một từ.':'Điền đáp án trở lại văn bản và đọc thành câu hoàn chỉnh.'}</p>${wrong?`<details><summary>Phân tích các phương án còn lại</summary><ul>${wrong}</ul><p class="small">Đây là hướng dẫn đối chiếu; tài liệu hướng dẫn chấm chỉ cung cấp đáp án, không giải chi tiết từng phương án.</p></details>`:''}<h3>❓ Socrates — tự phát hiện lỗ hổng</h3><p>${esc(soc)}</p><textarea id="reflection" style="min-height:72px" placeholder="Tự giải thích vì sao đáp án đúng (không bắt buộc)..."></textarea><button class="action secondary" onclick="saveReflection(${q.n})">Lưu giải thích của em</button>${!ok?'<p><b>🔁 Câu này đã được đưa vào “Luyện lại câu sai”.</b> Hãy quay lại sau khi ôn lý thuyết để tự trả lời lần nữa.</p>':''}</div>`}
function check(){let q=Q[current-1],a=q.type==='text'?($('textAns')?.value||'').trim():selected;if(!a){alert('Hãy chọn hoặc nhập đáp án trước khi kiểm tra.');return}let ok=correct(q,a),r=progress[q.n]||{attempts:[]};r.attempts.push({answer:a,correct:ok,at:new Date().toISOString()});r.lastCorrect=ok;r.wrongEver=!!r.wrongEver||!ok;progress[q.n]=r;save();$('feedback').innerHTML=explain(q,a,ok);document.querySelectorAll('.choice').forEach(b=>{let k=b.querySelector('.letter')?.textContent;if(k===q.answer)b.classList.add('correct');else if(k===a)b.classList.add('wrong');b.disabled=true});let b=$('check');if(b)b.disabled=true;renderNav()}
// Điều khiển hoàn toàn bằng bàn phím, không ảnh hưởng nhập ghi chú, writing hay trình phát âm thanh.
document.addEventListener('keydown',function(e){
  if(mode==='writing'||e.ctrlKey||e.metaKey||e.altKey||e.isComposing||e.repeat)return;
  const el=e.target,tag=el?.tagName||'',editable=el?.isContentEditable||tag==='TEXTAREA'||tag==='SELECT'||tag==='INPUT'&&el.id!=='textAns';
  if(editable)return;
  const set=qset();if(!set.length)return;
  const q=Q[current-1],input=$('textAns'),checkBtn=$('check');if(!q||!checkBtn)return;
  const assessed=checkBtn.disabled;
  if(e.key==='Enter'){
    // Enter trên nút điều hướng/chọn mục vẫn giữ hành vi bình thường.
    if(tag==='BUTTON'&&el.id!=='check'&&!el.classList.contains('choice'))return;
    e.preventDefault();
    if(assessed){move(1);return}
    if(q.type!=='text'&&el.classList?.contains('choice')){
      const key=el.querySelector('.letter')?.textContent;if(key)selectOption(key);
    }
    check();return;
  }
  if(assessed||q.type==='text'||tag==='INPUT')return;
  const keys=q.options.map(x=>x.key);
  let key=e.key.toUpperCase();
  if(key==='N'&&keys.includes('NG'))key='NG';
  if(keys.includes(key)&&key.length<=2){e.preventDefault();selectOption(key);return}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();const i=keys.indexOf(selected),step=e.key==='ArrowDown'?1:-1;
    selectOption(keys[i===-1?(step>0?0:keys.length-1):(i+step+keys.length)%keys.length]);
  }
});
function saveReflection(n){progress[n]=progress[n]||{attempts:[]};progress[n].reflection=$('reflection')?.value||'';save();alert('Đã lưu ghi chú của em trên trình duyệt.')};function loadAudio(e){let f=e.target.files[0];if(!f)return;if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(f);showAudio()};function showAudio(){let el=$('audioBox');if(el)el.innerHTML=`<audio id="player" controls preload="metadata" style="width:100%;margin:9px 0" src="${audioURL}"></audio>`};function setSpeed(v){if($('player'))$('player').playbackRate=+v};function toggleTranscript(){let el=$('transcript');if(!el)return;el.textContent=DB.transcripts[String(part(current))]||'Không có transcript';el.classList.toggle('hidden')}
function writingGuideOne(){return `<details class="guide" open><summary>📘 HƯỚNG DẪN TỪNG BƯỚC — REPORT (150 từ)</summary><div class="guidebody"><h4>1. Giải mã yêu cầu đề</h4><p>Viết <b>report mô tả bảng số liệu</b>, không phải bài nghị luận. Hai chỉ số có đơn vị khác nhau: <b>triệu người</b> chịu ảnh hưởng bởi lũ sông và <b>% GDP</b> chịu ảnh hưởng bởi lũ nội địa. Không cộng hai loại số liệu hoặc tự suy ra quan hệ nhân quả.</p><h4>2. Nhìn số liệu theo 4 câu hỏi Socrates</h4><ol><li>Nước nào cao nhất về dân số? <b>India: 4.84 million</b>; kế tiếp <b>Bangladesh: 3.48 million</b>.</li><li>Nước nào cao nhất về GDP? <b>Bangladesh: 4.75%</b>; tiếp theo <b>Cambodia: 3.42%</b>.</li><li>Sự tương phản nào đáng chú ý? <b>India</b> đứng đầu về số người nhưng chỉ <b>0.84%</b> GDP; <b>Cambodia</b> chỉ <b>0.19 million</b> người nhưng GDP chịu ảnh hưởng <b>3.42%</b>.</li><li>Các nước còn lại có thể nhóm như thế nào để tránh liệt kê cứng nhắc?</li></ol><h4>3. Công thức 4 đoạn</h4><div class="step"><b>Đoạn 1 — Introduction (1 câu, 20–25 từ):</b> diễn đạt lại thông tin trong đề.<p class="model">The table compares seven countries in terms of the annual number of people expected to be affected by river floods and the proportion of GDP exposed to inland flooding.</p></div><div class="step"><b>Đoạn 2 — Overview (2 câu, 30–35 từ):</b> nêu các xu hướng nổi bật, không sa vào từng con số.<p class="model">Overall, India and Bangladesh have by far the largest affected populations, whereas Bangladesh records the greatest share of GDP affected. The population and economic measures do not always follow the same pattern.</p></div><div class="step"><b>Đoạn 3 — Body 1 (45–50 từ):</b> so sánh India, Bangladesh và các nước về số người bị ảnh hưởng.</div><div class="step"><b>Đoạn 4 — Body 2 (45–50 từ):</b> so sánh tỷ lệ GDP, làm rõ Cambodia và India.</div><h4>4. Mẫu diễn đạt hữu ích</h4><p><b>Comparison:</b> <i>By contrast, ..., whereas ..., respectively, more than twice as high as ...</i></p><p><b>Reporting:</b> <i>accounted for, stood at, was estimated at, recorded the highest proportion, a relatively small figure</i></p><h4>5. Bẫy thường gặp — Feynman</h4><p>Vì sao <i>4.84 million</i> không chứng minh India thiệt hại kinh tế nặng nhất? Vì bảng đo <b>hai đại lượng khác nhau</b>: một bên là số người, một bên là tỷ lệ GDP. Đọc đúng đơn vị trước khi so sánh.</p><label class="checkrow"><input type="checkbox"> Tôi có Introduction và Overview riêng.</label><label class="checkrow"><input type="checkbox"> Tôi so sánh cả <b>2 chỉ số</b> và nêu điểm tương phản nổi bật.</label><label class="checkrow"><input type="checkbox"> Tôi không đưa quan điểm cá nhân hay suy diễn nguyên nhân.</label><label class="checkrow"><input type="checkbox"> Tôi dùng đúng số liệu, đơn vị và viết khoảng 150 từ.</label></div></details>`}
function writingGuideTwo(){return `<details class="guide" open><summary>📙 HƯỚNG DẪN TỪNG BƯỚC — DISCUSS BOTH VIEWS (300 từ)</summary><div class="guidebody"><h4>1. Nhận diện nhiệm vụ</h4><p>Đề hỏi <b>Discuss both views and give your own opinion</b>. Bắt buộc trình bày <b>cả hai quan điểm</b> và thể hiện <b>lập trường cá nhân rõ ràng</b>. Không chỉ kể ưu điểm và nhược điểm rời rạc.</p><h4>2. Bóc tách luận điểm</h4><div class="step"><b>Quan điểm A: toàn cầu hóa giúp giảm nghèo.</b><p>Chuỗi lập luận mẫu: thương mại và đầu tư xuyên biên giới → việc làm, xuất khẩu, tiếp cận công nghệ → cơ hội tăng thu nhập. Đây là <b>lập luận minh họa</b>, không phải số liệu được đề cung cấp.</p></div><div class="step"><b>Quan điểm B: lợi ích tập trung ở nước giàu và tập đoàn đa quốc gia.</b><p>Chuỗi lập luận mẫu: doanh nghiệp lớn có sức mặc cả → người lao động và doanh nghiệp nhỏ nhận phần lợi ích hạn chế → bất bình đẳng, phụ thuộc chuỗi cung ứng. Cần giải thích quan hệ nhân quả, tránh khẳng định tuyệt đối.</p></div><h4>3. Khung bài 4 đoạn — 280–320 từ</h4><div class="step"><b>Introduction (40–50 từ)</b><p>Paraphrase đề → Thesis cân bằng, có chính kiến.</p><p class="model">Economic globalisation has brought countries closer through trade and investment. While some argue that this process has reduced poverty, others believe that its rewards disproportionately flow to richer economies and large corporations. I believe both effects exist, but the outcome largely depends on domestic policies.</p></div><div class="step"><b>Body 1 (85–100 từ): vì sao có thể giảm nghèo?</b><p>Topic sentence → Explanation → Example giả định/khái quát → Kết nối lại luận điểm.</p><p class="model">Supporters of globalisation argue that access to international markets enables developing economies to expand production and create employment. ...</p></div><div class="step"><b>Body 2 (95–110 từ): vì sao phân phối lợi ích không đều?</b><p>Topic sentence → Cơ chế bất bình đẳng → Ví dụ → Nêu điều kiện để điều chỉnh (giáo dục, bảo vệ lao động, chính sách cạnh tranh).</p><p class="model">Critics, however, point out that the gains are not distributed equally. Large multinational firms may possess greater bargaining power than local suppliers ...</p></div><div class="step"><b>Conclusion (35–45 từ)</b><p>Nhắc gọn 2 phía → tái khẳng định quan điểm; không đưa luận điểm mới.</p><p class="model">In conclusion, globalisation can generate opportunities for poorer nations, yet it can also deepen economic inequalities. In my view, governments should strengthen labour protections and investment in education so that the benefits are more widely shared.</p></div><h4>4. Công thức lý giải Feynman: CLAIM → WHY → HOW → EXAMPLE → LINK</h4><p><b>Claim:</b> Globalisation can create jobs. <b>Why?</b> Foreign firms may invest in local production. <b>How?</b> New factories need workers and supporting services. <b>Example:</b> Một tình huống giả định về doanh nghiệp xuất khẩu. <b>Link:</b> This may raise household incomes. Trình bày rõ từng nấc giúp tránh viết câu khẳng định không được chứng minh.</p><h4>5. Tự vấn Socrates trước khi hoàn tất</h4><ol><li>Hai mặt được trình bày công bằng, hay em đang viết lệch sang một phía?</li><li>Nếu bỏ một ví dụ, luận điểm còn được giải thích bằng quan hệ nguyên nhân–kết quả không?</li><li>Em đã dùng ví dụ cụ thể mà không bịa số liệu chưa?</li><li>Quan điểm của em có nhất quán từ mở bài đến kết luận không?</li></ol><h4>6. Từ nối và diễn đạt</h4><p><i>Proponents contend that ...; Conversely, critics maintain that ...; This is because ...; Consequently, ...; Nevertheless, ...; From my perspective, ...; Provided that ...</i></p><label class="checkrow"><input type="checkbox"> Mở bài có thesis nêu chính kiến.</label><label class="checkrow"><input type="checkbox"> Tôi đã giải thích và minh họa <b>cả hai phía</b>.</label><label class="checkrow"><input type="checkbox"> Mỗi đoạn thân bài có câu chủ đề và lập luận cụ thể.</label><label class="checkrow"><input type="checkbox"> Kết luận thống nhất với mở bài, độ dài khoảng 300 từ.</label></div></details>`}
function renderWriting(){let src=DB.writing;let parts=src.split('Part 2: (30 points)');let one=parts[0]||'',two='Part 2: (30 points)'+(parts[1]||'');$('main').innerHTML=`<h2>✍️ Writing · 50 điểm</h2><p class="help">Đọc hướng dẫn và tự xây dựng lập luận trước khi viết. Câu mẫu để học cấu trúc, không thay thế bài làm độc lập. App lưu bản nháp và đếm từ, chưa chấm Writing tự động bằng AI.</p><div class="panel"><h3>Part 1 · Report · 20 điểm</h3><div class="writing">${esc(one)}</div>${writingGuideOne()}<h3>📝 Bài làm của em</h3><textarea id="write1" placeholder="Viết bài báo cáo khoảng 150 từ..."></textarea><div class="horizontal"><span id="word1" class="small"></span><button class="action" onclick="saveWriting(1)">Lưu bài 1</button></div><details><summary class="ctxbutton">Thang điểm theo hướng dẫn chấm</summary><p>Introduction 2 điểm; Overview 2 điểm; miêu tả số liệu, đối chiếu 6 điểm; Language use 10 điểm.</p></details></div><div class="panel" style="margin-top:18px"><h3>Part 2 · Essay · 30 điểm</h3><div class="writing">${esc(two)}</div>${writingGuideTwo()}<h3>📝 Bài làm của em</h3><textarea id="write2" placeholder="Viết bài nghị luận khoảng 300 từ..."></textarea><div class="horizontal"><span id="word2" class="small"></span><button class="action" onclick="saveWriting(2)">Lưu bài 2</button></div><details><summary class="ctxbutton">Thang điểm theo hướng dẫn chấm</summary><p>Organization 5 điểm; Content 15 điểm; Language use 10 điểm. Phải bàn luận cả hai quan điểm và đưa chính kiến cá nhân.</p></details></div>`;for(let i=1;i<=2;i++){let t=$('write'+i);t.value=progress['writing'+i]||'';t.addEventListener('input',()=>wordCount(i));wordCount(i)}}
function wordCount(i){let t=$('write'+i).value.trim();$('word'+i).textContent=(t?t.split(/\s+/).length:0)+' từ'}function saveWriting(i){progress['writing'+i]=$('write'+i).value;save();alert('Đã lưu bản nháp bài '+i)}function exportResults(){let blob=new Blob([JSON.stringify(progress,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ket_qua_hsg_anh10.json';a.click();URL.revokeObjectURL(a.href)}function resetAll(){if(confirm('Xóa toàn bộ đáp án, ghi chú và bài viết đã lưu trên trình duyệt?')){progress={};save();render()}}render();
