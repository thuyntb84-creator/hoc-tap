<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSK3 Bài 15 · Smart Practice</title><style>
:root{--bg:#f4f7fd;--ink:#23324d;--line:#e1e8f4;--blue:#4368ed;--soft:#eaf0ff;--red:#dd4960;--green:#138467}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,'Microsoft YaHei','Noto Sans CJK SC',sans-serif}button,textarea,input{font:inherit}button{cursor:pointer}header{background:linear-gradient(118deg,#283d7d,#5676eb);color:white;padding:24px 5%}header h1{margin:8px 0;font-size:25px}.wrap{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:90vh}nav{background:white;padding:18px 12px;border-right:1px solid var(--line)}nav button{display:block;border:0;background:transparent;text-align:left;width:100%;padding:13px;border-radius:12px;margin:3px 0;font-weight:700;color:#495976}nav button.active,nav button:hover{background:var(--soft);color:#2c51cc}main{max-width:1080px;width:100%;padding:25px;margin:auto}.card{background:white;border-radius:17px;border:1px solid var(--line);padding:21px;margin:0 0 18px;box-shadow:0 3px 15px #152a4608}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.stat{background:#f2f5ff;border-radius:13px;padding:17px}.stat strong{display:block;font-size:29px;color:#4264d5}.muted{color:#677691;font-size:14px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0}.btn{background:var(--blue);color:white;border:0;border-radius:11px;padding:11px 15px;font-weight:700}.btn.alt{background:#eaf0ff;color:#3154b7}.btn.gray{background:#eef1f7;color:#45546e}.pill{border:1px solid #d7e0ee;border-radius:50px;padding:10px 13px;background:#fff;color:#4b5d7b}.pill.on{background:var(--blue);color:white}.hanzi{font-size:24px;line-height:1.7}.py{font-size:14px;color:#4276b9}.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px}.vgrid .card{margin:0;padding:15px}.vgrid .hanzi{font-weight:700}.formula{font-size:19px;font-weight:700;padding:15px;background:#fff4c1;border-radius:12px;line-height:1.6}.grammarcards{display:grid;gap:15px}.grammar{border-radius:15px;border:2px dashed #dccde7;padding:20px;background:linear-gradient(120deg,#fff9fc,#fffef5)}.grammar h3{margin:0 0 10px}.readingline{border-bottom:1px dashed #d7dfed;padding:12px 0;line-height:1.7}.readingline .hanzi{font-size:21px}.quiz{border:1px solid var(--line);padding:18px;border-radius:14px;background:white;margin-bottom:13px}.option{display:block;width:100%;padding:12px;text-align:left;background:#fbfcff;border:1px solid #dce3ed;border-radius:11px;margin:7px 0;color:var(--ink)}.option.sel{border:2px solid #4267ef;padding:11px;background:#edf2ff}.option.good{border-color:#24a17d;background:#e8f8ee}.option.bad{border-color:var(--red);background:#fff0f2}.feedback{background:#f2f5fb;border-radius:12px;padding:14px;margin:10px 0;line-height:1.8}.feedback.good{background:#e7f8f0}.feedback.bad{background:#fff0f2}.socrates{border-left:4px solid #daa34f;background:#fffaeb;padding:12px;margin-top:9px;border-radius:9px}textarea{width:100%;min-height:100px;padding:14px;border:1px solid #ccd5e5;border-radius:11px;line-height:1.7;resize:vertical}details{margin:12px 0}summary{color:#315ac4;cursor:pointer;font-weight:bold}.progress{height:9px;border-radius:10px;background:#e4eaf5;overflow:hidden}.progress>i{display:block;background:var(--blue);height:100%}.small{font-size:13px;color:#748198}.textnote{background:#fff9e5;padding:14px;border-radius:11px}.quizstats{padding:15px;border-radius:12px;background:#edf3ff;margin:14px 0}h2{margin:0 0 13px}h3{line-height:1.5}.empty{padding:24px;text-align:center}.voice{font-size:13px}.badge{background:#ffe4ed;color:#aa4669;border-radius:7px;padding:4px 9px;display:inline-block;font-size:12px;font-weight:bold}.qtitle{font-size:19px;line-height:1.7}.cover{background:linear-gradient(130deg,#fef1ef,#f2f2ff);border:2px dashed #e8c8cf;border-radius:16px;padding:18px;margin:12px 0}.cover .formula{margin-top:10px}.tabs{display:flex;flex-wrap:wrap;gap:8px}.alert{background:#fff9e7;border-radius:12px;padding:13px} @media(max-width:800px){.wr </style></head><body><header><span class="badge">新HSK教程 3 · LESSON 15</span><h1>我是半个南京人</h1><div>Tôi là nửa người Nam Kinh · Học hiểu → luyện tập → tự chữa lỗi</div></header><div class="wrap"><nav id="nav"></nav><main id="main"></main></div><script>const DB={"vocab": [["蓝", "lán", "xanh lam"], ["段", "duàn", "đoạn; khoảng thời gian"], ["附近", "fùjìn", "gần đây, lân cận"], ["马路", "mǎlù", "đường lớn"], ["平时", "píngshí", "thường ngày"], ["放学", "fàngxué", "tan học"], ["游戏", "yóuxì", "trò chơi"], ["老人", "lǎorén", "người già"], ["根据", "gēnjù", "dựa theo; căn cứ"], ["了解", "liǎojiě", "hiểu, tìm hiểu"], ["可是", "kěshì", "nhưng, tuy nhiên"], ["以上", "yǐshàng", "trở lên, hơn"], ["有名", "yǒumíng", "nổi tiếng"], ["景点", "jǐngdiǎn", "địa điểm tham quan"], ["游客", "yóukè", "du khách"], ["外地", "wàidì", "nơi khác"], ["聊", "liáo", "trò chuyện"], ["河", "hé", "sông"], ["关系", "guānxi", "quan hệ"], ["养", "yǎng", "nuôi; nuôi dưỡng"], ["西北", "xīběi", "tây bắc"], ["经过", "jīngguò", "đi qua; trải qua"], ["草地", "cǎodì", "bãi cỏ"], ["遇见", "yùjiàn", "gặp gỡ"]], "readings": [{"title": "Bài khóa 1 – Khu dân cư Lam Thiên", "where": "Văn phòng · 王一雪、杨同乐", "lines": [["杨同乐", "您搬到蓝天小区一段时间了，觉得怎么样？", "Chị chuyển đến khu dân cư Lam Thiên được một thời gian rồi, thấy thế nào?"], ["王一雪", "小区环境挺好的，附近买东西也很方便，过马路就是超市。", "Môi trường khu dân cư khá tốt, mua sắm gần đó tiện lợi, băng qua đường là siêu thị."], ["杨同乐", "平时孩子们在哪儿玩？", "Ngày thường bọn trẻ chơi ở đâu?"], ["王一雪", "小区里有很多树，孩子们放学后就在树下做游戏。你想买房子吗？", "Trong khu có nhiều cây, sau giờ học bọn trẻ chơi dưới tán cây. Anh muốn mua nhà à?"], ["杨同乐", "是。我想买一个大房子，让我爸妈过来跟我一起住。", "Đúng. Tôi muốn mua nhà lớn để bố mẹ đến sống cùng."], ["王一雪", "蓝天小区的老人挺多的，这几年小区根据他们的需要，有了很多变化。", "Khu Lam Thiên có khá nhiều người già; mấy năm nay khu đã thay đổi nhiều dựa trên nhu cầu của họ."], ["杨同乐", "真不错！过几天我去蓝天小区看看。", "Tốt quá! Vài hôm nữa tôi sẽ đến khu Lam Thiên xem."]], "questions": ["蓝天小区附近买东西方便吗？", "蓝天小区的孩子们放学后在哪里玩？", "蓝天小区为什么变化多了？"]}, {"title": "Bài khóa 2 – Tìm hiểu thành phố Nam Kinh", "where": "Văn phòng · 王一雪、杨同乐", "lines": [["王一雪", "假期我想去南京旅游，但是我不太了解那里。", "Kỳ nghỉ tôi muốn đi du lịch Nam Kinh nhưng không hiểu rõ nơi đó lắm."], ["杨同乐", "我虽然不是南京人，可是我是在南京上的大学，可以说是半个南京人。", "Tôi tuy không phải người Nam Kinh, nhưng học đại học ở Nam Kinh, có thể nói là nửa người Nam Kinh."], ["王一雪", "太好了！你快给我介绍一下南京吧。", "Hay quá! Anh mau giới thiệu cho tôi một chút về Nam Kinh đi."], ["杨同乐", "南京有两千年以上的历史，有老城、老街，还有很多有名的景点，每年去旅游的游客特别多。", "Nam Kinh có lịch sử hơn hai nghìn năm, có thành cổ, phố cổ và nhiều danh thắng nổi tiếng, mỗi năm có rất nhiều du khách."], ["王一雪", "除了这些以外，你再告诉我一些外地人不知道的地方。", "Ngoài những chỗ đó, anh hãy kể thêm vài địa điểm người ngoài chưa biết đi."], ["杨同乐", "那太多了，我得一点儿一点儿给您讲。", "Nhiều lắm, tôi phải kể cho chị từng chút một."], ["王一雪", "行，下班后我请你吃晚饭，咱们边吃边聊。", "Được, sau giờ làm tôi mời anh ăn tối, vừa ăn vừa trò chuyện."]], "questions": ["王一雪了解南京吗？", "杨同乐为什么了解南京？", "王一雪为什么请杨同乐吃晚饭？"]}, {"title": "Bài khóa 3 – Câu chuyện về Hoàng Hà", "where": "Ở nhà · 王一雪、刘小明", "lines": [["王一雪", "小明，中国有一条大河，它的名字跟颜色有关系，你知道是什么河吗？", "Tiểu Minh, Trung Quốc có con sông lớn tên liên quan đến màu sắc, con biết sông nào không?"], ["刘小明", "我知道，是黄河！", "Con biết, là Hoàng Hà!"], ["王一雪", "你说对了。我再问问你，你知道它为什么叫黄河吗？", "Con trả lời đúng rồi. Mẹ hỏi thêm nhé, con biết vì sao nó tên Hoàng Hà không?"], ["刘小明", "因为河水看起来是黄色的，所以叫这个名字。黄河是中国最长的河吗？", "Vì nước sông trông màu vàng nên gọi vậy. Hoàng Hà là sông dài nhất Trung Quốc à?"], ["王一雪", "不是。黄河虽然不是最长的河，可是在历史上很重要。", "Không. Hoàng Hà tuy không phải sông dài nhất nhưng rất quan trọng trong lịch sử."], ["刘小明", "这个我知道。很久以前，很多中国人都住在黄河边上。", "Điều này con biết. Rất lâu trước kia nhiều người Trung Quốc sống bên Hoàng Hà."], ["王一雪", "对。在我们中国人看来，黄河像妈妈一样，养了我们几千年。", "Đúng. Theo người Trung Quốc chúng ta, Hoàng Hà như người mẹ, đã nuôi dưỡng chúng ta hàng nghìn năm."]], "questions": ["黄河的名字为什么跟“黄”这个颜色有关系？", "黄河是中国最长的河吗？", "在中国人看来，黄河像什么一样？为什么？"]}, {"title": "Bài khóa 4 – Dòng sông tuổi thơ", "where": "Nhật ký · 王一雪", "lines": [["王一雪", "我小时候住在北京的西北边，有一条非常有名的河经过那里。", "Hồi nhỏ tôi sống ở phía tây bắc Bắc Kinh; có một con sông rất nổi tiếng chảy qua đó."], ["王一雪", "我家就住在河边。那里有高高的大树和绿绿的草地。", "Nhà tôi ở ngay bên sông. Ở đó có những cây cao và bãi cỏ xanh mướt."], ["王一雪", "春天，河边的花都开了，看起来特别漂亮。", "Mùa xuân, hoa ven sông đều nở, trông đặc biệt đẹp."], ["王一雪", "还记得小时候，一到夏天我就去河里游泳。", "Tôi vẫn nhớ hồi nhỏ cứ hè đến là tôi ra sông bơi."], ["王一雪", "长大以后，遇到什么不开心的事情，我就去河边的树下坐着，听听鸟叫，看看河水，跟遇见的朋友聊聊天儿，难过的事情不一会儿就忘了。", "Khi trưởng thành, gặp chuyện không vui tôi ra ngồi dưới cây bên sông, nghe chim hót, ngắm nước, trò chuyện với bạn gặp được; chẳng mấy chốc là quên điều buồn."], ["王一雪", "那是我最喜欢的地方。", "Đó là nơi tôi yêu thích nhất."]], "questions": ["王一雪小时候住的地方环境怎么样？", "小时候，王一雪一到夏天就做什么？", "长大以后，王一雪会去河边做什么？"]}], "grammar": [{"name": "根据 – Dựa theo, căn cứ vào", "formula": "根据 + căn cứ / thông tin + (chủ ngữ) + kết quả / hành động", "meaning": "Đưa ra căn cứ cho một hành động hay phán đoán.", "example": "小区根据他们的需要，有了很多变化。", "vi": "Khu dân cư đã thay đổi nhiều dựa trên nhu cầu của họ.", "tip": "Hãy hỏi “dựa vào điều gì?” để tìm phần sau 根据.", "s": "Trong câu trên, những thay đổi căn cứ vào thông tin nào?"}, {"name": "Lặp cụm số lượng – 一点儿一点儿", "formula": "Số từ + lượng từ + số từ + lượng từ + (địa / động từ)", "meaning": "Cụm số lượng lặp lại diễn tả từng chút, từng lần, từng bước; làm nổi bật cách thức diễn ra.", "example": "我得一点儿一点儿给您讲。", "vi": "Tôi phải kể cho chị từng chút một.", "tip": "一点儿一点儿 nhấn mạnh từng chút một, không phải số lượng “hai chút”.", "s": "Nếu bỏ lần lặp thứ hai, sắc thái “từng chút một” có còn mạnh không?"}, {"name": "在……看来 – Theo quan điểm của…", "formula": "在 + người / nhóm người + 看来，+ nhận định", "meaning": "Dùng để trình bày quan điểm, sự đánh giá của cá nhân hoặc tập thể.", "example": "在我们中国人看来，黄河像妈妈一样。", "vi": "Theo người Trung Quốc chúng ta, Hoàng Hà giống như người mẹ.", "tip": "Đừng hiểu 看来 là “nhìn thấy” theo nghĩa đen trong mẫu câu này.", "s": "Ai là người đưa ra cách nhìn nhận về Hoàng Hà?"}, {"name": "不一会儿 – Chẳng mấy chốc", "formula": "Chủ ngữ + 不一会儿 + 就 + động từ / kết quả + 了", "meaning": "Diễn tả thời gian ngắn trôi qua trước khi một hành động hoặc kết quả xảy ra.", "example": "难过的事情不一会儿就忘了。", "vi": "Chuyện buồn chẳng mấy chốc đã quên.", "tip": "不一会儿 nhấn mạnh chỉ trong chốc lát; 就 nhấn mạnh kết quả đến nhanh.", "s": "Trong câu ví dụ, việc quên xảy ra nhanh hay chậm?"}], "book": [{"q": "我爷爷喜欢____花，他家有很多漂亮的花。", "opts": ["段", "养", "外地", "遇见", "有名"], "ans": 1, "ex": "Điền “养” vì phù hợp nghĩa và chức năng trong câu.", "tag": "SGK trang 140 · Câu 1"}, {"q": "昨天我在公园____了一位老朋友，聊了很久。", "opts": ["段", "养", "外地", "遇见", "有名"], "ans": 3, "ex": "Điền “遇见” vì phù hợp nghĩa và chức năng trong câu.", "tag": "SGK trang 140 · Câu 2"}, {"q": "他是从____来的，还不太习惯这里的天气。", "opts": ["段", "养", "外地", "遇见", "有名"], "ans": 2, "ex": "Điền “外地” vì phù hợp nghĩa và chức năng trong câu.", "tag": "SGK trang 140 · Câu 3"}, {"q": "这家饭馆在我们城市很____，很多人都来这里吃饭。", "opts": ["段", "养", "外地", "遇见", "有名"], "ans": 4, "ex": "Điền “有名” vì phù hợp nghĩa và chức năng trong câu.", "tag": "SGK trang 140 · Câu 4"}, {"q": "这本书我已经看了一____时间了，越看越觉得有意思。", "opts": ["段", "养", "外地", "遇见", "有名"], "ans": 0, "ex": "Điền “段” vì phù hợp nghĩa và chức năng trong câu.", "tag": "SGK trang 140 · Câu 5"}, {"q": "这家饭馆很有名，咱们去尝尝吧！今天是假期，人一定很多，____人少的时候再去吧。", "opts": ["了解", "经过", "可是", "根据", "平时"], "ans": 4, "ex": "Điền “平时” vì phù hợp nghĩa và chức năng trong câu.", "tag": "SGK trang 141 · Câu 6"}, {"q": "公园有两个门，咱们进哪个门？进东门吧，进去以后会____一条很漂亮的小河。", "opts": ["了解", "经过", "可是", "根据", "平时"], "ans": 1, "ex": "Điền “经过” vì phù hợp nghĩa và chức năng trong câu.", "tag": "SGK trang 141 · Câu 7"}, {"q": "我早就想去南京旅游了，____一直没时间去。", "opts": ["了解", "经过", "可是", "根据", "平时"], "ans": 2, "ex": "Điền “可是” vì phù hợp nghĩa và chức năng trong câu.", "tag": "SGK trang 141 · Câu 8"}, {"q": "我说什么课好呢？你可以____自己的兴趣来选择。", "opts": ["了解", "经过", "可是", "根据", "平时"], "ans": 3, "ex": "Điền “根据” vì phù hợp nghĩa và chức năng trong câu.", "tag": "SGK trang 141 · Câu 9"}, function optsV(i){let ids=[i,(i+5)%24,(i+11)%24,(i+18)%24];return ids.sort((a,b)=>((a*9+i*3)%31)-((b*9+i*3)%31))}
function showVQuiz(a){a.innerHTML=`<h2>🧩 Quiz từ vựng · 72 lượt</h2><div class="toolbar">${[['hv','Hán → Việt'],['vh','Việt → Hán'],['hp','Hán → Pinyin']].map(([v,t])=>`<button class="pill ${vm===v?'on':''}" onclick="setVM('${v}')">${t}</button>`).join('')}</div>${vocab.map((v,i)=>{let key=vm+i,sel=state.vocAnswers[key],graded=key in state.vocResults;return `<article class="quiz"><span class="badge">Từ ${i+1}/24</span><h3 class="qtitle">${esc(vm==='vh'?v[2]:v[0])}</h3>${optsV(i).map((j,n)=>`<button class="option ${sel===j?'sel':''} ${graded&&j===i?'good':''} ${graded&&sel===j&&j!==i?'bad':''}" onclick="chooseV('${key}',${j})">${'ABCD'[n]}. ${esc(vm==='hv'?vocab[j][2]:vm==='vh'?vocab[j][0]:vocab[j][1])}</button>`).join('')}<button class="btn" onclick="gradeV('${key}',${i})">Chấm đáp án</button> <button class="btn alt" onclick="speak('${v[0]}')">🔊 Nghe</button>${graded?`<div class="feedback ${state.vocResults[key]?'good':'bad'}"><b>${state.vocResults[key]?'✅ Đúng':'❌ Sai'}</b><p><b>Feynman:</b> ${esc(v[0])} – ${esc(v[1])} – ${esc(v[2])}.</p><div class="socrates">Em đặt thử một câu có từ này nhé?</div></div>`:''}</article>`}).join('')}`}
function chooseV(k,j){state.vocAnswers[k]=j;delete state.vocResults[k];save();keep()}function gradeV(k,i){if(!(k in state.vocAnswers)){alert('Hãy chọn đáp án.');return}state.vocResults[k]=state.vocAnswers[k]===i;save();keep()}
function showGrammar(a){let g=grammar[ri%4];a.innerHTML=`<h2>📒 4 chủ điểm ngữ pháp</h2><div class="toolbar">${grammar.map((x,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">${i+1}. ${esc(x.name)}</button>`).join('')}</div><div class="card grammar"><h2>${esc(g.name)}</h2><div class="formula">${esc(g.formula)}</div><h3>Ý nghĩa</h3><p>${esc(g.meaning)}</p><h3>Ví dụ</h3><div class="hanzi">${esc(g.example)}</div><p>${esc(g.vi)}</p><div class="textnote"><b>Feynman:</b> ${esc(g.tip)}</div><div class="socrates"><b>Socrates:</b> ${esc(g.s)}</div></div><button class="btn" onclick="setPage('practice')">Luyện thêm →</button>`}
function tabs(){return `<div class="toolbar">${readings.map((_,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div>`}
function showReading(a){let r=readings[ri%4];a.innerHTML=`<h2>📖 4 bài khóa</h2>${tabs()}<div class="card"><h2>${esc(r.title)}</h2><p class="muted">${esc(r.where)}</p>${r.lines.map(([sp,cn,vi])=>`<div class="readingline"><div class="hanzi"><b>${esc(sp)}：</b>${esc(cn)}</div><button class="btn alt" onclick="speak('${cn}')">🔊 Đọc</button><details><summary>Xem bản dịch tham khảo</summary>${esc(vi)}</details></div>`).join('')}<h3>Câu hỏi đọc hiểu trong sách</h3>${r.questions.map((q,i)=>`<p>${i+1}. ${esc(q)}</p>`).join('')}<button class="btn" onclick="setPage('translate')">Tự luyện dịch →</button></div>`}
function showTranslate(a){let r=readings[ri%4];a.innerHTML=`<h2>🌏 Luyện dịch Trung → Việt</h2><p class="muted">Hãy tự viết bản dịch trước khi xem đáp án mẫu. Bản dịch được lưu trên trình duyệt này.</p>${tabs()}<div class="card"><h3>${esc(r.title)}</h3>${r.lines.map(([sp,cn,vi],i)=>{let key=`${ri}_${i}`;return `<div class="readingline"><div class="hanzi">${esc(sp)}：${esc(cn)}</div><textarea oninput="setTrans('${key}',this.value)" placeholder="Tự viết bản dịch…">${esc(state.translation[key]||'')}</textarea><details><summary>🔎 Xem bản dịch mẫu</summary><div class="feedback good">${esc(vi)}</div><p class="small">Hãy đối chiếu chủ ngữ, động từ chính và sắc thái nghĩa.</p></details></div>`}).join('')}<button class="btn alt" onclick="exportTrans()">Xuất bản dịch TXT</button></div>`}
function setTrans(key,v){state.translation[key]=v;save()}
function exportTrans(){let r=readings[ri%4],s=r.title+'\n\n'+r.lines.map(([sp,cn],i)=>sp+'：'+cn+'\n'+(state.translation[`${ri}_${i}`]||'')).join('\n\n'),a=document.createElement('a'),u=URL.createObjectURL(new Blob([s],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='HSK3_Bai13_DichBai'+(ri+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const all=[...DB.book.map((q,i)=>({...q,id:'b'+i})),...DB.extra.map((q,i)=>({...q,id:'e'+i}))];
function showQuiz(a){let list=page==='original'?all.slice(0,10):page==='practice'?all.slice(10):all.filter(q=>state.results[q.id]===false);let total=list.filter(q=>q.id in state.results).length,correct=list.filter(q=>state.results[q.id]===true).length;a.innerHTML=`<h2>${page==='original'?'📝 10 câu theo sách':page==='practice'?'🎯 30 câu luyện mở rộng':'🔁 Ôn câu sai'}</h2><p class="muted">${page==='original'?'Trích từ mục 综合练习 trang 140–141 của giáo trình.':'Quiz mở rộng được biên soạn từ từ vựng và ngữ pháp bài học.'}</p><div class="quizstats">Đã làm ${total}/${list.length} · Đúng ${correct}</div>${list.length?list.map((q,i)=>{let sel=state.answers[q.id],graded=q.id in state.results;return `<article class="quiz"><span class="badge">Câu ${i+1} · ${esc(q.tag)}</span><h3 class="qtitle">${esc(q.q)}</h3>${q.opts.map((s,j)=>`<button class="option ${sel===j?'sel':''} ${graded&&j===q.ans?'good':''} ${graded&&sel===j&&j!==q.ans?'bad':''}" onclick="chooseQ('${q.id}',${j})">${'ABCDE'[j]}. ${esc(s)}</button>`).join('')}<button class="btn" onclick="gradeQ('${q.id}')">Kiểm tra đáp án</button>${graded?`<div class="feedback ${state.results[q.id]?'good':'bad'}"><b>${state.results[q.id]?'✅ Đúng':'❌ Sai'} · Đáp án: ${esc(q.opts[q.ans])}</b><p><b>Feynman:</b> ${esc(q.ex)}</p><div class="socrates"><b>Socrates:</b> Trong câu có dấu hiệu nào dẫn em đến đáp án đó?</div></div>`:''}</article>`}).join(''):'<div class="card">Bạn chưa có câu sai nào.</div>'}`}
function chooseQ(k,j){state.answers[k]=j;delete state.results[k];save();keep()}function gradeQ(k){if(!(k in state.answers)){alert('Chọn đáp án trước nhé.');return}let q=all.find(q=>q.id===k);state.results[k]=state.answers[k]===q.ans;save();keep()}
function keep(){let y=window.scrollY;render();requestAnimationFrame(()=>scrollTo(0,y))}render();
</script></body></html>
