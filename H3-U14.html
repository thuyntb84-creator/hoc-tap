s:15px;border:2px dashed #dccde7;padding:20px;background:linear-gradient(120deg,#fff9fc,#fffef5)}.grammar h3{margin:0 0 10px}.readingline{border-bottom:1px dashed #d7dfed;padding:12px 0;line-height:1.7}.readingline .hanzi{font-size:21px}.quiz{border:1px solid var(--line);padding:18px;border-radius:14px;background:white;margin-bottom:13px}.option{display:block;width:100%;padding:12px;text-align:left;background:#fbfcff;border:1px solid #dce3ed;border-radius:11px;margin:7px 0;color:var(--ink)}.option.sel{border:2px solid #4267ef;padding:11px;background:#edf2ff}.option.good{border-color:#24a17d;background:#e8f8ee}.option.bad{border-color:var(--red);background:#fff0f2}.feedback{background:#f2f5fb;border-radius:12px;padding:14px;margin:10px 0;line-height:1.8}.feedback.good{background:#e7f8f0}.feedback.bad{background:#fff0f2}.socrates{border-left:4px solid #daa34f;background:#fffaeb;padding:12px;margin-top:9px;border-radius:9px}textarea{width:100%;min-height:100px;padding:14px;border:1px solid #ccd5e5;border-radius:11px;line-height:1.7;resize:vertical}details{margin:12px 0}summary{color:#315ac4;cursor:pointer;font-weight:bold}.progress{height:9px;border-radius:10px;background:#e4eaf5;overflow:hidden}.progress>i{display:block;background:var(--blue);height:100%}.small{font-size:13px;color:#748198}.textnote{background:#fff9e5;padding:14px;border-radius:11px}.quizstats{padding:15px;border-radius:12px;background:#edf3ff;margin:14px 0}h2{margin:0 0 13px}h3{line-height:1.5}.empty{padding:24px;text-align:center}.voice{font-size:13px}.badge{background:#ffe4ed;color:#aa4669;border-radius:7px;padding:4px 9px;display:inline-block;font-size:12px;font-weight:bold}.qtitle{font-size:19px;line-height:1.7}.cover{background:linear-gradient(130deg,#fef1ef,#f2f2ff);border:2px dashed #e8c8cf;border-radius:16px;padding:18px;margin:12px 0}.cover .formula{margin-top:10px}.tabs{display:flex;flex-wrap:wrap;gap:8px}.alert{background:#fff9e7;border-radius:12px;padding:13px} @media(max-width:800px){.wr </style></head><body><header><span class="badge">新HSK教程 3 · LESSON 14</span><h1>这本书被别人借走了</h1><div>Cuốn sách này đã bị người khác mượn mất · Học hiểu → luyện tập → tự chữa lỗi</div></header><div class="wrap"><nav id="nav"></nav><main id="main"></main></div><script>const DB={"vocab":[["词典","cídiǎn","từ điển"],["最好","zuìhǎo","tốt nhất; nên"],["节","jié","tiết học; đoạn"],["图书馆","túshūguǎn","thư viện"],["被","bèi","bị; được (bị động)"],["名人","míngrén","người nổi tiếng"],["故事","gùshi","câu chuyện"],["然后","ránhòu","sau đó"],["报纸","bàozhǐ","báo giấy"],["忘记","wàngjì","quên"],["电子书","diànzǐshū","sách điện tử"],["女生","nǚshēng","nữ sinh"],["表演","biǎoyǎn","biểu diễn"],["节目","jiémù","tiết mục"],["怎么办","zěnme bàn","làm thế nào"],["校长","xiàozhǎng","hiệu trưởng"],["面前","miànqián","trước mặt"],["有些","yǒuxiē","hơi; có phần; một số"],["相信","xiāngxìn","tin tưởng"],["新年","xīnnián","năm mới"],["班级","bānjí","lớp học"],["跳","tiào","nhảy"],["留学生","liúxuéshēng","du học sinh"],["最后","zuìhòu","cuối cùng"],["一块儿","yíkuàir","cùng nhau"],["网站","wǎngzhàn","trang web"],["视频","shìpín","video"]],"readings":[{"title":"Bài khóa 1 – Mượn và trả sách","where":"Nhà ăn trường · 李文、白家月","lines":[["李文","我借的这本词典最好今天还，但是我没时间去。","Cuốn từ điển tôi mượn tốt nhất là trả hôm nay, nhưng tôi không có thời gian đi."],["白家月","下午我只有两节课，可以帮你去图书馆还书。","Chiều nay tôi chỉ có hai tiết học, có thể giúp bạn đến thư viện trả sách."],["李文","那太谢谢了。你能再帮我借本书吗？","Vậy cảm ơn bạn nhiều. Bạn có thể giúp tôi mượn thêm một cuốn sách không?"],["白家月","行，你告诉我书名。","Được, bạn cho tôi biết tên sách."],["李文","我把名字写在纸上吧。我去了好几次图书馆，这本书都被别人借走了。","Tôi viết tên sách ra giấy nhé. Tôi đã đến thư viện mấy lần rồi mà cuốn sách đó đều bị người khác mượn mất."],["白家月","《名人的故事》？我有这本书。明天我借给你吧。","“Chuyện về những người nổi tiếng” à? Tôi có cuốn này. Ngày mai tôi cho bạn mượn nhé."]],"questions":["李文请白家月帮他借什么书？","李文为什么没借到这本书？","李文把书名写在哪儿了？"]},{"title":"Bài khóa 2 – Thẻ thư viện bị mất","where":"Trong sân trường · 白家月、安妮","lines":[["安妮","今天下课早，你一会儿做什么？","Hôm nay tan học sớm, lát nữa bạn làm gì?"],["白家月","我今天忙得很，要先去图书馆借书，然后去游泳。","Hôm nay tôi rất bận, phải đến thư viện mượn sách trước, sau đó đi bơi."],["安妮","咱们一起走吧。我想去图书馆看看中文报纸。","Chúng ta đi cùng nhé. Tôi muốn đến thư viện xem báo tiếng Trung."],["白家月","等等，我的校园卡不见了，没有卡进不去图书馆。","Chờ đã, thẻ sinh viên của tôi biến mất rồi, không có thẻ thì không vào thư viện được."],["安妮","你想想上一次用是什么时候？","Bạn nghĩ xem lần trước dùng thẻ là khi nào?"],["白家月","我忘记了，可能被我放在家里了。","Tôi quên mất rồi, có lẽ tôi đã để nó ở nhà."],["安妮","进不去图书馆也没关系，上网看看有没有电子书。","Không vào được thư viện cũng không sao, lên mạng xem có sách điện tử không."],["白家月","不行，我必须去，我还得帮李文还书呢。","Không được, tôi nhất định phải đi, còn phải giúp Lý Văn trả sách nữa."]],"questions":["下课之后安妮要做什么？","白家月为什么不能进图书馆？","白家月觉得校园卡可能在哪儿？"]},{"title":"Bài khóa 3 – Biểu diễn văn nghệ","where":"Nhà ăn trường · 李文、白家月","lines":[["李文","下周学校有晚会，你知道吗？","Tuần sau trường có buổi liên hoan, bạn biết không?"],["白家月","知道，我和几个女生要表演一个节目。你也参加吗？","Biết, tôi cùng mấy bạn nữ sẽ biểu diễn một tiết mục. Bạn cũng tham gia chứ?"],["李文","我想唱中文歌，但是还没找到人一起表演，不知道怎么办。","Tôi muốn hát bài hát tiếng Trung nhưng chưa tìm được ai cùng biểu diễn, không biết làm sao."],["白家月","找不到人，你就一个人唱吧。","Không tìm được người thì bạn hát một mình đi."],["李文","一想到要在校长、老师和那么多同学面前表演，我就有些紧张。","Cứ nghĩ đến việc biểu diễn trước mặt hiệu trưởng, thầy cô và bao nhiêu bạn học, tôi lại hơi căng thẳng."],["白家月","紧张什么呀，我们都喜欢听你唱歌，你要相信自己。","Căng thẳng gì chứ! Chúng tôi đều thích nghe bạn hát, bạn phải tin vào bản thân."]],"questions":["白家月要在晚会上做什么？","李文为什么紧张？","听说李文有点儿紧张，白家月是怎么说的？"]},{"title":"Bài khóa 4 – Buổi liên hoan năm mới","where":"Nhật ký · 白家月","lines":[["白家月","昨天是我们学校的新年晚会，每个班级的同学都表演节目了。","Hôm qua là buổi liên hoan năm mới của trường chúng tôi, học sinh mỗi lớp đều biểu diễn tiết mục."],["白家月","晚会是八点开始的，差不多十二点才结束。","Buổi liên hoan bắt đầu lúc tám giờ, mãi gần mười hai giờ mới kết thúc."],["白家月","我一个晚上跟大家一起又唱又跳，开心极了，也累坏了。","Cả buổi tối tôi cùng mọi người vừa hát vừa nhảy, vui vô cùng mà cũng mệt rã rời."],["白家月","我最喜欢的节目是留学生们跳舞。","Tiết mục tôi thích nhất là màn múa của các du học sinh."],["白家月","最后老师和校长也被叫起来一块儿跳，特别有意思。","Cuối cùng thầy cô và hiệu trưởng cũng được gọi lên cùng nhảy, rất thú vị."],["白家月","过几天学校的网站上会有晚会的视频，我打算再看一遍。","Vài ngày nữa trên trang web trường sẽ có video của buổi liên hoan, tôi định xem lại một lần."]],"questions":["晚会是什么时候开始的？什么时候结束的？","白家月最喜欢哪个节目？为什么？","过几天白家月打算做什么？"]}],"grammar":[{"name":"被字句（1）– Câu bị động","formula":"Chủ ngữ (chịu tác động) + 被 + người/vật gây ra + động từ + thành phần khác","meaning":"Nhấn mạnh đối tượng chịu ảnh hưởng bởi hành động. Sắc thái thường là bất lợi, bị động hoặc bất ngờ. Người thực hiện đôi khi được lược bỏ.","example":"这本书被别人借走了。","vi":"Cuốn sách này đã bị người khác mượn mất.","tip":"Phân biệt: 书被别人借走了 (sách bị người khác mượn) và 别人借走了书 (người khác mượn sách).","s":"Trong câu 这本书被别人借走了, đối tượng nào đang chịu tác động?"},{"name":"先……再/然后…… – Trình tự hành động","formula":"(Chủ ngữ) + 先 + hành động 1，再/然后 + hành động 2","meaning":"Nói hai hành động nối tiếp theo thứ tự thời gian: làm việc thứ nhất trước, sau đó mới làm việc thứ hai.","example":"我要先去图书馆借书，然后去游泳。","vi":"Tôi sẽ đến thư viện mượn sách trước, sau đó đi bơi.","tip":"先 = trước tiên, 然后/再 = sau đó. Không dịch thành hai hành động đồng thời.","s":"Nếu đổi vị trí 借书 và 游泳, trình tự việc làm có còn như cũ không?"},{"name":"“X什么（啊）” – Trấn an, bác bỏ lo ngại","formula":"Động từ / tính từ + 什么（啊）！+ lời động viên / giải thích","meaning":"Dùng để gạt đi sự lo lắng, nghi ngờ hoặc nhấn mạnh quan điểm với sắc thái phản bác hay trấn an, không phải lúc nào cũng là câu hỏi hỏi thông tin.","example":"紧张什么呀，我们都喜欢听你唱歌。","vi":"Lo lắng gì chứ! Chúng tôi đều thích nghe bạn hát.","tip":"Người nói không thực sự hỏi “lo điều gì”, mà đang động viên người nghe.","s":"Khi nghe 紧张什么呀, bạn có cần trả lời liệt kê nguyên nhân lo lắng không?"}],"book":[{"q":"你今天看起来________难过，遇到什么问题了？","opts":["故事","最好","有些","一块儿","表演"],"ans":2,"ex":"有些 nghĩa là hơi, có phần.","tag":"Theo sách · 综合练习 (tr. 131)"},{"q":"图书馆的这本书我已经看完了，我很喜欢这个________。","opts":["故事","最好","有些","一块儿","表演"],"ans":0,"ex":"故事 là câu chuyện.","tag":"Theo sách · 综合练习 (tr. 131)"},{"q":"她读不懂中文报纸，你________把那个新闻给她讲一下。","opts":["故事","最好","有些","一块儿","表演"],"ans":1,"ex":"最好 = tốt nhất nên.","tag":"Theo sách · 综合练习 (tr. 131)"},{"q":"网站上已经可以看到晚会的视频了，咱们________看吧。","opts":["故事","最好","有些","一块儿","表演"],"ans":3,"ex":"一块儿 = cùng nhau.","tag":"Theo sách · 综合练习 (tr. 131)"},{"q":"她学过________，可以跟你们一起准备这个节目。","opts":["故事","最好","有些","一块儿","表演"],"ans":4,"ex":"表演 = biểu diễn.","tag":"Theo sách · 综合练习 (tr. 131)"},{"q":"你要________自己，这次一定能比上次更好！","opts":["最后","面前","相信","留学生","忘记"],"ans":2,"ex":"相信自己 = tin bản thân.","tag":"Theo sách · 综合练习 (tr. 131)"},{"q":"我刚才想说什么？突然就________了。","opts":["最后","面前","相信","留学生","忘记"],"ans":4,"ex":"忘记 = quên.","tag":"Theo sách · 综合练习 (tr. 131)"},{"q":"你们学校的________多吗？","opts":["最后","面前","相信","留学生","忘记"],"ans":3,"ex":"留学生 = du học sinh.","tag":"Theo sách · 综合练习 (tr. 131)"},{"q":"你唱歌唱得那么好听，为什么没参加昨天的晚会？我不喜欢在很多人________表演。","opts":["最后","面前","相信","留学生","忘记"],"ans":1,"ex":"面前 = trước mặt.","tag":"Theo sách · 综合练习 (tr. 131)"},{"q":"这次考试你考得怎么样？我已经很努力了，希望________的成绩能好一些！","opts":["最后","面前","相信","留学生","忘记"],"ans":0,"ex":"最后 = cuối cùng.","tag":"Theo sách · 综合练习 (tr. 131)"}],"extra":[{"q":"“词典” (cídiǎn) nghĩa là gì?","opts":["người nổi tiếng","từ điển","nữ sinh","tin tưởng"],"ans":1,"ex":"词典 (cídiǎn) nghĩa là từ điển.","tag":"Mở rộng · từ vựng"},{"q":"“最好” (zuìhǎo) nghĩa là gì?","opts":["tốt nhất; nên","câu chuyện","biểu diễn","năm mới"],"ans":0,"ex":"最好 (zuìhǎo) nghĩa là tốt nhất; nên.","tag":"Mở rộng · từ vựng"},{"q":"“节” (jié) nghĩa là gì?","opts":["sau đó","tiết mục","lớp học","tiết học; đoạn"],"ans":3,"ex":"节 (jié) nghĩa là tiết học; đoạn.","tag":"Mở rộng · từ vựng"},{"q":"“图书馆” (túshūguǎn) nghĩa là gì?","opts":["báo giấy","làm thế nào","thư viện","nhảy"],"ans":2,"ex":"图书馆 (túshūguǎn) nghĩa là thư viện.","tag":"Mở rộng · từ vựng"},{"q":"“被” (bèi) nghĩa là gì?","opts":["quên" const vocab=DB.vocab, readings=DB.readings, grammar=DB.grammar;
const labels={home:'🏠 Tổng quan',vocab:'🀄 Từ vựng',vquiz:'🧩 Quiz từ vựng',grammar:'📒 Ngữ pháp',reading:'📖 Bài khóa',translate:'🌏 Luyện dịch',original:'📝 Bài tập trong sách',practice:'🎯 Luyện mở rộng',mistakes:'🔁 Ôn câu sai'};
const store='hsk3b14_complete_v1';let state;try{state=JSON.parse(localStorage.getItem(store)||'{}')}catch(e){state={}};state={answers:{},results:{},vocAnswers:{},vocResults:{},translation:{},...state};let page='home',ri=0,vm='hv';
function save(){try{localStorage.setItem(store,JSON.stringify(state))}catch(e){}}function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function speak(t){if(!('speechSynthesis' in window)){alert('Trình duyệt chưa hỗ trợ phát âm.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;speechSynthesis.speak(u)}
function setPage(p){page=p;ri=0;render();window.scrollTo(0,0)}function setRi(i){ri=i;render()}function setVM(v){vm=v;render()}
function render(){document.getElementById('nav').innerHTML=Object.entries(labels).map(([k,t])=>`<button class="${page===k?'active':''}" onclick="setPage('${k}')">${t}</button>`).join('');let a=document.getElementById('main');({home:home,vocab:showVocab,vquiz:showVQuiz,grammar:showGrammar,reading:showReading,translate:showTranslate,original:showQuiz,practice:showQuiz,mistakes:showQuiz})[page](a)}
function home(a){let done=Object.keys(state.results).length,good=Object.values(state.results).filter(Boolean).length;a.innerHTML=`<h2>HSK 3 – Bài 14</h2><p class="muted">Nguồn: giáo trình Bài 14, 9 trang, tr. 124–132; phần quiz mở rộng và lời dịch Việt là nội dung biên soạn hỗ trợ.</p><div class="grid"><div class="stat">Từ mới<strong>27</strong></div><div class="stat">Bài khóa<strong>4</strong></div><div class="stat">Đã luyện<strong>${done}/40</strong><span class="small">Đúng ${good}</span></div></div><div class="card"><h2>🧠 Tổng quan · Cấu trúc ngữ pháp</h2>${grammar.map((g,i)=>`<div class="cover"><h3>${i+1}. ${esc(g.name)}</h3><div class="formula">${esc(g.formula)}</div><p>${esc(g.meaning)}</p><div class="hanzi">${esc(g.example)}</div><p>${esc(g.vi)}</p><button class="btn alt" onclick="page='grammar';ri=${i};render()">Học chi tiết →</button></div>`).join('')}</div><div class="card"><h3>7 bước học</h3>Học từ → Quiz → Ngữ pháp → Đọc bài khóa → Luyện dịch → Bài tập → Ôn câu sai.<div class="toolbar"><button class="btn" onclick="setPage('vocab')">Bắt đầu học</button><button class="btn alt" onclick="setPage('original')">Làm bài gốc</button></div></div>`}
function showVocab(a){a.innerHTML=`<h2>🀄 27 từ mới Bài 14</h2><div class="toolbar"><input id="search" placeholder="Tìm chữ Hán, Pinyin, nghĩa Việt" oninput="drawWords(this.value)" style="padding:12px;border:1px solid #dbe1ed;border-radius:10px;max-width:330px;width:100%"><button class="btn" onclick="setPage('vquiz')">Quiz từ vựng →</button></div><div class="vgrid" id="words"></div>`;drawWords('')}
function drawWords(term){document.getElementById('words').innerHTML=vocab.filter(v=>v.join(' ').toLowerCase().includes(term.toLowerCase())).map(v=>`<div class="card"><div class="hanzi"><b>${esc(v[0])}</b></div><div class="py">${esc(v[1])}</div><p>${esc(v[2])}</p><button class="btn alt" onclick="speak('${v[0]}')">🔊 Nghe</button></div>`).join('')}
function optsV(i){let ids=[i,(i+5)%27,(i+11)%27,(i+18)%27];return ids.sort((a,b)=>((a*9+i*3)%31)-((b*9+i*3)%31))}
function showVQuiz(a){a.innerHTML=`<h2>🧩 Quiz từ vựng · 81 lượt</h2><div class="toolbar">${[['hv','Hán → Việt'],['vh','Việt → Hán'],['hp','Hán → Pinyin']].map(([v,t])=>`<button class="pill ${vm===v?'on':''}" onclick="setVM('${v}')">${t}</button>`).join('')}</div>${vocab.map((v,i)=>{let key=vm+i,sel=state.vocAnswers[key],graded=key in state.vocResults;return `<article class="quiz"><span class="badge">Từ ${i+1}/27</span><h3 class="qtitle">${esc(vm==='vh'?v[2]:v[0])}</h3>${optsV(i).map((j,n)=>`<button class="option ${sel===j?'sel':''} ${graded&&j===i?'good':''} ${graded&&sel===j&&j!==i?'bad':''}" onclick="chooseV('${key}',${j})">${'ABCD'[n]}. ${esc(vm==='hv'?vocab[j][2]:vm==='vh'?vocab[j][0]:vocab[j][1])}</button>`).join('')}<button class="btn" onclick="gradeV('${key}',${i})">Chấm đáp án</button> <button class="btn alt" onclick="speak('${v[0]}')">🔊 Nghe</button>${graded?`<div class="feedback ${state.vocResults[key]?'good':'bad'}"><b>${state.vocResults[key]?'✅ Đúng':'❌ Sai'}</b><p><b>Feynman:</b> ${esc(v[0])} – ${esc(v[1])} – ${esc(v[2])}.</p><div class="socrates">Em đặt thử một câu có từ này nhé?</div></div>`:''}</article>`}).join('')}`}
function chooseV(k,j){state.vocAnswers[k]=j;delete state.vocResults[k];save();keep()}function gradeV(k,i){if(!(k in state.vocAnswers)){alert('Hãy chọn đáp án.');return}state.vocResults[k]=state.vocAnswers[k]===i;save();keep()}
function showGrammar(a){let g=grammar[ri%3];a.innerHTML=`<h2>📒 3 chủ điểm ngữ pháp</h2><div class="toolbar">${grammar.map((x,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">${i+1}. ${esc(x.name)}</button>`).join('')}</div><div class="card grammar"><h2>${esc(g.name)}</h2><div class="formula">${esc(g.formula)}</div><h3>Ý nghĩa</h3><p>${esc(g.meaning)}</p><h3>Ví dụ</h3><div class="hanzi">${esc(g.example)}</div><p>${esc(g.vi)}</p><div class="textnote"><b>Feynman:</b> ${esc(g.tip)}</div><div class="socrates"><b>Socrates:</b> ${esc(g.s)}</div></div><button class="btn" onclick="setPage('practice')">Luyện thêm →</button>`}
function tabs(){return `<div class="toolbar">${readings.map((_,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div>`}
function showReading(a){let r=readings[ri%4];a.innerHTML=`<h2>📖 4 bài khóa</h2>${tabs()}<div class="card"><h2>${esc(r.title)}</h2><p class="muted">${esc(r.where)}</p>${r.lines.map(([sp,cn,vi])=>`<div class="readingline"><div class="hanzi"><b>${esc(sp)}：</b>${esc(cn)}</div><button class="btn alt" onclick="speak('${cn}')">🔊 Đọc</button><details><summary>Xem bản dịch tham khảo</summary>${esc(vi)}</details></div>`).join('')}<h3>Câu hỏi đọc hiểu trong sách</h3>${r.questions.map((q,i)=>`<p>${i+1}. ${esc(q)}</p>`).join('')}<button class="btn" onclick="setPage('translate')">Tự luyện dịch →</button></div>`}
function showTranslate(a){let r=readings[ri%4];a.innerHTML=`<h2>🌏 Luyện dịch Trung → Việt</h2><p class="muted">Hãy tự viết bản dịch trước khi xem đáp án mẫu. Bản dịch được lưu trên trình duyệt này.</p>${tabs()}<div class="card"><h3>${esc(r.title)}</h3>${r.lines.map(([sp,cn,vi],i)=>{let key=`${ri}_${i}`;return `<div class="readingline"><div class="hanzi">${esc(sp)}：${esc(cn)}</div><textarea oninput="setTrans('${key}',this.value)" placeholder="Tự viết bản dịch…">${esc(state.translation[key]||'')}</textarea><details><summary>🔎 Xem bản dịch mẫu</summary><div class="feedback good">${esc(vi)}</div><p class="small">Hãy đối chiếu chủ ngữ, động từ chính và sắc thái nghĩa.</p></details></div>`}).join('')}<button class="btn alt" onclick="exportTrans()">Xuất bản dịch TXT</button></div>`}
function setTrans(key,v){state.translation[key]=v;save()}
function exportTrans(){let r=readings[ri%4],s=r.title+'\n\n'+r.lines.map(([sp,cn],i)=>sp+'：'+cn+'\n'+(state.translation[`${ri}_${i}`]||'')).join('\n\n'),a=document.createElement('a'),u=URL.createObjectURL(new Blob([s],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='HSK3_Bai13_DichBai'+(ri+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const all=[...DB.book.map((q,i)=>({...q,id:'b'+i})),...DB.extra.map((q,i)=>({...q,id:'e'+i}))];
function showQuiz(a){let list=page==='original'?all.slice(0,10):page==='practice'?all.slice(10):all.filter(q=>state.results[q.id]===false);let total=list.filter(q=>q.id in state.results).length,correct=list.filter(q=>state.results[q.id]===true).length;a.innerHTML=`<h2>${page==='original'?'📝 10 câu theo sách':page==='practice'?'🎯 30 câu luyện mở rộng':'🔁 Ôn câu sai'}</h2><p class="muted">${page==='original'?'Lấy từ mục 综合练习 trang 122–123.':'Quiz mở rộng được biên soạn từ từ vựng và ngữ pháp bài học.'}</p><div class="quizstats">Đã làm ${total}/${list.length} · Đúng ${correct}</div>${list.length?list.map((q,i)=>{let sel=state.answers[q.id],graded=q.id in state.results;return `<article class="quiz"><span class="badge">Câu ${i+1} · ${esc(q.tag)}</span><h3 class="qtitle">${esc(q.q)}</h3>${q.opts.map((s,j)=>`<button class="option ${sel===j?'sel':''} ${graded&&j===q.ans?'good':''} ${graded&&sel===j&&j!==q.ans?'bad':''}" onclick="chooseQ('${q.id}',${j})">${'ABCDE'[j]}. ${esc(s)}</button>`).join('')}<button class="btn" onclick="gradeQ('${q.id}')">Kiểm tra đáp án</button>${graded?`<div class="feedback ${state.results[q.id]?'good':'bad'}"><b>${state.results[q.id]?'✅ Đúng':'❌ Sai'} · Đáp án: ${esc(q.opts[q.ans])}</b><p><b>Feynman:</b> ${esc(q.ex)}</p><div class="socrates"><b>Socrates:</b> Trong câu có dấu hiệu nào dẫn em đến đáp án đó?</div></div>`:''}</article>`}).join(''):'<div class="card">Bạn chưa có câu sai nào.</div>'}`}
function chooseQ(k,j){state.answers[k]=j;delete state.results[k];save();keep()}function gradeQ(k){if(!(k in state.answers)){alert('Chọn đáp án trước nhé.');return}let q=all.find(q=>q.id===k);state.results[k]=state.answers[k]===q.ans;save();keep()}
function keep(){let y=window.scrollY;render();requestAnimationFrame(()=>scrollTo(0,y))}render();
</script></body></html>
