</style></head><body><header><span class="badge">新HSK教程 3 · LESSON 10</span><h1>你明天再把书还给我</h1><div>Ngày mai bạn hãy trả sách lại cho tôi · Học hiểu → luyện tập → tự chữa lỗi</div></header><div class="wrap"><nav id="nav"></nav><main id="main"></main></div><script>
const DB={"vocab":[["数学","shùxué","toán học"],["认真","rènzhēn","nghiêm túc; chăm chỉ"],["笔记","bǐjì","ghi chép"],["清楚","qīngchu","rõ ràng"],["黑板","hēibǎn","bảng đen"],["把","bǎ","đưa tân ngữ ra trước động từ"],["作业","zuòyè","bài tập về nhà"],["遍","biàn","lượt; lần"],["提高","tígāo","nâng cao"],["历史","lìshǐ","lịch sử"],["难","nán","khó"],["要求","yāoqiú","yêu cầu"],["差","chà","kém; thiếu"],["复习","fùxí","ôn tập"],["外语","wàiyǔ","ngoại ngữ"],["当然","dāngrán","đương nhiên"],["遇到","yùdào","gặp phải"],["办公室","bàngōngshì","văn phòng"],["页","yè","trang"],["对话","duìhuà","đối thoại"],["明白","míngbai","hiểu; rõ"],["讲","jiǎng","giảng giải"],["句","jù","lượng từ cho câu"],["句子","jùzi","câu"],["年级","niánjí","khối lớp"],["后年","hòunián","năm sau nữa"],["一般","yìbān","thông thường"],["努力","nǔlì","nỗ lực"]],"readings":[{"title":"Bài khóa 1 – Phương pháp học","where":"Trong lớp, 刘小雪 và bạn học","lines":[["同学","你的数学越来越好，能不能介绍一下学习方法？","Toán của bạn ngày càng tốt, bạn giới thiệu phương pháp học được không?"],["刘小雪","没有什么特别的方法，认真听课，认真记笔记。","Không có phương pháp đặc biệt gì, chăm chú nghe giảng và ghi chép."],["同学","我看过你的笔记，记得非常清楚。","Tôi đã xem ghi chép của bạn, ghi rất rõ ràng."],["刘小雪","老师写在黑板上的题都很重要，所以我会把这些题都记在本子上。","Những bài thầy cô viết trên bảng đều quan trọng, nên tôi ghi chúng vào vở."],["同学","你说得对。我没有记笔记的习惯。","Bạn nói đúng. Tôi không có thói quen ghi chép."],["刘小雪","笔记挺重要的，我每天写作业以前，都要看一遍。","Ghi chép rất quan trọng, trước khi làm bài tập hằng ngày tôi đều xem lại một lượt."],["同学","这个方法真好！我以后也试试，希望能提高成绩。","Phương pháp này thật hay! Sau này tôi sẽ thử để hy vọng nâng cao kết quả."]],"questions":["刘小雪的数学为什么越来越好？","刘小雪为什么要把题记在本子上？","她每天写作业前做什么？"]},{"title":"Bài khóa 2 – Trao đổi về bài thi","where":"Trong lớp, 刘小雪 và bạn học","lines":[["同学","小雪，昨天的考试，你考得怎么样？","Tiểu Tuyết, bài thi hôm qua bạn làm thế nào?"],["刘小雪","我觉得历史有点儿难，你呢？","Tôi thấy môn lịch sử hơi khó, còn bạn?"],["同学","数学考试我没看清楚要求，做错了好几个题，考得挺差的。","Khi thi Toán tôi không đọc rõ yêu cầu, làm sai mấy câu nên kết quả khá kém."],["刘小雪","明天还有考试呢，别想那么多了，先复习外语吧。","Ngày mai còn bài thi, đừng nghĩ nhiều nữa, ôn ngoại ngữ trước đi."],["同学","外语作业里有几个问题，我可以问问你吗？","Trong bài tập ngoại ngữ có vài vấn đề, tôi có thể hỏi bạn không?"],["刘小雪","当然可以。在学习上，遇到什么问题都可以问我。","Tất nhiên. Về học tập, gặp vấn đề gì bạn cũng có thể hỏi tôi."],["同学","不好意思，这几个题我也不会。咱们还是一起去办公室问问李老师吧。","Xin lỗi, vài câu này tôi cũng không làm được. Chúng ta cùng đến văn phòng hỏi cô Lý nhé."]],"questions":["同学数学考试考得怎么样？","为什么做错了好几个题？","最后他们决定去哪里？"]},{"title":"Bài khóa 3 – Hỏi giáo viên","where":"Trong văn phòng cô Lý","lines":[["同学","李老师，书上有几个问题，我们想问问您。","Cô Lý, trong sách có vài vấn đề, chúng em muốn hỏi cô."],["李老师","好，坐下说吧，哪个题不会？","Được, ngồi xuống nói nào, câu nào không biết làm?"],["同学","书上第五页的这个对话我看不懂，小雪也不明白。","Đoạn hội thoại ở trang 5 của sách em đọc không hiểu, Tiểu Tuyết cũng chưa hiểu."],["李老师","我课上讲过这几句话，再给你们讲一遍。","Cô đã giảng những câu này trên lớp, cô sẽ giảng lại một lượt."],["同学","我终于懂了。这些句子一点儿也不难。","Cuối cùng em đã hiểu. Những câu này chẳng khó chút nào."],["刘小雪","我也明白了，谢谢您，李老师。","Em cũng đã hiểu, cảm ơn cô Lý."],["李老师","我这本书上还有几个练习，你们回家也做一做，明天再把书还给我。","Trong cuốn sách này của cô còn vài bài luyện, các em về làm thử, ngày mai trả sách lại cho cô."]],"questions":["他们不明白书上第几页的内容？","李老师怎么帮助他们？","为什么明天要还书？"]},{"title":"Bài khóa 4 – Email kể chuyện học tập","where":"Ở nhà, 刘小雪 viết thư cho 白家月","lines":[["刘小雪","家月姐姐：你最近怎么样？忙不忙？","Chị Gia Nguyệt, dạo này chị thế nào, có bận không?"],["刘小雪","我现在上初中二年级，学习越来越忙，后年就要考高中了。","Em đang học lớp 8, việc học ngày càng bận, năm sau nữa phải thi lên cấp ba."],["刘小雪","中国的学校一般是小学六年，初中三年，高中三年。","Trường học ở Trung Quốc thường có 6 năm tiểu học, 3 năm THCS và 3 năm THPT."],["刘小雪","妈妈说想考上好大学，就得上一个好高中；为了考上好高中，初中就得有一个不错的成绩，所以我现在非常努力。","Mẹ nói muốn vào đại học tốt thì phải học trường THPT tốt; để vào trường đó, cấp hai phải có kết quả khá, vì thế giờ em rất cố gắng."],["刘小雪","家月姐姐，你知道吗？在你的影响下，我也开始喜欢拍照了。","Chị Gia Nguyệt biết không, nhờ ảnh hưởng của chị, em cũng bắt đầu thích chụp ảnh."],["刘小雪","下次你再来北京，我给你看看我照的照片。","Lần sau chị đến Bắc Kinh, em cho chị xem ảnh em chụp nhé."]],"questions":["刘小雪现在上几年级？","中国中学通常读几年？","受谁的影响，她喜欢拍照？"]}],"grammar":[{"name":"Câu 把 (1): chuyển vị trí","formula":"Chủ ngữ + 把 + tân ngữ xác định + động từ + 在/到 + địa điểm","meaning":"Đưa sự vật đã xác định tới một vị trí; nhấn mạnh sự xử lý tân ngữ. 不/没/能 đặt trước 把.","example":"我会把这些题都记在本子上。","vi":"Tôi sẽ ghi những câu hỏi này vào vở.","tip":"Hãy xác định thứ được tác động: 这些题; rồi hỏi được ghi ở đâu: 在本子上.","s":"Vì sao không nói 把这些题记 mà phải chỉ rõ nơi ghi?"},{"name":"Cấu trúc 在……上 / 中 / 下","formula":"在 + danh từ / cụm danh từ + 上 / 中 / 下","meaning":"上 diễn tả phương diện/lĩnh vực; 中 diễn tả quá trình hoặc thời gian; 下 diễn tả điều kiện hay ảnh hưởng.","example":"在学习上，遇到什么问题都可以问我。","vi":"Trong học tập, gặp vấn đề gì cũng có thể hỏi tôi.","tip":"Đừng luôn dịch 上 là “trên”. 在学习上 nghĩa là “về phương diện học tập”.","s":"在老师的帮助下 nói đến vị trí hay điều kiện giúp đỡ?"},{"name":"Câu 把 (2): chuyển giao","formula":"Chủ ngữ + 把 + vật + động từ + 给 + người nhận","meaning":"Dùng 把 làm rõ việc chuyển một vật xác định sang người nhận.","example":"你明天再把书还给我。","vi":"Ngày mai bạn hãy trả sách lại cho tôi.","tip":"Xác định ba vai: người làm → đồ vật → người nhận; “把书还给我” đầy đủ cả ba.","s":"Trong câu 你把书送给老师, ai nhận quyển sách?"}],"book":[["我再说一________，请大家认真听。",["遍","难","差","讲","清楚"],0,"Tìm vị trí từ phù hợp với nghĩa trong ngữ cảnh."],["你的汉字写得太________了，要多练习才能写得好。",["遍","难","差","讲","清楚"],2,"Tìm vị trí từ phù hợp với nghĩa trong ngữ cảnh."],["老师上课说什么我没听________，你再告诉我一下吧。",["遍","难","差","讲","清楚"],4,"Tìm vị trí từ phù hợp với nghĩa trong ngữ cảnh."],["李老师，可以给我________一下我做错的这几个题吗？",["遍","难","差","讲","清楚"],3,"Tìm vị trí từ phù hợp với nghĩa trong ngữ cảnh."],["今天这几个题有点儿________，好多同学都没听明白。",["遍","难","差","讲","清楚"],1,"Tìm vị trí từ phù hợp với nghĩa trong ngữ cảnh."],["今天的作业你写完了吗？没有，老师________写500个字，我只写了一半。",["认真","复习","提高","要求","当然"],3,"Tìm vị trí từ phù hợp với nghĩa trong ngữ cảnh."],["你有什么________外语水平的好方法吗？",["认真","复习","提高","要求","当然"],2,"Tìm vị trí từ phù hợp với nghĩa trong ngữ cảnh."],["你还在想考试的事吗？一次考试没考好没关系。好，我不想了。我以后会好好________的。",["认真","复习","提高","要求","当然"],1,"Tìm vị trí từ phù hợp với nghĩa trong ngữ cảnh."],["我高中的时候没遇到好老师，所以成绩越来越差。老师________重要，但是自己的努力也很重要。",["认真","复习","提高","要求","当然"],4,"Tìm vị trí từ phù hợp với nghĩa trong ngữ cảnh."],["这次你数学考试考了100分，你是怎么做到的？做完以后，我又________地检查了一遍。",["认真","复习","提高","要求","当然"],0,"Tìm vị trí từ phù hợp với nghĩa trong ngữ cảnh."]],"extra":[["Từ nào có nghĩa “toán học”?",["数学","把","难","当然"],0,"数学 (shùxué) nghĩa là toán học."],["Từ nào có nghĩa “nghiêm túc; chăm chỉ”?",["认真","作业","要求","遇到"],0,"认真 (rènzhēn) nghĩa là nghiêm túc; chăm chỉ."],["Từ nào có nghĩa “ghi chép”?",["笔记","遍","差","办公室"],0,"笔记 (bǐjì) nghĩa là ghi chép."],["Từ nào có nghĩa “rõ ràng”?",["清楚","提高","复习","页"],0,"清楚 (qīngchu) nghĩa là rõ ràng."],["Từ nào có nghĩa “bảng đen”?",["黑板","历史","外语","对话"],0,"黑板 (hēibǎn) nghĩa là bảng đen."],["Từ nào có nghĩa “đưa tân ngữ ra trước động từ”?",["把","难","当然","明白"],0,"把 (bǎ) nghĩa là đưa tân ngữ ra trước động từ."],["Từ nào có nghĩa “bài tập về nhà”?",["作业","要求","遇到","讲"],0,"作业 (zuòyè) nghĩa là bài tập về nhà."],["Từ nào có nghĩa “lượt; lần”?",["遍","差","办公室","句"],0,"遍 (biàn) nghĩa là lượt; lần."],["Từ nào có nghĩa “nâng cao”?",["提高","复习","页","句子"],0,"提高 (tígāo) nghĩa là nâng cao."],["Từ nào có nghĩa “lịch sử”?",["历史","外语","对话","年级"],0,"历史 (lìshǐ) nghĩa là lịch sử."],["Từ nào có nghĩa “khó”?",["难","当然","明白","后年"],0,"难 (nán) nghĩa là khó."],["Từ nào có nghĩa “yêu cầu”?",["要求","遇到","讲","一般"],0,"要求 (yāoqiú) nghĩa là yêu cầu."],["Từ nào có nghĩa “kém; thiếu”?",["差","办公室","句","努力"],0,"差 (chà) nghĩa là kém; thiếu."],["Từ nào có nghĩa “ôn tập”?",["复习","页","句子","数学"],0,"复习 (fùxí) nghĩa là ôn tập."],["Từ nào có nghĩa “ngoại ngữ”?",["外语","对话","年级","认真"],0,"外语 (wàiyǔ) nghĩa là ngoại ngữ."],["Từ nào có nghĩa “đương nhiên”?",["当然","明白","后年","笔记"],0,"当然 (dāngrán) nghĩa là đương nhiên."],["Từ nào có nghĩa “gặp phải”?",["遇到","讲","一般","清楚"],0,"遇到 (yùdào) ngh const {vocab,readings,grammar,book,extra}=DB;
let page='home',ri=0,vm='hv',state={};try{state=JSON.parse(localStorage.getItem('HSK3_L10_fixed_2026')||'{}')}catch(e){};
for(const name of ['answer','graded','vanswer','vgraded','translation'])if(!state[name])state[name]={};
const save=()=>{try{localStorage.setItem('HSK3_L10_fixed_2026',JSON.stringify(state))}catch(e){}};
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs=[['home','🏠 Tổng quan'],['vocab','🀄 26 từ vựng'],['vquiz','🧩 Quiz từ vựng'],['grammar','📒 3 điểm ngữ pháp'],['reading','📖 4 bài khóa'],['translate','🌏 Luyện dịch'],['original','📝 Bài tập gốc'],['practice','🎯 30 câu mở rộng'],['mistakes','🔁 Ôn câu sai']];
function setPage(p){page=p;render();window.scrollTo(0,0)}function setRi(i){ri=i;render()}function setVM(m){vm=m;render()}
function speak(t){if(!('speechSynthesis'in window)){alert('Thiết bị không hỗ trợ giọng đọc.');return}speechSynthesis.cancel();let a=new SpeechSynthesisUtterance(t);a.lang='zh-CN';a.rate=.77;speechSynthesis.speak(a)}
function render(){document.getElementById('nav').innerHTML=tabs.map(([k,t])=>`<button class="${page===k?'active':''}" onclick="setPage('${k}')">${t}</button>`).join('');let a=document.getElementById('main');({home,vocab:showVocab,vquiz:showVQuiz,grammar:showGrammar,reading:showReading,translate:showTranslation,original:showExercises,practice:showExercises,mistakes:showExercises})[page](a)}
function home(a){let marks=Object.values(state.graded),done=marks.length,acc=marks.filter(Boolean).length;a.innerHTML=`<h2>Chào mừng đến HSK 3 – Bài 10 📚</h2><p class="muted">Nội dung dựa trên trang 86–94 của giáo trình đính kèm. Quiz từ vựng và bài tập mở rộng có ghi rõ là nội dung biên soạn thêm.</p><div class="grid"><div class="stat">Từ vựng<strong>26</strong></div><div class="stat">Bài khóa<strong>4</strong></div><div class="stat">Đã làm<strong>${done}/40</strong><span class="small">Đúng ${acc}/${done||0}</span></div></div><div class="card"><h2>🧠 Tổng quan · Công thức trọng tâm</h2><p class="muted">Ba thẻ ngữ pháp hiển thị ngay dưới đây, bấm để học ví dụ và luyện tập.</p>${grammar.map((g,i)=>`<div class="cover"><h3>${i+1}. ${E(g.name)}</h3><div class="formula">${E(g.formula)}</div><p>${E(g.meaning)}</p><div class="hanzi">${E(g.example)}</div><p>${E(g.vi)}</p><button class="btn alt" onclick="ri=${i};setPage('grammar')">Học sâu chủ điểm này →</button></div>`).join('')}</div><div class="card"><h3>Lộ trình đề xuất</h3>① Học 26 từ → ② Quiz từ vựng → ③ Học 3 công thức → ④ Đọc và dịch 4 bài khóa → ⑤ Làm 10 câu sách → ⑥ Làm 30 câu mở rộng → ⑦ Ôn câu sai.<div class="toolbar"><button class="btn" onclick="setPage('vocab')">Bắt đầu học</button><button class="btn alt" onclick="setPage('original')">Làm bài gốc</button></div></div><div class="alert">Lưu ý: Tài liệu là trang scan; phần dịch tiếng Việt là bản tham khảo biên soạn. Chưa tích hợp audio gốc của sách.</div>`}
function showVocab(a){a.innerHTML=`<h2>🀄 26 từ vựng Bài 10</h2><p class="muted">Chữ Hán · Pinyin · nghĩa Việt · giọng đọc tiếng Trung của trình duyệt.</p><div class="toolbar"><input id="findv" placeholder="Tìm chữ Hán / Pinyin / nghĩa Việt" oninput="drawVocab(this.value)" style="padding:12px;border:1px solid #dbe1ed;border-radius:10px;max-width:350px;width:100%"><button class="btn" onclick="setPage('vquiz')">Luyện quiz →</button></div><div class="vgrid" id="vitems"></div>`;drawVocab('')}
function drawVocab(term){let g=document.getElementById('vitems');if(!g)return;g.innerHTML=vocab.filter(v=>v.join(' ').toLowerCase().includes(term.toLowerCase())).map(v=>`<div class="card"><div class="hanzi">${E(v[0])}</div><div class="py">${E(v[1])}</div><p>${E(v[2])}</p><button class="btn alt voice" onclick="speak('${E(v[0])}')">🔊 Nghe</button></div>`).join('')}
function vkey(i){return vm+'_'+i}function vopts(i){let inds=[i];for(let k=1;inds.length<4;k++){let j=(i+k*7)%vocab.length;if(!inds.includes(j))inds.push(j)}return inds.sort((a,b)=>((a*17+5)%29)-((b*17+5)%29))}
function showVQuiz(a){let n=vocab.filter((_,i)=>vkey(i) in state.vgraded).length,ok=vocab.filter((_,i)=>state.vgraded[vkey(i)]===true).length;a.innerHTML=`<h2>🧩 Quiz từ vựng · 26 từ</h2><p class="muted">3 chế độ: Hán → nghĩa, nghĩa → Hán, chữ Hán → Pinyin. 78 lượt câu hỏi.</p><div class="card"><div class="toolbar"><button class="pill ${vm==='hv'?'on':''}" onclick="setVM('hv')">Hán → Việt</button><button class="pill ${vm==='vh'?'on':''}" onclick="setVM('vh')">Việt → Hán</button><button class="pill ${vm==='hp'?'on':''}" onclick="setVM('hp')">Hán → Pinyin</button></div><b>Đã chấm ${n}/26 · Đúng ${ok}</b><div class="progress"><i style="width:${n/26*100}%"></i></div></div>${vocab.map((v,i)=>{let k=vkey(i),pick=state.vanswer[k],graded=k in state.vgraded,opts=vopts(i),show=j=>vm==='hv'?vocab[j][2]:vm==='vh'?vocab[j][0]:vocab[j][1];return `<div class="quiz"><span class="badge">Từ ${i+1}/26</span><div class="qtitle">${E(vm==='vh'?v[2]:v[0])}</div>${opts.map((j,n)=>`<button class="option ${pick===j?'sel':''} ${graded&&j===i?'good':''} ${graded&&pick===j&&j!==i?'bad':''}" onclick="chooseV(${i},${j})">${'ABCD'[n]}. ${E(show(j))}</button>`).join('')}<button class="btn" onclick="checkV(${i})">Chấm đáp án</button> <button class="btn alt" onclick="speak('${E(v[0])}')">🔊 Nghe</button>${graded?`<div class="feedback ${state.vgraded[k]?'good':'bad'}"><b>${state.vgraded[k]?'✅ Đúng':'❌ Sai'}</b><p><b>Feynman:</b> ${E(v[0])} đọc là <b>${E(v[1])}</b>, nghĩa <b>${E(v[2])}</b>.</p><div class="socrates"><b>Socrates:</b> Em thử đặt một câu ngắn có từ này trong tình huống học tập?</div></div>`:''}</div>`}).join('')}`}
function chooseV(i,j){let k=vkey(i);state.vanswer[k]=j;delete state.vgraded[k];save();keep()}function checkV(i){let k=vkey(i);if(!(k in state.vanswer)){alert('Hãy chọn đáp án.');return}state.vgraded[k]=state.vanswer[k]===i;save();keep()}
function showGrammar(a){a.innerHTML=`<h2>📒 Ngữ pháp 1–3</h2><div class="toolbar">${grammar.map((g,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">${i+1}. ${E(g.name)}</button>`).join('')}</div>${(()=>{let g=grammar[Math.min(ri,2)];return `<div class="card grammar"><h2>${E(g.name)}</h2><div class="formula">${E(g.formula)}</div><h3>Ý nghĩa</h3><p>${E(g.meaning)}</p><h3>Ví dụ trong bài</h3><div class="hanzi">${E(g.example)}</div><p>${E(g.vi)}</p><p class="textnote"><b>Feynman:</b> ${E(g.tip)}</p><div class="socrates"><b>Câu hỏi Socrates:</b> Nếu thay cụm này bằng cách nói khác, sắc thái của người nói sẽ thay đổi như thế nào?</div></div>`})()}<button class="btn" onclick="setPage('practice')">Luyện vận dụng ngữ pháp →</button>`}
function showReading(a){let r=readings[ri%4];a.innerHTML=`<h2>📖 Đọc hiểu 4 bài khóa</h2><div class="toolbar">${readings.map((x,i)=>`<button class="pill ${i===ri?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div><div class="card"><h2>${E(r.title)}</h2><p class="muted">${E(r.where)}</p>${r.lines.map(([sp,cn,vi],i)=>`<div class="readingline"><div class="hanzi"><b>${E(sp)}：</b>${E(cn)}</div><button class="btn alt voice" onclick="speak('${E(cn)}')">🔊 Đọc</button> <details><summary>Xem bản dịch</summary>${E(vi)}</details></div>`).join('')}<h3>Vấn đáp Socrates · Đọc hiểu</h3>${r.questions.map((q,i)=>`<p>${i+1}. ${E(q)}</p>`).join('')}<button class="btn" onclick="setPage('translate')">Tự dịch bài khóa →</button></div>`}
function showTranslation(a){let r=readings[ri%4];a.innerHTML=`<h2>🌏 Dịch từng câu · Trung → Việt</h2><p class="muted">Viết trước khi xem đáp án mẫu. Nội dung tự lưu trên trình duyệt.</p><div class="toolbar">${readings.map((x,i)=>`<button class="pill ${i===ri?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div><div class="card"><h3>${E(r.title)}</h3>${r.lines.map(([sp,cn,vi],i)=>{let key='r'+ri+'_'+i;return `<div class="readingline"><div class="hanzi">${E(sp)}：${E(cn)}</div><textarea placeholder="Viết bản dịch tiếng Việt của bạn..." oninput="transInput('${key}',this.value)">${E(state.translation[key]||'')}</textarea><details><summary>🔎 Xem bản dịch mẫu và tự đối chiếu</summary><div class="feedback good">${E(vi)}</div><p class="small">Socrates: Hãy tìm chủ ngữ, động từ chính, từ chỉ thời gian và thành phần chỉ kết quả.</p></details></div>`}).join('')}<button class="btn alt" onclick="downloadTrans()">Xuất bản dịch (.txt)</button></div>`}
function transInput(k,v){state.translation[k]=v;save()}function downloadTrans(){let r=readings[ri%4],txt=r.title+'\n\n'+r.lines.map(([sp,cn],i)=>sp+'：'+cn+'\n'+(state.translation['r'+ri+'_'+i]||'')).join('\n\n');let u=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='HSK3_Bai10_Dich_Bai'+(ri+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),800)}
const questions=[...book.map((e,i)=>({id:'b'+i,q:e[0],opts:e[1],ans:e[1].indexOf(e[2]===undefined?'':e[1][e[2]]),ex:e[3],source:true})),...extra.map((e,i)=>({id:'e'+i,q:e[0],opts:e[1],ans:e[2],ex:e[3],source:false}))];
// For source questions the numeric answer key is recorded in DB.book's 3rd item.
book.forEach((e,i)=>questions[i].ans=e[2]);
function showExercises(a){let list=page==='original'?questions.filter(q=>q.source):page==='practice'?questions.filter(q=>!q.source):questions.filter(q=>state.graded[q.id]===false);let n=list.filter(q=>q.id in state.graded).length,ok=list.filter(q=>state.graded[q.id]===true).length;a.innerHTML=`<h2>${page==='original'?'📝 10 câu điền từ từ sách · tr. 93':page==='practice'?'🎯 30 câu luyện vận dụng':'🔁 Ôn lại câu sai'}</h2><p class="muted">${page==='original'?'Câu gốc dựa trên mục 综合练习, mỗi câu có các lựa chọn của nhóm từ tương ứng.':'Các câu trắc nghiệm mở rộng do app biên soạn, không phải bài gốc.'}</p><div class="quizstats">Đã chấm <b>${n}/${list.length}</b> · Đúng <b>${ok}</b><div class="progress"><i style="width:${list.length?n/list.length*100:0}%"></i></div></div>${list.length?list.map((q,i)=>{let p=state.answer[q.id],g=q.id in state.graded;return `<article class="quiz"><span class="badge">Câu ${i+1} ${q.source?'· Theo sách':'· Mở rộng'}</span><h3 class="qtitle">${E(q.q)}</h3>${q.opts.map((o,j)=>`<button class="option ${p===j?'sel':''} ${g&&j===q.ans?'good':''} ${g&&p===j&&p!==q.ans?'bad':''}" onclick="pick('${q.id}',${j})">${'ABCDE'[j]}. ${E(o)}</button>`).join('')}<button class="btn" onclick="check('${q.id}')">Kiểm tra đáp án</button>${g?`<div class="feedback ${state.graded[q.id]?'good':'bad'}"><b>${state.graded[q.id]?'✅ Chính xác':'❌ Chưa đúng'}. Đáp án: ${E(q.opts[q.ans])}</b><p><b>Feynman:</b> ${E(q.ex)}</p><div class="socrates"><b>Socrates:</b> Từ nào trong ngữ cảnh giúp em chọn đáp án này và loại những từ còn lại?</div></div>`:''}</article>`}).join(''):'<div class="card empty">Chưa có câu sai. Hãy làm bài tập trước nhé!</div>'}`}
function pick(id,j){state.answer[id]=j;delete state.graded[id];save();keep()}function check(id){if(!(id in state.answer)){alert('Hãy chọn đáp án trước.');return}let q=questions.find(x=>x.id===id);state.graded[id]=state.answer[id]===q.ans;save();keep()}
function keep(){let y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,y))}render();
</script></body></html>
