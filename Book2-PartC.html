"D","page":16,"test":"Test 4"},{"n":144,"q":"Being the second child of three, he tends to admire his elder brother and despise his younger sister.","options":{"A":"look over / look up","B":"make up to / make over","C":"make for / make up to","D":"look up to / look down on"},"answer":"D","page":16,"test":"Test 4"},{"n":145,"q":"As we had a long way to go, we left at five in the morning.","options":{"A":"set off","B":"put up","C":"stood for","D":"set about"},"answer":"A","page":16,"test":"Test 4"},{"n":146,"q":"The Prime Minister established a committee to discuss ways of improving the Turkish economy.","options":{"A":"set up","B":"put out","C":"kept up","D":"found out"},"answer":"A","page":16,"test":"Test 4"},{"n":147,"q":"The factory has reduced its workforce by 50%.","options":{"A":"cut back","B":"cut off","C":"set off","D":"taken in"},"answer":"A","page":16,"test":"Test 4"},{"n":148,"q":"The editor had to omit several articles because of lack of space.","options":{"A":"cut down","B":"cut out","C":"cut off","D":"cut away"},"answer":"B","page":16,"test":"Test 4"},{"n":149,"q":"He gave a lift to three students outside London and dropped them off in Watford.","options":{"A":"called up","B":"brought up","C":"took up","D":"picked up"},"answer":"D","page":16,"test":"Test 4"},{"n":150,"q":"Our radio can receive the Voice of America very clearly.","options":{"A":"get on","B":"take off","C":"pick out","D":"pick up"},"answer":"D","page":16,"test":"Test 4"}];const GROUPS=['Classified Phrasal Verbs','Test 1','Test 2','Test 3','Test 4'];const KEYS={};BANK.forEach(x=>{(KEYS[x.test]??=[]).push(x)});let storage={};try{storage=JSON.parse(localStorage.getItem('book2partc-progress')||'{}')}catch{};let group=GROUPS[0],review=false,index=0,selected=null,checked=false;
function persist(){try{localStorage.setItem('book2partc-progress',JSON.stringify(storage))}catch{}}
function id(x){return x.test+'-'+x.n}function currentList(){let ar=KEYS[group]||[];return review?ar.filter(x=>storage[id(x)]&&!storage[id(x)].correct):ar}function current(){return currentList()[index]}
function choose(l){if(checked)return;selected=l;render()}function navGroup(s){group=s;index=0;selected=null;checked=false;review=false;render()}function changeMode(v){review=v;index=0;selected=null;checked=false;render()}function go(delta){let ar=currentList();if(!ar.length)return;index=Math.max(0,Math.min(ar.length-1,index+delta));selected=null;checked=false;render()}
function check(){const q=current();if(!q)return;if(checked){go(1);return}if(!selected)return;checked=true;storage[id(q)]={answer:selected,correct:selected===q.answer};persist();render()}
function explanation(q){const word=q.options[q.answer]||'', source=q.q;const blank=source.includes('______');let combined=blank?source.replace(/_{2,}/,word):source;let types=[];
if(/\b(?:break|broke|broken)\b/i.test(combined))types.push('break: phá vỡ, ngắt hoặc bộc phát tùy tiểu từ đi kèm');
if(/\b(?:get|got)\b/i.test(combined))types.push('get: thường chỉ đạt được, thoát khỏi, hoặc chuyển trạng thái');
if(/\b(?:take|took)\b/i.test(combined))types.push('take: nhận, mang đi, đảm nhận hoặc bắt đầu');
if(/\b(?:put|set)\b/i.test(combined))types.push('put/set: đặt, chuyển, hoãn hoặc thiết lập');
if(/\b(?:go|went|gone)\b/i.test(combined))types.push('go: di chuyển, tiếp diễn hoặc thay đổi tình trạng');
if(/\b(?:look|looked)\b/i.test(combined))types.push('look: nhìn, tìm kiếm, xem xét, trông nom');
return `<h3>${selected===q.answer?'✅ Chính xác!':'❌ Chưa đúng'}</h3><b>Đáp án theo Key:</b> ${q.answer}) ${esc(word)}<div class="explain"><p><b>1. Ghép vào ngữ cảnh:</b> ${esc(combined)}.</p><p><b>2. Suy luận Feynman:</b> Không dịch động từ riêng lẻ rồi đoán tiểu từ. Hãy xem <b>động từ + giới từ/trạng từ</b> như một cụm từ có nghĩa riêng, sau đó thử thay cả cụm vào câu để kiểm tra nghĩa và cấu trúc.</p><p><b>3. Dấu hiệu cần phân tích:</b> ${types.length?types.join('; '):'Ngữ cảnh trước và sau chỗ trống quyết định cụm từ phù hợp.'}. <i>Đây là gợi ý phương pháp, chưa phải bản dịch hoặc lời giải biên soạn riêng cho câu này.</i></p><p><b>4. Tư duy ngược:</b> Nếu thay bằng lựa chọn ${selected&&selected!==q.answer?selected:'khác'}, ý nghĩa hoặc cách kết hợp với từ phía sau có còn phù hợp không?</p><p><b>5. Socrates:</b> Em có thể giải thích nghĩa của <strong>${esc(word)}</strong> bằng một câu tiếng Việt và đặt một ví dụ mới không?</p></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.getElementById('nav').innerHTML=GROUPS.map(g=>`<button class="nav ${g===group?'active':''}" onclick="navGroup('${g}')">${g}<span class="count">${(KEYS[g]||[]).length} câu</span></button>`).join('');let all=KEYS[group]||[],ar=currentList();index=Math.min(index,Math.max(0,ar.length-1));let done=all.filter(x=>storage[id(x)]).length,good=all.filter(x=>storage[id(x)]?.correct).length;document.getElementById('heading').textContent=group;document.getElementById('subtitle').textContent=review?'Chế độ luyện lại câu trả lời sai':'Chọn A–D; phần Classified chọn A–C';document.getElementById('stats').innerHTML=`<div class="pill">📋 ${all.length} câu khả dụng</div><div class="pill">✅ Đúng: ${good}</div><div class="pill">📝 Đã làm: ${done}</div><div class="pill">🎯 ${done?Math.round(good/done*100):0}%</div>`;let q=ar[index];document.getElementById('bar').style.width=ar.length?100*(index+1)/ar.length+'%':'0%';document.getElementById('position').textContent=q?`Câu ${q.n} · ${index+1}/${ar.length} · Trang PDF ${q.page}`:'';document.getElementById('q').textContent=q?q.q:(review?'Không có câu sai nào cần luyện lại. 🎉':'Không có câu hợp lệ.');document.getElementById('opts').innerHTML=q?Object.entries(q.options).map(([l,v])=>`<button class="option ${selected===l?'selected':''} ${checked&&l===q.answer?'correct':''} ${checked&&selected===l&&l!==q.answer?'wrong':''}" onclick="choose('${l}')"><span class="letter">${l}</span><span>${esc(v)}</span></button>`).join(''):'';let f=document.getElementById('feedback');f.className='';f.innerHTML=q&&checked?explanation(q):'';if(checked)f.className='feedback '+(selected===q.answer?'good':'bad');let b=document.getElementById('check');b.textContent=checked?'Câu tiếp (Enter)':'Kiểm tra (Enter)';b.disabled=!q||(!checked&&!selected)}
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','Enter'].includes(e.key)){if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;e.preventDefault();let q=current();if(!q)return;let letters=Object.keys(q.options);if(e.key==='Enter'){check();return}if(checked)return;let ix=letters.indexOf(selected);ix=(ix+(e.key==='ArrowDown'?1:-1)+letters.length)%letters.length;selected=letters[ix];render()}});render();</script></body></html>
