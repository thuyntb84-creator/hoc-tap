<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSK3 Bài 17 · Smart Practice</title><style>
:root{--bg:#f4f7fd;--ink:#23324d;--line:#e1e8f4;--blue:#4368ed;--soft:#eaf0ff;--red:#dd4960;--green:#138467}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,'Microsoft YaHei','Noto Sans CJK SC',sans-serif}button,textarea,input{font:inherit}button{cursor:pointer}header{background:linear-gradient(118deg,#283d7d,#5676eb);color:white;padding:24px 5%}header h1{margin:8px 0;font-size:25px}.wrap{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:90vh}nav{background:white;padding:18px 12px;border-right:1px solid var(--line)}nav button{display:block;border:0;background:transparent;text-align:left;width:100%;padding:13px;border-radius:12px;margin:3px 0;font-weight:700;color:#495976}nav button.active,nav button:hover{background:var(--soft);color:#2c51cc}main{max-width:1080px;width:100%;padding:25px;margin:auto}.card{background:white;border-radius:17px;border:1px solid var(--line);padding:21px;margin:0 0 18px;box-shadow:0 3px 15px #152a4608}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.stat{background:#f2f5ff;border-radius:13px;padding:17px}.stat strong{display:block;font-size:29px;color:#4264d5}.muted{color:#677691;font-size:14px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0}.btn{background:var(--blue);color:white;border:0;border-radius:11px;padding:11px 15px;font-weight:700}.btn.alt{background:#eaf0ff;color:#3154b7}.btn.gray{background:#eef1f7;color:#45546e}.pill{border:1px solid #d7e0ee;border-radius:50px;padding:10px 13px;background:#fff;color:#4b5d7b}.pill.on{background:var(--blue);color:white}.hanzi{font-size:24px;line-height:1.7}.py{font-size:14px;color:#4276b9}.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px}.vgrid .card{margin:0;padding:15px}.vgrid .hanzi{font-weight:700}.formula{font-size:19px;font-weight:700;padding:15px;background:#fff4c1;border-radius:12px;line-height:1.6}.grammarcards{display:grid;gap:15px}.grammar{border-radius:15px;border:2px dashed #dccde7;padding:20px;background:linear-gradient(120deg,#fff9fc,#fffef5)}.grammar h3{margin:0 0 10px}.readingline{border-bottom:1px dashed #d7dfed;padding:12px 0;line-height:1.7}.readingline .hanzi{font-size:21px}.quiz{border:1px solid var(--line);padding:18px;border-radius:14px;background:white;margin-bottom:13px}.option{display:block;width:100%;padding:12px;text-align:left;background:#fbfcff;border:1px solid #dce3ed;border-radius:11px;margin:7px 0;color:var(--ink)}.option.sel{border:2px solid #4267ef;padding:11px;background:#edf2ff}.option.good{border-color:#24a17d;background:#e8f8ee}.option.bad{border-color:var(--red);background:#fff0f2}.feedback{background:#f2f5fb;border-radius:12px;padding:14px;margin:10px 0;line-height:1.8}.feedback.good{background:#e7f8f0}.feedback.bad{background:#fff0f2}.socrates{border-left:4px solid #daa34f;background:#fffaeb;padding:12px;margin-top:9px;border-radius:9px}textarea{width:100%;min-height:100px;padding:14px;border:1px solid #ccd5e5;border-radius:11px;line-height:1.7;resize:vertical}details{margin:12px 0}summary{color:#315ac4;cursor:pointer;font-weight:bold}.progress{height:9px;border-radius:10px;background:#e4eaf5;overflow:hidden}.progress>i{display:block;background:var(--blue);height:100%}.small{font-size:13px;color:#748198}.textnote{background:#fff9e5;padding:14px;border-radius:11px}.quizstats{padding:15px;border-radius:12px;background:#edf3ff;margin:14px 0}h2{margin:0 0 13px}h3{line-height:1.5}.empty{padding:24px;text-align:center}.voice{font-size:13px}.badge{background:#ffe4ed;color:#aa4669;border-radius:7px;padding:4px 9px;display:inline-block;font-size:12px;font-weight:bold}.qtitle{font-size:19px;line-height:1.7}.cover{background:linear-gradient(130deg,#fef1ef,#f2f2ff);border:2px dashed #e8c8cf;border-radius:16px;padding:18px;margin:12px 0}.cover .formula{margin-top:10px}.tabs{display:flex;flex-wrap:wrap;gap:8px}.alert{background:#fff9e7;border-radius:12px;padding:13px} @media(max-width:800px){.wrap{display:block}nav{display:flex;overflow:auto;position:sticky;top:0;z-index:10;padding:8px;gap:3px}nav button{width:auto;white-space:nowrap;padding:10px}main{padding:13px}.grid{grid-template-columns:1fr}header h1{font-size:20px}}
</style></head><body><header><span class="badge">新HSK教程 3 · LESSON 17</span><h1>我要多向认真的人学习</h1><div>Tôi cần học hỏi nhiều từ những người nghiêm túc · Học hiểu → luyện tập → tự chữa lỗi</div></header><div class="wrap"><nav id="nav"></nav><main id="main"></main></div><script>const DB={"vocab":[["向","xiàng","hướng về; với"],["楼梯","lóutī","cầu thang"],["害怕","hàipà","sợ"],["生气","shēngqì","tức giận"],["常见","chángjiàn","thường gặp"],["聪明","cōngming","thông minh"],["错","cuò","sai; lỗi"],["认为","rènwéi","cho rằng"],["到处","dàochù","khắp nơi"],["继续","jìxù","tiếp tục"],["同意","tóngyì","đồng ý"],["可","kě","nhưng; thế mà"],["屋子","wūzi","căn phòng"],["有关","yǒuguān","có liên quan"],["关机","guānjī","tắt máy"],["前天","qiántiān","hôm kia"],["留学","liúxué","du học"],["国家","guójiā","quốc gia"],["比如","bǐrú","ví dụ như"],["查","chá","tra cứu; kiểm tra"],["有用","yǒuyòng","hữu ích"],["容易","róngyì","dễ dàng"],["回答","huídá","trả lời"],["方向","fāngxiàng","phương hướng"],["只有","zhǐyǒu","chỉ khi; chỉ có"],["真正","zhēnzhèng","thực sự"],["难题","nántí","vấn đề khó"]],"readings":[{"title":"Bài khóa 1 – Học từ người nghiêm túc","where":"Tòa nhà giảng đường – 刘小雪 và bạn học","lines":[["刘小雪","别再向前走了，李老师的办公室已经到了。","Đừng đi tiếp về phía trước nữa, đã đến văn phòng thầy Lý rồi."],["同学","你进去吧，我在楼梯那儿等你。我害怕见李老师。","Cậu vào đi, tớ đợi ở cầu thang. Tớ sợ gặp thầy Lý."],["刘小雪","怎么回事？","Có chuyện gì vậy?"],["同学","最近我做错了好几件事，我怕李老师生气。","Gần đây tớ làm sai mấy việc, sợ thầy Lý nổi giận."],["刘小雪","你想多了，做错事情是很常见的。","Cậu nghĩ quá nhiều rồi, làm sai là chuyện rất thường gặp."],["同学","我把简单的事情做错了，李老师一定觉得我不认真。","Tớ đã làm sai cả việc đơn giản, chắc thầy Lý nghĩ tớ không nghiêm túc."],["刘小雪","有的人虽然很聪明，但是会在简单的事情中出错，因为他们认为事情简单，就不会认真去做了。","Có người dù thông minh vẫn mắc lỗi ở việc đơn giản vì họ nghĩ việc dễ nên không làm nghiêm túc."],["同学","你说的就是我，以后我要多向认真的人学习。","Cậu đang nói đúng tớ đấy. Sau này tớ phải học hỏi nhiều hơn từ những người nghiêm túc."]],"questions":["小雪的同学为什么害怕见李老师？","小雪认为她的同学为什么做错事？","小雪的同学打算以后怎么做？"]},{"title":"Bài khóa 2 – Tiếp tục học hay đi làm","where":"Cửa phòng đọc – 白家月 và 陈天中","lines":[["白家月","太阳从西边出来了？这几天怎么总是在图书馆看见你？","Mặt trời mọc đằng Tây sao? Sao mấy hôm nay lúc nào cũng thấy cậu ở thư viện?"],["陈天中","这有什么奇怪的？我是来学习的。","Có gì lạ đâu? Tớ đến để học mà."],["白家月","你怎么还来图书馆学习？同学们都在到处找工作呢。","Sao cậu vẫn đến thư viện học? Các bạn đều đang đi khắp nơi tìm việc đấy."],["陈天中","我不想现在就工作，还想继续学习，我爸妈也同意。可我还没想好学什么，所以来图书馆看看。","Tớ chưa muốn đi làm ngay, còn muốn học tiếp, bố mẹ cũng đồng ý. Nhưng tớ chưa quyết định học gì nên đến thư viện xem thử."],["白家月","你不是喜欢玩电脑吗？你可以去看看跟电脑有关系的书。","Chẳng phải cậu thích máy tính sao? Cậu có thể tìm sách liên quan đến máy tính."],["陈天中","你说得对，我记得那个屋子里有些跟电脑有关的书，我去找找。","Cậu nói đúng. Tớ nhớ căn phòng kia có sách về máy tính, tớ đi tìm."]],"questions":["白家月为什么说“太阳从西边出来了”？","陈天中为什么不去找工作？","白家月觉得陈天中可以学什么？"]},{"title":"Bài khóa 3 – Chọn nước du học","where":"Trong trường – 李文 và 陈天中","lines":[["李文","天中，你的手机怎么关机了？","Thiên Trung, sao điện thoại cậu tắt máy vậy?"],["陈天中","我的手机没电了。你找我有事吗？","Điện thoại tớ hết pin rồi. Cậu tìm tớ có việc gì?"],["李文","前天我看见家月了，她告诉我你打算继续留学？","Hôm kia tớ gặp Gia Nguyệt, bạn ấy nói cậu định tiếp tục đi du học à?"],["陈天中","是，可是我还没想好学什么，更没想好去哪个国家。","Ừ, nhưng tớ chưa quyết định học gì, càng chưa quyết định sẽ đến nước nào."],["李文","你可以去中国学中文啊。比如可以去北京、上海这样的城市，那里有很多好大学，也有很多留学生。","Cậu có thể đến Trung Quốc học tiếng Trung. Ví dụ Bắc Kinh hoặc Thượng Hải có nhiều đại học tốt và sinh viên quốc tế."],["陈天中","好，那我上网查一查。","Được, vậy tớ sẽ lên mạng tra thử."],["李文","我给你介绍几个有用的网站。","Tớ sẽ giới thiệu cho cậu vài trang web hữu ích."]],"questions":["陈天中打算做什么？","李文给他出了什么主意？","李文为什么给陈天中介绍几个网站？"]},{"title":"Bài khóa 4 – Chọn đúng hướng đi","where":"Ở nhà – Nhật ký của 陈天中","lines":[["陈天中","大学生活马上就要结束了，我最近经常被问到一个问题——“你以后想做什么？”","Cuộc sống đại học sắp kết thúc, gần đây tôi thường bị hỏi: Sau này bạn muốn làm gì?"],["陈天中","这个问题真不容易回答。","Câu hỏi này thật không dễ trả lời."],["陈天中","我也问了几个同学，大家选择的方向都不同。","Tôi cũng hỏi vài người bạn, mỗi người chọn hướng đi khác nhau."],["陈天中","有的想继续在学校学习，有的打算出国留学，还有的决定先找工作。","Có bạn muốn học tiếp, có bạn định du học, có người quyết định tìm việc trước."],["陈天中","我认为只有想清楚自己真正喜欢什么，才能做出最合适的选择。","Tôi nghĩ chỉ khi hiểu rõ mình thực sự thích gì mới có thể đưa ra lựa chọn phù hợp nhất."],["陈天中","对我来说，想清楚“真正喜欢什么”是个难题。","Đối với tôi, hiểu rõ mình thực sự thích gì là một bài toán khó."]],"questions":["陈天中最近经常被问到什么问题？","同学们有哪些不同的选择？","陈天中知道自己真正喜欢什么吗？"]}],"grammar":[{"name":"向 – Hướng về / học hỏi từ","formula":"向 + người / nơi chốn + động từ","meaning":"Giới từ 向 chỉ đối tượng hoặc hướng của hành động.","example":"以后我要多向认真的人学习。","vi":"Sau này tôi phải học hỏi nhiều hơn từ những người nghiêm túc.","tip":"Tưởng tượng mũi tên chỉ người nhận hành động: 向谁学习 = học từ ai.","s":"Trong câu này, ai là người mà nhân vật muốn học hỏi?"},{"name":"不是……吗？ – Câu hỏi tu từ","formula":"不是 + sự việc + 吗？","meaning":"Hình thức hỏi phủ định, nhưng thường để nhắc lại, xác nhận hoặc bày tỏ ngạc nhiên.","example":"你不是喜欢玩电脑吗？","vi":"Chẳng phải bạn thích chơi máy tính sao?","tip":"Người nói thường đã biết hoặc tin điều đó, nên dùng câu hỏi để gợi nhắc.","s":"Câu hỏi này có nhất thiết đang muốn biết thông tin hoàn toàn mới không?"},{"name":"……，更…… – Càng hơn nữa","formula":"Mệnh đề 1，更 + mức độ / tính chất ở mệnh đề 2","meaning":"Mệnh đề sau nhấn mạnh mức độ sâu hơn hoặc điều chưa thể thực hiện hơn nữa.","example":"我还没想好学什么，更没想好去哪个国家。","vi":"Tôi chưa nghĩ xong nên học gì, càng chưa nghĩ xong sẽ đến nước nào.","tip":"更 tạo bậc tăng tiến: việc đầu đã khó/chưa xong; việc sau còn hơn thế.","s":"Cụm 更没想好 làm tăng hay giảm mức độ chưa xác định?"},{"name":"只有……才…… – Chỉ khi… mới…","formula":"只有 + điều kiện，才 + kết quả","meaning":"Nhấn mạnh điều kiện cần để đạt một kết quả.","example":"只有想清楚自己真正喜欢什么，才能做出最合适的选择。","vi":"Chỉ khi hiểu mình thật sự thích gì mới đưa ra lựa chọn phù hợp nhất.","tip":"只有 là chiếc chìa khóa; 才 là cánh cửa kết quả chỉ mở khi có chìa.","s":"Nếu không đáp ứng điều kiện 只有, người nói có khẳng định kết quả sẽ xảy ra không?"}],"book":[{"q":"生活中，因为不认真做错事情是很____的。","opts":["常见","方向","回答","难题","同意"],"ans":0,"ex":"Chọn theo nghĩa và chức năng từ trong ngữ cảnh. Từ đúng là 常见; thử thay các phương án khác để nhận ra chỗ không hợp nghĩa.","tag":"Sách · 综合练习"},{"q":"我认为大学的时候就应该好好选择好以后的工作____。","opts":["常见","方向","回答","难题","同意"],"ans":1,"ex":"Chọn theo nghĩa và chức năng từ trong ngữ cảnh. Từ đúng là 方向; thử thay các phương án khác để nhận ra chỗ không hợp nghĩa.","tag":"Sách · 综合练习"},{"q":"他说的话我一句也不____，你也不要受他的影响。","opts":["常见","方向","回答","难题","同意"],"ans":4,"ex":"Chọn theo nghĩa và chức năng từ trong ngữ cảnh. Từ đúng là 同意; thử thay các phương án khác để nhận ra chỗ không hợp nghĩa.","tag":"Sách · 综合练习"},{"q":"这个问题我还没想清楚怎么____他。","opts":["常见","方向","回答","难题","同意"],"ans":2,"ex":"Chọn theo nghĩa và chức năng từ trong ngữ cảnh. Từ đúng là 回答; thử thay các phương án khác để nhận ra chỗ không hợp nghĩa.","tag":"Sách · 综合练习"},{"q":"对我来说，怎么让父母同意我的选择是一个____。","opts":["常见","方向","回答","难题","同意"],"ans":3,"ex":"Chọn theo nghĩa và chức năng từ trong ngữ cảnh. Từ đúng là 难题; thử thay các phương án khác để nhận ra chỗ không hợp nghĩa.","tag":"Sách · 综合练习"},{"q":"已经下课了，同学们都走了吗？没有，还有几个人在____向李老师问问题。","opts":["到处","比如","继续","有关","认为"],"ans":2,"ex":"Chọn theo nghĩa và chức năng từ trong ngữ cảnh. Từ đúng là 继续; thử thay các phương án khác để nhận ra chỗ không hợp nghĩa.","tag":"Sách · 综合练习"},{"q":"你为什么____找我？有什么急事？","opts":["到处","比如","继续","有关","认为"],"ans":0,"ex":"Chọn theo nghĩa và chức năng từ trong ngữ cảnh. Từ đúng là 到处; thử thay các phương án khác để nhận ra chỗ không hợp nghĩa.","tag":"Sách · 综合练习"},{"q":"你觉得中文难学吗？我____汉字有点儿难，但是也非常有意思。","opts":["到处","比如","继续","有关","认为"],"ans":4,"ex":"Chọn theo nghĩa và chức năng từ trong ngữ cảnh. Từ đúng là 认为; thử thay các phương án khác để nhận ra chỗ không hợp nghĩa.","tag":"Sách · 综合练习"},{"q":"今天下午的会议跟留学生____吗？","opts":["到处","比如","继续","有关","认为"],"ans":3,"ex":"Chọn theo nghĩa và chức năng từ trong ngữ cảnh. Từ đúng là 有关; thử thay các phương án khác để nhậ const vocab=DB.vocab, readings=DB.readings, grammar=DB.grammar;
const labels={home:'🏠 Tổng quan',vocab:'🀄 Từ vựng',vquiz:'🧩 Quiz từ vựng',grammar:'📒 Ngữ pháp',reading:'📖 Bài khóa',translate:'🌏 Luyện dịch',original:'📝 Bài tập trong sách',practice:'🎯 Luyện mở rộng',mistakes:'🔁 Ôn câu sai'};
const store='hsk3b17_complete_v1';let state;try{state=JSON.parse(localStorage.getItem(store)||'{}')}catch(e){state={}};state={answers:{},results:{},vocAnswers:{},vocResults:{},translation:{},...state};let page='home',ri=0,vm='hv';
function save(){try{localStorage.setItem(store,JSON.stringify(state))}catch(e){}}function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function speak(t){if(!('speechSynthesis' in window)){alert('Trình duyệt chưa hỗ trợ phát âm.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;speechSynthesis.speak(u)}
function setPage(p){page=p;ri=0;render();window.scrollTo(0,0)}function setRi(i){ri=i;render()}function setVM(v){vm=v;render()}
function render(){document.getElementById('nav').innerHTML=Object.entries(labels).map(([k,t])=>`<button class="${page===k?'active':''}" onclick="setPage('${k}')">${t}</button>`).join('');let a=document.getElementById('main');({home:home,vocab:showVocab,vquiz:showVQuiz,grammar:showGrammar,reading:showReading,translate:showTranslate,original:showQuiz,practice:showQuiz,mistakes:showQuiz})[page](a)}
function home(a){let done=Object.keys(state.results).length,good=Object.values(state.results).filter(Boolean).length;a.innerHTML=`<h2>HSK 3 – Bài 17</h2><p class="muted">Nguồn: giáo trình Bài 17, 10 trang, tr. 154–162; phần quiz mở rộng và lời dịch Việt là nội dung biên soạn hỗ trợ.</p><div class="grid"><div class="stat">Từ mới<strong>27</strong></div><div class="stat">Bài khóa<strong>4</strong></div><div class="stat">Đã luyện<strong>${done}/40</strong><span class="small">Đúng ${good}</span></div></div><div class="card"><h2>🧠 Tổng quan · Cấu trúc ngữ pháp</h2>${grammar.map((g,i)=>`<div class="cover"><h3>${i+1}. ${esc(g.name)}</h3><div class="formula">${esc(g.formula)}</div><p>${esc(g.meaning)}</p><div class="hanzi">${esc(g.example)}</div><p>${esc(g.vi)}</p><button class="btn alt" onclick="page='grammar';ri=${i};render()">Học chi tiết →</button></div>`).join('')}</div><div class="card"><h3>7 bước học</h3>Học từ → Quiz → Ngữ pháp → Đọc bài khóa → Luyện dịch → Bài tập → Ôn câu sai.<div class="toolbar"><button class="btn" onclick="setPage('vocab')">Bắt đầu học</button><button class="btn alt" onclick="setPage('original')">Làm bài gốc</button></div></div>`}
function showVocab(a){a.innerHTML=`<h2>🀄 27 từ mới Bài 17</h2><div class="toolbar"><input id="search" placeholder="Tìm chữ Hán, Pinyin, nghĩa Việt" oninput="drawWords(this.value)" style="padding:12px;border:1px solid #dbe1ed;border-radius:10px;max-width:330px;width:100%"><button class="btn" onclick="setPage('vquiz')">Quiz từ vựng →</button></div><div class="vgrid" id="words"></div>`;drawWords('')}
function drawWords(term){document.getElementById('words').innerHTML=vocab.filter(v=>v.join(' ').toLowerCase().includes(term.toLowerCase())).map(v=>`<div class="card"><div class="hanzi"><b>${esc(v[0])}</b></div><div class="py">${esc(v[1])}</div><p>${esc(v[2])}</p><button class="btn alt" onclick="speak('${v[0]}')">🔊 Nghe</button></div>`).join('')}
function optsV(i){let ids=[i,(i+5)%26,(i+11)%26,(i+18)%26];return ids.sort((a,b)=>((a*9+i*3)%31)-((b*9+i*3)%31))}
function showVQuiz(a){a.innerHTML=`<h2>🧩 Quiz từ vựng · 81 lượt</h2><div class="toolbar">${[['hv','Hán → Việt'],['vh','Việt → Hán'],['hp','Hán → Pinyin']].map(([v,t])=>`<button class="pill ${vm===v?'on':''}" onclick="setVM('${v}')">${t}</button>`).join('')}</div>${vocab.map((v,i)=>{let key=vm+i,sel=state.vocAnswers[key],graded=key in state.vocResults;return `<article class="quiz"><span class="badge">Từ ${i+1}/27</span><h3 class="qtitle">${esc(vm==='vh'?v[2]:v[0])}</h3>${optsV(i).map((j,n)=>`<button class="option ${sel===j?'sel':''} ${graded&&j===i?'good':''} ${graded&&sel===j&&j!==i?'bad':''}" onclick="chooseV('${key}',${j})">${'ABCD'[n]}. ${esc(vm==='hv'?vocab[j][2]:vm==='vh'?vocab[j][0]:vocab[j][1])}</button>`).join('')}<button class="btn" onclick="gradeV('${key}',${i})">Chấm đáp án</button> <button class="btn alt" onclick="speak('${v[0]}')">🔊 Nghe</button>${graded?`<div class="feedback ${state.vocResults[key]?'good':'bad'}"><b>${state.vocResults[key]?'✅ Đúng':'❌ Sai'}</b><p><b>Feynman:</b> ${esc(v[0])} – ${esc(v[1])} – ${esc(v[2])}.</p><div class="socrates">Em đặt thử một câu có từ này nhé?</div></div>`:''}</article>`}).join('')}`}
function chooseV(k,j){state.vocAnswers[k]=j;delete state.vocResults[k];save();keep()}function gradeV(k,i){if(!(k in state.vocAnswers)){alert('Hãy chọn đáp án.');return}state.vocResults[k]=state.vocAnswers[k]===i;save();keep()}
function showGrammar(a){let g=grammar[ri%4];a.innerHTML=`<h2>📒 4 chủ điểm ngữ pháp</h2><div class="toolbar">${grammar.map((x,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">${i+1}. ${esc(x.name)}</button>`).join('')}</div><div class="card grammar"><h2>${esc(g.name)}</h2><div class="formula">${esc(g.formula)}</div><h3>Ý nghĩa</h3><p>${esc(g.meaning)}</p><h3>Ví dụ</h3><div class="hanzi">${esc(g.example)}</div><p>${esc(g.vi)}</p><div class="textnote"><b>Feynman:</b> ${esc(g.tip)}</div><div class="socrates"><b>Socrates:</b> ${esc(g.s)}</div></div><button class="btn" onclick="setPage('practice')">Luyện thêm →</button>`}
function tabs(){return `<div class="toolbar">${readings.map((_,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div>`}
function showReading(a){let r=readings[ri%4];a.innerHTML=`<h2>📖 4 bài khóa</h2>${tabs()}<div class="card"><h2>${esc(r.title)}</h2><p class="muted">${esc(r.where)}</p>${r.lines.map(([sp,cn,vi])=>`<div class="readingline"><div class="hanzi"><b>${esc(sp)}：</b>${esc(cn)}</div><button class="btn alt" onclick="speak('${cn}')">🔊 Đọc</button><details><summary>Xem bản dịch tham khảo</summary>${esc(vi)}</details></div>`).join('')}<h3>Câu hỏi đọc hiểu trong sách</h3>${r.questions.map((q,i)=>`<p>${i+1}. ${esc(q)}</p>`).join('')}<button class="btn" onclick="setPage('translate')">Tự luyện dịch →</button></div>`}
function showTranslate(a){let r=readings[ri%4];a.innerHTML=`<h2>🌏 Luyện dịch Trung → Việt</h2><p class="muted">Hãy tự viết bản dịch trước khi xem đáp án mẫu. Bản dịch được lưu trên trình duyệt này.</p>${tabs()}<div class="card"><h3>${esc(r.title)}</h3>${r.lines.map(([sp,cn,vi],i)=>{let key=`${ri}_${i}`;return `<div class="readingline"><div class="hanzi">${esc(sp)}：${esc(cn)}</div><textarea oninput="setTrans('${key}',this.value)" placeholder="Tự viết bản dịch…">${esc(state.translation[key]||'')}</textarea><details><summary>🔎 Xem bản dịch mẫu</summary><div class="feedback good">${esc(vi)}</div><p class="small">Hãy đối chiếu chủ ngữ, động từ chính và sắc thái nghĩa.</p></details></div>`}).join('')}<button class="btn alt" onclick="exportTrans()">Xuất bản dịch TXT</button></div>`}
function setTrans(key,v){state.translation[key]=v;save()}
function exportTrans(){let r=readings[ri%4],s=r.title+'\n\n'+r.lines.map(([sp,cn],i)=>sp+'：'+cn+'\n'+(state.translation[`${ri}_${i}`]||'')).join('\n\n'),a=document.createElement('a'),u=URL.createObjectURL(new Blob([s],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='HSK3_Bai13_DichBai'+(ri+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const all=[...DB.book.map((q,i)=>({...q,id:'b'+i})),...DB.extra.map((q,i)=>({...q,id:'e'+i}))];
function showQuiz(a){let list=page==='original'?all.slice(0,10):page==='practice'?all.slice(10):all.filter(q=>state.results[q.id]===false);let total=list.filter(q=>q.id in state.results).length,correct=list.filter(q=>state.results[q.id]===true).length;a.innerHTML=`<h2>${page==='original'?'📝 10 câu theo sách':page==='practice'?'🎯 30 câu luyện mở rộng':'🔁 Ôn câu sai'}</h2><p class="muted">${page==='original'?'Trích từ mục 综合练习 trang 161 của giáo trình.':'Quiz mở rộng được biên soạn từ từ vựng và ngữ pháp bài học.'}</p><div class="quizstats">Đã làm ${total}/${list.length} · Đúng ${correct}</div>${list.length?list.map((q,i)=>{let sel=state.answers[q.id],graded=q.id in state.results;return `<article class="quiz"><span class="badge">Câu ${i+1} · ${esc(q.tag)}</span><h3 class="qtitle">${esc(q.q)}</h3>${q.opts.map((s,j)=>`<button class="option ${sel===j?'sel':''} ${graded&&j===q.ans?'good':''} ${graded&&sel===j&&j!==q.ans?'bad':''}" onclick="chooseQ('${q.id}',${j})">${'ABCDE'[j]}. ${esc(s)}</button>`).join('')}<button class="btn" onclick="gradeQ('${q.id}')">Kiểm tra đáp án</button>${graded?`<div class="feedback ${state.results[q.id]?'good':'bad'}"><b>${state.results[q.id]?'✅ Đúng':'❌ Sai'} · Đáp án: ${esc(q.opts[q.ans])}</b><p><b>Feynman:</b> ${esc(q.ex)}</p><div class="socrates"><b>Socrates:</b> Trong câu có dấu hiệu nào dẫn em đến đáp án đó?</div></div>`:''}</article>`}).join(''):'<div class="card">Bạn chưa có câu sai nào.</div>'}`}
function chooseQ(k,j){state.answers[k]=j;delete state.results[k];save();keep()}function gradeQ(k){if(!(k in state.answers)){alert('Chọn đáp án trước nhé.');return}let q=all.find(q=>q.id===k);state.results[k]=state.answers[k]===q.ans;save();keep()}
function keep(){let y=window.scrollY;render();requestAnimationFrame(()=>scrollTo(0,y))}render();
</script></body></html>
