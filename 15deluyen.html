<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>15 Đề luyện tập Tiếng Anh 5</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#15243a;--muted:#6d7a90;--accent:#3157d5;--accent2:#06a77d;--bad:#d04444;--line:#dce4f1;--warn:#f0a21b}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#203f9f,#6b18df);color:#fff;padding:14px 22px;box-shadow:0 5px 18px #1b3f8f33}
.hrow{display:flex;gap:14px;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:21px}.sub{opacity:.88;font-size:12px}
main{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 66px)}
aside{background:#fff;border-right:1px solid var(--line);padding:14px;position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto}
.content{padding:20px;max-width:1120px;width:100%;margin:auto}
.navbtn{width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px;color:var(--ink);cursor:pointer;margin:2px 0;font-size:14px}
.navbtn:hover,.navbtn.active{background:#eef3ff;color:var(--accent);font-weight:800}
.sectionTitle{font-size:12px;color:var(--muted);font-weight:900;letter-spacing:.08em;margin:15px 8px 6px;text-transform:uppercase}
.hero{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:16px;box-shadow:0 7px 20px #27477a0d}
.hero h1{margin:0 0 6px;font-size:25px}.hero p{margin:4px 0;color:var(--muted)}
.gridstats{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin-top:14px}
.stat{background:#f8faff;border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{font-size:20px;display:block}.stat span{font-size:12px;color:var(--muted)}
.testGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.testTile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 15px #27477a0b}
.testTile h3{margin:0 0 6px;color:#244ab8}.testTile p{font-size:13px;color:var(--muted)}
.exercise{margin:18px 0}.exercise h2{font-size:19px;margin:0 0 10px;padding:10px 12px;background:#eef5ff;border-left:5px solid var(--accent);border-radius:10px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin:10px 0;box-shadow:0 4px 16px #28466e0a}
.qtop{display:flex;gap:10px;align-items:flex-start}.qnum{min-width:34px;height:34px;border-radius:10px;background:#eef3ff;color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800}
.qtext{line-height:1.55;white-space:pre-wrap;flex:1;font-size:15px}.answerRow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ans{flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer;background:var(--accent);color:white}
.btn.secondary{background:#eef3ff;color:var(--accent)}.btn.good{background:var(--accent2)}.btn.ghost{background:#f2f4f8;color:#43506a}
.feedback{margin-top:8px;font-size:13px;padding:9px 11px;border-radius:10px;display:none}
.feedback.ok{display:block;background:#e9fbf5;color:#08785b}.feedback.bad{display:block;background:#fff0f0;color:#a22828}.feedback.warn{display:block;background:#fff7e7;color:#96600a}
.key{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;white-space:pre-wrap}
.mcopts{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr));gap:8px;margin-top:11px}
.opt{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 11px;text-align:left;cursor:pointer;line-height:1.35}
.opt:hover{border-color:#9db1ed}.opt.sel{border-color:var(--accent);background:#eef3ff}
.progress{height:8px;background:#e9eef7;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:var(--accent2);width:0}
.note{font-size:12px;color:var(--muted)}.wrongtag{color:var(--bad);font-weight:700;font-size:12px}
.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eef3ff;color:var(--accent);font-size:11px;font-weight:700;margin-right:6px}
@media(max-width:900px){.testGrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){
main{grid-template-columns:1fr}
aside{
  position:static;
  height:auto;
  border-right:0;
  border-bottom:1px solid var(--line);
  display:block;
  overflow:visible;
  padding:10px 12px
}
.sectionTitle{display:block}
.navbtn{
  display:block;
  width:100%;
  min-width:0;
  margin:3px 0
}
.content{padding:12px}
.gridstats{grid-template-columns:repeat(2,1fr)}
.mcopts,.testGrid{grid-template-columns:1fr}
}

.feynman{
  margin-top:10px;padding:12px 14px;border-radius:13px;
  background:linear-gradient(180deg,#fff8dc,#fffdf3);
  border:1px solid #ead58b;color:#5d4705
}
.feynman b{color:#724f00}
.feynman .step{margin:6px 0}
.topicBadge{
  display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;
  background:#eef3ff;color:#3157d5;font-size:11px;font-weight:800;margin-top:8px
}
.weakPanel{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;
  box-shadow:0 7px 20px #27477a0d;margin-bottom:15px
}
.weakBars{display:grid;gap:9px;margin-top:12px}
.weakRow{display:grid;grid-template-columns:185px 1fr 42px;gap:8px;align-items:center;font-size:13px}
.weakTrack{height:9px;background:#e8edf6;border-radius:999px;overflow:hidden}
.weakTrack>div{height:100%;background:linear-gradient(90deg,#3157d5,#06a77d)}
.practiceCard{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 7px 20px #27477a0d}
.practiceTitle{font-size:13px;color:var(--muted);font-weight:800;margin-bottom:7px}
.practiceQ{font-size:20px;line-height:1.5;font-weight:700;margin:8px 0}

</style>

const TOPIC_NAMES={
  present_simple:"Hiện tại đơn",
  present_continuous:"Hiện tại tiếp diễn",
  past_simple:"Quá khứ đơn",
  future:"Tương lai / Be going to",
  question_words:"Từ để hỏi",
  modals:"Can / Could / Should / Must",
  articles_pronouns:"Mạo từ / đại từ / sở hữu",
  prepositions:"Giới từ & cụm cố định",
  adj_adverb:"Tính từ / trạng từ",
  conjunctions:"AND / BUT / OR / SO",
  vocabulary:"Từ vựng theo chủ đề",
  sentence_structure:"Trật tự / cấu trúc câu",
  pronunciation:"Phát âm",
  reading:"Đọc hiểu",
  other:"Tổng hợp"
};

function topicName(t){return TOPIC_NAMES[t]||"Tổng hợp";}

function detectTopic(raw,key){
  const s=norm(raw);
  const sec=(key||"").split("-")[2]||"";
  if(sec==="I") return "vocabulary";
  if(sec==="II") return "pronunciation";
  if(sec==="VI"||sec==="VII") return "reading";
  if(sec==="VIII"||sec==="IX") return "sentence_structure";

  if(/how often|how much|how many|how far|how old|how long|whose|where|when|why|who|which|what time/.test(s))
    return "question_words";
  if(/did |yesterday|last week|last weekend|ago|were | was /.test(" "+s+" "))
    return "past_simple";
  if(/going to|will |tomorrow|next week|next summer|this summer/.test(s))
    return "future";
  if(/at the moment|right now| now |is .*ing|are .*ing|am .*ing/.test(" "+s+" "))
    return "present_continuous";
  if(/should|must|could|can |can't|cannot|mustn't|shouldn't/.test(s))
    return "modals";
  if(/do you|does |don't|doesn't|every day|usually|always|often|never|sometimes/.test(s))
    return "present_simple";
  if(/ a | an | the |whose|your |yours|my |mine|our |ours|their |theirs/.test(" "+s+" "))
    return "articles_pronouns";
  if(/ in | on | at | from | to | by | under | above | between | next to /.test(" "+s+" "))
    return "prepositions";
  if(/careful|carefully|good|well|hardly|hard |extreme|extremely|adjective|adverb/.test(s))
    return "adj_adverb";
  if(/ and | but | or | so /.test(" "+s+" "))
    return "conjunctions";
  return "vocabulary";
}

function findItemByKey(key){
  const m=/^T-(\d+)-([IVX]+)-(\d+)$/.exec(key||"");
  if(!m)return null;
  const t=DATA.bank.tests.find(x=>String(x.test)===m[1]);
  if(!t||!t.sections[m[2]])return null;
  return t.sections[m[2]].items.find(x=>String(x.n)===m[3])||null;
}

function rebuildWeakTopics(){
  Object.keys(state.wrong||{}).forEach(k=>{
    if(!state.wrongTopic[k]){
      const it=findItemByKey(k);
      if(it) state.wrongTopic[k]=detectTopic(it.q,k);
    }
  });
  const c={};
  Object.values(state.wrongTopic).forEach(t=>c[t]=(c[t]||0)+1);
  state.topicStats=c;
}
rebuildWeakTopics();

function registerWrongTopic(key,raw){
  const t=detectTopic(raw,key);
  state.wrongTopic[key]=t;
  rebuildWeakTopics();
  return t;
}
function clearWrongTopic(key){
  delete state.wrongTopic[key];
  rebuildWeakTopics();
}

function answerTextFromCard(card,ans){
  if(!ans)return "";
  if(/^[A-D]$/i.test(ans)){
    const o=card.querySelector(`.opt[data-letter="${ans.toUpperCase()}"]`);
    return o ? `${ans.toUpperCase()}. ${o.textContent.replace(/^\s*[A-D]\.\s*/,'').trim()}` : ans;
  }
  return ans;
}

function norm(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[^a-z0-9']/g,' ').replace(/\s+/g,' ').trim()}
function expectedVariants(ans){if(!ans)return[];let a=String(ans).trim();let vs=[a];if(/^([A-D])$/i.test(a))vs.push(a.toUpperCase());a.split(/\bor\b|\/|→|->/i).forEach(x=>{if(x.trim())vs.push(x.trim())});return[...new Set(vs.map(norm).filter(Boolean))]}
function isCorrect(user,ans){const u=norm(user);if(!u||!ans)return false;return expectedVariants(ans).some(v=>u===v)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

function cleanOCR(s){
  return String(s||'')
    .replace(/[§|©@]+/g,' ')
    .replace(/\s+[=<>]{1,}\s*/g,' ')
    .replace(/\s+/g,' ')
    .replace(/^\s*[\.\-_:;]+\s*/,'')
    .trim();
}
function optionMarkers(q){
  const r=/(?<![A-Za-z])([A-D])[\.,]\s*/g, out=[]; let m;
  while((m=r.exec(q))!==null) out.push({letter:m[1],start:m.index,end:r.lastIndex});
  return out;
}
function extractOptions(q){
  const ms=optionMarkers(q);
  if(ms.length<3)return null;
  const first4=ms.slice(0,4);
  return first4.map((m,i)=>{
    const end=(i<3?first4[i+1].start:q.length);
    let val=q.slice(m.end,end);
    if(i===3 && ms.length>4) val=q.slice(m.end,ms[4].start);
    val=cleanOCR(val).replace(/\s+[a-zA-Z]?\d*[\)\]\}]*\s*$/,'').trim();
    return [m.letter,val];
  });
}
function extractStem(q){
  const opts=extractOptions(q);
  if(!opts)return cleanOCR(q);
  const ms=optionMarkers(q);
  let stem=cleanOCR(q.slice(0,ms[0].start));
  if(!stem)return 'Chọn đáp án đúng.';
  return stem.replace(/\s*\d+\s*$/,'').trim();
}
function cleanHeading(h){
  return cleanOCR(h)
    .replace(/^[^A-Za-z]*(I{1,3}|IV|V|VI|VII|VIII|IX)[\.,]?\s*/i,'')
    .replace(/\s+/g,' ')
    .trim();
}

function wire(){
  document.querySelectorAll('.qcard').forEach(card=>{
    const key=card.dataset.key, ans=card.dataset.answer, inp=card.querySelector('.ans'), fb=card.querySelector('.feedback');
    const topic=card.dataset.topic||"other", stem=card.dataset.stem||"";
    card.querySelectorAll('.opt').forEach(o=>{
      o.onclick=()=>{
        card.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
        o.classList.add('sel');
        inp.value=o.dataset.letter;
        state.answers[key]=inp.value;
        save();

      o.addEventListener('keydown',e=>{
        if(e.key==='Enter'){
          e.preventDefault();
          // Nếu chưa được chọn bằng chuột, Enter cũng chọn luôn đáp án đang focus.
          if(!o.classList.contains('sel')){
            card.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
            o.classList.add('sel');
            inp.value=o.dataset.letter;
            state.answers[key]=inp.value;
          }
          check();
        }
      });
    });
    function check(){
      const u=(inp.value||'').trim();
      state.answers[key]=u;
      if(!u){fb.className='feedback warn';fb.innerHTML='Hãy chọn hoặc nhập đáp án trước.';save();return}
      if(!ans){
        fb.className='feedback warn';
        fb.innerHTML='Đã lưu câu trả lời. Phần này chưa chấm tự động để tránh dùng đáp án OCR bị lệch.';
        state.done[key]=true;save();return;
      }
      const ok=isCorrect(u,ans);state.done[key]=true;
      if(ok){
        delete state.wrong[key];
        clearWrongTopic(key);
        fb.className='feedback ok';
        fb.innerHTML='✓ Chính xác. Em đã sửa được lỗi này.';
      }else{
        state.wrong[key]=true;
        registerWrongTopic(key,stem);
        const correctText=answerTextFromCard(card,ans);
        fb.className='feedback bad';
        fb.innerHTML='✗ Chưa đúng.' + feynmanExplain(topic,stem,correctText);
      }
      save();
    }
    card.querySelector('.check').onclick=check;
    if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});
    // Với câu trắc nghiệm, sau khi đã chọn A/B/C/D, có thể bấm Enter ở bất kỳ nút đáp án nào để check.

    const show=card.querySelector('.show');
    if(show)show.onclick=()=>{fb.className='feedback warn';fb.innerHTML=`Đáp án: <span class="key">${esc(ans)}</span>`};
    card.querySelector('.mark').onclick=()=>{
      state.wrong[key]=!state.wrong[key];
      if(state.wrong[key]) registerWrongTopic(key,stem); else clearWrongTopic(key);
      save();
      card.querySelector('.mark').textContent=state.wrong[key]?'✓ Đã thêm sổ sai':'Đánh dấu ôn lại';
    };
  });
}

function renderTest(id){
  const t=DATA.bank.tests.find(x=>x.test==id);
  currentPrefix='T-'+id+'-';
  let total=0,ansn=0;
  Object.values(t.sections).forEach(s=>s.items.forEach(i=>{total++;if(i.answer)ansn++}));
  let h=hero(`Đề tham khảo số ${id}`,'Các phần được trình bày theo đúng thứ tự I → IX. Trắc nghiệm đã tách câu hỏi và đáp án ra riêng.',total,ansn);
  ['I','II','III','IV','V','VI','VII','VIII','IX'].forEach(sec=>{
    if(!t.sections[sec])return;
    const s=t.sections[sec];
    h+=`<div class="exercise"><h2>${sec}. ${esc(cleanHeading(s.heading||''))}</h2>`;
    if(!s.items.length)h+='<div class="hero note">Phần này trong bản trích xuất cũ chưa tách được câu riêng.</div>';
    s.items.sort((a,b)=>Number(a.n)-Number(b.n)).forEach(it=>h+=qcard(it,`T-${id}-${sec}-${it.n}`));
    h+='</div>';
  });
  document.getElementById('app').innerHTML=h;wire();
}

function renderHome(){
  currentPrefix='';
  let total=0,auto=0;
  DATA.bank.tests.forEach(t=>Object.values(t.sections).forEach(s=>s.items.forEach(i=>{total++;if(i.answer)auto++})));
  document.getElementById('app').innerHTML=`
  <div class="hero">
    <h1>15 đề luyện tập Tiếng Anh lớp 5</h1>
    <p>Danh mục Đề 1 → Đề 15 xếp <b>theo hàng dọc</b>. Sai câu nào, app giải thích lại thật đơn giản theo kiểu Feynman và tự gom chủ đề yếu để tạo bài luyện bổ trợ. Chọn/nhập đáp án rồi nhấn <b>Enter</b>.</p>
    <div class="gridstats">
      <div class="stat"><b>15</b><span>Đề luyện tập</span></div>
      <div class="stat"><b>${total}</b><span>Câu đã tách</span></div>
      <div class="stat"><b>${auto}</b><span>Câu check tự động chắc chắn</span></div>
      <div class="stat"><b>${Object.keys(state.wrong).length}</b><span>Câu cần ôn</span></div>
    </div>
  </div>
  <div class="testGrid">
    ${DATA.bank.tests.map(t=>`<div class="testTile"><h3>Đề ${t.test}</h3><p>Luyện từng phần I–IX, lưu tiến độ và câu sai.</p><button class="btn" onclick="route('test','${t.test}')">Bắt đầu đề ${t.test}</button></div>`).join('')}
  </div>`;
}

function renderWrong(){
  currentPrefix='';
  const cards=[];
  DATA.bank.tests.forEach(t=>Object.entries(t.sections).forEach(([sec,s])=>s.items.forEach(it=>{
    const k=`T-${t.test}-${sec}-${it.n}`;
    if(state.wrong[k])cards.push(`<div class="note" style="margin:14px 0 3px"><b>Đề ${t.test} · Phần ${sec}</b></div>`+qcard(it,k));
  })));
  document.getElementById('app').innerHTML=`<div class="hero"><h1>Sổ câu sai</h1><p>Chỉ luyện lại những câu đã làm sai hoặc tự đánh dấu.</p></div>${cards.length?cards.join(''):'<div class="hero">Chưa có câu sai.</div>'}`;
  wire();
}


let weakPracticeList=[], weakPracticeIndex=0, weakPracticeSelected="", weakPracticeChecked=false;

function weakTopicSummary(){
  rebuildWeakTopics();
  const entries=Object.entries(state.topicStats||{}).sort((a,b)=>b[1]-a[1]);
  if(!entries.length) return '<div class="note">Chưa có lỗi sai. Hãy làm một đề trước để app xác định phần cần luyện.</div>';
  const max=Math.max(...entries.map(x=>x[1]),1);
  return `<div class="weakBars">${entries.map(([t,n])=>`
    <div class="weakRow">
      <b>${topicName(t)}</b>
      <div class="weakTrack"><div style="width:${Math.round(n/max*100)}%"></div></div>
      <span>${n} lỗi</span>
    </div>`).join('')}</div>`;
}

function buildWeakPractice(){
  rebuildWeakTopics();
  let topics=Object.entries(state.topicStats||{}).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  if(!topics.length) topics=["present_simple","past_simple","question_words"];
  let pool=PRACTICE_BANK.filter(q=>topics.slice(0,4).includes(q.topic));

  // Nếu chủ đề lỗi thuộc nhóm không có bank chuyên biệt, đưa về nhóm gần nhất.
  if(pool.length<10){
    pool=[...pool,...PRACTICE_BANK.filter(q=>["present_simple","past_simple","question_words","prepositions","vocabulary"].includes(q.topic))];
  }

  // Trộn ổn định tương đối bằng sort random ở thời điểm bấm tạo.
  weakPracticeList=pool.sort(()=>Math.random()-.5).slice(0,20);
  weakPracticeIndex=0;
  weakPracticeSelected="";
  weakPracticeChecked=false;
}

function renderWeakPractice(){
  currentPrefix='';
  rebuildWeakTopics();
  if(!weakPracticeList.length) buildWeakPractice();

  let h=`<div class="weakPanel">
    <h1 style="margin:0 0 5px">🎯 Luyện lại phần bị sai</h1>
    <p class="note">App gom lỗi theo chủ đề và tạo tối đa 20 câu luyện đúng phần em đang yếu.</p>
    ${weakTopicSummary()}
    <div style="margin-top:14px"><button class="btn" onclick="buildWeakPractice();renderWeakPractice()">Tạo lại bộ 20 câu</button></div>
  </div>`;

  if(!weakPracticeList.length){
    h+='<div class="hero">Chưa có câu phù hợp để luyện.</div>';
    document.getElementById('app').innerHTML=h;
    return;
  }

  const q=weakPracticeList[weakPracticeIndex];
  h+=`<div class="practiceCard" id="practiceCard">
    <div class="practiceTitle">${topicName(q.topic)} · Câu ${weakPracticeIndex+1}/${weakPracticeList.length}</div>
    <div class="progress"><div style="width:${Math.round((weakPracticeIndex)/weakPracticeList.length*100)}%"></div></div>
    <div class="practiceQ">${esc(q.q)}</div>
    <div class="mcopts">
      ${q.options.map((o,i)=>{
        const l=String.fromCharCode(65+i);
        return `<button class="opt ${weakPracticeSelected===l?'sel':''}" data-p="${l}"><b>${l}.</b> ${esc(o)}</button>`;
      }).join('')}
    </div>
    <div class="answerRow">
      <button class="btn" id="practiceCheck">Kiểm tra bằng Enter</button>
      <button class="btn secondary" id="practiceNext">Câu tiếp →</button>
    </div>
    <div class="feedback" id="practiceFb"></div>
    <div class="note" style="margin-top:8px">Chọn A/B/C/D rồi nhấn <b>Enter</b>. Sau khi check, nhấn Enter lần nữa để sang câu tiếp.</div>
  </div>`;

  document.getElementById('app').innerHTML=h;

  const card=document.getElementById('practiceCard');
  const fb=document.getElementById('practiceFb');

  card.querySelectorAll('.opt').forEach(o=>{
    o.onclick=()=>{
      card.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
      o.classList.add('sel');
      weakPracticeSelected=o.dataset.p;
      weakPracticeChecked=false;
    };
  });

  function checkPractice(){
    if(!weakPracticeSelected){
      fb.className='feedback warn';
      fb.innerHTML='Hãy chọn một đáp án trước.';
      return;
    }
    const ok=weakPracticeSelected===q.answer;
    weakPracticeChecked=true;
    if(ok){
      fb.className='feedback ok';
      fb.innerHTML=`✓ Đúng! <div class="feynman"><b>🧠 Nói lại thật đơn giản</b><div class="step">${esc(q.why)}</div><div class="step"><b>Tự kiểm tra:</b> Em hãy tự tạo một câu mới dùng đúng quy tắc này.</div></div>`;
    }else{
      const ansText=`${q.answer}. ${q.options[q.answer.charCodeAt(0)-65]}`;
      fb.className='feedback bad';
      fb.innerHTML='✗ Chưa đúng.'+feynmanExplain(q.topic,q.q,ansText);
    }
  }

  function nextPractice(){
    weakPracticeIndex=(weakPracticeIndex+1)%weakPracticeList.length;
    weakPracticeSelected="";
    weakPracticeChecked=false;
    renderWeakPractice();
  }

  document.getElementById('practiceCheck').onclick=checkPractice;
  document.getElementById('practiceNext').onclick=nextPractice;

  document.addEventListener('keydown',function weakEnter(e){
    if(document.getElementById('practiceCard')!==card){
      document.removeEventListener('keydown',weakEnter); return;
    }
    if(e.key==='Enter'){
      e.preventDefault();
      weakPracticeChecked ? nextPractice() : checkPractice();
    }
  });
}

function route(v,id){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===v&&(!id||b.dataset.id===String(id))));
  if(v==='home')renderHome();
  else if(v==='wrong')renderWrong();
  else if(v==='weakpractice')renderWeakPractice();
  else if(v==='test')renderTest(id);
}

sidebar();updateGlobal();route('home');
</script>
