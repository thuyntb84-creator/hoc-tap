s:15px;border:2px dashed #dccde7;padding:20px;background:linear-gradient(120deg,#fff9fc,#fffef5)}.grammar h3{margin:0 0 10px}.readingline{border-bottom:1px dashed #d7dfed;padding:12px 0;line-height:1.7}.readingline .hanzi{font-size:21px}.quiz{border:1px solid var(--line);padding:18px;border-radius:14px;background:white;margin-bottom:13px}.option{display:block;width:100%;padding:12px;text-align:left;background:#fbfcff;border:1px solid #dce3ed;border-radius:11px;margin:7px 0;color:var(--ink)}.option.sel{border:2px solid #4267ef;padding:11px;background:#edf2ff}.option.good{border-color:#24a17d;background:#e8f8ee}.option.bad{border-color:var(--red);background:#fff0f2}.feedback{background:#f2f5fb;border-radius:12px;padding:14px;margin:10px 0;line-height:1.8}.feedback.good{background:#e7f8f0}.feedback.bad{background:#fff0f2}.socrates{border-left:4px solid #daa34f;background:#fffaeb;padding:12px;margin-top:9px;border-radius:9px}textarea{width:100%;min-height:100px;padding:14px;border:1px solid #ccd5e5;border-radius:11px;line-height:1.7;resize:vertical}details{margin:12px 0}summary{color:#315ac4;cursor:pointer;font-weight:bold}.progress{height:9px;border-radius:10px;background:#e4eaf5;overflow:hidden}.progress>i{display:block;background:var(--blue);height:100%}.small{font-size:13px;color:#748198}.textnote{background:#fff9e5;padding:14px;border-radius:11px}.quizstats{padding:15px;border-radius:12px;background:#edf3ff;margin:14px 0}h2{margin:0 0 13px}h3{line-height:1.5}.empty{padding:24px;text-align:center}.voice{font-size:13px}.badge{background:#ffe4ed;color:#aa4669;border-radius:7px;padding:4px 9px;display:inline-block;font-size:12px;font-weight:bold}.qtitle{font-size:19px;line-height:1.7}.cover{background:linear-gradient(130deg,#fef1ef,#f2f2ff);border:2px dashed #e8c8cf;border-radius:16px;padding:18px;margin:12px 0}.cover .formula{margin-top:10px}.tabs{display:flex;flex-wrap:wrap;gap:8px}.alert{background:#fff9e7;border-radius:12px;padding:13px} @media(max-width:800px){.wr </style></head><body><header><span class="badge">新HSK教程 3 · LESSON 18</span><h1>我学会了包饺子</h1><div>Tôi đã học được cách gói sủi cảo · Học hiểu → luyện tập → tự chữa lỗi</div></header><div class="wrap"><nav id="nav"></nav><main id="main"></main></div><script>const DB={"vocab":[["怎样","zěnyàng","như thế nào"],["过节","guòjié","đón lễ hội"],["节","jié","ngày lễ; tiết"],["节日","jiérì","ngày lễ"],["联欢","liánhuān","liên hoan"],["大概","dàgài","khoảng; đại khái"],["春节","Chūnjié","Tết Nguyên đán"],["阿姨","āyí","cô, dì"],["叔叔","shūshu","chú"],["收","shōu","nhận"],["总","zǒng","luôn; thường"],["起","qǐ","bắt đầu; dậy"],["见面","jiànmiàn","gặp mặt"],["矿泉水","kuàngquánshuǐ","nước khoáng"],["出发","chūfā","xuất phát"],["不久","bùjiǔ","không lâu"],["发生","fāshēng","xảy ra"],["刚","gāng","vừa mới"],["只要","zhǐyào","chỉ cần"],["学期","xuéqī","học kỳ"],["毕业","bìyè","tốt nghiệp"],["出生","chūshēng","chào đời"],["过去","guòqù","quá khứ"],["懂得","dǒngde","hiểu; biết"],["坚持","jiānchí","kiên trì"],["完成","wánchéng","hoàn thành"],["目标","mùbiāo","mục tiêu"],["发展","fāzhǎn","phát triển"]],"grammar":[{"name":"Số lượng ước chừng 概数表达法","formula":"七八个人 / 两三个朋友 / 三四年","meaning":"Ghép hai số gần nhau để diễn tả khoảng chừng; không phải con số chính xác.","example":"春节大概来七八个人。","vi":"Tết có khoảng bảy tám người đến.","tip":"七八 không phải phép cộng: đây là khoảng 7–8.","s":"Nếu là con số chính xác thì có còn dùng 七八 được không?"},{"name":"Phân biệt 刚才 và 刚刚","formula":"刚才 + sự việc ; 主语 + 刚(刚) + động từ","meaning":"刚才 chỉ thời điểm vừa rồi; 刚/刚刚 nhấn mạnh hành động mới xảy ra. 刚才 thường làm trạng ngữ thời gian.","example":"我刚才见到李文了。/ 他刚出发。","vi":"Vừa nãy tôi đã gặp Lý Văn. / Anh ấy vừa xuất phát.","tip":"刚才 là “lúc nãy”; 刚(刚) là “vừa mới làm”. Không thay thế tùy tiện trong mọi câu.","s":"Trong câu 我___到家, em cần nói thời điểm hay hành động vừa hoàn tất?"},{"name":"Câu điều kiện 只要……就……","formula":"只要 + điều kiện，(chủ ngữ) + 就 + kết quả","meaning":"Chỉ cần điều kiện đủ xảy ra thì kết quả sẽ xuất hiện.","example":"只要努力学习，就一定能进步。","vi":"Chỉ cần chăm chỉ học, nhất định sẽ tiến bộ.","tip":"Khác 只有……才…… (điều kiện cần); 只要……就…… là điều kiện đủ.","s":"Một điều kiện đủ có nhất thiết là điều kiện duy nhất không?"},{"name":"Cấu trúc 从……起","formula":"从 + mốc thời gian / sự kiện + 起，……","meaning":"Tính bắt đầu từ một thời điểm hoặc sự kiện trở đi.","example":"从搬到北京起，我每天都锻炼。","vi":"Từ khi chuyển đến Bắc Kinh, ngày nào tôi cũng tập thể dục.","tip":"起 đánh dấu điểm bắt đầu, không phải điểm kết thúc.","s":"Tại sao 从搬到北京起 nhấn mạnh mốc bắt đầu chứ không phải thời lượng?"}],"readings":[{"title":"Bài khóa 1 – Đón Tết Nguyên đán","where":"Trên máy bay – 白家月 và 李文","lines":[["白家月","我要在中国过年，真开心。","Tôi sẽ đón Tết ở Trung Quốc, vui quá."],["李文","第一次请外国朋友来家里过春节，我也很高兴。","Lần đầu mời bạn nước ngoài đến nhà đón Tết, tôi cũng rất vui."],["白家月","你们怎样过节？","Các bạn đón lễ thế nào?"],["李文","春节是中国最重要的节日，我们一般会回家，跟家人一起过。","Tết là ngày lễ quan trọng nhất Trung Quốc, chúng tôi thường về nhà đón cùng gia đình."],["白家月","那你跟家人会一起做什么？","Vậy cậu sẽ làm gì cùng gia đình?"],["李文","我们家会一边包饺子，一边看春节联欢晚会，直到十二点以后才睡觉。","Gia đình chúng tôi vừa gói sủi cảo vừa xem chương trình liên hoan Tết, mãi sau 12 giờ mới ngủ."],["白家月","听起来很有意思。春节一般几天假？","Nghe thật thú vị. Tết thường nghỉ mấy ngày?"],["李文","大概七八天。","Khoảng bảy tám ngày."]],"questions":["李文为什么很高兴？","李文和家人春节的时候会做什么？","春节大概放几天假？"]},{"title":"Bài khóa 2 – Chúc Tết gia đình","where":"Nhà Lý Văn – 白家月 và bố mẹ 李文","lines":[["白家月","张阿姨，李叔叔，过年好！这是我准备的礼物，请收下。","Cô Trương, chú Lý, chúc mừng năm mới! Đây là món quà cháu chuẩn bị, xin nhận ạ."],["李文妈妈","谢谢家月，你太客气了！","Cảm ơn Gia Nguyệt, cháu khách sáo quá!"],["白家月","我听小文说您总有机会见面。","Cháu nghe Tiểu Văn kể rằng mọi người thường có dịp gặp mặt."],["李文妈妈","春节让我们和家人一起过。","Tết là dịp để chúng ta ở bên gia đình."],["白家月","您先坐着看会儿电视，我去准备。","Cô cứ ngồi xem TV một lúc, cháu đi chuẩn bị."],["李文妈妈","我刚刚看视频学会了包饺子，我跟你们一起包吧。","Cô vừa xem video học được cách gói sủi cảo, cô cùng gói với các cháu nhé."]],"questions":["白家月送了什么礼物？","李文的家人为什么过春节？","他们打算一起做什么？"]},{"title":"Bài khóa 3 – Ảnh cũ và du học","where":"Nhà Lý Văn – 白家月, 张阿姨","lines":[["白家月","这张照片是李文出国前照的吗？","Bức ảnh này chụp trước khi Lý Văn ra nước ngoài phải không?"],["张阿姨","对，这是他从北京出发时，我们全家在机场照的。","Đúng, đây là ảnh cả nhà chụp ở sân bay khi cháu ấy khởi hành từ Bắc Kinh."],["白家月","那是三四年前吧？","Đó là khoảng ba bốn năm trước nhỉ?"],["张阿姨","是啊，时间过得真快，好像是不久前发生的一样。","Đúng thế, thời gian trôi nhanh thật, cứ như mới xảy ra cách đây không lâu."],["白家月","您一定特别想李文吧？","Cô hẳn là nhớ Lý Văn lắm nhỉ?"],["张阿姨","他刚离开家时，我很不习惯，只要几天不跟他视频，就很想他。","Khi nó mới rời nhà, cô rất không quen; chỉ cần mấy ngày không gọi video là rất nhớ."],["白家月","还有最后一个学期就要毕业了，他很快就会回来了。","Chỉ còn một học kỳ nữa là tốt nghiệp, anh ấy sẽ sớm về thôi."]],"questions":["李文第一次出国留学，是从哪儿出发的？","李文全家的照片是什么时候照的？","李文刚离开家的时候，张阿姨怎么样？"]},{"title":"Bài khóa 4 – Tự đặt mục tiêu","where":"Ở nhà – nhật ký 白家月","lines":[["旁白","这次来中国，我最高兴的是认识了李文的父母。","Chuyến đi Trung Quốc này, điều tôi vui nhất là được gặp bố mẹ Lý Văn."],["旁白","他们给我看了李文出生时的照片，还给我讲了很多他过去的故事。","Họ cho tôi xem ảnh lúc Lý Văn chào đời và kể nhiều chuyện trước đây của anh ấy."],["旁白","近几年来，他们一直很关心他的成长。","Những năm gần đây, họ luôn quan tâm đến sự trưởng thành của anh ấy."],["旁白","从小懂得坚持自己的目标，才能完成自己的梦想。","Hiểu được việc kiên trì theo đuổi mục tiêu từ nhỏ mới có thể hoàn thành ước mơ."],["旁白","我觉得，发展自己的能力很重要。","Tôi thấy việc phát triển năng lực bản thân rất quan trọng."]],"questions":["李文的父母给白家月看什么了？","白家月从李文父母那里了解到什么？","李文为什么能够得到出国留学的机会？"]}],"book":[{"q":"我____来中国几个月，还没在中国过过春节。","opts":["刚","总","起","收","见面"],"ans":0,"ex":"Điền đúng theo ngữ cảnh và cách kết hợp từ trong câu gốc.","tag":"Sách · 170–171"},{"q":"这是我给您和叔叔准备的小礼物，请您____下。","opts":["刚","总","起","收","见面"],"ans":3,"ex":"Điền đúng theo ngữ cảnh và cách kết hợp từ trong câu gốc.","tag":"Sách · 170–171"},{"q":"过年的时候，小孩子____会收到大人给的红包。","opts":["刚","总","起","收","见面"],"ans":1,"ex":"Điền đúng theo ngữ cảnh và cách kết hợp từ trong câu gốc.","tag":"Sách · 170–171"},{"q":"从上个月____，妈妈就开始为春节做准备了。","opts":["刚","总","起","收","见面"],"ans":2,"ex":"Điền đúng theo ngữ cảnh và cách kết hợp từ trong câu gốc.","tag":"Sách · 170–171"},{"q":"春节的时候只要有时间，就一定要跟小时候的朋友们____。","opts":["刚","总","起","收","见面"],"ans":4,"ex":"Điền đúng theo ngữ cảnh và cách kết hợp từ trong câu gốc.","tag":"Sách · 170–171"},{"q":"你想____过今年的春节？","opts":["完成","坚持","发生","怎样","大概"],"ans":3,"ex":"Điền đúng theo ngữ cảnh và cách kết hợp từ trong câu gốc.","tag":"Sách · 170–171"},{"q":"这一年____了很多开心的事。","opts":["完成","坚持","发生","怎样","大概"],"ans":2,"ex":"Điền đúng theo ngữ cảnh và cách kết hợp từ trong câu gốc.","tag":"Sách · 170–171"},{"q":"我回家住____三四天，然后出去旅游。","opts":["完成","坚持","发生","怎样","大概"],"ans":4,"ex":"Điền đúng theo ngữ cảnh và cách kết hợp từ trong câu gốc.","tag":"Sách · 170–171"},{"q":"我一定要____到12点，新的一年开始以后再睡觉。","opts":["完成","坚持","发生","怎样","大概"],"ans":1,"ex":"Điền đúng theo ngữ cảnh và cách kết hợp từ trong câu gốc.","tag":"Sách · 170–171"},{"q":"新年就要到了，可是今年的目标还没____呢。","opts":["完成","坚持","发生","怎样","大概"],"ans":0,"ex":"Điền đúng theo ngữ cảnh và cách kết hợp từ trong câu gốc.","tag":"Sách · 170–171"}],"extra":[{"q":"\"怎样\" (zěnyàng) nghĩa là gì?","opts":["như thế nào","khoảng; đại khái","bắt đầu; dậy","vừa mới"],"ans":0,"ex":"怎样 (zěnyàng) nghĩa là như thế nào.","tag":"Mở rộng · Từ vựng"},{"q":"\"过节\" (guòjié) nghĩa là gì?","opts":["đón lễ hội","Tết Nguyên đán","gặp mặt","chỉ cần"],"ans":0,"ex":"过节 (guòjié) nghĩa là đón lễ hội.","tag":"Mở rộng · Từ vựng"},{"q":"\"节\" (jié) nghĩa là gì?","opts":["ngày lễ; tiết","cô, dì","nước khoáng","học kỳ"],"ans":0,"ex":"节 (jié) nghĩa là ngày lễ; tiết.","tag":"Mở rộng · Từ vựng"},{"q":"\"节日\" (jiérì) nghĩa là gì?","opts":["ngày lễ","chú","xuất phát","tốt nghiệp"],"ans":0,"ex":"节日 (jiérì) nghĩa là ngày lễ.","tag":"Mở rộng · Từ vựng"},{"q":"\"联欢\" (liánhuān) nghĩa là gì?","opts":["liên hoan","nhận","không lâu","chào đời"],"ans":0,"ex":"联欢 (liánhuān) nghĩa là liên hoan.","tag":"Mở rộng · Từ vựng"},{"q":"\"大概\" (dàgài) nghĩa là gì?","opts":["khoảng; đại khái","luôn; thường","xảy ra","quá khứ"],"ans":0 const vocab=DB.vocab, readings=DB.readings, grammar=DB.grammar;

const store='hsk3b18_complete_v1';let state;try{state=JSON.parse(localStorage.getItem(store)||'{}')}catch(e){state={}};state={answers:{},results:{},vocAnswers:{},vocResults:{},translation:{},...state};let page='home',ri=0,vm='hv';
function save(){try{localStorage.setItem(store,JSON.stringify(state))}catch(e){}}function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function speak(t){if(!('speechSynthesis' in window)){alert('Trình duyệt chưa hỗ trợ phát âm.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;speechSynthesis.speak(u)}
function setPage(p){page=p;ri=0;render();window.scrollTo(0,0)}function setRi(i){ri=i;render()}function setVM(v){vm=v;render()}
function render(){document.getElementById('nav').innerHTML=Object.entries(labels).map(([k,t])=>`<button class="${page===k?'active':''}" onclick="setPage('${k}')">${t}</button>`).join('');let a=document.getElementById('main');({home:home,vocab:showVocab,vquiz:showVQuiz,grammar:showGrammar,reading:showReading,translate:showTranslate,original:showQuiz,practice:showQuiz,mistakes:showQuiz})[page](a)}
function home(a){let done=Object.keys(state.results).length,good=Object.values(state.results).filter(Boolean).length;a.innerHTML=`<h2>HSK 3 – Bài 18</h2><p class="muted">Nguồn: giáo trình Bài 18, 11 trang, tr. 163–173; bản dịch và bài đọc tóm lược có biên soạn hỗ trợ, hãy đối chiếu PDF gốc; phần quiz mở rộng và lời dịch Việt là nội dung biên soạn hỗ trợ.</p><div class="grid"><div class="stat">Từ mới<strong>28</strong></div><div class="stat">Bài khóa<strong>4</strong></div><div class="stat">Đã luyện<strong>${done}/${DB.book.length+DB.extra.length}</strong><span class="small">Đúng ${good}</span></div></div><div class="card"><h2>🧠 Tổng quan · Công thức ngữ pháp</h2>${grammar.map((g,i)=>`<div class="cover"><h3>${i+1}. ${esc(g.name)}</h3><div class="formula">${esc(g.formula)}</div><p>${esc(g.meaning)}</p><div class="hanzi">${esc(g.example)}</div><p>${esc(g.vi)}</p><button class="btn alt" onclick="page='grammar';ri=${i};render()">Học chi tiết →</button></div>`).join('')}</div><div class="card"><h3>7 bước học</h3>Học từ → Quiz → Ngữ pháp → Đọc bài khóa → Luyện dịch → Bài tập → Ôn câu sai.<div class="toolbar"><button class="btn" onclick="setPage('vocab')">Bắt đầu học</button><button class="btn alt" onclick="setPage('original')">Làm bài gốc</button></div></div>`}
function showVocab(a){a.innerHTML=`<h2>🀄 28 từ mới Bài 18</h2><div class="toolbar"><input id="search" placeholder="Tìm chữ Hán, Pinyin, nghĩa Việt" oninput="drawWords(this.value)" style="padding:12px;border:1px solid #dbe1ed;border-radius:10px;max-width:330px;width:100%"><button class="btn" onclick="setPage('vquiz')">Quiz từ vựng →</button></div><div class="vgrid" id="words"></div>`;drawWords('')}
function drawWords(term){document.getElementById('words').innerHTML=vocab.filter(v=>v.join(' ').toLowerCase().includes(term.toLowerCase())).map(v=>`<div class="card"><div class="hanzi"><b>${esc(v[0])}</b></div><div class="py">${esc(v[1])}</div><p>${esc(v[2])}</p><button class="btn alt" onclick="speak('${v[0]}')">🔊 Nghe</button></div>`).join('')}
function optsV(i){let ids=[i,(i+5)%vocab.length,(i+11)%vocab.length,(i+18)%vocab.length];return ids.sort((a,b)=>((a*9+i*3)%31)-((b*9+i*3)%31))}
function showVQuiz(a){a.innerHTML=`<h2>🧩 Quiz từ vựng · 84 lượt</h2><div class="toolbar">${[['hv','Hán → Việt'],['vh','Việt → Hán'],['hp','Hán → Pinyin']].map(([v,t])=>`<button class="pill ${vm===v?'on':''}" onclick="setVM('${v}')">${t}</button>`).join('')}</div>${vocab.map((v,i)=>{let key=vm+i,sel=state.vocAnswers[key],graded=key in state.vocResults;return `<article class="quiz"><span class="badge">Từ ${i+1}/${vocab.length}</span><h3 class="qtitle">${esc(vm==='vh'?v[2]:v[0])}</h3>${optsV(i).map((j,n)=>`<button class="option ${sel===j?'sel':''} ${graded&&j===i?'good':''} ${graded&&sel===j&&j!==i?'bad':''}" onclick="chooseV('${key}',${j})">${'ABCD'[n]}. ${esc(vm==='hv'?vocab[j][2]:vm==='vh'?vocab[j][0]:vocab[j][1])}</button>`).join('')}<button class="btn" onclick="gradeV('${key}',${i})">Chấm đáp án</button> <button class="btn alt" onclick="speak('${v[0]}')">🔊 Nghe</button>${graded?`<div class="feedback ${state.vocResults[key]?'good':'bad'}"><b>${state.vocResults[key]?'✅ Đúng':'❌ Sai'}</b><p><b>Feynman:</b> ${esc(v[0])} – ${esc(v[1])} – ${esc(v[2])}.</p><div class="socrates">Em đặt thử một câu có từ này nhé?</div></div>`:''}</article>`}).join('')}`}
function chooseV(k,j){state.vocAnswers[k]=j;delete state.vocResults[k];save();keep()}function gradeV(k,i){if(!(k in state.vocAnswers)){alert('Hãy chọn đáp án.');return}state.vocResults[k]=state.vocAnswers[k]===i;save();keep()}
function showGrammar(a){let g=grammar[ri%4];a.innerHTML=`<h2>📒 4 chủ điểm ngữ pháp</h2><div class="toolbar">${grammar.map((x,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">${i+1}. ${esc(x.name)}</button>`).join('')}</div><div class="card grammar"><h2>${esc(g.name)}</h2><div class="formula">${esc(g.formula)}</div><h3>Ý nghĩa</h3><p>${esc(g.meaning)}</p><h3>Ví dụ</h3><div class="hanzi">${esc(g.example)}</div><p>${esc(g.vi)}</p><div class="textnote"><b>Feynman:</b> ${esc(g.tip)}</div><div class="socrates"><b>Socrates:</b> ${esc(g.s)}</div></div><button class="btn" onclick="setPage('practice')">Luyện thêm →</button>`}
function tabs(){return `<div class="toolbar">${readings.map((_,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div>`}
function showReading(a){let r=readings[ri%4];a.innerHTML=`<h2>📖 4 bài khóa</h2>${tabs()}<div class="card"><h2>${esc(r.title)}</h2><p class="muted">${esc(r.where)}</p>${r.lines.map(([sp,cn,vi])=>`<div class="readingline"><div class="hanzi"><b>${esc(sp)}：</b>${esc(cn)}</div><button class="btn alt" onclick="speak('${cn}')">🔊 Đọc</button><details><summary>Xem bản dịch tham khảo</summary>${esc(vi)}</details></div>`).join('')}<h3>Câu hỏi đọc hiểu trong sách</h3>${r.questions.map((q,i)=>`<p>${i+1}. ${esc(q)}</p>`).join('')}<button class="btn" onclick="setPage('translate')">Tự luyện dịch →</button></div>`}
function showTranslate(a){let r=readings[ri%4];a.innerHTML=`<h2>🌏 Luyện dịch Trung → Việt</h2><p class="muted">Hãy tự viết bản dịch trước khi xem đáp án mẫu. Bản dịch được lưu trên trình duyệt này.</p>${tabs()}<div class="card"><h3>${esc(r.title)}</h3>${r.lines.map(([sp,cn,vi],i)=>{let key=`${ri}_${i}`;return `<div class="readingline"><div class="hanzi">${esc(sp)}：${esc(cn)}</div><textarea oninput="setTrans('${key}',this.value)" placeholder="Tự viết bản dịch…">${esc(state.translation[key]||'')}</textarea><details><summary>🔎 Xem bản dịch mẫu</summary><div class="feedback good">${esc(vi)}</div><p class="small">Hãy đối chiếu chủ ngữ, động từ chính và sắc thái nghĩa.</p></details></div>`}).join('')}<button class="btn alt" onclick="exportTrans()">Xuất bản dịch TXT</button></div>`}
function setTrans(key,v){state.translation[key]=v;save()}
function exportTrans(){let r=readings[ri%4],s=r.title+'\n\n'+r.lines.map(([sp,cn],i)=>sp+'：'+cn+'\n'+(state.translation[`${ri}_${i}`]||'')).join('\n\n'),a=document.createElement('a'),u=URL.createObjectURL(new Blob([s],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='HSK3_Bai18_DichBai'+(ri+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const all=[...DB.book.map((q,i)=>({...q,id:'b'+i})),...DB.extra.map((q,i)=>({...q,id:'e'+i}))];
function showQuiz(a){let list=page==='original'?all.slice(0,10):page==='practice'?all.slice(10):all.filter(q=>state.results[q.id]===false);let total=list.filter(q=>q.id in state.results).length,correct=list.filter(q=>state.results[q.id]===true).length;a.innerHTML=`<h2>${page==='original'?'📝 10 câu theo sách':page==='practice'?'🎯 30 câu luyện mở rộng':'🔁 Ôn câu sai'}</h2><p class="muted">${page==='original'?'Trích từ mục 综合练习 trang 170–171 của giáo trình.':'Quiz mở rộng được biên soạn từ từ vựng và ngữ pháp bài học.'}</p><div class="quizstats">Đã làm ${total}/${list.length} · Đúng ${correct}</div>${list.length?list.map((q,i)=>{let sel=state.answers[q.id],graded=q.id in state.results;return `<article class="quiz"><span class="badge">Câu ${i+1} · ${esc(q.tag)}</span><h3 class="qtitle">${esc(q.q)}</h3>${q.opts.map((s,j)=>`<button class="option ${sel===j?'sel':''} ${graded&&j===q.ans?'good':''} ${graded&&sel===j&&j!==q.ans?'bad':''}" onclick="chooseQ('${q.id}',${j})">${'ABCDE'[j]}. ${esc(s)}</button>`).join('')}<button class="btn" onclick="gradeQ('${q.id}')">Kiểm tra đáp án</button>${graded?`<div class="feedback ${state.results[q.id]?'good':'bad'}"><b>${state.results[q.id]?'✅ Đúng':'❌ Sai'} · Đáp án: ${esc(q.opts[q.ans])}</b><p><b>Feynman:</b> ${esc(q.ex)}</p><div class="socrates"><b>Socrates:</b> Trong câu có dấu hiệu nào dẫn em đến đáp án đó?</div></div>`:''}</article>`}).join(''):'<div class="card">Bạn chưa có câu sai nào.</div>'}`}
function chooseQ(k,j){state.answers[k]=j;delete state.results[k];save();keep()}function gradeQ(k){if(!(k in state.answers)){alert('Chọn đáp án trước nhé.');return}let q=all.find(q=>q.id===k);state.results[k]=state.answers[k]===q.ans;save();keep()}
function keep(){let y=window.scrollY;render();requestAnimationFrame(()=>scrollTo(0,y))}render();
</script></body></html>
