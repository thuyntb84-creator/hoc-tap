x}.vocab .card{margin:0;padding:16px}.vocab .hanzi{font-size:29px;font-weight:750}.q{border:1px solid var(--line);border-radius:15px;padding:19px;margin:14px 0;background:white}.q h3{font-size:17px;margin:6px 0 12px}.choice{display:block;text-align:left;width:100%;margin:8px 0;padding:12px;border:1px solid #dce2ed;background:#fbfcff;border-radius:11px;color:var(--ink)}.choice.selected{border:2px solid #5471e5;background:#eef2ff;padding:11px}.choice.correct{border-color:#0c9669;background:#e8faf2}.choice.wrong{border-color:#dc475e;background:#fff0f1}.feedback{margin-top:12px;border-radius:11px;padding:15px;background:#f4f6fb;line-height:1.75}.feedback.ok{background:#e8faf2}.feedback.no{background:#fff1f2}.socratic{margin-top:12px;padding:15px;border-left:4px solid #da9c39;background:#fff8e9;border-radius:9px}.inputline{padding:12px;width:100%;border:1px solid #dbe1ed;border-radius:10px}.progress{height:9px;background:#e7eafa;border-radius:50px;overflow:hidden}.progress i{display:block;height:100%;background:#4267ef}.note{background:#fff7de;padding:12px 15px;border-radius:11px}.reading{white-space:pre-wrap;font-size:19px;line-height:2.15}.tabs{display:flex;gap:8px;flex-wrap:wrap}.notice{color:#815c1e;background:#fff8e8;padding:12px;border-radius:10px}.small{font-size:13px;color:var(--muted)}img.poster{width:100%;max-width:650px;display:block;margin:16px auto;border-radius:13px}.hidden{display:none}h2{margin:0 0 10px}h3{margin:12px 0} @media(max-width:800px){.shell{display:block}nav{display:flex;overflow:auto;padding:8px;gap:4px;position:sticky;top:0;z-index:5}nav button{min-width:max-content;width:auto;font-size:12px;padding:10px}main{padding:14px}.grid{grid-template-columns:1fr}header{padding:18px}header h1{font-size:19px}.card{padding:16px}}

px 0;padding:14px;min-height:100px;border-radius:12px;border:1px solid #ccd6e5;resize:vertical;font:inherit;line-height:1.7}summary{cursor:pointer} @media(max-width:850px){.grammarShow,.posterStudy,.studyGrid{grid-template-columns:1fr}}
</style></head><body><header><span class="tag">新HSK教程 3 · LESSON 2</span><h1>你们想吃什么就点什么</h1><p>Học theo giáo trình · Hiểu bản chất · Luyện tập thông minh · Dịch 4 bài khóa</p></header><div class="shell"><nav id="nav"></nav><main id="app"></main></div><script>const DB={"vocab": [["菜单", "càidān", "thực đơn"], ["又", "yòu", "vừa... vừa...; lại"], ["饿", "è", "đói"], ["渴", "kě", "khát"], ["客气", "kèqi", "khách sáo; lịch sự"], ["饮料", "yǐnliào", "đồ uống"], ["好久", "hǎojiǔ", "rất lâu"], ["服务", "fúwù", "phục vụ"], ["员", "yuán", "người làm công việc; nhân viên"], ["双", "shuāng", "đôi; cặp"], ["筷子", "kuàizi", "đũa"], ["勺子", "sháozi", "thìa"], ["碗", "wǎn", "bát"], ["马上", "mǎshàng", "ngay lập tức"], ["热情", "rèqíng", "nhiệt tình"], ["尝", "cháng", "nếm; thử"], ["记", "jì", "nhớ; ghi nhớ"], ["用", "yòng", "dùng; sử dụng"], ["鸡", "jī", "gà"], ["张", "zhāng", "tờ; lượng từ đồ phẳng"], ["不用", "búyòng", "không cần"], ["选", "xuǎn", "chọn"], ["外卖", "wàimài", "đồ ăn giao tận nơi; đặt đồ ăn"], ["方便", "fāngbiàn", "tiện lợi"], ["蛋糕", "dàngāo", "bánh ngọt"], ["只", "zhǐ", "chỉ"], ["方便面", "fāngbiànmiàn", "mì ăn liền"], ["简单", "jiǎndān", "đơn giản"]], "readings": [{"title": "课文 1 · Chọn món tại nhà hàng", "lines": [["王一雪", "家月，李文，你们看看菜单，想吃点儿什么？", "Gia Nguyệt, Lý Văn, hai bạn xem thực đơn, muốn ăn gì nào?"], ["李文", "谢谢一雪姐，我都可以，你们点吧。", "Cảm ơn chị Nhất Tuyết, em ăn gì cũng được, mọi người gọi món đi ạ."], ["白家月", "飞了这么远，现在还真是又饿又渴。", "Bay một quãng xa như vậy, bây giờ đúng là vừa đói vừa khát."], ["王一雪", "那多点点儿，别客气。你们喝什么饮料？", "Vậy gọi nhiều hơn một chút, đừng khách sáo. Các bạn uống gì?"], ["白家月", "好久没喝中国茶，也好久没吃饺子了。我想喝绿茶、吃饺子，可以吗？", "Lâu rồi em chưa uống trà Trung Quốc, cũng lâu rồi chưa ăn sủi cảo. Em muốn uống trà xanh và ăn sủi cảo, được không?"], ["王一雪", "没问题。你们看看还想吃什么。", "Không vấn đề gì. Các bạn xem còn muốn ăn gì nữa."]], "questions": [["白家月现在觉得怎么样？", "她又饿又渴。"], ["白家月想喝什么？", "绿茶。"], ["王一雪要点什么？", "让大家看菜单，选择想吃的东西。"]]}, {"title": "课文 2 · Dụng cụ và phục vụ", "lines": [["王一雪", "服务员，再给我们拿一双筷子、一个勺子和一个碗。", "Nhân viên ơi, lấy thêm cho chúng tôi một đôi đũa, một chiếc thìa và một cái bát."], ["服务员", "好的，请等一下，我马上去拿。", "Vâng, xin chờ một lát, tôi mang đến ngay."], ["王一雪", "这家饭馆的服务很热情，菜也都做得很好吃。你们尝尝，看喜不喜欢这些菜。", "Nhà hàng này phục vụ rất nhiệt tình, các món cũng được nấu rất ngon. Mọi người nếm thử xem có thích các món này không."], ["白家月", "哪个菜都好吃。您点的这些菜真不错。", "Món nào cũng ngon. Những món cô gọi thật tuyệt."], ["王一雪", "这里的饭菜又便宜又好吃，我们经常来，服务员都记住我们爱吃的菜了。", "Đồ ăn ở đây vừa rẻ vừa ngon, chúng tôi thường đến nên nhân viên đã nhớ những món chúng tôi thích ăn."], ["服务员", "王姐，您经常来吃饭，今天送您一些水果，请慢用。", "Chị Vương, chị thường đến dùng bữa, hôm nay tặng chị chút hoa quả, xin mời dùng thong thả."]], "questions": [["王一雪觉得这家饭馆怎么样？", "服务热情，饭菜又便宜又好吃。"], ["白家月觉得菜怎么样？", "哪个菜都好吃。"], ["服务员为什么送水果？", "因为王一雪经常来吃饭。"]]}, {"title": "课文 3 · Gọi món trên điện thoại", "lines": [["白家月", "这个鸡肉饭太好吃了，我要再来吃一次。", "Cơm gà này ngon quá, tôi muốn quay lại ăn thêm lần nữa."], ["李文", "你可以拿走这张菜单，看看下次还吃点儿什么。", "Bạn có thể mang thực đơn này về để xem lần sau còn muốn ăn gì."], ["王一雪", "不用拿菜单，在手机上就能看到，也可以选好了让他们给你送。", "Không cần mang thực đơn đâu, xem ngay trên điện thoại được, cũng có thể chọn xong rồi nhờ họ giao đến."], ["白家月", "他们家还能送外卖？", "Nhà hàng của họ còn giao đồ ăn sao?"], ["王一雪", "对，现在很多饭馆都能送外卖，想吃什么就点什么。", "Đúng vậy, bây giờ rất nhiều nhà hàng giao đồ ăn, muốn ăn gì thì gọi món đó."], ["白家月", "那真是太方便了！", "Thế thì tiện quá!"]], "questions": [["白家月为什么要再来吃一次？", "因为鸡肉饭太好吃了。"], ["这家饭馆可以怎么点菜？", "可以在手机上看菜单、选菜，也可以点外卖。"], ["白家月觉得外卖怎么样？", "她觉得很方便。"]]}, {"title": "课文 4 · Nhật ký và thói quen ăn uống", "lines": [["", "这些年在国外，我很少自己做饭。", "Những năm sống ở nước ngoài, tôi rất ít khi tự nấu cơm."], ["", "早饭就吃一个面包，有时候吃一块蛋糕，再喝一杯咖啡。", "Bữa sáng chỉ ăn một chiếc bánh mì, đôi khi ăn một miếng bánh ngọt, rồi uống một cốc cà phê."], ["", "午饭和晚饭也都在外面吃。", "Bữa trưa và bữa tối cũng đều ăn ở ngoài."], ["", "快要考试的时候又忙又累，没时间出去吃饭，家里又什么吃的都没有，我可能好几天只买方便面吃。", "Khi sắp thi, tôi vừa bận vừa mệt, không có thời gian ra ngoài ăn; ở nhà cũng chẳng có gì ăn, có khi mấy ngày chỉ mua mì ăn liền."], ["", "现在回到中国了，每天能吃到妈妈做的饭，我真是太高兴了！", "Bây giờ đã về Trung Quốc, ngày nào cũng được ăn cơm mẹ nấu, tôi thật sự rất vui!"], ["", "有时候妈妈只做几个简单的菜，我也非常爱吃，因为外面什么都没有妈妈做的饭好吃。", "Đôi khi mẹ chỉ làm vài món đơn giản, tôi vẫn rất thích ăn, vì không món ăn bên ngoài nào ngon bằng cơm mẹ nấu."]], "questions": [["李文在国外经常做饭吗？", "不经常，他很少自己做饭。"], ["李文为什么好几天只买方便面？", "因为快考试的时候又忙又累，没时间出去吃饭。"], ["回到中国后什么事让他非常高兴？", "每天能吃到妈妈做的饭。"]]}], "grammar": [{"title": "又……又……", "meaning": "Vừa… vừa…: kết hợp hai tính chất hoặc trạng thái cùng tồn tại.", "formula": "Chủ ngữ + 又 + tính từ 1 + 又 + tính từ 2", "examples": [["我现在还真是又饿又渴。", "Tôi bây giờ đúng là vừa đói vừa khát."], ["这个饭馆的菜又便宜又好吃。", "Món ăn của nhà hàng này vừa rẻ vừa ngon."]], "trap": "Đừng hiểu 又…又… như hai hành động nối tiếp; nó thường diễn tả hai đặc điểm đồng thời.", "q": "Nếu cùng lúc “rẻ” và “ngon”, em sẽ ghép 便宜 và 好吃 bằng cách nào?"}, {"title": "疑问代词的非疑问用法（2）", "meaning": "Đại từ nghi vấn (谁、什么、哪儿、哪个、怎么…) có thể chỉ bất cứ người, vật, nơi, cách nào; thường kết hợp 都/也.", "formula": "Từ nghi vấn + 都 / 也 + động từ / tính từ …", "examples": [["哪个菜都好吃。", "Món nào cũng ngon."], ["这次旅游，我去哪儿都可以。", "Chuyến du lịch này, tôi đi đâu cũng được."]], "trap": "Có đại từ nghi vấn không có nghĩa là câu đang hỏi; hãy kiểm tra 都/也 và ngữ cảnh.", "q": "Trong 哪个菜都好吃, người nói hỏi “món nào?” hay khẳng định tất cả các món?"}, {"title": "疑问代词的非疑问用法（3）", "meaning": "Lặp lại cùng một đại từ nghi vấn ở hai vế để chỉ tự do lựa chọn hoặc tương ứng: muốn gì thì làm nấy.", "formula": "想 + từ nghi vấn + 就 + động từ + cùng từ nghi vấn", "examples": [["你们想吃什么就点什么。", "Mọi người muốn ăn gì thì cứ gọi món ấy."], ["你想去哪儿，我们就去哪儿。", "Bạn muốn đi đâu thì chúng ta đi đó."], ["你觉得哪个好看就买哪个。", "Bạn thấy cái nào đẹp thì mua cái đó."]], "trap": "Hai đại từ nghi vấn thường ứng với nhau; trong vế sau cần 就.", "q": "Vì sao trong 想吃什么就点什么, chữ 什么 được lặp lại hai lần?"}], "book": [["我觉得____筷子吃饭更方便。", ["尝", "只", "菜单", "记", "用"], 4, "用 + dụng cụ: dùng đũa ăn cơm."], ["你____住那个饭馆的名字了吗？", ["尝", "只", "菜单", "记", "用"], 3, "记住: ghi nhớ."], ["她现在很饿，早上____吃了一块蛋糕。", ["尝", "只", "菜单", "记", "用"], 1, "只: chỉ (giới hạn số lượng)."], ["____上有好几个新菜，你看看我们吃哪个？", ["尝", "只", "菜单", "记", "用"], 2, "菜单 là thực đơn."], ["我妈妈会做中国菜，下次你们来我家____一下她做的菜。", ["尝", "只", "菜单", "记", "用"], 0, "尝一下: nếm thử."], ["我还不太会用筷子，你们有勺子吗？— 有，你等一下，我____给你拿。", ["饿", "不用", "简单", "好久", "马上"], 4, "马上: ngay lập tức."], ["我找服务员要一下菜单，咱们点菜。— 在手机上就可以点菜，____要菜单。", ["饿", "不用", "简单", "好久", "马上"], 1, "不用: không cần."], ["我太____了，不想做饭了，我们叫个外卖，怎么样？", ["饿", "不用", "简单", "好久", "马上"], 0, "饿: đói."], ["你想去哪个饭馆吃饭？— 我____没吃饺子了，去楼下的饺子馆吧。", ["饿", "不用", "简单", "好久", "马上"], 3, "好久没…了: đã lâu không…"], ["你下班回家自己做饭吗？— 不做饭，我就吃碗方便面。方便面是最____的晚饭。", ["饿", "不用", "简单", "好久", "马上"], 2, "简单: đơn giản."]], "extra": [["他又饿____渴。", ["都", "就", "又", "才"], 2, "又饿又渴: vừa đói vừa khát."], ["想吃什么____点什么。", ["就", "也", "又", "才"], 0, "Mẫu từ nghi vấn … 就 … cùng từ nghi vấn."], ["这个菜____便宜又好吃。", ["才", "又", "就", "都"], 1, "又…又… liên kết hai tính chất."], ["哪个菜____好吃。", ["就", "又", "都", "再"], 2, "哪个…都…: món nào cũng…"], ["我们现在很____，想喝饮料。", ["饿", "渴", "简单", "方便"], 1, "渴 = khát."], ["饭馆的____很热情。", ["菜单", "筷子", "服务", "蛋糕"], 2, "服务热情: phục vụ nhiệt tình."], ["请给我一____筷子。", ["张", "双", "个", "块"], 1, "一双筷子: một đôi đũa."], ["请给我一个____喝汤。", ["碗", "菜单", "勺子", "筷子"], 2, "勺子 = thìa."], ["这家饭馆可以送____。", ["外卖", "护照", "机场", "头发"], 0, "外卖: đồ ăn giao mang về."], ["他____自己做饭，常常在外面吃。", ["经常", "很少", "马上", "又"], 1, "很少: rất ít khi."], ["我想喝____。", ["鸡", "筷子", "绿茶", "勺子"], 2, "绿茶: trà xanh."], ["考试的时候他又忙____累。", ["就", "哪", "又", "都"], 2, "又忙又累: vừa bận vừa mệt."], ["你想去____，我们就去哪儿。", ["什么", "哪儿", "谁", "怎么"], 1, "去哪儿…就去哪儿: đi đâu thì đi đó."], ["你觉得____好看就买哪个。", ["哪个", "哪儿", "什么", "谁"], 0, "哪个…就…哪个."], ["请看____，然后点菜。", ["菜单", "筷子", "勺子", "碗"], 0, "菜单: thực đơn."], ["这些菜很好吃，你____一下。", ["记", "尝", "用", "张"], 1, "尝: nếm thử."], ["这个菜____好吃！", ["只", "太", "员", "张"], 1, "太…了: quá…!"], ["去饭馆吃饭很____。", ["方便", "饿", "渴", "筷子"], 0, "方便: tiện lợi."], ["我____没吃中国菜了。", ["马上", "好久", "简单", "热情"], 1, "好久没…了."], ["服务____，请拿一个碗。", ["台", "员", "菜", "单"], 1, "服务员 = nhân viên phục vụ."], ["一____菜单。", ["张", "双", "碗", "个"], 0, "张: lượng từ cho tờ giấy, thực đơn."], ["我____带菜单，手机上能看。", ["好久", "不用", "简单", "只"], 1, "不用: không cần."], ["我每天____能吃到妈妈做的饭。", ["都", "又", "张", "饿"], 0, "每天…都: ngày nào cũng…"], ["这个饭馆的菜很____，大家都喜欢。", ["好吃", "渴", "筷子", "菜单"], 0, "好吃: ngon."], ["下次还想吃什么？你可以自己____。", ["饿", "选", "员", "碗"], 1, "选: chọn."], ["快考试了，他____忙又累。", ["很", "又", "都", "就"], 1, "又忙又累."], ["一____蛋糕。", ["双", "碗", "块", "张"], 2, "一块蛋糕: một miếng bánh."], ["我想吃____饭。", ["鸡肉", "筷子", "服务", "菜单"], 0, "鸡肉饭: cơm gà."], ["不用客气，想吃____就点什么。", ["谁", "什么", "哪儿", "怎么"], 1, "什么…就…什么."], ["今天的饭菜又便宜____好吃。", ["又", "就", "都", "也"], 0, "又…又… diễn tả hai tính chất."]]};</script><script>
const {vocab,readings,grammar,book,extra}=DB;
const tabs=[['home','🏠 Tổng quan'],['vocab','🀄 28 từ vựng'],['vquiz','🧩 Quiz từ vựng'],['grammar','📒 3 chủ điểm ngữ pháp'],['reading','📖 4 bài khóa'],['translate','🌏 Dịch bài khóa'],['original','📝 Bài tập từ sách'],['practice','🎯 Luyện mở rộng'],['mistakes','🔁 Ôn câu sai']];
let page='home',which=0,vMode='meaning',filter='',state={};try{state=JSON.parse(localStorage.getItem('hsk3lesson2_v1')||'{}')}catch{};
state.ans??={};state.mark??={};state.vans??={};state.translation??={};
const save=()=>localStorage.setItem('hsk3lesson2_v1',JSON.stringify(state));
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setPage(v){page=v;render();window.scrollTo(0,0)};
function setWhich(v){which=v;render()};
function speak(s){if(!window.speechSynthesis){alert('Trình duyệt không hỗ trợ phát âm.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='zh-CN';u.rate=.79;speechSynthesis.speak(u)}
function render(){document.getElementById('nav').innerHTML=tabs.map(([k,t])=>`<button class="${page===k?'active':''}" onclick="setPage('${k}')">${t}</button>`).join('');let a=document.getElementById('app');if(page==='home')home(a);else if(page==='vocab')vocabPage(a);else if(page==='vquiz')vquiz(a);else if(page==='grammar')grammarPage(a);else if(page==='reading')readingPage(a);else if(page==='translate')translationPage(a);else exercises(a)}
function grammarCard(g,i,full=false){return `<article class="${full?'card':'posterStyle'}"><span class="tag">NGỮ PHÁP ${i+1}</span><h3>${E(g.title)}</h3><p>${E(g.meaning)}</p><div class="formula">${E(g.formula)}</div>${g.examples.map(([cn,vi])=>`<div class="quote"><div class="hanzi">${E(cn)}</div><div class="gloss">${E(vi)}</div><button class="btn ghost" onclick="speak('${E(cn)}')">🔊 Nghe</button></div>`).join('')}<p class="note"><b>⚠️ Bẫy dễ sai:</b> ${E(g.trap)}</p><div class="socratic"><b>🧠 Socrates</b><p>${E(g.q)}</p></div>${!full?`<div class="toolbar"><button class="btn secondary" onclick="which=${i};setPage('grammar')">Học chi tiết →</button></div>`:''}</article>`}
function home(a){let n=Object.keys(state.mark).length,correct=Object.values(state.mark).filter(Boolean).length,vc=Object.values(state.vans).filter(v=>v.checked).length;a.innerHTML=`<h2>HSK 3 · Bài 2 <span class="tag">Bài học mới</span></h2><p class="subtitle">Chủ đề nhà hàng: gọi món, dụng cụ ăn, đặt đồ ăn giao tận nơi và thói quen ăn uống (trang 10–18 trong PDF).</p><div class="grid"><div class="stat">Từ vựng <br><b>28</b><div class="small">Hán tự, Pinyin, nghĩa Việt</div></div><div class="stat">Quiz từ vựng<br><b>${vc}/84</b><div class="small">3 chế độ × 28 từ</div></div><div class="stat">Luyện câu<br><b>${n}/40</b><div class="small">Tỉ lệ đúng ${n?Math.round(correct/n*100):0}%</div></div></div><div class="card"><h2>Lộ trình học hiệu quả</h2><p>① Học từ vựng → ② Nắm 3 công thức ngữ pháp → ③ Đọc 4 bài khóa → ④ Dịch từng câu → ⑤ Làm bài sách và bài mở rộng → ⑥ Ôn câu sai.</p><button class="btn" onclick="setPage('vocab')">Bắt đầu học</button></div><div class="card"><h2>🖼️ Tổng quan · Bộ công thức cấu trúc ngữ pháp</h2><p class="subtitle">Thẻ ghi chú kiểu highlight: công thức, ý nghĩa, ví dụ, lỗi hay mắc và câu hỏi Socrates. Đây là thẻ do app biên soạn, không phải ảnh chụp trang PDF.</p><div class="posterStudy">${grammar.map((g,i)=>grammarCard(g,i)).join('')}</div></div><div class="card"><h3>🍜 Mục tiêu thực hành</h3><p>Biết gọi món, mô tả món ăn vừa rẻ vừa ngon, diễn đạt “món nào cũng…”, “muốn gì thì gọi nấy”, và kể về thói quen ăn uống.</p></div><p class="notice">Lưu ý: PDF không kèm tệp âm thanh. Chức năng 🔊 dùng giọng tổng hợp tiếng Trung trên thiết bị; không thay thế bài nghe gốc.</p>`}
function vocabPage(a){let items=vocab.map((v,i)=>({v,i})).filter(x=>x.v.join(' ').toLowerCase().includes(filter.toLowerCase()));a.innerHTML=`<h2>🀄 Từ vựng bài 2 · 28 từ</h2><div class="toolbar"><input class="inputline" style="max-width:330px" placeholder="Tìm chữ Hán / Pinyin / nghĩa" oninput="filter=this.value;vocabPage(document.getElementById('app'))" value="${E(filter)}"><button class="btn" onclick="setPage('vquiz')">Luyện quiz 28 từ →</button></div><div class="vocab">${items.map(({v,i})=>`<div class="card"><span class="tag">#${i+1}</span><div class="hanzi">${E(v[0])}</div><div class="pinyin">${E(v[1])}</div><p>${E(v[2])}</p><button class="btn ghost" onclick="speak('${E(v[0])}')">🔊 Phát âm</button></div>`).join('')}</div>`}
function vocabOpts(i){let s=[i];for(let k=1;s.length<4;k++){let j=(i+k*9)%28;if(!s.includes(j))s.push(j)}return s.sort((a,b)=>((a*11+4)%31)-((b*11+4)%31))}
function vKey(i){return vMode+'_'+i}
function changeVMode(x){vMode=x;render()}
function vquiz(a){let completed=vocab.filter((v,i)=>state.vans[vKey(i)]?.checked).length,correct=vocab.filter((v,i)=>state.vans[vKey(i)]?.checked&&state.vans[vKey(i)].choice===i).length;a.innerHTML=`<h2>🧩 Quiz 28 từ vựng</h2><p class="subtitle">Chọn → kiểm tra → hiện đúng/sai, nghĩa, Pinyin và câu hỏi Socrates. Điểm được lưu riêng theo từng chế độ.</p><div class="card"><div class="toolbar"><button class="pill ${vMode==='meaning'?'active':''}" onclick="changeVMode('meaning')">Hán → Việt</button><button class="pill ${vMode==='hanzi'?'active':''}" onclick="changeVMode('hanzi')">Việt → Hán</button><button class="pill ${vMode==='sound'?'active':''}" onclick="changeVMode('sound')">Hán → Pinyin</button><button class="btn ghost" onclick="resetV()">Làm lại chế độ</button></div><b>${completed}/28 đã chấm · ${correct} đúng</b><div class="progress"><i style="width:${completed*100/28}%"></i></div></div>${vocab.map((v,i)=>{let k=vKey(i),r=state.vans[k]||{},opts=vocabOpts(i),show=(j)=>vMode==='meaning'?vocab[j][2]:vMode==='hanzi'?vocab[j][0]:vocab[j][1],question=vMode==='hanzi'?v[2]:v[0];return `<article class="q"><span class="tag">Câu ${i+1}/28</span><h3 class="hanzi">${E(question)}</h3>${opts.map((j,n)=>`<button class="choice ${r.choice===j?'selected':''} ${r.checked&&j===i?'correct':''} ${r.checked&&r.choice===j&&j!==i?'wrong':''}" onclick="setVAnswer(${i},${j})">${'ABCD'[n]}. ${E(show(j))}</button>`).join('')}<button class="btn" onclick="checkV(${i})">Kiểm tra đáp án</button> <button class="btn ghost" onclick="speak('${E(v[0])}')">🔊 Nghe</button>${r.checked?`<div class="feedback ${r.choice===i?'ok':'no'}"><b>${r.choice===i?'✅ Chính xác':'❌ Chưa đúng'}</b><p>${E(v[0])} · ${E(v[1])} · ${E(v[2])}</p><b>Feynman:</b> Ghép chữ Hán, âm đọc và nghĩa trong tình huống gọi món tại nhà hàng.<div class="socratic"><b>🧠 Socrates:</b> Hãy đặt một câu ngắn sử dụng “${E(v[0])}”.</div></div>`:''}</article>`}).join('')}`}
function setVAnswer(i,j){state.vans[vKey(i)]={choice:j,checked:false};save();preserve()}
function checkV(i){let r=state.vans[vKey(i)];if(!r){alert('Bạn hãy chọn đáp án trước.');return}r.checked=true;save();preserve()}
function resetV(){if(!confirm('Xóa đáp án chế độ từ vựng này?'))return;vocab.forEach((v,i)=>delete state.vans[vKey(i)]);save();render()}
function preserve(){let y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,y))}
function grammarPage(a){a.innerHTML=`<h2>📒 3 điểm ngữ pháp</h2><div class="toolbar">${grammar.map((g,i)=>`<button class="pill ${which===i?'active':''}" onclick="setWhich(${i})">${i+1}. ${E(g.title)}</button>`).join('')}</div>${grammarCard(grammar[which],which,true)}<button class="btn" onclick="setPage('practice')">Luyện trắc nghiệm ứng dụng →</button>`}
function readingPage(a){let r=readings[which];a.innerHTML=`<h2>📖 Hội thoại / Nhật ký</h2><div class="toolbar">${readings.map((r,i)=>`<button class="pill ${which===i?'active':''}" onclick="setWhich(${i})">Bài khóa ${i+1}</button>`).join('')}</div><div class="card"><h2>${E(r.title)}</h2>${r.lines.map(([speaker,cn,vi],i)=>`<div class="readingBlock"><div class="readCN">${speaker?`<b>${E(speaker)}：</b>`:''}${E(cn)}</div><button class="btn ghost" onclick="speak('${E(cn)}')">🔊 Đọc câu</button> <button class="tog" onclick="document.getElementById('v${i}').hidden=!document.getElementById('v${i}').hidden">Xem / ẩn nghĩa</button><p class="gloss" id="v${i}" hidden>${E(vi)}</p></div>`).join('')}<h3>🧠 Câu hỏi đọc hiểu</h3>${r.questions.map(([q,an],i)=>`<details><summary class="quote">${i+1}. ${E(q)}</summary><div class="answer">${E(an)}</div></details>`).join('')}<p><button class="btn" onclick="setPage('translate')">Luyện dịch bài này →</button></p></div>`}
function translationPage(a){let r=readings[which];a.innerHTML=`<h2>🌏 Luyện dịch 4 bài khóa · Trung → Việt</h2><p class="subtitle">Tự viết bản dịch trước khi mở đáp án mẫu. App lưu nội dung bạn nhập trên thiết bị, không tự đánh giá chính xác mọi bản dịch tự do.</p><div class="toolbar">${readings.map((r,i)=>`<button class="pill ${which===i?'active':''}" onclick="setWhich(${i})">Bài khóa ${i+1}</button>`).join('')}</div><div class="card"><h3>${E(r.title)}</h3>${r.lines.map(([sp,cn,vi],i)=>{let k='b'+which+'_s'+i;return `<div class="readingBlock"><small>Câu ${i+1}</small><div class="readCN">${sp?`<b>${E(sp)}：</b>`:''}${E(cn)}</div><button class="btn ghost" onclick="speak('${E(cn)}')">🔊 Nghe</button><textarea class="inputTranslate" placeholder="Nhập bản dịch tiếng Việt của bạn..." oninput="saveTrans('${k}',this.value)">${E(state.translation[k]||'')}</textarea><details><summary>🔎 Xem bản dịch tham khảo</summary><div class="answer">${E(vi)}</div><p><b>Phân tích 5 bước:</b> Tách cụm → xác định chủ thể → tìm động từ chính → tìm bổ nghĩa → ghép nghĩa tự nhiên.</p></details></div>`}).join('')}<button class="btn secondary" onclick="exportTrans()">Xuất bản dịch của tôi (.txt)</button></div>`}
function saveTrans(k,v){state.translation[k]=v;save()}
function exportTrans(){let r=readings[which],txt=r.title+'\n\n'+r.lines.map(([sp,cn,vi],i)=>(sp?sp+'：':'')+cn+'\n'+(state.translation['b'+which+'_s'+i]||'')).join('\n\n');let u=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='HSK3_Bai2_Dich_Bai'+(which+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const allQ=[...book.map((e,i)=>({id:'b'+i,q:e[0],options:e[1],correct:e[2],explain:e[3],source:true})),...extra.map((e,i)=>({id:'x'+i,q:e[0],options:e[1],correct:e[2],explain:e[3],source:false}))];
function exercises(a){let list=page==='original'?allQ.filter(x=>x.source):page==='practice'?allQ.filter(x=>!x.source):allQ.filter(x=>state.mark[x.id]===false);let done=list.filter(x=>x.id in state.mark).length,correct=list.filter(x=>state.mark[x.id]).length;a.innerHTML=`<h2>${page==='original'?'📝 Bài tập chọn từ trong sách (trang 17)':page==='practice'?'🎯 30 câu vận dụng mở rộng':'🔁 Ôn tập các câu đã sai'}</h2><p class="subtitle">${page==='original'?'10 câu trong mục 综合练习; lựa chọn hiển thị riêng ở từng câu.':'Bài mở rộng do app biên soạn, dựa trên kiến thức Bài 2.'}</p><div class="card"><b>Đã chấm: ${done}/${list.length} · Đúng ${correct}</b><div class="progress"><i style="width:${list.length?done*100/list.length:0}%"></i></div><div class="toolbar"><button class="btn ghost" onclick="resetExercises()">Làm lại phần này</button></div></div>${list.length?list.map((x,i)=>{let picked=state.ans[x.id],ch=x.id in state.mark;return `<article class="q"><span class="tag">Câu ${i+1}${x.source?' · Sách':' · Mở rộng'}</span><h3>${E(x.q)}</h3>${x.options.map((option,j)=>`<button class="choice ${picked===j?'selected':''} ${ch&&j===x.correct?'correct':''} ${ch&&picked===j&&j!==x.correct?'wrong':''}" onclick="choose('${x.id}',${j})">${'ABCDE'[j]}. ${E(option)}</button>`).join('')}<button class="btn" onclick="grade('${x.id}')">Kiểm tra đáp án</button>${ch?`<div class="feedback ${state.mark[x.id]?'ok':'no'}"><b>${state.mark[x.id]?'✅ Đúng':'❌ Sai'} – Đáp án: ${'ABCDE'[x.correct]}. ${E(x.options[x.correct])}</b><p><b>Feynman:</b> ${E(x.explain)}</p><div class="socratic"><b>🧠 Socrates:</b> Từ nào trong câu là dấu hiệu giúp em loại các phương án còn lại?</div></div>`:''}</article>`}).join(''):'<div class="card">Chưa có câu trả lời sai. Hãy thử làm bài trước!</div>'}`}
function choose(id,j){state.ans[id]=j;delete state.mark[id];save();preserve()}
function grade(id){if(!(id in state.ans)){alert('Bạn hãy chọn đáp án trước.');return}let q=allQ.find(x=>x.id===id);state.mark[id]=q.correct===state.ans[id];save();preserve()}
function resetExercises(){let arr=page==='original'?allQ.filter(x=>x.source):page==='practice'?allQ.filter(x=>!x.source):allQ.filter(x=>state.mark[x.id]===false);if(!confirm('Xóa bài làm trong mục hiện tại?'))return;arr.forEach(x=>{delete state.ans[x.id];delete state.mark[x.id]});save();render()}
render();
</script></body></html>
