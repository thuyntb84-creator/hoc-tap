<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HSK3 Bài 13 · Smart Practice</title><style>
:root{--bg:#f4f7fd;--ink:#23324d;--line:#e1e8f4;--blue:#4368ed;--soft:#eaf0ff;--red:#dd4960;--green:#138467}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,'Microsoft YaHei','Noto Sans CJK SC',sans-serif}button,textarea,input{font:inherit}button{cursor:pointer}header{background:linear-gradient(118deg,#283d7d,#5676eb);color:white;padding:24px 5%}header h1{margin:8px 0;font-size:25px}.wrap{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:90vh}nav{background:white;padding:18px 12px;border-right:1px solid var(--line)}nav button{display:block;border:0;background:transparent;text-align:left;width:100%;padding:13px;border-radius:12px;margin:3px 0;font-weight:700;color:#495976}nav button.active,nav button:hover{background:var(--soft);color:#2c51cc}main{max-width:1080px;width:100%;padding:25px;margin:auto}.card{background:white;border-radius:17px;border:1px solid var(--line);padding:21px;margin:0 0 18px;box-shadow:0 3px 15px #152a4608}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.stat{background:#f2f5ff;border-radius:13px;padding:17px}.stat strong{display:block;font-size:29px;color:#4264d5}.muted{color:#677691;font-size:14px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0}.btn{background:var(--blue);color:white;border:0;border-radius:11px;padding:11px 15px;font-weight:700}.btn.alt{background:#eaf0ff;color:#3154b7}.btn.gray{background:#eef1f7;color:#45546e}.pill{border:1px solid #d7e0ee;border-radius:50px;padding:10px 13px;background:#fff;color:#4b5d7b}.pill.on{background:var(--blue);color:white}.hanzi{font-size:24px;line-height:1.7}.py{font-size:14px;color:#4276b9}.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(195px,1fr));gap:12px}.vgrid .card{margin:0;padding:15px}.vgrid .hanzi{font-weight:700}.formula{font-size:19px;font-weight:700;padding:15px;background:#fff4c1;border-radius:12px;line-height:1.6}.grammarcards{display:grid;gap:15px}.grammar{border-radius:15px;border:2px dashed #dccde7;padding:20px;background:linear-gradient(120deg,#fff9fc,#fffef5)}.grammar h3{margin:0 0 10px}.readingline{border-bottom:1px dashed #d7dfed;padding:12px 0;line-height:1.7}.readingline .hanzi{font-size:21px}.quiz{border:1px solid var(--line);padding:18px;border-radius:14px;background:white;margin-bottom:13px}.option{display:block;width:100%;padding:12px;text-align:left;background:#fbfcff;border:1px solid #dce3ed;border-radius:11px;margin:7px 0;color:var(--ink)}.option.sel{border:2px solid #4267ef;padding:11px;background:#edf2ff}.option.good{border-color:#24a17d;background:#e8f8ee}.option.bad{border-color:var(--red);background:#fff0f2}.feedback{background:#f2f5fb;border-radius:12px;padding:14px;margin:10px 0;line-height:1.8}.feedback.good{background:#e7f8f0}.feedback.bad{background:#fff0f2}.socrates{border-left:4px solid #daa34f;background:#fffaeb;padding:12px;margin-top:9px;border-radius:9px}textarea{width:100%;min-height:100px;padding:14px;border:1px solid #ccd5e5;border-radius:11px;line-height:1.7;resize:vertical}details{margin:12px 0}summary{color:#315ac4;cursor:pointer;font-weight:bold}.progress{height:9px;border-radius:10px;background:#e4eaf5;overflow:hidden}.progress>i{display:block;background:var(--blue);height:100%}.small{font-size:13px;color:#748198}.textnote{background:#fff9e5;padding:14px;border-radius:11px}.quizstats{padding:15px;border-radius:12px;background:#edf3ff;margin:14px 0}h2{margin:0 0 13px}h3{line-height:1.5}.empty{padding:24px;text-align:center}.voice{font-size:13px}.badge{background:#ffe4ed;color:#aa4669;border-radius:7px;padding:4px 9px;display:inline-block;font-size:12px;font-weight:bold}.qtitle{font-size:19px;line-height:1.7}.cover{background:linear-gradient(130deg,#fef1ef,#f2f2ff);border:2px dashed #e8c8cf;border-radius:16px;padding:18px;margin:12px 0}.cover .formula{margin-top:10px}.tabs{display:flex;flex-wrap:wrap;gap:8px}.alert{background:#fff9e7;border-radius:12px;padding:13px} @media(max-width:800px){.wrap{display:block}nav{display:flex;overflow:auto;position:sticky;top:0;z-index:10;padding:8px;gap:3px}nav button{width:auto;white-space:nowrap;padding:10px}main{padding:13px}.grid{grid-template-columns:1fr}header h1{font-size:20px}}
</style></head><body><header><span class="badge">新HSK教程 3 · LESSON 13</span><h1>我的新邻居来自英国</h1><div>Hàng xóm mới của tôi đến từ Anh · Học hiểu → luyện tập → tự chữa lỗi</div></header><div class="wrap"><nav id="nav"></nav><main id="main"></main></div><script>const DB={"vocab": [["请客", "qǐngkè", "mời khách; đãi khách"], ["南方", "nánfāng", "miền Nam"], ["北方", "běifāng", "miền Bắc"], ["做法", "zuòfǎ", "cách làm"], ["不同", "bùtóng", "khác nhau"], ["加", "jiā", "thêm"], ["的话", "dehuà", "nếu… thì…"], ["做客", "zuòkè", "đến chơi; làm khách"], ["邻居", "línjū", "hàng xóm"], ["放心", "fàngxīn", "yên tâm"], ["酒", "jiǔ", "rượu"], ["放", "fàng", "đặt; để"], ["客人", "kèrén", "khách"], ["晚会", "wǎnhuì", "buổi liên hoan"], ["礼物", "lǐwù", "quà tặng"], ["画家", "huàjiā", "họa sĩ"], ["盘子", "pánzi", "đĩa"], ["一边", "yìbiān", "một mặt; vừa"], ["聊天儿", "liáotiānr", "trò chuyện"], ["来自", "láizì", "đến từ"], ["夫妻", "fūqī", "vợ chồng"], ["直到", "zhídào", "cho đến"], ["地图", "dìtú", "bản đồ"], ["点", "diǎn", "điểm; chấm"], ["感到", "gǎndào", "cảm thấy"], ["东方", "dōngfāng", "phương Đông"], ["文化", "wénhuà", "văn hóa"]], "readings": [{"title": "Bài khóa 1 – Mời đồng nghiệp ăn tối", "where": "Nhà hàng · 杨同乐、王一雪", "lines": [["杨同乐", "今天我请客，你们想吃什么就点什么！", "Hôm nay tôi mời, mọi người muốn ăn gì cứ gọi món đó!"], ["王一雪", "那我就不客气了。听说这家饭馆的鱼做得很特别？", "Vậy tôi không khách sáo nữa. Nghe nói món cá của nhà hàng này làm rất đặc biệt phải không?"], ["杨同乐", "对，南方菜跟你们北方菜的做法不同。除了鱼，你们还想吃什么？", "Đúng, món ăn miền Nam có cách chế biến khác món miền Bắc của các bạn. Ngoài cá ra, mọi người còn muốn ăn gì?"], ["同事", "我不常吃南方菜，还是你决定吧。", "Tôi không thường ăn món miền Nam, anh cứ quyết định đi."], ["杨同乐", "好，那再加一个鸡肉，一个……", "Được, vậy thêm một món gà, một món…"], ["王一雪", "咱们就三个人，别点那么多。", "Chúng ta chỉ có ba người, đừng gọi nhiều thế."], ["杨同乐", "好，那先来这几个菜。", "Được, vậy trước tiên lấy mấy món này."], ["王一雪", "对了，下周我儿子过生日，你们有时间的话，就来我家做客，我给你们做北京菜。", "À đúng rồi, tuần sau là sinh nhật con trai tôi, nếu mọi người có thời gian thì đến nhà tôi chơi, tôi sẽ nấu món Bắc Kinh cho mọi người."]], "questions": ["这家饭馆什么菜做得很特别？", "王一雪为什么要请同事去她家？", "王一雪打算给大家做什么菜？"]}, {"title": "Bài khóa 2 – Chuẩn bị đón hàng xóm mới", "where": "Ở nhà · 王一雪、刘明", "lines": [["王一雪", "第一次请新邻居来做客，总是担心有什么没准备好。", "Lần đầu mời hàng xóm mới đến chơi, lúc nào tôi cũng lo còn thứ gì chưa chuẩn bị xong."], ["刘明", "放心吧，我帮你看了，都已经准备好了。", "Yên tâm đi, tôi đã kiểm tra giúp, mọi thứ đều chuẩn bị xong rồi."], ["王一雪", "我记得刚才已经把饮料拿出来了，怎么不见了？", "Tôi nhớ vừa lấy đồ uống ra rồi, sao lại không thấy đâu?"], ["刘明", "我把饮料和酒都放进冰箱里了，客人来了再拿出来。", "Tôi đã cất đồ uống và rượu vào tủ lạnh rồi, khách đến sẽ lấy ra."], ["王一雪", "音乐的声音合适吗？", "Âm lượng nhạc đã vừa chưa?"], ["刘明", "你把声音开得太大了，我去关小一点儿。", "Em mở nhạc to quá, để anh giảm nhỏ đi một chút."], ["王一雪", "好，那我们就等客人来吧。", "Được, vậy chúng ta đợi khách đến thôi."]], "questions": ["王一雪为什么很担心？", "刘明把饮料和酒放在哪里了？", "刘明觉得音乐的声音合适吗？"]}, {"title": "Bài khóa 3 – Bữa tiệc sinh nhật", "where": "Ở nhà · 王一雪、杨同乐、刘小明", "lines": [["王一雪", "谢谢你们来参加我儿子的生日晚会，希望大家今晚玩得开心。", "Cảm ơn mọi người đã đến dự tiệc sinh nhật con trai tôi, hy vọng tối nay mọi người chơi vui."], ["杨同乐", "小明，生日快乐！我准备了一个小礼物，希望你喜欢！", "Tiểu Minh, chúc mừng sinh nhật! Chú đã chuẩn bị một món quà nhỏ, hy vọng cháu thích!"], ["刘小明", "谢谢您，我可以打开吗？", "Cảm ơn chú, cháu có thể mở ra không ạ?"], ["杨同乐", "当然可以，你妈妈说你跟姐姐一样，都喜欢画画，对吗？", "Tất nhiên rồi, mẹ cháu nói cháu cũng như chị gái đều thích vẽ, đúng không?"], ["刘小明", "对，我想做一名画家。啊！画板和画笔，这正是我需要的。我太喜欢了。", "Vâng, cháu muốn trở thành họa sĩ. A! Bảng vẽ và bút vẽ, đúng là thứ cháu cần. Cháu thích quá!"], ["王一雪", "我去把盘子拿过来，咱们一边吃蛋糕，一边聊天儿吧。", "Để tôi lấy đĩa lại đây, chúng ta vừa ăn bánh vừa trò chuyện nhé."]], "questions": ["杨同乐送给刘小明什么礼物？", "刘小明收到礼物后说什么了？", "刘小明以后想做什么？"]}, {"title": "Bài khóa 4 – Hàng xóm đến từ Anh", "where": "Nhật ký · 王一雪", "lines": [["王一雪", "我的新邻居是来自英国的夫妻。", "Hàng xóm mới của tôi là một cặp vợ chồng đến từ Anh."], ["王一雪", "上周我去他们家做客了。", "Tuần trước tôi đến nhà họ chơi."], ["王一雪", "他们做了很多好吃的，还准备了英国的红茶。", "Họ nấu rất nhiều món ngon và còn chuẩn bị trà đen của Anh."], ["王一雪", "那天我跟他们一边喝红茶，一边聊天儿，直到十二点多才回家。", "Hôm đó tôi vừa uống trà đen vừa trò chuyện với họ, đến hơn mười hai giờ mới về nhà."], ["王一雪", "他们年轻的时候喜欢旅游，他家有一张世界地图，上面每一个红点都是他们去过的地方。", "Hồi trẻ họ thích du lịch, nhà họ có một tấm bản đồ thế giới, trên đó mỗi chấm đỏ là một nơi họ đã đến."], ["王一雪", "后来，他们感到东方的文化很特别，就开始学习中文。", "Sau đó, họ cảm thấy văn hóa phương Đông rất đặc biệt nên bắt đầu học tiếng Trung."], ["王一雪", "今天是小明的生日，我请他们到我家玩，来看看中国人的家，也尝尝中国菜。", "Hôm nay là sinh nhật Tiểu Minh, tôi mời họ đến chơi nhà, xem gia đình người Trung Quốc và nếm món ăn Trung Quốc."]], "questions": ["上周王一雪去邻居家做什么了？", "邻居家的世界地图有什么特别的？", "她的邻居为什么学习中文？"]}], "grammar": [{"name": "……的话，就…… – điều kiện giả định", "formula": "Điều kiện + 的话，(chủ ngữ) + 就 + kết quả", "meaning": "Nếu tình huống ở vế đầu xảy ra thì có kết quả/hành động ở vế sau. Trong văn nói 的话 thường đi sau mệnh đề điều kiện.", "example": "你有时间的话，就来我家做客。", "vi": "Nếu bạn có thời gian thì hãy đến nhà tôi chơi.", "tip": "Tách câu thành hai phần: điều kiện (có thời gian) và kết quả (đến nhà chơi).", "s": "Nếu chưa có thời gian, hành động đến chơi có chắc xảy ra không?"}, {"name": "把字句（4）– bổ ngữ xu hướng/trạng thái", "formula": "Chủ ngữ + 把 + tân ngữ + động từ + bổ ngữ", "meaning": "Làm thay đổi vị trí/trạng thái của một đối tượng đã xác định. Bổ ngữ sau động từ nêu kết quả hoặc hướng dịch chuyển.", "example": "我把饮料和酒都放进冰箱里了。", "vi": "Tôi đã đặt đồ uống và rượu vào trong tủ lạnh.", "tip": "把 đưa đối tượng lên trước, phần 放进冰箱里 nói rõ chúng được chuyển đến đâu.", "s": "Nếu bỏ 进冰箱里, người nghe có biết rõ đồ uống được chuyển đi đâu không?"}, {"name": "一边……一边…… – hai hành động cùng lúc", "formula": "(Chủ ngữ) + 一边 + hành động 1，一边 + hành động 2", "meaning": "Diễn tả hai hành động diễn ra đồng thời. Có thể rút gọn thành 边……边…….", "example": "咱们一边吃蛋糕，一边聊天儿吧。", "vi": "Chúng ta vừa ăn bánh vừa trò chuyện nhé.", "tip": "Hai việc cùng diễn ra, không phải làm xong việc một mới thực hiện việc hai.", "s": "一边吃饭一边听音乐 diễn tả hai việc cùng lúc hay nối tiếp nhau?"}], "book": [{"q": "我们一边吃饭一边________，时间过得很快。", "opts": ["加", "放", "请客", "做客", "聊天儿"], "ans": 4, "ex": "Vừa ăn cơm vừa trò chuyện: dùng 聊天儿.", "tag": "Theo sách · 综合练习"}, {"q": "咱们只点了一个鸡肉，再________几个菜吧。", "opts": ["加", "放", "请客", "做客", "聊天儿"], "ans": 0, "ex": "加 là thêm món ăn.", "tag": "Theo sách · 综合练习"}, {"q": "谢谢小王今天________，下周你们都来我家吃饭。", "opts": ["加", "放", "请客", "做客", "聊天儿"], "ans": 2, "ex": "请客 nghĩa là mời/đãi khách.", "tag": "Theo sách · 综合练习"}, {"q": "在南方的一些城市，你去别人家________的时候会先喝茶。", "opts": ["加", "放", "请客", "做客", "聊天儿"], "ans": 3, "ex": "做客 nghĩa là đến nhà người khác làm khách.", "tag": "Theo sách · 综合练习"}, {"q": "桌子上________着一些饮料，你们想喝什么就拿什么。", "opts": ["加", "放", "请客", "做客", "聊天儿"], "ans": 1, "ex": "放着 diễn tả đồ uống được đặt sẵn trên bàn.", "tag": "Theo sách · 综合练习"}, {"q": "昨天的生日晚会玩得怎么样？玩得太开心了，________十二点多我才回家。", "opts": ["不同", "直到", "来自", "感到", "放心"], "ans": 1, "ex": "直到……才……: mãi cho đến thời điểm ấy mới….", "tag": "Theo sách · 综合练习"}, {"q": "你去外国人家做客，会不会________不太习惯？", "opts": ["不同", "直到", "来自", "感到", "放心"], "ans": 3, "ex": "感到不习惯: cảm thấy không quen; 不同 chỉ sự khác nhau.", "tag": "Theo sách · 综合练习"}, {"q": "你的同学们是哪里人？他们都________不同的地方，大家的文化也不一样。", "opts": ["不同", "直到", "来自", "感到", "放心"], "ans": 2, "ex": "来自 = đến từ.", "tag": "Theo sách · 综合练习"}, {"q": "现在你可以________了，吃的喝的都准备好了。", "opts": ["不同", "直到", "来自", "感到", "放心"], "ans": 4, "ex": "放心 = yên tâm.", "tag": "Theo sách · 综合练习"}, {"q": "你们国家过生日和这里过生日有什么________？", "opts": ["不同", "直到", "来自", "感到", "放心"], "ans": 0, "ex": "不同 = điểm khác biệt.", "tag": "Theo sách · 综合练习"}], "extra": [{"q": "“请客” có nghĩa tiếng Việt là gì?", "opts": ["mời khách; đãi khách", "thêm", "đặt; để", "trò chuyện"], "ans": 0, "ex": "请客 đọc là qǐngkè, nghĩa là mời khách; đãi khách.", "tag": "Mở rộng · từ vựng"}, {"q": "“南方” có nghĩa tiếng Việt là gì?", "opts": ["miền Nam", "nếu… thì…", "khách", "đến từ"], "ans": 0, "ex": "南方 đọc là nánfāng, nghĩa là miền Nam.", "tag": "Mở rộ function showVQuiz(a){a.innerHTML=`<h2>🧩 Quiz từ vựng · 81 lượt</h2><div class="toolbar">${[['hv','Hán → Việt'],['vh','Việt → Hán'],['hp','Hán → Pinyin']].map(([v,t])=>`<button class="pill ${vm===v?'on':''}" onclick="setVM('${v}')">${t}</button>`).join('')}</div>${vocab.map((v,i)=>{let key=vm+i,sel=state.vocAnswers[key],graded=key in state.vocResults;return `<article class="quiz"><span class="badge">Từ ${i+1}/27</span><h3 class="qtitle">${esc(vm==='vh'?v[2]:v[0])}</h3>${optsV(i).map((j,n)=>`<button class="option ${sel===j?'sel':''} ${graded&&j===i?'good':''} ${graded&&sel===j&&j!==i?'bad':''}" onclick="chooseV('${key}',${j})">${'ABCD'[n]}. ${esc(vm==='hv'?vocab[j][2]:vm==='vh'?vocab[j][0]:vocab[j][1])}</button>`).join('')}<button class="btn" onclick="gradeV('${key}',${i})">Chấm đáp án</button> <button class="btn alt" onclick="speak('${v[0]}')">🔊 Nghe</button>${graded?`<div class="feedback ${state.vocResults[key]?'good':'bad'}"><b>${state.vocResults[key]?'✅ Đúng':'❌ Sai'}</b><p><b>Feynman:</b> ${esc(v[0])} – ${esc(v[1])} – ${esc(v[2])}.</p><div class="socrates">Em đặt thử một câu có từ này nhé?</div></div>`:''}</article>`}).join('')}`}
function chooseV(k,j){state.vocAnswers[k]=j;delete state.vocResults[k];save();keep()}function gradeV(k,i){if(!(k in state.vocAnswers)){alert('Hãy chọn đáp án.');return}state.vocResults[k]=state.vocAnswers[k]===i;save();keep()}
function showGrammar(a){let g=grammar[ri%3];a.innerHTML=`<h2>📒 3 chủ điểm ngữ pháp</h2><div class="toolbar">${grammar.map((x,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">${i+1}. ${esc(x.name)}</button>`).join('')}</div><div class="card grammar"><h2>${esc(g.name)}</h2><div class="formula">${esc(g.formula)}</div><h3>Ý nghĩa</h3><p>${esc(g.meaning)}</p><h3>Ví dụ</h3><div class="hanzi">${esc(g.example)}</div><p>${esc(g.vi)}</p><div class="textnote"><b>Feynman:</b> ${esc(g.tip)}</div><div class="socrates"><b>Socrates:</b> ${esc(g.s)}</div></div><button class="btn" onclick="setPage('practice')">Luyện thêm →</button>`}
function tabs(){return `<div class="toolbar">${readings.map((_,i)=>`<button class="pill ${ri===i?'on':''}" onclick="setRi(${i})">Bài ${i+1}</button>`).join('')}</div>`}
function showReading(a){let r=readings[ri%4];a.innerHTML=`<h2>📖 4 bài khóa</h2>${tabs()}<div class="card"><h2>${esc(r.title)}</h2><p class="muted">${esc(r.where)}</p>${r.lines.map(([sp,cn,vi])=>`<div class="readingline"><div class="hanzi"><b>${esc(sp)}：</b>${esc(cn)}</div><button class="btn alt" onclick="speak('${cn}')">🔊 Đọc</button><details><summary>Xem bản dịch tham khảo</summary>${esc(vi)}</details></div>`).join('')}<h3>Câu hỏi đọc hiểu trong sách</h3>${r.questions.map((q,i)=>`<p>${i+1}. ${esc(q)}</p>`).join('')}<button class="btn" onclick="setPage('translate')">Tự luyện dịch →</button></div>`}
function showTranslate(a){let r=readings[ri%4];a.innerHTML=`<h2>🌏 Luyện dịch Trung → Việt</h2><p class="muted">Hãy tự viết bản dịch trước khi xem đáp án mẫu. Bản dịch được lưu trên trình duyệt này.</p>${tabs()}<div class="card"><h3>${esc(r.title)}</h3>${r.lines.map(([sp,cn,vi],i)=>{let key=`${ri}_${i}`;return `<div class="readingline"><div class="hanzi">${esc(sp)}：${esc(cn)}</div><textarea oninput="setTrans('${key}',this.value)" placeholder="Tự viết bản dịch…">${esc(state.translation[key]||'')}</textarea><details><summary>🔎 Xem bản dịch mẫu</summary><div class="feedback good">${esc(vi)}</div><p class="small">Hãy đối chiếu chủ ngữ, động từ chính và sắc thái nghĩa.</p></details></div>`}).join('')}<button class="btn alt" onclick="exportTrans()">Xuất bản dịch TXT</button></div>`}
function setTrans(key,v){state.translation[key]=v;save()}
function exportTrans(){let r=readings[ri%4],s=r.title+'\n\n'+r.lines.map(([sp,cn],i)=>sp+'：'+cn+'\n'+(state.translation[`${ri}_${i}`]||'')).join('\n\n'),a=document.createElement('a'),u=URL.createObjectURL(new Blob([s],{type:'text/plain;charset=utf-8'}));a.href=u;a.download='HSK3_Bai13_DichBai'+(ri+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const all=[...DB.book.map((q,i)=>({...q,id:'b'+i})),...DB.extra.map((q,i)=>({...q,id:'e'+i}))];
function showQuiz(a){let list=page==='original'?all.slice(0,10):page==='practice'?all.slice(10):all.filter(q=>state.results[q.id]===false);let total=list.filter(q=>q.id in state.results).length,correct=list.filter(q=>state.results[q.id]===true).length;a.innerHTML=`<h2>${page==='original'?'📝 10 câu theo sách':page==='practice'?'🎯 30 câu luyện mở rộng':'🔁 Ôn câu sai'}</h2><p class="muted">${page==='original'?'Lấy từ mục 综合练习 trang 122–123.':'Quiz mở rộng được biên soạn từ từ vựng và ngữ pháp bài học.'}</p><div class="quizstats">Đã làm ${total}/${list.length} · Đúng ${correct}</div>${list.length?list.map((q,i)=>{let sel=state.answers[q.id],graded=q.id in state.results;return `<article class="quiz"><span class="badge">Câu ${i+1} · ${esc(q.tag)}</span><h3 class="qtitle">${esc(q.q)}</h3>${q.opts.map((s,j)=>`<button class="option ${sel===j?'sel':''} ${graded&&j===q.ans?'good':''} ${graded&&sel===j&&j!==q.ans?'bad':''}" onclick="chooseQ('${q.id}',${j})">${'ABCDE'[j]}. ${esc(s)}</button>`).join('')}<button class="btn" onclick="gradeQ('${q.id}')">Kiểm tra đáp án</button>${graded?`<div class="feedback ${state.results[q.id]?'good':'bad'}"><b>${state.results[q.id]?'✅ Đúng':'❌ Sai'} · Đáp án: ${esc(q.opts[q.ans])}</b><p><b>Feynman:</b> ${esc(q.ex)}</p><div class="socrates"><b>Socrates:</b> Trong câu có dấu hiệu nào dẫn em đến đáp án đó?</div></div>`:''}</article>`}).join(''):'<div class="card">Bạn chưa có câu sai nào.</div>'}`}
function chooseQ(k,j){state.answers[k]=j;delete state.results[k];save();keep()}function gradeQ(k){if(!(k in state.answers)){alert('Chọn đáp án trước nhé.');return}let q=all.find(q=>q.id===k);state.results[k]=state.answers[k]===q.ans;save();keep()}
function keep(){let y=window.scrollY;render();requestAnimationFrame(()=>scrollTo(0,y))}render();
</script></body></html>
